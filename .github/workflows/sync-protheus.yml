name: Sync Protheus → Supabase

on:
  schedule:
    - cron: '0 7 * * *'   # Todo dia às 07h (UTC) = 04h horário Brasil
  workflow_dispatch:        # Botão manual no GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync clientes Protheus → Supabase
        run: node scripts/sync-protheus.js
        env:
          PROTHEUS_BASE:        ${{ secrets.PROTHEUS_BASE }}
          PROTHEUS_USER:        ${{ secrets.PROTHEUS_USER }}
          PROTHEUS_PASS:        ${{ secrets.PROTHEUS_PASS }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
