        ${icon('alert-triangle',20,'color:var(--orange);flex-shrink:0')}
        <div style="font-size:14px;font-weight:700;color:var(--text)">Pedido já vinculado a uma OP</div>
      </div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px">
        O PV <strong>${num}</strong> já está vinculado à OP <strong>${numOp(dupOp)}</strong>
        (${esc(dupOp.cliente || '')}). Criar uma OP repetida pode prejudicar o fluxo de trabalho.
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="_dup-cancel" style="padding:7px 16px;border-radius:var(--radius);border:1px solid rgba(220,38,38,.4);background:var(--red-bg);color:var(--red);font-size:12px;font-weight:600;cursor:pointer">Cancelar</button>
        <button id="_dup-continue" style="padding:7px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-weight:600;cursor:pointer">Continuar mesmo assim</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  document.getElementById('_dup-cancel').onclick   = () => el.remove();
  document.getElementById('_dup-continue').onclick = () => { el.remove(); onContinue(); };
  el.onclick = e => { if (e.target === el) el.remove(); };
}

async function _aplicarPedido(p, num) {
  preencherPedido(p);
  const ff = document.getElementById('nova-form-fields');
  const ft = document.getElementById('nova-modal-footer');
  if (ff) ff.style.display = '';
  if (ft) ft.style.display = 'flex';
  if (p.cliente && p.cliente.cod && !p.cliente.cgc) {
    setStatus('pedido-status', 'Buscando dados do cliente…', 'loading');
    await buscarClientePorCodigo(p.cliente.cod, p.cliente.loja);
    lockCamposPuxados();
  }
  const st = p.statusPedido ? ` · ${p.statusPedido}` : '';
  setStatus('pedido-status', `Pedido ${p.numero || num} carregado${st}`, 'ok');
  showToast('Pedido carregado do Protheus');
}

  const inp = document.getElementById('nova-numPedido');
  const num = (inp?.value || '').trim();
  if (!num) { setStatus('pedido-status', 'Digite o número do pedido', 'err'); return; }

  const btn = document.getElementById('btn-puxar-pedido');
  if (btn) btn.disabled = true;
  setStatus('pedido-status', 'Buscando pedido no Protheus…', 'loading');

  try {
    const resp = await apiFetch('/api/pedido-venda?pedido=' + encodeURIComponent(num),
      { signal: AbortSignal.timeout(25000) });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      setStatus('pedido-status', e.error || 'Pedido não encontrado', 'err');
      return;
    }
    const p = await resp.json();

    const dupOp = ops.find(o => String(o.pedidoProtheus) === String(num));
    if (dupOp) {
      setStatus('pedido-status', `PV ${num} já vinculado à OP ${numOp(dupOp)}`, 'err');
      showDupPedidoWarn(dupOp, num, () => _aplicarPedido(p, num));
      return;
    }

    await _aplicarPedido(p, num);
  } catch (err) {
    setStatus('pedido-status', 'Falha ao buscar o pedido. Tente novamente.', 'err');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// Busca o cliente por código no Protheus e preenche CPF/endereço/etc.
// Reaproveita fillClientFromProtheus (mesmo formato do customerVendor).
async function buscarClientePorCodigo(cod, loja) {
  try {
    const url = '/api/cliente?code=' + encodeURIComponent(cod)
              + (loja ? '&loja=' + encodeURIComponent(loja) : '');
    const resp = await apiFetch(url, { signal: AbortSignal.timeout(20000) });
    if (!resp.ok) return;
    const d = await resp.json();
    if (d && (d.name || d.shortName)) {
      fillClientFromProtheus(d);
    }
  } catch (err) { /* silencioso - dados do cliente ficam manuais */ }
}

// Puxa série/lote do pedido (já faturado) e trava os campos preenchidos
async function puxarSerieLote(opId) {
  const op  = ops.find(o => o.id === opId);
  const num = op?.pedidoProtheus;
  if (!num) { showToast('Esta OP não tem pedido do Protheus vinculado', 'err'); return; }
  const btn = document.getElementById('btn-puxar-serie');
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; }
  try {
    const resp = await apiFetch('/api/pedido-venda?pedido=' + encodeURIComponent(num), { signal: AbortSignal.timeout(25000) });
    if (!resp.ok) { showToast('Não foi possível buscar o pedido', 'err'); return; }
    const p = await resp.json();

    // fila de valores (série/lote) por nome de produto
    const porNome = {};
    (p.itens || []).forEach(it => {
      const nome = (it.descricao || it.produto || '').trim();
      const q = [];
      if ((it.numSerie || '').trim()) q.push({ tipo: 'serie', val: it.numSerie.trim() });
      if ((it.lote     || '').trim()) q.push({ tipo: 'lote',  val: it.lote.trim() });
      if (q.length) (porNome[nome] = porNome[nome] || []).push(...q);
    });

    let algum = 0;
    document.querySelectorAll('[id^="f-numSerie_"]').forEach(inp => {
      if (inp.dataset.puxado === '1') return;         // já travado
      const nome     = inp.getAttribute('data-name') || '';
      const tracking = inp.getAttribute('data-tracking') || '';
      const fila     = porNome[nome];
      if (!fila || !fila.length) return;
      let idx = fila.findIndex(x => x.tipo === tracking);
      if (idx < 0) idx = 0;
      const item = fila.splice(idx, 1)[0];
      inp.value = item.val;
      inp.readOnly = true;
      inp.style.background = 'var(--surface2)';
      inp.dataset.puxado = '1';
      algum++;
    });

    if (algum) showToast(`${algum} série(s)/lote(s) puxado(s) do Protheus`, 'ok');
    else showToast('Nenhuma série/lote disponível no pedido ainda (fatura o pedido primeiro)', 'err');
  } catch (e) {
    showToast('Falha ao buscar série/lote do Protheus', 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
  }
}

function preencherPedido(p) {
  const fill = (id, v) => {
    const el = document.getElementById(id);
    if (el && v != null && String(v).trim() !== '') el.value = String(v).trim();
  };

  // Cliente (nome - CPF/endereço vêm da busca do cliente por código)
  // Cliente completo - vem no próprio pedido (objeto A1)
  const cl = p.cliente || {};
  fill('nova-cliente', cl.nome);
  if (cl.cgc) fill('nova-cpf', cl.cgc);
  fill('nova-rg', cl.rg);
  fill('nova-email', cl.email);
  fill('nova-profissao', cl.profissao);
  fill('nova-numDocumento', cl.docProfissional);
  fill('nova-dn', cl.dataNascimento);
  if (cl.tel) fill('nova-tel', cl.ddd ? `(${cl.ddd}) ${cl.tel}` : cl.tel);
  // Endereço - separa o número que vem após a vírgula (ex.: "RUA X, 146")
  let rua = (cl.endereco || '').trim(), numero = '';
  if (rua.includes(',')) {
    const parts = rua.split(','); const last = parts[parts.length - 1].trim();
    const m = last.match(/\d+[A-Za-z]?/);
    if (m) { numero = m[0]; rua = parts.slice(0, -1).join(',').trim(); }
  }
  fill('nova-endRua', rua);
  fill('nova-endNumero', numero);
  fill('nova-endBairro', cl.bairro);
  fill('nova-endCidade', cl.cidade);
  if (cl.estado) { const est = document.getElementById('nova-endEstado'); if (est) est.value = cl.estado; }
  if (cl.cep && cl.cep.length === 8) fill('nova-cep-cliente', cl.cep.replace(/^(\d{5})(\d{3})$/, '$1-$2'));
  togglePFFields((cl.pessoa || '') !== 'J');

  fill('nova-data', p.emissao);
  fill('nova-numContrato', p.contrato);
  fill('nova-treinamento', p.treinamento);
  fill('nova-instagram',   p.instagram);
  fill('nova-descricao',   p.outrasInfo);

  // Vendedores (1..5): 1º no campo principal, extras aparecem abaixo (só preenchidos)
  const vends = Array.isArray(p.vendedores) ? p.vendedores.filter(Boolean) : [];
  fill('nova-vendedorCanal', vends[0]);
  tempVendedores = vends.slice();
  renderVendedoresExtra(vends.slice(1));

  // Simulador
  if (Number(p.simulador) > 0) fill('nova-simulador', brlFmtNum(p.simulador));

  // Previsão de entrega - data exata do pedido (prazo calculado a partir de hoje)
  if (p.previsaoEntrega) {
    fill('nova-previsaoEntrega', p.previsaoEntrega);
    calcPrazoEntrega();
  }

  // Pagamento: cada forma (condição) com parcela + vencimento - só as preenchidas
  const linhas = (p.pagamentos || []).map(pg => {
    const vlr = Number(pg.valor||0) > 0 ? ` - R$ ${Number(pg.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}` : '';
    const vc  = pg.venc ? ` (venc. ${pg.venc})` : '';
    return `${pg.forma || ''}${vlr}${vc}`.trim();
  }).filter(Boolean);
  if (linhas.length) {
    const el = document.getElementById('nova-detalhesPagamento');
    if (el) el.value = linhas.join('\n');
  }

  // Itens → equipamentos (preço bruto + desconto por item)
  if (Array.isArray(p.itens) && p.itens.length) {
    // Condição de pagamento só com zeros (00 / 000) → itens saem gratuitos
    const cpDigits = String(p.condPag || '').replace(/\D/g, '');
    const gratuito = cpDigits.length > 0 && /^0+$/.test(cpDigits);
    tempEquipList = p.itens.map(it => {
      const nome = (it.descricao || it.produto || '').trim();
      const code = (it.produto || '').trim();
      const item = {
        name:      nome,
        code:      code,
        qty:       parseInt(it.qtd) > 0 ? parseInt(it.qtd) : 1,
        valorUnit: gratuito ? '0' : (Number(it.preco) > 0 ? Number(it.preco).toString() : ''),
        desconto:  gratuito ? '' : (Number(it.desconto) > 0 ? Number(it.desconto).toString() : ''),
        qrcode:    (it.qrcode || '').trim(),
        // Protheus traz 1 QR por linha (C6_XQRCODE). Se a linha tiver mais de uma
        // máquina, os demais adesivos são digitados na abertura da OP.
        qrcodes:   (it.qrcode || '').trim() ? [(it.qrcode || '').trim()] : [],
        qrLocked:  (it.qrcode || '').trim() ? true : undefined,
        numSerie:  (it.numSerie || '').trim(),
        lote:      (it.lote || '').trim(),
        gratuito:  gratuito,
        tes:       (it.tes || '').trim(),
        tesDesc:   (it.tesDesc || '').trim(),
      };
      // Fixa o controle série/lote no item (do catálogo) já na abertura, para não
      // ser recomputado no despacho: se o cache do catálogo mudar entre a captura
      // da série e o build do payload do QR, a série podia parear com a máquina
      // errada. Fixado aqui, série e QR ficam sempre alinhados.
      const cc = _equipCache?.find(c => (code && c.code === code) || c.name === nome);
      if (cc && cc.tracking !== undefined) item.tracking = cc.tracking;
      return item;
    });
    refreshEquipList();
  }

  lockCamposPuxados();   // bloqueia os campos preenchidos (edita via lápis)
}

// Vendedores extras (2..5) - exibição, aparecem quando vêm preenchidos no pedido

function setFieldEditing(el, bar, editing) {
  if (editing) el.dataset.flOrig = el.value;
  const isSel = el.tagName === 'SELECT';
  if (isSel) el.disabled = !editing; else el.readOnly = !editing;
  if (isSel || el.type === 'date') el.style.pointerEvents = editing ? '' : 'none';
  el.style.background = editing ? '' : 'var(--surface2)';
  bar.querySelector('.fl-pencil').style.display = editing ? 'none' : '';
  bar.querySelector('.fl-cancel').style.display = editing ? '' : 'none';
  bar.querySelector('.fl-ok').style.display     = editing ? '' : 'none';
  if (editing && !isSel) el.focus();
}

function lockField(id) {
  const el = document.getElementById(id);
  if (!el || !String(el.value || '').trim()) return;   // só bloqueia o que veio preenchido
  if (!el.dataset.flInit) {
    el.dataset.flInit = '1';
    const wrap = document.createElement('div');
    wrap.className = 'fl-wrap';
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    el.style.flex = '1'; el.style.minWidth = '0';
    const bar = document.createElement('span');
    bar.style.cssText = 'display:flex;gap:1px;flex-shrink:0';
    bar.innerHTML =
      `<button type="button" class="fl-btn fl-pencil" title="Editar">${icon('pencil',13)}</button>` +
      `<button type="button" class="fl-btn fl-cancel" title="Cancelar" style="display:none">${icon('x',14)}</button>` +
      `<button type="button" class="fl-btn fl-ok" title="Confirmar" style="display:none">${icon('check',14)}</button>`;
    wrap.appendChild(bar);
    bar.querySelector('.fl-pencil').onclick = () => setFieldEditing(el, bar, true);
    bar.querySelector('.fl-cancel').onclick = () => { el.value = el.dataset.flOrig || ''; setFieldEditing(el, bar, false); };
    bar.querySelector('.fl-ok').onclick     = () => setFieldEditing(el, bar, false);
    el._flBar = bar;
  }
  setFieldEditing(el, el._flBar, false);
}

function lockCamposPuxados() { CAMPOS_PUXADOS.forEach(lockField); }

// Prazo = dias corridos de HOJE até a previsão de entrega (data exata do pedido)
function calcPrazoEntrega() {
  const prev = document.getElementById('nova-previsaoEntrega')?.value;
  const info = document.getElementById('nova-prazo-info');
  if (!info) return;
  if (!prev) { info.textContent = '-'; return; }
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  const alvo = new Date(prev + 'T12:00:00');
  if (isNaN(alvo.getTime())) { info.textContent = '-'; return; }
  const dias = Math.round((alvo - hoje) / 86400000);
  const dataFmt = alvo.toLocaleDateString('pt-BR');
  info.textContent = dias >= 0 ? `faltam ${dias} dia(s) - entrega ${dataFmt}` : `data já passou - ${dataFmt}`;
}

// Calcula a Páscoa pelo algoritmo de Meeus/Jones/Butcher
function calcEaster(year) {
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day   = ((h+l-7*m+114) % 31) + 1;
  return new Date(year, month-1, day, 12);
}

// Retorna true se a data for feriado nacional brasileiro
function isBrHoliday(d) {
  const m = d.getMonth()+1, day = d.getDate(), year = d.getFullYear();
  // Feriados fixos: [mês, dia]
  const fixed = [[1,1],[4,21],[5,1],[9,7],[10,12],[11,2],[11,15],[12,25]];
  if (fixed.some(([fm,fd]) => m===fm && day===fd)) return true;
  // Feriados móveis (relativos à Páscoa)
  const easter = calcEaster(year);
  const diff   = Math.round((new Date(year,m-1,day,12)-easter) / 86400000);
  // Carnaval seg (-48), Carnaval ter (-47), Sexta-feira Santa (-2), Corpus Christi (+60)
  return diff===-48 || diff===-47 || diff===-2 || diff===60;
}

function calcDataPrevista() {
  const prazo = parseInt(document.getElementById('nova-prazo')?.value);
  const aContarDe = document.getElementById('nova-aContarDe')?.value;
  const diasUteis = document.getElementById('nova-diasUteis')?.checked !== false;
  const el = document.getElementById('nova-data-prevista');
  if (!el) return;
  if (!prazo || prazo <= 0) { el.textContent = '-'; return; }
  const d = aContarDe ? new Date(aContarDe + 'T12:00:00') : new Date();
  if (diasUteis) {
    let dias = 0;
    while (dias < prazo) {
      d.setDate(d.getDate() + 1);
      const dow = d.getDay();
      // Pula fins de semana e feriados nacionais
      if (dow !== 0 && dow !== 6 && !isBrHoliday(d)) dias++;
    }
  } else {
    d.setDate(d.getDate() + prazo);
  }
  el.textContent = d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function validateEmailField(input) {
  input.value = input.value.trim().toLowerCase().replace(/\s/g, '');
  const val = input.value;
  if (!val) return;
  const ok = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}(\.[a-zA-Z]{2,})?$/.test(val);
  if (!ok) {
    input.style.outline = '2px solid var(--red)';
    input.style.borderColor = 'var(--red)';
    showToast('E-mail pode estar inválido - verifique o formato', 'err');
    setTimeout(() => { input.style.outline = ''; input.style.borderColor = ''; }, 2500);
  }
}

/** Com a caixa de endereço marcada, o CEP fica bloqueado: buscar por CEP
 *  sobrescreveria justamente o endereço que a caixa acabou de definir. */
function travarCep(cepId, travado) {
  const cep = cepId && document.getElementById(cepId);
  if (!cep) return;
  cep.disabled = !!travado;
  cep.style.opacity = travado ? '0.6' : '1';
  cep.style.cursor  = travado ? 'not-allowed' : '';
  cep.title = travado ? 'Desmarque a caixa acima para editar o CEP' : '';
}

function toggleSameAddress(checked) {
  const entrega = document.getElementById('nova-enderecoEntrega');
  if (!entrega) return;
  if (checked) {
    const rua    = document.getElementById('nova-endRua')?.value || '';
    const numero = document.getElementById('nova-endNumero')?.value || '';
    const bairro = document.getElementById('nova-endBairro')?.value || '';
    const cidade = document.getElementById('nova-endCidade')?.value || '';
    const estado = document.getElementById('nova-endEstado')?.value || '';
    const cep    = document.getElementById('nova-cep-cliente')?.value || '';
    const parts  = [[rua, numero].filter(Boolean).join(', '), bairro, [cidade, estado].filter(Boolean).join('/'), cep].filter(Boolean);
    entrega.value    = parts.join(', ');
    entrega.disabled = true;
    entrega.style.opacity = '0.6';
  } else {
    entrega.disabled = false;
    entrega.style.opacity = '1';
  }
  travarCep('nova-cep-entrega', checked);
}

// ═══════════════════════════════════════════════════════════════════
// PROTHEUS - busca direto no Supabase (tabela protheus_clientes)
// ═══════════════════════════════════════════════════════════════════

function clearClientFields() {
  ['nova-cliente','nova-endRua','nova-endNumero','nova-endBairro','nova-endCidade',
   'nova-cep-cliente','nova-tel','nova-email','nova-rg'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const estEl = document.getElementById('nova-endEstado');
  if (estEl) estEl.value = '';
}

function fillClientFromProtheus(d) {
  // Sempre sobrescreve - limpa antes para não misturar dados de pessoas diferentes
  clearClientFields();
  const fill = (id, val) => { const el = document.getElementById(id); if (el && val) el.value = String(val).trim(); };
  fill('nova-cliente', d.name || d.shortName);
  const addr = d.address || {};
  // Número: usa o campo separado; senão extrai do fim da rua
  // (Protheus manda "RUA XXX YYY, 515" - número após a vírgula)
  let rua    = (addr.address || '').trim();
  let numero = (addr.number  || '').trim();
  if (rua.includes(',')) {
    const parts = rua.split(',');
    const last  = parts[parts.length - 1].trim();
    const m     = last.match(/\d+[A-Za-z]?/);
    if (m) {
      if (!numero) numero = m[0];
      rua = parts.slice(0, -1).join(',').trim();
    }
  }
  const comp = (addr.complement || '').trim();
  fill('nova-endRua',    [rua, comp].filter(Boolean).join(', '));
  fill('nova-endNumero', numero);
  fill('nova-endBairro', addr.district);
  fill('nova-endCidade', addr.city && addr.city.cityDescription);
  const estEl = document.getElementById('nova-endEstado');
  const stateId = addr.state && addr.state.stateId && addr.state.stateId.trim();
  if (estEl && stateId) estEl.value = stateId;
  const rawCep = (addr.zipCode || '').replace(/\D/g, '');
  if (rawCep.length === 8) fill('nova-cep-cliente', rawCep.replace(/^(\d{5})(\d{3})$/, '$1-$2'));
  const comm = (d.listOfCommunicationInformation || [])[0] || {};
  const ddd = (comm.diallingCode || '').trim();
  const tel = (comm.phoneNumber || '').trim();
  if (tel) fill('nova-tel', ddd ? '(' + ddd + ') ' + tel : tel);
  fill('nova-email', comm.email);
  const govInfo = d.GovernmentalInformation || [];
  const rgEntry = govInfo.find(function(g){ return g.name === 'RG'; });
  if (rgEntry && rgEntry.id && rgEntry.id.trim()) fill('nova-rg', rgEntry.id.trim());
  // CPF/CNPJ: casa pela entrada "CPF|CNPJ"; valida 11/14 dígitos; senão varre por tamanho
  let doc = '';
  const docEntry = govInfo.find(g => /CPF|CNPJ/i.test(g.name || ''));
  if (docEntry) {
    const dig = String(docEntry.id || '').replace(/\D/g, '');
    if (dig.length === 11 || dig.length === 14) doc = dig;
  }
  if (!doc) {
    for (const g of govInfo) {
      const dig = String(g.id || '').replace(/\D/g, '');
      if (dig.length === 11 || dig.length === 14) { doc = dig; break; }
    }
  }
  if (doc) fill('nova-cpf', doc);
  togglePFFields(d.entityType !== 'J');
}

async function upsertProtheusCache(digits, dados) {
  // Via cliente do Supabase (usa o JWT da sessão). Antes ia com a anon key crua,
  // o que exigia manter a tabela aberta para o role 'anon' — ou seja, a base de
  // clientes (CPF/CNPJ, endereço) ficava legível por qualquer um na internet.
  try {
    await sb.from('protheus_clientes')
      .upsert([{ cpf_digits: digits, nome: (dados.name || dados.shortName || '').trim(), dados }],
              { onConflict: 'cpf_digits' });
  } catch {}
}

async function lookupProtheusClient(rawVal) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length < 11) return false;
  setStatus('cnpj-status', 'Buscando no Protheus…', 'loading');

  // ── 1. Supabase cache (instantâneo) ─────────────────────────────
  try {
    // Cliente do Supabase = JWT da sessão (antes: anon key crua, ver upsertProtheusCache)
    const { data: rows, error } = await sb
      .from('protheus_clientes').select('dados').eq('cpf_digits', digits).limit(1);
    if (!error) {
      if (Array.isArray(rows) && rows.length > 0) {
        const d = rows[0].dados;
        fillClientFromProtheus(d);
        setStatus('cnpj-status', 'OK: ' + (d.name || d.shortName || '').substring(0, 35) + ' (Protheus)', 'ok');
        showToast('Cliente encontrado no Protheus');
        return true;
      }
    }
  } catch {}

  // ── 2. Fallback: busca ao vivo na API do Protheus ────────────────
  setStatus('cnpj-status', 'Não encontrado no cache - buscando na API…', 'loading');
  try {
    const resp = await apiFetch('/api/protheus?cpfCnpj=' + digits, { signal: AbortSignal.timeout(25000) });
    if (resp.ok) {
      const data = await resp.json();
      const items = data.items || [];
      if (items.length > 0) {
        const d = items[0];
        fillClientFromProtheus(d);
        // Salva no Supabase para próximas buscas
        upsertProtheusCache(digits, d);
        setStatus('cnpj-status', 'OK: ' + (d.name || d.shortName || '').substring(0, 35) + ' (Protheus)', 'ok');
        showToast('Cliente encontrado no Protheus');
        return true;
      }
    }
  } catch {}

  setStatus('cnpj-status', 'Não encontrado no Protheus', 'err');
  return false;
}

function searchClientBtn() {
  var cpfVal = (document.getElementById('nova-cpf') || {}).value || '';
  var digits = cpfVal.replace(/\D/g, '');
  if (!digits) { setStatus('cnpj-status', 'Digite o CPF ou CNPJ primeiro', 'err'); return; }
  lookupProtheusClient(cpfVal).then(function(found) {
    if (!found && digits.length === 14) lookupCNPJ(cpfVal);
  });
}

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.style.color = type === 'ok' ? 'var(--green)' : type === 'err' ? 'var(--red)' : 'var(--text3)';
}

function showToast(msg, type = 'ok') {
  // Container fixo empilha os toasts (não se sobrepõem no mesmo ponto).
  let box = document.getElementById('toast-box');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toast-box';
    box.style.cssText = 'position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;max-width:min(360px,90vw)';
    document.body.appendChild(box);
  }
  const ok = type === 'ok';
  const t = document.createElement('div');
  t.style.cssText = `display:flex;align-items:center;gap:8px;background:${ok?'var(--green)':'var(--red)'};color:#fff;padding:10px 14px;border-radius:var(--radius);font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(15,31,53,.22);animation:toastIn .2s ease`;
  t.innerHTML = `${icon(ok?'check-circle':'alert-triangle',15,'color:#fff;flex-shrink:0')}<span></span>`;
  t.querySelector('span').textContent = msg; // texto seguro (sem HTML)
  box.appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .25s, transform .25s'; t.style.opacity = '0'; t.style.transform = 'translateX(8px)'; setTimeout(() => t.remove(), 250); }, 3200);
}

async function lookupCEP(rawVal, targetId, statusId) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 8) return;
  setStatus(statusId, 'Buscando…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cep/v2/' + digits);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const el = document.getElementById(targetId);
    if (el && !el.disabled) {
      const parts = [d.street, d.neighborhood, [d.city, d.state].filter(Boolean).join('/'), d.cep].filter(Boolean);
      el.value = parts.join(', ');
    }
    setStatus(statusId, '✓ ' + [d.city, d.state].filter(Boolean).join('/'), 'ok');
  } catch {
    setStatus(statusId, '✗ CEP não encontrado', 'err');
  }
}

// CEP lookup genérico: preenche um campo textarea pelo ID
// AbortController por statusId previne race condition ao digitar rápido
const _cepControllers = {};
async function lookupCEPforField(rawVal, targetId, statusId) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 8) return;
  if (_cepControllers[statusId]) _cepControllers[statusId].abort();
  _cepControllers[statusId] = new AbortController();
  setStatus(statusId, 'Buscando…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cep/v2/' + digits, { signal: _cepControllers[statusId].signal });
    if (!res.ok) throw new Error('not-found');
    const d = await res.json();
    const el = document.getElementById(targetId);
    if (el) {
      const cepFmt = digits.replace(/^(\d{5})(\d{3})$/, '$1-$2');
      const parts = [d.street, d.neighborhood, [d.city, d.state].filter(Boolean).join('/'), cepFmt].filter(Boolean);
      el.value = parts.join(', ');
    }
    setStatus(statusId, `✓ ${[d.city, d.state].filter(Boolean).join('/')}`, 'ok');
  } catch (e) {
    if (e.name === 'AbortError') return; // cancelado por nova digitação - ignora
    setStatus(statusId, '✗ CEP não encontrado', 'err');
  }
}

  const fmtD = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR') : '';

  // Constrói o objeto OP sem ID ainda - Supabase vai gerar
  const opData = {
    id: 0,            // placeholder; será substituído pelo ID real do DB

    entrada,

      action: 'OP Criada' + (pulou ? ' - Fin. pulado' : ''),

    cliente:  opData.cliente,
    status:   opData.status,
    data:     opData,
  }).select('id');

  // Atualiza com ID e numero reais
  const newId  = Number(rows[0].id);

  // Numeração sequencial por ano. Preferência: sequência ATÔMICA no servidor
  // (RPC next_op_seq) — evita duas OPs com o mesmo número em criações simultâneas.
  // Fallback (enquanto a migração 2026-07-21 não estiver aplicada): melhor esforço
  // lendo o MAX do banco.
  const anoAtual = new Date().getFullYear();
  let seqNum;
  try {
    const { data: seqData, error: seqErr } = await sb.rpc('next_op_seq', { p_ano: anoAtual });
    if (seqErr || seqData == null) throw seqErr || new Error('sem retorno');
    seqNum = Number(seqData);
  } catch {
    const { data: _numRows } = await sb.from('ops').select('numero').like('numero', `%/${anoAtual}%`).not('numero','is',null);
    const _maxSeq = (_numRows || []).reduce((mx, r) => {
      const m = String(r.numero || '').match(/^(\d+)\//);
      return m ? Math.max(mx, parseInt(m[1], 10)) : mx;
    }, 0);
    seqNum = _maxSeq + 1;
  }
  const baseNum = `${seqNum}/${anoAtual}`;
  const numero  = pedidoProtheus ? `${baseNum} - PV ${pedidoProtheus}` : baseNum;
  opData.id     = newId;
  opData.numero = numero;
  opData.pedidoProtheus = pedidoProtheus;
  if (opData.pedidoVenda) opData.pedidoVenda.numero = numero;

  // Atualiza Supabase com numero correto (await para garantir que data.numero não fique 'PENDENTE')
  await sb.from('ops').update({ numero, data: opData }).eq('id', newId);

  // O realtime pode ter inserido esta mesma OP (com numero 'PENDENTE', exibida
  // como "#49") entre o insert e este ponto. Substitui em vez de duplicar.
  const _jaExiste = ops.findIndex(o => o.id === newId);
  if (_jaExiste >= 0) ops[_jaExiste] = opData; else ops.unshift(opData);
  nextId = newId + 1;

  clearDraft();
  closeModal();
  currentTab = 'todas';
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===2));
  renderAll();
  showToast('OP criada com sucesso', 'ok');
}

function printPedidoVenda(opId) {
  const op = ops.find(o => o.id === opId);
  if (!op?.pedidoVenda) { alert('Pedido do Cliente não disponível para esta OP.'); return; }
  const pv = op.pedidoVenda;

  // PJ vs PF (CNPJ = 14 dígitos)
  const cpfClean = String(pv.cpf || '').replace(/\D/g, '');
  const isPJ = cpfClean.length === 14;

  // Número sequencial da OP (ex: 1/2026)
  const pvNum = numOp(op).split(' - ')[0];

  // Data de criação da OP (dataAbertura ISO → DD/MM/AAAA)
  const dataCriacao = (() => {
    const iso = op.dataAbertura || '';
    if (!iso) return pv.data || '-';
    const [y, m, d] = iso.split('-');
    return d && m && y ? `${d}/${m}/${y}` : pv.data || '-';
  })();

  // Vendedores do pedido de venda (canal + adicionais)
  const vendedores = (() => {
    const all = [];
    if (pv.vendedorCanal) all.push(pv.vendedorCanal);
    (pv.vendedores || []).forEach(v => { if (v && v !== pv.vendedorCanal) all.push(v); });
    return all.length ? all.join(' | ').toUpperCase() : (pv.analista || op.history?.[0]?.actorName || '-').toUpperCase();
  })();

  // Endereço principal
  const endereco = [pv.endRua, pv.endNumero ? 'nº ' + pv.endNumero : ''].filter(Boolean).join(', ') || pv.enderecoCliente || '';

  // Logo via URL da origem
  const logoSrc = window.location.origin + '/Logo-Contourline-Azul-2048x597%20(2).webp';

  // Linhas de produtos
  const hasBonif = (pv.equipamentos||[]).some(e => e.gratuito);
  const equipList = pv.equipamentos || (op.equipamentos||[]).map(n => typeof n==='string' ? {name:n,qty:1} : n);
  const equipRows = equipList.map(e => {
    const qty = parseInt(e.qty) || 1;
    const vu = e.valorUnit && parseFloat(e.valorUnit) > 0 ? fmtBRL(e.valorUnit) : (e.gratuito ? 'Gratuito' : '-');
    // VALOR TOTAL por linha = bruto (qty × unit), sem descontar item a item
    const lineGross = e.valorUnit && parseFloat(e.valorUnit) > 0 ? qty * parseFloat(e.valorUnit) : 0;
    const vt = lineGross > 0 ? fmtBRL(lineGross) : (e.gratuito ? 'Gratuito' : '-');
    const serieLote = e.numSerie || e.lote || '';
    const tes = e.tes ? `TES ${e.tes}${e.tesDesc ? ' · ' + e.tesDesc : ''}` : '';
    return `<tr>
      <td style="text-align:center">${qty}</td>
      <td>${e.name}${e.code?' (cód. '+e.code+')':''}${tes?`<br><span style="font-size:8px;color:#555">${tes}</span>`:''}</td>
      <td style="text-align:right">${vu}</td>
      <td style="text-align:right">${vt}</td>
      <td style="text-align:center;font-family:monospace">${serieLote}</td>
    </tr>`;
  }).join('');

  // Total bruto = soma de qty × unit de todos os itens pagos
  const grossTotal = equipList.reduce((s,e) => {
    if (e.gratuito) return s;
    return s + (parseInt(e.qty)||1) * (parseFloat(e.valorUnit)||0);
  }, 0);
  // Desconto total = soma dos descontos por item + valorDesconto do pedido
  const totalDesconto = equipList.reduce((s,e) => s + (!e.gratuito ? parseFloat(e.desconto||0) : 0), 0);
  const descontoVal = totalDesconto > 0 ? totalDesconto : parseFloat(pv.valorDesconto||0);
  // Valor líquido = bruto − desconto
  const liqVal = grossTotal > 0 ? (grossTotal - descontoVal) : parseFloat(pv.valorLiquido||pv.valorTotal||0);

  const descontoRow = `<tr style="background:#f5f5f5">
    <td colspan="3" style="text-align:right;font-weight:bold;font-size:9px;padding:3px 5px">DESCONTO/ ACR&Eacute;SCIMO</td>
    <td style="text-align:right;font-weight:bold;padding:3px 5px;border-left:1px solid #000">${descontoVal > 0 ? '- R$ ' + descontoVal.toLocaleString('pt-BR',{minimumFractionDigits:2}) : 'R$ 0,00'}</td>
    <td style="border-left:1px solid #000"></td>
  </tr>`;
  const totalRow = `<tr style="background:#e5e5e5">
    <td colspan="3" style="text-align:right;font-weight:bold;font-size:9px;padding:3px 5px">VALOR TOTAL</td>
    <td style="text-align:right;font-weight:bold;font-size:11px;padding:3px 5px;border-left:1px solid #000">${fmtBRL(liqVal)}</td>
    <td style="border-left:1px solid #000"></td>
  </tr>`;

  // Observações gerais
  const obsParts = [];
  const obsDescricao = op.stepData?.aberta?.descricao;
  if (obsDescricao) obsParts.push(obsDescricao);
  if (pv.enderecoEntrega) obsParts.push(`Endereço de Entrega: ${esc(pv.enderecoEntrega)}`);
  if (pv.contatoEntrega)  obsParts.push(`Contato responsável: ${esc(pv.contatoEntrega)}`);
  if (pv.prazo) {
    let ps = `Prazo de entrega: ${pv.prazo} ${pv.diasUteis===false?'dias':'dias úteis'}`;
    if (pv.aContarDe) ps += ` a contar de ${pv.aContarDe}`;
    if (pv.dataPrevista) ps += ` — Previsão: ${pv.dataPrevista}`;
    obsParts.push(ps);
  }
  if (pv.treinamento) obsParts.push(`Treinamento: ${pv.treinamento}`);
  if (pv.instagram)   obsParts.push(`Instagram: ${pv.instagram}`);
  if (pv.simulador && parseFloat(pv.simulador) > 0) obsParts.push(`Simulador: ${fmtBRL(pv.simulador)}`);
  const tesUniq = [...new Set(equipList.filter(e=>e.tes).map(e=>`TES ${e.tes}${e.tesDesc?' ('+e.tesDesc+')':''}`))];
  if (tesUniq.length) obsParts.push(tesUniq.join(', '));
  const obsText = obsParts.join('\n');

  // Tabela de parcelas / condições de pagamento
  let parcHtml;
  const _pagamentos = Array.isArray(pv.pagamentos) ? pv.pagamentos.filter(pg => pg && pg.valor > 0) : [];
  if (_pagamentos.length > 0) {
    const toOrd = s => { const [d,m,y] = (s||'').split('/').map(Number); return (y||0)*10000+(m||0)*100+(d||0); };
    const sorted = [..._pagamentos].sort((a,b) => toOrd(a.venc) - toOrd(b.venc));
    const groups = new Map();
    sorted.forEach(pg => {
      const key = `${pg.forma||''}||${pg.valor}`;
      if (!groups.has(key)) groups.set(key, { valor: pg.valor, vencs: [] });
      groups.get(key).vencs.push(pg.venc || '');
    });
    const parcRows = [...groups.values()].map(g => {
      const qty = g.vencs.length;
      return `<tr>
        <td style="text-align:center">${qty}</td>
        <td style="text-align:right">${fmtBRL(g.valor)}</td>
        <td style="text-align:center">${g.vencs[0]||'-'}</td>
        <td style="text-align:center">${qty > 1 ? g.vencs[qty-1] : '-'}</td>
      </tr>`;
    }).join('');
    parcHtml = `<table class="pay">
      <thead><tr>
        <th>Qtda Parcelas</th><th>Valor da parcela</th>
        <th>Data de Vencimento</th><th>Data do &uacute;ltimo vencimento</th>
      </tr></thead>
      <tbody>${parcRows}</tbody>
    </table>`;
  } else {
    let textRows = '';
    if (pv.tipoContrato || pv.detalhesPagamento) {
      textRows += `<tr><td colspan="4" style="text-align:left;padding:4px 8px">${esc([pv.tipoContrato, pv.detalhesPagamento].filter(Boolean).join(' — '))}</td></tr>`;
    }
    if (pv.entrada && pv.entrada !== 'sem' && parseFloat(pv.valorEntrada||0) > 0) {
      textRows += `<tr><td colspan="4" style="text-align:left;font-size:9px;color:#555;padding:3px 8px">Entrada: ${fmtBRL(pv.valorEntrada)}</td></tr>`;
    }
    if (!textRows) textRows = '<tr><td colspan="4">-</td></tr>';
    parcHtml = `<table class="pay">
      <thead><tr><th colspan="4" style="text-align:center">CONDI&Ccedil;&Otilde;ES DE PAGAMENTO</th></tr></thead>
      <tbody>${textRows}</tbody>
    </table>`;
  }

  // Campos preenchidos automaticamente no bloco de expedição:
  const previsaoChegada = pv.dataPrevista || '';                        // previsão de entrega (definida na abertura da OP)
  const numeroNFPdf     = op.stepData?.aguard_emissao?.numeroNF || '';  // preenchido após a emissão da NF

  const w = window.open('', '_blank', 'width=900,height=1200');
  if (!w) { showToast('Popup bloqueado pelo navegador. Permita popups para este site e tente novamente.', 'err'); return; }
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
