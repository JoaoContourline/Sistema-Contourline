<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de OPs — Contourline</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface2: #f0f2f5;
  --border: #e2e5eb; --border2: #d0d5de;
  --text: #111827; --text2: #4b5563; --text3: #9ca3af;
  --accent: #2563eb; --accent2: #1d4ed8;
  --green: #16a34a; --green-bg: rgba(22,163,74,.08);
  --yellow: #ca8a04; --yellow-bg: rgba(202,138,4,.08);
  --orange: #ea580c; --orange-bg: rgba(234,88,12,.08);
  --red: #dc2626; --red-bg: rgba(220,38,38,.08);
  --gray: #6b7280; --gray-bg: rgba(107,114,128,.08);
  --blue: #2563eb; --blue-bg: rgba(37,99,235,.08);
  --purple: #7c3aed; --purple-bg: rgba(124,58,237,.08);
  --teal: #0d9488; --teal-bg: rgba(13,148,136,.08);
  --radius: 8px; --radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* HEADER */
header {
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,.97); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.logo { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.logo-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: grid; place-items: center; font-size: 14px; }
.logo-text { font-size: 14px; font-weight: 700; }
.logo-sub { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; }

/* ROLE SELECTOR */
.role-selector { display: flex; gap: 4px; flex-wrap: wrap; }
.role-btn {
  padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text2);
  font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px;
}
.role-btn:hover { border-color: var(--border2); color: var(--text); }
.role-btn.active { border-color: var(--accent); background: var(--blue-bg); color: var(--accent); }

/* NEW OP BUTTON */
.btn-nova-op {
  padding: 7px 14px; background: var(--accent); border: none; color: #fff;
  border-radius: var(--radius); font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.btn-nova-op:hover { background: var(--accent2); }

/* TABS */
.tabs { padding: 0 24px; border-bottom: 1px solid var(--border); display: flex; background: var(--surface); }
.tab-btn {
  padding: 12px 16px; border: none; background: transparent;
  color: var(--text3); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; position: relative; transition: color .15s; display: flex; align-items: center; gap: 7px;
}
.tab-btn::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: transparent; border-radius: 2px 2px 0 0; transition: background .15s; }
.tab-btn.active { color: var(--text); }
.tab-btn.active::after { background: var(--accent); }
.tab-count { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px; font-size: 10px; font-family: 'DM Mono', monospace; }
.tab-btn.active .tab-count { background: var(--accent); border-color: var(--accent); color: #fff; }

/* MAIN */
main { padding: 24px; }
.step-header { margin-bottom: 20px; }
.step-title { font-size: 18px; font-weight: 700; }
.step-desc { font-size: 12px; color: var(--text3); margin-top: 3px; }

/* CARD GRID */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

/* CARD */
.card {
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  border-radius: var(--radius-lg); padding: 16px;
  cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .1s;
  animation: cardIn .25s ease both;
}
@keyframes cardIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.card:hover { border-color: var(--border2); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.card.actionable { border-color: rgba(37,99,235,.2); }
.card.actionable:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,99,235,.12); }
.card.blocked { border-color: rgba(220,38,38,.2); }
.card.blocked:hover { border-color: var(--red); }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-op { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); font-weight: 500; }
.card-flags { display: flex; gap: 3px; flex-wrap: wrap; }
.flag { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; font-family: 'DM Mono', monospace; }
.flag-dir   { background: rgba(234,88,12,.1);  color: var(--orange); border: 1px solid rgba(234,88,12,.25); }
.flag-div   { background: rgba(220,38,38,.1);  color: var(--red);    border: 1px solid rgba(220,38,38,.25); }
.flag-multi { background: rgba(124,58,237,.1); color: var(--purple); border: 1px solid rgba(124,58,237,.25); }

.card-client { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 6px; }
.equip-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.equip-chip { display: inline-block; padding: 2px 8px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 5px; font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text2); }

.card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

/* BADGE */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .2px; }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; }
.b-blue   { background: var(--blue-bg);   color: var(--blue);   }
.b-yellow { background: var(--yellow-bg); color: var(--yellow); }
.b-orange { background: var(--orange-bg); color: var(--orange); }
.b-purple { background: var(--purple-bg); color: var(--purple); }
.b-teal   { background: var(--teal-bg);   color: var(--teal);   }
.b-green  { background: var(--green-bg);  color: var(--green);  }
.b-red    { background: var(--red-bg);    color: var(--red);    }
.b-gray   { background: var(--gray-bg);   color: var(--gray);   }

/* SEMA */
.sema { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-family: 'DM Mono', monospace; }

/* PIPELINE BAR */
.pipe-bar { display: flex; gap: 3px; margin-bottom: 10px; }
.pipe-dot { flex: 1; height: 3px; border-radius: 2px; background: var(--border); }
.pipe-dot.done    { background: var(--green); }
.pipe-dot.current { background: var(--accent); }
.pipe-dot.blocked { background: var(--red); }

/* CARD LAST EVENT */
.card-last-event { margin-top: 8px; font-size: 11px; color: var(--text3); line-height: 1.4; border-top: 1px solid var(--border); padding-top: 8px; }

/* CARD FOOTER */
.card-footer { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.btn-action { width: 100%; padding: 9px; border-radius: var(--radius); background: var(--accent); border: none; color: #fff; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
.btn-action:hover { background: var(--accent2); }
.btn-action.danger { background: transparent; border: 1px solid rgba(220,38,38,.25); color: var(--red); }
.btn-action.danger:hover { background: var(--red-bg); border-color: var(--red); }
.btn-action.warn { background: transparent; border: 1px solid rgba(234,88,12,.25); color: var(--orange); }
.btn-action.warn:hover { background: var(--orange-bg); border-color: var(--orange); }

/* SECTION */
.section { margin-bottom: 28px; }
.section-label { font-size: 10px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); margin-bottom: 10px; padding: 5px 10px; background: var(--surface2); border-radius: 6px; display: inline-block; }

/* EMPTY */
.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-icon { font-size: 32px; margin-bottom: 10px; }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
.empty-desc { font-size: 12px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 300; opacity: 0; pointer-events: none; transition: opacity .2s; display: grid; place-items: center; padding: 20px; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 480px; transform: scale(.97) translateY(8px); transition: transform .2s; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
.modal-overlay.open .modal { transform: scale(1) translateY(0); }
.modal.wide { max-width: 620px; }
.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-subtitle { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; }
.close-btn { width: 26px; height: 26px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); cursor: pointer; font-size: 14px; display: grid; place-items: center; flex-shrink: 0; transition: all .15s; }
.close-btn:hover { background: var(--border); color: var(--text); }
.modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

.op-info-block { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.op-info-client { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
.op-info-meta { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; display: flex; gap: 10px; flex-wrap: wrap; }

/* FORM FIELDS */
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 10px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .6px; color: var(--text3); }
.form-input, .form-select, .form-textarea {
  padding: 8px 11px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 13px;
  font-family: 'Syne', sans-serif; outline: none; transition: border-color .15s; width: 100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
.form-textarea { resize: vertical; min-height: 68px; }
.form-select option { background: var(--surface); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* EQUIPMENT LIST */
.equip-picker { display: flex; flex-direction: column; gap: 8px; }
.equip-add-row { display: flex; gap: 6px; }
.equip-add-row .form-select { flex: 1; }
.btn-add-equip {
  padding: 8px 14px; background: var(--accent); border: none; color: #fff;
  border-radius: var(--radius); font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background .15s; flex-shrink: 0;
}
.btn-add-equip:hover { background: var(--accent2); }
.equip-list-items { display: flex; flex-direction: column; gap: 5px; }
.equip-list-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 10px;
}
.equip-list-item-name { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text); }
.equip-list-item-qty { display: flex; align-items: center; gap: 6px; }
.equip-qty-btn { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; display: grid; place-items: center; transition: background .1s; }
.equip-qty-btn:hover { background: var(--border2); }
.equip-qty-val { font-size: 12px; font-family: 'DM Mono', monospace; width: 20px; text-align: center; }
.equip-remove { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1; transition: color .1s; }
.equip-remove:hover { color: var(--red); }
.equip-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 10px; background: var(--surface2); border: 1px dashed var(--border2); border-radius: 6px; }

/* FILE UPLOAD */
.file-upload-area {
  border: 1.5px dashed var(--border2); border-radius: var(--radius);
  padding: 14px; text-align: center; cursor: pointer; transition: all .15s;
  background: var(--surface2);
}
.file-upload-area:hover { border-color: var(--accent); background: var(--blue-bg); }
.file-upload-area.has-file { border-color: var(--green); background: var(--green-bg); border-style: solid; }
.file-upload-text { font-size: 12px; color: var(--text3); }
.file-upload-text.has-file { color: var(--green); font-weight: 600; }

/* MULTI-FILE UPLOAD */
.multi-file-wrap { display: flex; flex-direction: column; gap: 6px; }
.multi-file-list { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.multi-file-item { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 5px 9px; }
.multi-file-item-name { flex: 1; font-size: 11px; font-family: 'DM Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multi-file-item-size { font-size: 10px; color: var(--text3); white-space: nowrap; }
.multi-file-remove { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 15px; padding: 0 2px; line-height: 1; transition: color .1s; flex-shrink: 0; }
.multi-file-remove:hover { color: var(--red); }
.multi-file-add-btn { display: block; padding: 8px 12px; background: var(--surface2); border: 1.5px dashed var(--border2); border-radius: var(--radius); font-size: 12px; color: var(--text2); cursor: pointer; transition: all .15s; text-align: center; width: 100%; font-family: 'Syne', sans-serif; }
.multi-file-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--blue-bg); }

/* BUTTONS */
.btn-primary { padding: 8px 18px; background: var(--accent); border: none; color: #fff; border-radius: var(--radius); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
.btn-primary:hover { background: var(--accent2); }
.btn-primary.orange { background: var(--orange); }
.btn-primary.orange:hover { background: #c94f0b; }
.btn-primary.red { background: var(--red); }
.btn-primary.red:hover { background: #b91c1c; }
.btn-cancel { padding: 8px 18px; background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: var(--radius); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
.btn-cancel:hover { border-color: var(--border2); color: var(--text); }

/* WARN BLOCK */
.warn-block { padding: 10px 12px; border-radius: var(--radius); background: var(--orange-bg); border: 1px solid rgba(234,88,12,.2); font-size: 12px; color: var(--text2); line-height: 1.5; }
.warn-block strong { color: var(--orange); }
.info-block { padding: 10px 12px; border-radius: var(--radius); background: var(--blue-bg); border: 1px solid rgba(37,99,235,.15); font-size: 12px; color: var(--text2); line-height: 1.5; }
.info-block strong { color: var(--accent); }
.success-block { padding: 10px 12px; border-radius: var(--radius); background: var(--green-bg); border: 1px solid rgba(22,163,74,.15); font-size: 12px; color: var(--text2); line-height: 1.5; }
.success-block strong { color: var(--green); }

/* DETAIL GRID */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.detail-item { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px; }
.detail-label { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; color: var(--text3); margin-bottom: 3px; }
.detail-value { font-size: 12px; font-weight: 600; }

/* HISTORY */
.history-item { display: flex; gap: 10px; }
.history-ts { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); width: 80px; flex-shrink: 0; padding-top: 1px; line-height: 1.4; }
.history-text { font-size: 12px; color: var(--text2); line-height: 1.5; }
.history-author { color: var(--text); font-weight: 600; }

/* SKIP BADGE */
.skip-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--teal-bg); border: 1px solid rgba(13,148,136,.2); border-radius: 20px; font-size: 10px; color: var(--teal); font-family: 'DM Mono', monospace; }

/* SECTION DIVIDER */
.form-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.badge.b-blue .badge-dot, .badge.b-yellow .badge-dot, .badge.b-orange .badge-dot, .badge.b-teal .badge-dot { animation: pulse 2s infinite; }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.api-status { font-size:10px; font-family:'DM Mono',monospace; min-height:13px; margin-top:3px; line-height:1.3; }

/* SPLIT ACTION MODAL */
.modal.split { max-width: 880px; overflow: hidden; display: flex; flex-direction: column; }
.modal-split-body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; min-height: 0; }
.split-pane { overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.split-pane-left { border-right: 1px solid var(--border); background: var(--surface2); }
.split-pane-header { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .9px; color: var(--text3); padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 2px; flex-shrink: 0; }
.ctx-sec { display: flex; flex-direction: column; gap: 7px; }
.ctx-sec-title { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .7px; color: var(--text3); border-bottom: 1px solid var(--border); padding-bottom: 3px; }
.ctx-row { display: flex; flex-direction: column; gap: 2px; }
.ctx-label { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .4px; color: var(--text3); }
.ctx-value { font-size: 12px; color: var(--text); line-height: 1.4; }
@media (max-width: 680px) {
  .modal.split { max-width: 98vw; }
  .modal-split-body { grid-template-columns: 1fr; }
  .split-pane-left { max-height: 220px; border-right: none; border-bottom: 1px solid var(--border); }
}

/* ACCORDION */
[hidden] { display: none !important; }
.acc { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.acc + .acc { margin-top: 8px; }
.acc-head {
  padding: 9px 13px; display: flex; justify-content: space-between; align-items: center;
  background: var(--surface2); cursor: pointer; user-select: none;
  font-size: 12px; font-weight: 700; transition: background .12s;
}
.acc-head:hover { background: var(--border); }
.acc-arrow { font-size: 11px; color: var(--text3); transition: transform .18s; display: inline-block; }
.acc-body { padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); }

/* KANBAN */
.kanban-wrap { overflow-x: auto; padding-bottom: 16px; }
.kanban-board { display: flex; gap: 10px; align-items: flex-start; padding: 2px 1px; }
.kanban-col { width: 224px; flex-shrink: 0; display: flex; flex-direction: column; }
.kanban-col-head {
  padding: 8px 11px 7px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0;
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.kanban-col-name { font-size: 11px; font-weight: 700; white-space: nowrap; }
.kanban-col-body {
  background: var(--surface2); border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 60px;
}
.kanban-col-body .card { animation: none; }
.kanban-empty { font-size: 11px; color: var(--text3); text-align: center; padding: 14px 6px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📋</div>
    <div>
      <div class="logo-text">Monitor de OPs</div>
      <div class="logo-sub">Contourline · Logística</div>
    </div>
  </div>
  <div class="role-selector" id="roleSelector"></div>

function rowToOp(row) {

async function loadOps() {
  document.getElementById('main').innerHTML =

  const maxId = ops.reduce((m, o) => Math.max(m, Number(o.id) || 0), 0);
  nextId = maxId + 1;
  renderAll();

// Salva ou atualiza uma OP no Supabase (fire-and-forget para não bloquear UI)
function dbSaveOp(op) {
  sb.from('ops')
    .update({ numero: op.numero, cliente: op.cliente, status: op.status, data: op })
    .eq('id', op.id)
    .then(({ error }) => { if (error) console.error('dbSaveOp error:', error); });
}

// Realtime — sincroniza mudanças de outros usuários
function startRealtime() {
  sb.channel('ops-monitor')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ops' }, payload => {
      if (payload.eventType === 'INSERT') {
        const newOp = rowToOp(payload.new);
        if (!ops.find(o => o.id === newOp.id)) ops.unshift(newOp);
      } else if (payload.eventType === 'UPDATE') {
        const updated = rowToOp(payload.new);
        const idx = ops.findIndex(o => o.id === updated.id);
        if (idx >= 0) ops[idx] = updated; else ops.unshift(updated);
      } else if (payload.eventType === 'DELETE') {
        ops = ops.filter(o => o.id !== Number(payload.old.id));
      }
      renderAll();
    })
    .subscribe();
}

// QUEUE RESOLUTION ALGORITHM
// ═══════════════════════════════════════════════════════════════════

function getQueue(user) {
  return ops.filter(op => {
    const step = STEPS[op.status];
    if (!step) return false;
    if (user.role === 'gestor')   return false;
    if (user.role === 'vendedor') return false; // vendedor apenas cria OPs via "+ Nova OP"
    return step.owner === user.role;
  });
}

function getCompleted(user) {
  if (user.role === 'gestor')   return ops.filter(o => o.status === 'entregue');
  if (user.role === 'vendedor') return ops; // Comercial vê todas as OPs
  return ops.filter(op => {
    const acted = op.history.some(h => h.actor === user.role);
    return acted && !getQueue(user).some(q => q.id === op.id);
  });
}

// ═══════════════════════════════════════════════════════════════════

function nowTs() {
  const d = new Date();
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function advanceOP(opId, formData) {
  const op = ops.find(o => o.id === opId);
  if (!op) return;
  const step = STEPS[op.status];
  const next = step.getNext(op);
  if (!next) return;

  if (formData && Object.keys(formData).length) op.stepData[op.status] = { ...formData };

  const user = getUser();
  op.history.push({ step: op.status, actor: user.role, actorName: user.name, ts: nowTs(), note: formData?.descricao || step.actionLabel });
  op.status = next;
  dbSaveOp(op);  // persiste no Supabase (não bloqueia UI)
  renderAll();
}

function rejectOP(opId, formData) {
  const op = ops.find(o => o.id === opId);
  if (!op) return;
  const step = STEPS[op.status];
  if (!step.getReject) return;
  op.stepData[op.status + '_reject'] = formData;
  const user = getUser();
  op.history.push({ step: op.status, actor: user.role, actorName: user.name, ts: nowTs(), note: 'Bloqueado: ' + (formData.descricao || formData.motivoReemissao || '') });
  op.status = step.getReject();
  dbSaveOp(op);  // persiste no Supabase (não bloqueia UI)
  renderAll();
}

function directorOverride(opId, nota) {
  const op = ops.find(o => o.id === opId);
  if (!op || (op.status !== 'aguard_financeiro' && op.status !== 'bloqueada')) return;
  op.liberadoDiretoria = true;
  const user = getUser();
  op.history.push({ step: op.status, actor: 'diretoria', actorName: user.name, ts: nowTs(), note: nota || 'Liberado por autorização da diretoria. Entrada ainda pendente.' });
  op.status = 'aguard_nf';
  renderAll();
}

function semaforo(op) {
  if (op.status === 'entregue') return { cls:'b-gray', label:'Entregue', icon:'' };
  const d = daysSince(op.dataAbertura);
  if (d <= 16) return { cls:'b-green',  label:`${20-d}d restantes`, icon:'●' };
  if (d <= 20) return { cls:'b-yellow', label:`${20-d}d p/ ótima`,  icon:'▲' };
  if (d <= 30) return { cls:'b-red',    label:`${d-20}d atrasada`,  icon:'!' };
  return { cls:'b-red', label:`${d-30}d crítico`, icon:'!!' };
}

function stepBadge(status) {

  const qt = parseInt(e.qty) || 1;

  return (qt * vu * (1 - dc / 100)).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function equipSelectChange(sel) {
  const wrap = document.getElementById('equip-custom-wrap');

}

function equipAdd() {
  const sel = document.getElementById('equip-select');
  if (!sel) return;
  const custom = document.getElementById('equip-custom');
  const name = sel.value === '__custom__'
    ? (custom?.value?.trim() || '')
    : sel.value;
  if (!name) return;
  const existing = tempEquipList.find(e => e.name === name);
  if (existing) { existing.qty++; }
  else { tempEquipList.push({ name, qty: 1, valorUnit: '', desconto: '' }); }
  sel.value = '';
  if (custom) custom.value = '';
  const wrap = document.getElementById('equip-custom-wrap');
  if (wrap) wrap.style.display = 'none';
  refreshEquipList();
}

function equipQty(idx, delta) {
  tempEquipList[idx].qty = Math.max(1, tempEquipList[idx].qty + delta);
  refreshEquipList();
}

function equipRemove(idx) {
  tempEquipList.splice(idx, 1);
  refreshEquipList();
}

function equipPrice(idx, val) {
  if (!tempEquipList[idx]) return;
  const numVal = parseBRL(val);
  tempEquipList[idx].valorUnit = numVal > 0 ? numVal.toString() : '';
  const lineT = numVal ? (parseInt(tempEquipList[idx].qty)||1) * numVal : 0;
  const el = document.getElementById('equip-total-' + idx);
  if (el) el.textContent = lineT > 0 ? 'R$ ' + lineT.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '';
  updateEquipListTotal();
}

function updateEquipListTotal() {
  const el = document.getElementById('equip-list-total');
  if (!el) return;
  const subtotal = tempEquipList.reduce((sum, e) => {
    if (!e.valorUnit) return sum;
    return sum + (parseInt(e.qty)||1) * (parseFloat(e.valorUnit)||0);
  }, 0);
  el.textContent = subtotal > 0
    ? 'Subtotal: R$ ' + subtotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : '';
  calcDescontoTotal();
}

function calcDescontoTotal() {
  const subtotal = tempEquipList.reduce((sum, e) => {
    if (!e.valorUnit) return sum;
    return sum + (parseInt(e.qty)||1) * (parseFloat(e.valorUnit)||0);
  }, 0);
  const desconto = parseBRL(document.getElementById('nova-desconto')?.value) || 0;
  const total = Math.max(0, subtotal - desconto);
  const elDisp = document.getElementById('nova-valor-total-display');
  if (elDisp) elDisp.textContent = total > 0 ? 'R$ ' + total.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '—';
  const vt = document.getElementById('nova-valorTotal');
  const vd = document.getElementById('nova-valorDesconto');
  const vl = document.getElementById('nova-valorLiquido');
  if (vt) vt.value = subtotal > 0 ? subtotal.toFixed(2) : '';
  if (vd) vd.value = desconto > 0 ? desconto.toFixed(2) : '';
  if (vl) vl.value = total > 0 ? total.toFixed(2) : '';
}

function refreshEquipList() {
  const el = document.getElementById('equip-list-items');
  if (!el) return;
  el.innerHTML = tempEquipList.length
    ? tempEquipList.map((e,i) => renderEquipItem(e,i)).join('')

}

// ═══════════════════════════════════════════════════════════════════
// BRL FORMATTING HELPERS
// ═══════════════════════════════════════════════════════════════════

function parseBRL(val) {
  if (!val && val !== 0) return 0;
  return parseFloat(String(val).replace(/\./g, '').replace(',', '.')) || 0;
}

function brlFormat(input) {
  const cur = input.selectionStart;
  const old = input.value;
  let val = input.value.replace(/[^\d,]/g, '');
  if (!val) return;
  const parts = val.split(',');
  const intPart = parts[0].replace(/^0+/, '') || '0';
  const formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  input.value = parts.length > 1 ? formatted + ',' + parts[1].slice(0, 2) : formatted;
  const diff = input.value.length - old.length;
  try { input.setSelectionRange(cur + diff, cur + diff); } catch(e) {}
}

function brlFmtNum(n) {
  const num = parseFloat(n);
  if (isNaN(num)) return '';
  return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ═══════════════════════════════════════════════════════════════════
// MULTI-FILE SYSTEM
// ═══════════════════════════════════════════════════════════════════

function addMultiFile(input, key) {
  if (!input.files.length) return;
  if (!tempFiles[key]) tempFiles[key] = [];
  Array.from(input.files).forEach(f => tempFiles[key].push(f));
  input.value = '';
  refreshMultiFileList(key);
}

function removeMultiFile(key, idx) {
  if (!tempFiles[key]) return;
  tempFiles[key].splice(idx, 1);
  refreshMultiFileList(key);
}

function refreshMultiFileList(key) {
  const el = document.getElementById('mfl-' + key);
  if (!el) return;
  const files = tempFiles[key] || [];
  el.innerHTML = files.map((f, i) => `
    <div class="multi-file-item">
      <span class="multi-file-item-name">📎 ${f.name}</span>
      <span class="multi-file-item-size">${(f.size/1024).toFixed(0)} KB</span>
      <button class="multi-file-remove" type="button" onclick="removeMultiFile('${key}',${i})" title="Remover">×</button>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════════════════
// FIELD RENDERER
// ═══════════════════════════════════════════════════════════════════

function buildFieldHtml(f) {
  if (f.type === 'equipment-list') return equipListHtml();

  if (f.type === 'multi-file') return `
    <div class="form-group">
      <label class="form-label">${f.label}</label>
      <div class="multi-file-wrap">
        <div class="multi-file-list" id="mfl-${f.key}"></div>
        <label class="multi-file-add-btn" style="cursor:pointer">
          <input type="file" id="f-${f.key}" ${f.accept?`accept="${f.accept}"`:''}
            style="display:none" multiple onchange="addMultiFile(this,'${f.key}')">
          + Adicionar arquivo(s)
        </label>
      </div>
    </div>`;

  if (f.type === 'file') return `
    <div class="form-group">
      <label class="form-label">${f.label}</label>
      <label style="cursor:pointer">
        <input type="file" id="f-${f.key}" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"
          style="display:none" onchange="handleFile(this)">
        <div class="file-upload-area" id="file-display-${f.key}">
          <div class="file-upload-text">📎 Clique para anexar arquivo (PDF, Word, Excel, Imagem)</div>
        </div>
      </label>
    </div>`;

  return `
    <div class="form-group">
      <label class="form-label">${f.label}</label>
      ${f.type === 'textarea'
        ? `<textarea class="form-textarea" id="f-${f.key}" rows="3"></textarea>`
        : `<input class="form-input" id="f-${f.key}" type="${f.type}">`}
    </div>`;
}

function handleFile(input) {
  if (!input.files[0]) return;
  const key = input.id.replace('f-','');
  const display = document.getElementById(`file-display-${key}`);
  if (display) {
    display.classList.add('has-file');
    display.innerHTML = `<div class="file-upload-text has-file">✓ ${input.files[0].name} <span style="font-weight:400;color:var(--green);opacity:.7">(${(input.files[0].size/1024).toFixed(0)} KB)</span></div>`;
  }
}

function renderQueue(user, el) {
  const queue = getQueue(user);
  const config = {
    vendedor:   ['Minhas OPs',                                'Acompanhe as OPs que você criou. Para abrir uma nova, use o botão "+ Nova OP" no topo.'],
    financeiro: ['Validação Financeira',                      'OPs com entrada pendente aguardando aprovação de pagamento'],
    logistica:  ['NF a Solicitar',                            'Preencha os dados de despacho e solicite a emissão da nota fiscal'],
    fiscal:     ['Notas Fiscais a Emitir',                    'Preencha os dados — emita a NF e registre o número aqui'],
    entrega:    ['Em Trânsito — Aguardando Confirmação',      'Confirme a entrega ao cliente'],
    gestor:     ['Sem ações pendentes',                       'Você tem acesso de visualização. Use "Todas as OPs" para o painel completo.'],
  };
  const [title, desc] = config[user.role] || ['Minha Fila',''];

  if (user.role === 'gestor') {
    el.innerHTML = `<div class="step-header"><div class="step-title">${title}</div><div class="step-desc">${desc}</div></div>
      <div class="empty"><div class="empty-icon">👁</div><div class="empty-title">Acesso de visualização</div><div class="empty-desc">Use "Todas as OPs" para o painel completo.</div></div>`;
    return;
  }
  if (user.role === 'vendedor') {
    const ativas    = ops.filter(o => o.status !== 'entregue');
    const entregues = ops.filter(o => o.status === 'entregue');
    let html = `<div class="step-header"><div class="step-title">${title}</div><div class="step-desc">${desc}</div></div>`;
    if (!ops.length) {
      html += `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Nenhuma OP ainda</div><div class="empty-desc">Clique em "+ Nova OP" para começar.</div></div>`;
    } else {
      if (ativas.length)    html += `<div class="section"><div class="section-label">Em andamento (${ativas.length})</div><div class="card-grid">${ativas.map((op,i)=>card(op,false,i)).join('')}</div></div>`;
      if (entregues.length) html += `<div class="section"><div class="section-label">Entregues (${entregues.length})</div><div class="card-grid">${entregues.map((op,i)=>card(op,false,i)).join('')}</div></div>`;
    }
    el.innerHTML = html;
    return;
  }
  el.innerHTML = `<div class="step-header"><div class="step-title">${title}</div><div class="step-desc">${desc}</div></div>
    ${queue.length === 0
      ? `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">Fila vazia</div><div class="empty-desc">Nenhuma OP aguardando sua ação agora.</div></div>`
      : `<div class="card-grid">${queue.map((op,i) => card(op,true,i)).join('')}</div>`}`;
}

function renderConcluidas(user, el) {
  const list = getCompleted(user);
  el.innerHTML = `<div class="step-header"><div class="step-title">Concluídas por Mim</div><div class="step-desc">OPs em que você já tomou uma ação</div></div>
    ${list.length === 0
      ? `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Nenhuma concluída ainda</div></div>`
      : `<div class="card-grid">${list.map((op,i) => card(op,false,i)).join('')}</div>`}`;
}

function renderTodas(el) {
  const order = ['bloqueada','aberta','aguard_financeiro','aguard_nf','aguard_emissao','aguard_despacho','transito','entregue'];
  const groups = {};
  ops.forEach(op => { (groups[op.status]=groups[op.status]||[]).push(op); });
  const abertas = ops.filter(o=>o.status!=='entregue').length;
  const cols = order.map(status => {
    const s = STEPS[status];
    const colOps = groups[status] || [];
    const badgeCls = COLOR_MAP[s?.color||'gray'] || 'b-gray';
    return `<div class="kanban-col">
      <div class="kanban-col-head">
        <span class="kanban-col-name">${s?.label||status}</span>
        <span class="badge ${badgeCls}" style="font-size:9px;padding:1px 6px">${colOps.length}</span>
      </div>
      <div class="kanban-col-body">
        ${colOps.length ? colOps.map((op,i)=>card(op,false,i)).join('') : '<div class="kanban-empty">—</div>'}
      </div>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="step-header">
      <div class="step-title">Todas as OPs</div>
      <div class="step-desc">${abertas} em aberto · ${ops.length-abertas} entregues</div>
    </div>
    <div class="kanban-wrap"><div class="kanban-board">${cols}</div></div>`;
}

// ═══════════════════════════════════════════════════════════════════
// CARD RENDERER
// ═══════════════════════════════════════════════════════════════════

function card(op, inQueue, animIdx) {
  const user     = getUser();
  const step     = STEPS[op.status];
  const badge    = stepBadge(op.status);
  const sem      = semaforo(op);
  const isBlocked = op.status === 'bloqueada';

  const dots = PIPELINE_ORDER.map(s => {
    const sIdx   = STEPS[s]?.pipelineIdx ?? 0;
    const curIdx = isBlocked ? 1 : (step?.pipelineIdx ?? 0);
    if (sIdx < curIdx)  return `<div class="pipe-dot done"></div>`;
    if (sIdx === curIdx) return `<div class="pipe-dot ${isBlocked?'blocked':'current'}"></div>`;
    return `<div class="pipe-dot"></div>`;
  }).join('');

  const canAct = inQueue && step?.owner === user.role;

  const skippedFin = op.history.some(h => h.note?.includes('Validação financeira pulada'));
  const lastEvt    = op.history[op.history.length-1];

  // Equipment chips
  const equipList = op.equipamentos?.length
    ? op.equipamentos.map(e=>`<span class="equip-chip">${e}</span>`).join('')
    : `<span class="equip-chip">${op.equipamento||'—'}</span>`;

  let footer = '';
  if (canAct) {
    footer = `<div class="card-footer">
      <button class="btn-action" onclick="event.stopPropagation();openActionModal(${op.id},'advance')">${step.actionLabel}</button>
      ${step.getReject ? `<button class="btn-action danger" onclick="event.stopPropagation();openActionModal(${op.id},'reject')">${step.rejectLabel||'Bloquear'}</button>` : ''}
    </div>`;
  }

  return `
  <div class="card ${canAct?'actionable':''} ${isBlocked?'blocked':''}" style="animation-delay:${animIdx*.04}s" onclick="openCard(${op.id})">
    <div class="card-top">
      <div>
        <div class="card-op">OP ${op.numero}</div>
        <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${fmtDate(op.dataAbertura)} · ${op.vendedorName}</div>
      </div>
      <div class="card-flags">${flagsHtml(op)}</div>
    </div>
    <div class="card-client">${op.cliente}</div>
    <div class="equip-chips">${equipList}</div>
    <div class="card-meta">
      <span class="badge ${badge.cls}"><span class="badge-dot" style="background:currentColor"></span>${badge.label}</span>
      ${op.status!=='entregue' ? `<span class="sema ${sem.cls}">${sem.icon?sem.icon+' ':''}${sem.label}</span>` : ''}
      ${skippedFin ? `<span class="skip-badge">↷ Fin. pulado</span>` : ''}
    </div>
    <div class="pipe-bar">${dots}</div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3)">${op.numContrato||op.canal||op.contrato} <span>${entradaHtml(op.entrada)}</span></div>
    ${lastEvt ? `<div class="card-last-event"><span style="color:var(--text2)">${lastEvt.actorName}:</span> ${lastEvt.note.substring(0,90)}${lastEvt.note.length>90?'…':''}</div>` : ''}
    ${footer}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// CONTEXT PANEL — acumula respostas anteriores
// ═══════════════════════════════════════════════════════════════════

function buildContextPanel(op) {
  const pv = op.pedidoVenda;
  const sd = op.stepData || {};
  const sem = semaforo(op);
  const badge = stepBadge(op.status);

  const cRow = (label, val) => {
    if (!val) return '';
    return `<div class="ctx-row"><span class="ctx-label">${label}</span><span class="ctx-value">${val}</span></div>`;
  };
  const sec = (title, rows) => {
    const content = rows.filter(Boolean).join('');
    if (!content) return '';
    return `<div class="ctx-sec"><div class="ctx-sec-title">${title}</div>${content}</div>`;
  };

  let parts = [];

  // OP summary header
  parts.push(`<div style="display:flex;flex-direction:column;gap:5px">
    <div style="font-size:13px;font-weight:700;line-height:1.3">${op.cliente}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
      <span class="badge ${badge.cls}"><span class="badge-dot" style="background:currentColor"></span>${badge.label}</span>
      ${op.status!=='entregue'?`<span class="sema ${sem.cls}">${sem.label}</span>`:''}
    </div>
    <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${[op.numContrato||op.contrato||'',op.vendedorName,daysSince(op.dataAbertura)+'d'].filter(Boolean).join(' · ')}</div>
    ${op.obs?`<div style="font-size:11px;color:var(--text2)">${op.obs}</div>`:''}
  </div>`);

  // Pedido do Cliente
  if (pv) {
    const equipLines = (pv.equipamentos||[]).map(e=>`${e.name}${e.qty>1?' ×'+e.qty:''}`).join('<br>');
    const addrParts  = [pv.endRua, pv.endBairro, [pv.endCidade,pv.endEstado].filter(Boolean).join('/'), pv.endCEP].filter(Boolean);
    const endDisplay = addrParts.length ? addrParts.join(', ') : (pv.enderecoCliente||'');

    const payRows = [];
    if (pv.tipoContrato)   payRows.push(cRow('Tipo de Contrato', `<strong>${pv.tipoContrato}</strong>`));
    if (pv.valorTotal)     payRows.push(cRow('Valor Bruto', fmtBRL(pv.valorTotal)));
    if (pv.valorDesconto && parseFloat(pv.valorDesconto) > 0)
                           payRows.push(cRow('Desconto', '− ' + fmtBRL(pv.valorDesconto)));
    if (pv.valorLiquido)   payRows.push(cRow('Valor Total', fmtBRL(pv.valorLiquido)));
    if (pv.detalhesPagamento) payRows.push(cRow('Pagamento', pv.detalhesPagamento.replace(/\n/g,'<br>')));
    if (pv.simulador && parseFloat(pv.simulador) > 0)
                           payRows.push(cRow('Simulador', fmtBRL(pv.simulador)));
    if (pv.entrada === 'pendente')
                           payRows.push(cRow('Entrada', (pv.valorEntrada ? fmtBRL(pv.valorEntrada) : 'a definir') + ' — PENDENTE'));

    parts.push(sec('Pedido do Cliente', [
      cRow('Vendedor(a)', pv.vendedorCanal),
      cRow('Equipamentos', equipLines),
      pv.voltagem ? cRow('Voltagem', pv.voltagem) : '',
      cRow('CPF / CNPJ', pv.cpf),
      cRow('Tel.', pv.tel),
      cRow('E-mail', pv.email),
      cRow('Endereço', endDisplay),
      ...payRows,
      pv.enderecoEntrega && pv.enderecoEntrega !== endDisplay
                       ? cRow('Endereço de entrega', pv.enderecoEntrega) : '',
      cRow('Contato responsável', pv.contatoEntrega),
      pv.dataPrevista  ? cRow('Prazo / Previsão', (pv.prazo ? pv.prazo + ' dias úteis' + (pv.aContarDe ? ' a contar de ' + pv.aContarDe : '') + ' — ' : '') + pv.dataPrevista) : '',
      cRow('Treinamento', pv.treinamento),
    ]));
  } else {
    parts.push(sec('Pedido', [
      cRow('Equipamentos', (op.equipamentos||[op.equipamento||'—']).join(', ')),
      cRow('Contrato', op.numContrato||op.contrato),
    ]));
  }

  // Validação financeira
  if (sd.aguard_financeiro) {
    parts.push(sec('Validação Financeira', [
      cRow('Aprovação', sd.aguard_financeiro.descricao),
    ]));
  }

  // Logística — solicitação de NF
  if (sd.aguard_nf) {
    const d = sd.aguard_nf;
    parts.push(sec('Solicitação de NF (Logística)', [
      cRow('Endereço de entrega', d.enderecoEntrega),
      cRow('Técnico / Transportadora', d.tecnico),
      (d.volumes||d.peso) ? cRow('Vol / Peso', [d.volumes&&d.volumes+' vol', d.peso&&d.peso+' kg'].filter(Boolean).join(' · ')) : '',
      cRow('Obs.', d.descricao),
    ]));
  }

  // Emissão da NF
  if (sd.aguard_emissao) {
    const d = sd.aguard_emissao;
    parts.push(sec('Nota Fiscal Emitida', [
      cRow('Número NF', d.numeroNF),
      d.dataEmissao ? cRow('Data de emissão', fmtDate(d.dataEmissao)) : '',
      cRow('Obs.', d.descricao),
    ]));
  }

  // Re-emissão solicitada (logística rejeitou despacho)
  if (sd.aguard_despacho_reject) {
    const d = sd.aguard_despacho_reject;
    parts.push(`<div style="background:var(--red-bg);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px">
      <div class="ctx-sec-title" style="color:var(--red);border-color:rgba(220,38,38,.2)">Re-emissão Solicitada</div>
      ${d.motivoReemissao?`<div class="ctx-row">${cRow('Motivo',d.motivoReemissao)}</div>`:''}
      ${d.dadosCorrigidos?`<div class="ctx-row">${cRow('Dados corrigidos',d.dadosCorrigidos.replace(/\n/g,'<br>'))}</div>`:''}
    </div>`);
  }

  // Despacho confirmado
  if (sd.aguard_despacho) {
    parts.push(sec('Despacho Confirmado', [
      cRow('Confirmação', sd.aguard_despacho.descricao),
    ]));
  }

  // Arquivo da OP
  if (sd.aberta?.arquivoOP) {
    parts.push(sec('Arquivo', [
      cRow('Arquivo da OP', '📎 ' + sd.aberta.arquivoOP),
    ]));
  }

  return parts.join('');
}

// ═══════════════════════════════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════════════════════════════

function openCard(opId) {
  const op   = ops.find(o => o.id === opId);
  const user = getUser();
  const step = STEPS[op.status];
  const canAct = step?.owner === user.role;
  canAct ? openActionModal(opId,'advance') : openInfoModal(opId);
}

function openActionModal(opId, mode) {
  activeOpId = opId; modalMode = mode; tempFiles = {};
  const op   = ops.find(o => o.id === opId);
  const step = STEPS[op.status];
  const fields = mode==='reject' ? (step.rejectFields||[]) : (step.formFields||[]);

  // Reset and pre-seed equipment list for aberta step
  if (op.status === 'aberta' && mode === 'advance') {
    tempEquipList = (op.equipamentos||[])
      .filter(e => e && e !== '—')
      .map(e => {
        const m = e.match(/^(.+)\s\(x(\d+)\)$/);
        return m ? { name: m[1], qty: parseInt(m[2]) } : { name: e, qty: 1 };
      });
  } else {
    tempEquipList = [];
  }

  const titles = { advance: step.actionLabel, reject: step.rejectLabel||'Bloquear OP' };
  const btnCls  = { advance: '', reject: ' red' };
  const btnLbl  = { advance: 'Confirmar →', reject: 'Bloquear' };

  // Algorithm note for "aberta" step
  let algoNote = '';
  if (op.status === 'aberta' && mode === 'advance') {
    algoNote = op.entrada === 'pendente'
      ? `<div class="warn-block">⚠ Entrada <strong>pendente</strong> — esta OP irá para <strong>Validação Financeira</strong> antes de prosseguir.</div>`
      : `<div class="success-block">✓ Entrada <strong>${op.entrada==='paga'?'paga':'não exigida'}</strong> — validação financeira será <strong>pulada</strong>. OP irá direto para Logística.</div>`;
  }

  const dirNote = '';

  // Rejection warning when aguard_emissao reopens after Logística rejection
  let rejectionNote = '';
  if (op.status === 'aguard_emissao' && op.stepData?.aguard_despacho_reject && mode === 'advance') {
    const rej = op.stepData.aguard_despacho_reject;
    rejectionNote = `
      <div style="background:var(--red-bg);border:1.5px solid rgba(220,38,38,.3);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px">
        <div style="font-size:11px;font-weight:700;color:var(--red);letter-spacing:.2px">⚠ RE-EMISSÃO SOLICITADA PELA LOGÍSTICA</div>
        ${rej.motivoReemissao ? `<div style="font-size:12px;color:var(--text);line-height:1.5"><strong>Motivo:</strong> ${rej.motivoReemissao}</div>` : ''}
        ${rej.dadosCorrigidos ? `<div style="font-size:12px;color:var(--text);line-height:1.5;padding:8px;background:rgba(0,0,0,.03);border-radius:6px;border:1px solid rgba(220,38,38,.15)"><strong>Dados corrigidos:</strong><br>${rej.dadosCorrigidos.replace(/\n/g,'<br>')}</div>` : ''}
        <div style="font-size:11px;color:var(--text3)">Os campos abaixo foram pré-preenchidos com os dados anteriores. Corrija conforme necessário e re-emita.</div>
      </div>`;
  }

function closeModal() {
  document.getElementById('overlay').classList.remove('open');

}

function submitModal() {
  if (!activeOpId || !modalMode) return;
  const op   = ops.find(o => o.id === activeOpId);
  const step = STEPS[op.status];

  // Re-emission: combined aguard_nf + aguard_emissao form
  if (op.status === 'aguard_emissao' && op.stepData?.aguard_despacho_reject && modalMode === 'advance') {
    const err = id => { const e = document.getElementById(id); if(e){e.style.borderColor='var(--red)';e.style.boxShadow='0 0 0 3px rgba(220,38,38,.12)';e.focus();} };
    const addr  = document.getElementById('f-reNF_enderecoEntrega')?.value?.trim();
    const tec   = document.getElementById('f-reNF_tecnico')?.value?.trim();
    const numNF = document.getElementById('f-numeroNF')?.value?.trim();
    const dtNF  = document.getElementById('f-dataEmissao')?.value;
    const descNF= document.getElementById('f-descricao')?.value?.trim();
    if (!addr)  { err('f-reNF_enderecoEntrega'); return; }
    if (!tec)   { err('f-reNF_tecnico');         return; }
    if (!numNF) { err('f-numeroNF');              return; }
    if (!dtNF)  { err('f-dataEmissao');           return; }
    if (!descNF){ err('f-descricao');             return; }
    op.stepData.aguard_nf = {
      enderecoEntrega: addr,
      tecnico: tec,
      volumes: document.getElementById('f-reNF_volumes')?.value || '',
      peso:    document.getElementById('f-reNF_peso')?.value    || '',
      descricao: document.getElementById('f-reNF_descricao')?.value?.trim() || '',
    };
    const fileNF = document.getElementById('f-arquivoNF')?.files[0]?.name || op.stepData.aguard_emissao?.arquivoNF || '';
    advanceOP(activeOpId, { numeroNF: numNF, dataEmissao: dtNF, arquivoNF: fileNF, descricao: descNF });
    closeModal(); return;
  }

  const fields = modalMode==='reject' ? (step.rejectFields||[]) : (step.formFields||[]);
  const formData = {};

  for (const f of fields) {
    if (f.type === 'equipment-list') {
      if (f.required && !tempEquipList.length) {
        const el = document.getElementById('equip-list-items');
        if (el) el.style.outline = '2px solid var(--red)';
        return;
      }
      formData.equipamentos = [...tempEquipList];
      continue;
    }
    if (f.type === 'multi-file') {
      formData[f.key] = (tempFiles[f.key] || []).map(file => file.name);
      continue;
    }
    if (f.type === 'file') {
      const input = document.getElementById('f-' + f.key);
      formData[f.key] = input?.files[0]?.name || '';
      continue;
    }
    const el  = document.getElementById('f-' + f.key);
    const val = el?.value?.trim();
    if (f.required && !val) { el.style.borderColor='var(--red)'; el.style.boxShadow='0 0 0 3px rgba(220,38,38,.12)'; el.focus(); return; }
    formData[f.key] = val || '';
  }

  modalMode === 'reject' ? rejectOP(activeOpId, formData) : advanceOP(activeOpId, formData);
  closeModal();
}

function updateValorLiquido() {

  const liq   = Math.max(0, total - desc);

  if (el) { el.value = (total > 0) ? liq.toFixed(2) : ''; }

function calcDataPrevista() {
  const prazo = parseInt(document.getElementById('nova-prazo')?.value);
  const aContarDe = document.getElementById('nova-aContarDe')?.value;
  const el = document.getElementById('nova-data-prevista');
  if (!el) return;
  if (!prazo || prazo <= 0) { el.textContent = '—'; return; }
  const d = aContarDe ? new Date(aContarDe + 'T12:00:00') : new Date();
  let dias = 0;
  while (dias < prazo) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) dias++;
  }
  el.textContent = d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' });
}

function toggleSameAddress(checked) {
  const entrega = document.getElementById('nova-enderecoEntrega');
  if (!entrega) return;
  if (checked) {
    const rua    = document.getElementById('nova-endRua')?.value || '';
    const bairro = document.getElementById('nova-endBairro')?.value || '';
    const cidade = document.getElementById('nova-endCidade')?.value || '';
    const estado = document.getElementById('nova-endEstado')?.value || '';
    const cep    = document.getElementById('nova-cep-cliente')?.value || '';
    const parts  = [rua, bairro, [cidade, estado].filter(Boolean).join('/'), cep].filter(Boolean);
    entrega.value    = parts.join(', ');
    entrega.disabled = true;
    entrega.style.opacity = '0.6';
  } else {
    entrega.disabled = false;
    entrega.style.opacity = '1';
  }
}

function fillClientFromProtheus(d) {
  const fill = (id, val) => { const el = document.getElementById(id); if (el && val && !el.value) el.value = String(val).trim(); };
  fill('nova-cliente', d.name || d.shortName);
  const addr = d.address || {};
  const ruaParts = [addr.address, addr.number, addr.complement].map(s => (s||'').trim()).filter(Boolean);
  fill('nova-endRua',    ruaParts.join(', '));
  fill('nova-endBairro', addr.district);
  fill('nova-endCidade', addr.city && addr.city.cityDescription);
  const estEl = document.getElementById('nova-endEstado');
  const stateId = addr.state && addr.state.stateId && addr.state.stateId.trim();
  if (estEl && !estEl.value && stateId) estEl.value = stateId;
  const rawCep = (addr.zipCode || '').replace(/\D/g, '');
  if (rawCep.length === 8) fill('nova-cep-cliente', rawCep.replace(/^(\d{5})(\d{3})$/, '$1-$2'));
  const comm = (d.listOfCommunicationInformation || [])[0] || {};
  const ddd = (comm.diallingCode || '').trim();
  const tel = (comm.phoneNumber || '').trim();
  if (tel) fill('nova-tel', ddd ? '(' + ddd + ') ' + tel : tel);
  fill('nova-email', comm.email);
  const govInfo = d.GovernmentalInformation || [];
  const rgEntry = govInfo.find(function(g){ return g.name === 'RG'; });
  if (rgEntry && rgEntry.id && rgEntry.id.trim()) fill('nova-rg', rgEntry.id.trim());
  togglePFFields(d.entityType !== 'J');
}

function lookupProtheusClient(rawVal) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length < 11) return Promise.resolve(false);
  setStatus('cnpj-status', 'Buscando no Protheus…', 'loading');
  // Chama a Vercel function /api/protheus — sem CORS, sem credenciais no frontend
  return fetch('/api/protheus?cpfCnpj=' + digits)
    .then(res => res.json().then(data => ({ ok: res.ok, status: res.status, data })))
    .then(({ ok, status, data }) => {
      if (!ok) {
        setStatus('cnpj-status', 'Protheus: ' + (data.error || data.message || ('HTTP ' + status)), 'err');
        return false;
      }
      const items = data.items || (Array.isArray(data) ? data : []);
      if (!items.length) {
        setStatus('cnpj-status', 'Não encontrado no Protheus', 'err');
        return false;
      }
      fillClientFromProtheus(items[0]);
      setStatus('cnpj-status', 'OK: ' + (items[0].name || items[0].shortName || '').trim().substring(0, 35) + ' (Protheus)', 'ok');
      showToast('Cliente encontrado no Protheus');
      return true;
    })
    .catch(err => {
      setStatus('cnpj-status', 'Erro: ' + err.message, 'err');
      return false;
    });
}

function searchClientBtn() {
  var cpfVal = (document.getElementById('nova-cpf') || {}).value || '';
  var digits = cpfVal.replace(/\D/g, '');
  if (!digits) { setStatus('cnpj-status', 'Digite o CPF ou CNPJ primeiro', 'err'); return; }
  lookupProtheusClient(cpfVal).then(function(found) {
    if (!found && digits.length === 14) lookupCNPJ(cpfVal);
  });
}

function fmtCEP(input) {
  let v = input.value.replace(/\D/g, '').slice(0, 8);
  if (v.length > 5) v = v.slice(0,5) + '-' + v.slice(5);
  input.value = v;
}

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.style.color = type === 'ok' ? 'var(--green)' : type === 'err' ? 'var(--red)' : 'var(--text3)';
}

function showToast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:22px;right:22px;background:${type==='ok'?'var(--green)':'var(--red)'};color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:toastIn .2s ease;pointer-events:none`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function lookupCEP(rawVal, targetId, statusId) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 8) return;
  setStatus(statusId, 'Buscando…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cep/v2/' + digits);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const el = document.getElementById(targetId);
    if (el && !el.disabled) {
      const parts = [d.street, d.neighborhood, [d.city, d.state].filter(Boolean).join('/'), d.cep].filter(Boolean);
      el.value = parts.join(', ');
    }
    setStatus(statusId, '✓ ' + [d.city, d.state].filter(Boolean).join('/'), 'ok');
  } catch {
    setStatus(statusId, '✗ CEP não encontrado', 'err');
  }
}

async function lookupCEPSplit(rawVal, ruaId, bairroId, cidadeId, estadoId, statusId) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 8) return;
  setStatus(statusId, 'Buscando…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cep/v2/' + digits);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const fillEl = (id, val) => { const e = document.getElementById(id); if (e && !e.value && val) e.value = val; };
    fillEl(ruaId, d.street);
    fillEl(bairroId, d.neighborhood);
    fillEl(cidadeId, d.city);
    const estEl = document.getElementById(estadoId);
    if (estEl && !estEl.value && d.state) estEl.value = d.state;
    setStatus(statusId, '✓ ' + [d.city, d.state].filter(Boolean).join('/'), 'ok');
  } catch {
    setStatus(statusId, '✗ CEP não encontrado', 'err');
  }
}

function togglePFFields(show) {
  const el = document.getElementById('nova-pf-fields');

}

function onCpfCnpjInput(val) {

async function lookupCNPJ(rawVal) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 14) return;
  setStatus('cnpj-status', 'Buscando CNPJ…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + digits);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const fill = (id, val) => { const el = document.getElementById(id); if (el && !el.value && val) el.value = val; };
    fill('nova-cliente', d.razao_social || d.nome_fantasia);
    fill('nova-tel', d.ddd_telefone_1);
    fill('nova-email', d.email ? d.email.toLowerCase() : '');
    if (d.logradouro) fill('nova-endRua', d.logradouro + (d.numero && d.numero !== '0' ? ', ' + d.numero : '') + (d.complemento ? ' ' + d.complemento : ''));
    fill('nova-endBairro', d.bairro);
    fill('nova-endCidade', d.municipio);
    const estEl = document.getElementById('nova-endEstado');
    if (estEl && !estEl.value && d.uf) estEl.value = d.uf;
    if (d.cep) fill('nova-cep-cliente', d.cep.replace(/\D/g,'').replace(/^(\d{5})(\d{3})$/,'$1-$2'));
    togglePFFields(false);
    setStatus('cnpj-status', '✓ ' + (d.razao_social || d.nome_fantasia || 'CNPJ encontrado'), 'ok');
    showToast('CNPJ encontrado — dados preenchidos automaticamente');
  } catch {
    setStatus('cnpj-status', '✗ CNPJ não encontrado ou inválido', 'err');
  }
}

  const opData = {

    numContrato: numContrato || '',
    entrada,
    dataAbertura: new Date().toISOString().split('T')[0],
    status: initialStatus,
    liberadoDiretoria: false, opDivergente: false, multiOp: false,

      contatoEntrega, prazo,

      note: (descricao || '') + (pulou ? ' — Validação financeira pulada.' : ''),
    }],
    obs: '',

  const btnCriar = g('btn-criar-op');
  if (btnCriar) { btnCriar.disabled = true; btnCriar.textContent = 'Salvando…'; }

  // Insere no Supabase para obter o ID real

.obs-box{background:#f7f9fc;border:1px solid #d8dfe8;border-radius:4px;padding:10px 12px;margin-top:10px}
.obs-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#162C45;margin-bottom:6px}
.obs-line{font-size:11px;line-height:1.8}
/* footer */
.footer-bar{margin-top:10px;display:flex;justify-content:space-between;border-top:1.5px solid #162C45;padding-top:7px;font-size:12px}
.footer-bar .val{font-weight:800}
.sig-block{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:48px}
.sig{border-bottom:1px solid #333;height:28px;margin-bottom:4px}
.sig-lbl{font-size:9px;color:#666;text-align:center}
.no-print{text-align:right;margin-bottom:14px}
.no-print button{padding:8px 18px;background:#162C45;color:#fff;border:none;border-radius:5px;font-size:12px;cursor:pointer;font-weight:700}
@media print{@page{margin:12mm;size:A4}.no-print{display:none!important}}
</style></head><body><div class="page">
<div class="no-print"><button onclick="window.print()">🖨 Imprimir / Salvar PDF</button></div>

<div class="hdr">
  <div>
    <div class="brand">CONTOURLINE</div>
    <div class="brand-sub">Equipamentos Médicos e Diagnósticos Ltda<br>CNPJ: ${pv.cnpj}</div>
  </div>
  <div class="doc-title">Pedido do Cliente</div>
</div>

<table class="meta-grid">
  <tr>
    <td class="lbl">Vendedor(a)</td><td>${pv.vendedorCanal||'—'}</td>
    <td class="lbl">Data</td><td>${pv.data||'—'}</td>
  </tr>
  <tr>
    <td class="lbl">Analista</td><td>${pv.analista||'—'}</td>
    <td class="lbl">Contrato</td><td>${pv.numContrato||'—'}</td>
  </tr>
</table>

<table class="cli">
  <tr>
    <td colspan="3"><strong>{ X } Nome: ${pv.cliente||'—'}</strong></td>
    <td style="white-space:nowrap"><span class="lbl">DN: </span>${pv.dn||'—'}</td>
  </tr>
  <tr>
    <td><span class="lbl">CPF: </span>${pv.cpf||'—'}</td>
    <td><span class="lbl">RG: </span>${pv.rg||'—'}</td>
    <td colspan="2"><span class="lbl">E-mail: </span>${pv.email||'—'}</td>
  </tr>
  <tr>
    <td colspan="4"><span class="lbl">Endereço: </span>${pv.endRua||pv.enderecoCliente||'—'}</td>
  </tr>
  <tr>
    <td><span class="lbl">Bairro: </span>${pv.endBairro||'—'}</td>
    <td><span class="lbl">Cidade: </span>${pv.endCidade||'—'}</td>
    <td><span class="lbl">CEP: </span>${pv.endCEP||'—'}</td>
    <td></td>
  </tr>
  <tr>
    <td><span class="lbl">Estado: </span>${pv.endEstado||'—'}</td>
    <td colspan="3"><span class="lbl">Tel.: </span>${pv.tel||'—'}</td>
  </tr>
  <tr>
    <td><span class="lbl">Profissão: </span>${pv.profissao||'—'}</td>
    <td colspan="3"><span class="lbl">Nº documento: </span>${pv.numDocumento||'N/A'}</td>
  </tr>
</table>

<table class="equip">
  <thead><tr>
    <th style="text-align:center;width:50px">Quant.</th>
    <th>Descrição</th>
    <th style="text-align:right;width:120px">Valor Unitário</th>
    <th style="text-align:right;width:120px">Valor Total</th>
  </tr></thead>
  <tbody>
    ${equipRows}
    ${descontoRow}
    ${totalRow}
  </tbody>
</table>

${pv.voltagem ? `<div style="font-size:11px;margin-bottom:8px">Voltagem: ${pv.voltagem}</div>` : ''}

<div style="margin:8px 0 4px">
  ${pv.tipoContrato ? `<div class="pay-type">${pv.tipoContrato}</div>` : ''}
  ${payLines}
  ${simLine}
</div>

${obsHtml ? `<div class="obs-box"><div class="obs-lbl">Observações</div>${obsHtml}</div>` : ''}

<div class="footer-bar">
  <div>Valor total da compra: <span class="val">${fmtBRL(pv.valorLiquido||pv.valorTotal)}</span></div>
  <div>Frete: <strong>${pv.frete||'EMPRESA'}</strong></div>
</div>
</div></body></html>`);
  w.document.close();
}

// ═══════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════

function setUser(id) { currentUserId = id; renderAll(); }
function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMain(); renderCounts();
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// ═══════════════════════════════════════════════════════════════════
// INIT — carrega do Supabase e inicia Realtime
// ═══════════════════════════════════════════════════════════════════
renderRoles();
loadOps().then(() => startRealtime());
</script>
</body>
</html>
