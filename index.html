function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.style.color = type === 'ok' ? 'var(--green)' : type === 'err' ? 'var(--red)' : 'var(--text3)';
}

function showToast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:22px;right:22px;background:${type==='ok'?'var(--green)':'var(--red)'};color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:toastIn .2s ease;pointer-events:none`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function lookupCEP(rawVal, targetId, statusId) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 8) return;
  setStatus(statusId, 'Buscando…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cep/v2/' + digits);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const el = document.getElementById(targetId);
    if (el && !el.disabled) {
      const parts = [d.street, d.neighborhood, [d.city, d.state].filter(Boolean).join('/'), d.cep].filter(Boolean);
      el.value = parts.join(', ');
    }
    setStatus(statusId, '✓ ' + [d.city, d.state].filter(Boolean).join('/'), 'ok');
  } catch {
    setStatus(statusId, '✗ CEP não encontrado', 'err');
  }
}

// CEP lookup genérico: preenche um campo textarea pelo ID
// AbortController por statusId previne race condition ao digitar rápido
const _cepControllers = {};
async function lookupCEPforField(rawVal, targetId, statusId) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 8) return;
  if (_cepControllers[statusId]) _cepControllers[statusId].abort();
  _cepControllers[statusId] = new AbortController();
  setStatus(statusId, 'Buscando…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cep/v2/' + digits, { signal: _cepControllers[statusId].signal });
    if (!res.ok) throw new Error('not-found');
    const d = await res.json();
    const el = document.getElementById(targetId);
    if (el) {
      const cepFmt = digits.replace(/^(\d{5})(\d{3})$/, '$1-$2');
      const parts = [d.street, d.neighborhood, [d.city, d.state].filter(Boolean).join('/'), cepFmt].filter(Boolean);
      el.value = parts.join(', ');
    }
    setStatus(statusId, `✓ ${[d.city, d.state].filter(Boolean).join('/')}`, 'ok');
  } catch (e) {
    if (e.name === 'AbortError') return; // cancelado por nova digitação — ignora
    setStatus(statusId, '✗ CEP não encontrado', 'err');
  }
}

async function lookupCEPSplit(rawVal, ruaId, bairroId, cidadeId, estadoId, statusId) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 8) return;
  setStatus(statusId, 'Buscando…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cep/v2/' + digits);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const fillEl = (id, val) => { const e = document.getElementById(id); if (e && !e.value && val) e.value = val; };
    fillEl(ruaId, d.street);
    fillEl(bairroId, d.neighborhood);
    fillEl(cidadeId, d.city);
    const estEl = document.getElementById(estadoId);
    if (estEl && !estEl.value && d.state) estEl.value = d.state;
    setStatus(statusId, '✓ ' + [d.city, d.state].filter(Boolean).join('/'), 'ok');
  } catch {
    setStatus(statusId, '✗ CEP não encontrado', 'err');
  }
}

async function lookupCNPJ(rawVal) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length !== 14) return;
  setStatus('cnpj-status', 'Buscando CNPJ…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + digits);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const fill = (id, val) => { const el = document.getElementById(id); if (el && !el.value && val) el.value = val; };
    fill('nova-cliente', d.razao_social || d.nome_fantasia);
    fill('nova-tel', d.ddd_telefone_1);
    fill('nova-email', d.email ? d.email.toLowerCase() : '');
    if (d.logradouro) fill('nova-endRua', d.logradouro + (d.numero && d.numero !== '0' ? ', ' + d.numero : '') + (d.complemento ? ' ' + d.complemento : ''));
    fill('nova-endBairro', d.bairro);
    fill('nova-endCidade', d.municipio);
    const estEl = document.getElementById('nova-endEstado');
    if (estEl && !estEl.value && d.uf) estEl.value = d.uf;
    if (d.cep) fill('nova-cep-cliente', d.cep.replace(/\D/g,'').replace(/^(\d{5})(\d{3})$/,'$1-$2'));
    togglePFFields(false);
    setStatus('cnpj-status', '✓ ' + (d.razao_social || d.nome_fantasia || 'CNPJ encontrado'), 'ok');
    showToast('CNPJ encontrado — dados preenchidos automaticamente');
  } catch {
    setStatus('cnpj-status', '✗ CNPJ não encontrado ou inválido', 'err');
  }
}

    numContrato: numContrato || '',

      enderecoEntrega: enderecoEntrega || enderecoCliente || '',
      contatoEntrega, prazo, diasUteis,
      aContarDe: fmtD(aContarDe),
      dataPrevista: (dataPrevista && dataPrevista !== '—') ? dataPrevista : '',
      treinamento,
      equipamentos: tempEquipList.map(e => ({ ...e })),
    },
    stepData: {
      aberta: { clienteNome: cliente, equipamentos: [...tempEquipList], arquivoOP: arquivo, comprovanteEntrada, descricao },
    },
    history: [{
      step: 'aberta', actor: 'vendedor', actorName: (getUser()?.userName || getUser()?.name || vendedorCanal || ''), ts: nowTs(),
      action: 'OP Criada' + (pulou ? ' — Fin. pulado' : ''),
      note: descricao || '',
    }],
    obs: '',
  };

  // Desabilita botão durante o insert
  const btnCriar = g('btn-criar-op');
  if (btnCriar) { btnCriar.disabled = true; btnCriar.textContent = 'Salvando…'; }

  // Insere no Supabase para obter o ID real
  const { data: rows, error } = await sb.from('ops').insert({
    cliente:  opData.cliente,
    status:   opData.status,
    data:     opData,
  }).select('id');

  if (error || !rows?.length) {
    console.error('Erro ao inserir OP:', error);

  const n = parseFloat(v);

}

</style></head><body><div class="page">
<div class="no-print"><button onclick="window.print()">Imprimir / Salvar PDF</button></div>

<div class="hdr">
  <div>
    <div class="brand">CONTOURLINE</div>
    <div class="brand-sub">Equipamentos Médicos e Diagnósticos Ltda<br>CNPJ: ${pv.cnpj}</div>
  </div>
  <div class="doc-title">Pedido do Cliente</div>
</div>

<table class="meta-grid">
  <tr>
    <td class="lbl">Vendedor(a)</td><td>${pv.vendedorCanal||'—'}</td>
    <td class="lbl">Data</td><td>${pv.data||'—'}</td>
  </tr>
  <tr>
    <td class="lbl">Analista</td><td>${pv.analista||'—'}</td>
    <td class="lbl">Contrato</td><td>${pv.numContrato||'—'}</td>
  </tr>
</table>

<table class="cli">
  <tr>
    <td colspan="3"><strong>{ X } Nome: ${pv.cliente||'—'}</strong></td>
    <td style="white-space:nowrap"><span class="lbl">DN: </span>${pv.dn||'—'}</td>
  </tr>
  <tr>
    <td><span class="lbl">CPF: </span>${pv.cpf||'—'}</td>
    <td><span class="lbl">RG: </span>${pv.rg||'—'}</td>
    <td colspan="2"><span class="lbl">E-mail: </span>${pv.email||'—'}</td>
  </tr>
  <tr>
    <td colspan="4"><span class="lbl">Endereço: </span>${[pv.endRua, pv.endNumero].filter(Boolean).join(', ')||pv.enderecoCliente||'—'}</td>
  </tr>
  <tr>
    <td><span class="lbl">Bairro: </span>${pv.endBairro||'—'}</td>
    <td><span class="lbl">Cidade: </span>${pv.endCidade||'—'}</td>
    <td><span class="lbl">CEP: </span>${pv.endCEP||'—'}</td>
    <td></td>
  </tr>
  <tr>
    <td><span class="lbl">Estado: </span>${pv.endEstado||'—'}</td>
    <td colspan="3"><span class="lbl">Tel.: </span>${pv.tel||'—'}</td>
  </tr>
  <tr>
    <td><span class="lbl">Profissão: </span>${pv.profissao||'—'}</td>
    <td colspan="3"><span class="lbl">Nº documento: </span>${pv.numDocumento||'N/A'}</td>
  </tr>
</table>

<table class="equip">
  <thead><tr>
    <th style="text-align:center;width:80px">Código</th>
    <th style="text-align:center;width:50px">Quant.</th>
    <th>Descrição</th>
    <th style="text-align:right;width:120px">Valor Unitário</th>
    <th style="text-align:right;width:120px">Valor Total</th>
  </tr></thead>
  <tbody>
    ${equipRows}
    ${descontoRow}
    ${totalRow}
  </tbody>
</table>

${(()=>{ const vs = Array.isArray(pv.voltagem) ? pv.voltagem.filter(Boolean) : (pv.voltagem ? [pv.voltagem] : []); return vs.length ? `<div style="font-size:11px;margin-bottom:8px">Voltagem: ${vs.join(' / ')}</div>` : ''; })()}

<div style="margin:8px 0 4px">
  ${pv.tipoContrato ? `<div class="pay-type">${pv.tipoContrato}</div>` : ''}
  ${payLines}
  ${simLine}
  ${entradaLine}
</div>

${obsHtml ? `<div class="obs-box"><div class="obs-lbl">Observações</div>${obsHtml}</div>` : ''}

<div class="footer-bar">
  <div>Valor total da compra: <span class="val">${fmtBRL(pv.valorLiquido||pv.valorTotal)}</span></div>
  <div>Frete: <strong>${pv.frete||'EMPRESA'}</strong></div>
</div>
</div></body></html>`);
  w.document.close();
}

// ═══════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════

// setUser removido — autenticação agora via login screen
function setTab(tab, btn) {
  if (tab !== 'todas') todasFilter = ''; // limpa busca ao sair da aba
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMain(); renderCounts();
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// ═══════════════════════════════════════════════════════════════════
// INIT — carrega do Supabase e inicia Realtime
// ═══════════════════════════════════════════════════════════════════
checkSession();
</script>
</body>
</html>
