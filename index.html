// ── QR por UNIDADE ───────────────────────────────────────────────────
// Cada máquina física tem seu próprio adesivo, e o QR é o ID único no Sistema
// QR — logo, uma linha × 3 precisa de 3 códigos, não de 1.

/** Como o item é controlado: 'serie' | 'lote' | null (não controla).
 *  Fonte única da verdade — mesma regra do campo de Nº de Série: usa o valor
 *  salvo no item e, se não houver, consulta o catálogo (_equipCache). */
function equipTracking(e) {
  if (!e || e.serial === false) return null;            // retrocompat campo antigo
  if ('tracking' in e) return e.tracking;
  const cached = _equipCache?.find(c => c.name === e.name || (e.code && c.code === e.code));
  return cached ? cached.tracking : null;
}

/** Quantos campos de QR a linha mostra.
 *  Série: 1 por unidade (cada máquina tem seu adesivo).
 *  Lote:  1 só — o código que veio do Protheus vale para a linha toda. */
function qrQtdDaLinha(e) {
  const tracking = equipTracking(e);
  if (tracking === 'serie') return parseInt(e.qty) || 1;
  return 1; // lote ou desconhecido: um único campo
}

/** Lista de QRs da linha, normalizada e preenchida até a quantidade. */
function qrListaDaLinha(e, qtd) {
  const n = (qtd === undefined) ? qrQtdDaLinha(e) : qtd;
  const arr = Array.isArray(e.qrcodes) ? [...e.qrcodes] : (e.qrcode ? [e.qrcode] : []);
  while (arr.length < n) arr.push('');
  return arr.slice(0, n);
}

function qrInputsHtml(e, i) {
  const n = qrQtdDaLinha(e);
  if (!n) return '';
  return qrListaDaLinha(e, n).map((val, k) => `
    <div style="display:flex;gap:6px;align-items:center;background:var(--blue-bg);padding:5px 7px;border-radius:6px">
      <span style="font-size:10px;color:var(--accent);font-family:'DM Mono',monospace;font-weight:700;flex-shrink:0;display:flex;align-items:center;gap:3px">${icon('qr-code',13,'color:var(--accent)')} QR Code${n > 1 ? ' ' + (k+1) : ''}</span>
      <input class="form-input" style="flex:1;font-size:11px;padding:4px 7px;min-width:0;font-family:'DM Mono',monospace;border-color:var(--accent)${e.qrLocked?';background:var(--surface2);pointer-events:none':''}"
        type="text" ${e.qrLocked?'readonly':''}
        value="${val ? String(val).replace(/"/g,'&quot;') : ''}" oninput="equipQrcode(${i},${k},this.value)">
      ${k === 0 && e.qrLocked !== undefined ? (e.qrLocked
        ? `<button type="button" class="fl-btn" title="Editar QR" onclick="toggleQrLock(${i})" style="flex-shrink:0">${icon('pencil',13)}</button>`
        : `<button type="button" class="fl-btn fl-ok" title="Confirmar QR" onclick="toggleQrLock(${i})" style="flex-shrink:0">${icon('check',14)}</button>`) : ''}
    </div>`).join('');
}
function toggleQrLock(idx) {
  if (!tempEquipList[idx]) return;
  tempEquipList[idx].qrLocked = !tempEquipList[idx].qrLocked;
  refreshEquipList();
}

let equipSearchFocusIdx = -1;

function filterEquipSearch(val) {
  const dd = document.getElementById('equip-dropdown');
  if (!dd) return;
  if (!val.trim()) { dd.classList.remove('open'); equipSearchFocusIdx = -1; return; }
  if (!_equipCache) {
    dd.innerHTML = '<div class="equip-dropdown-item" style="color:var(--text3);cursor:default">Carregando catálogo…</div>';
    dd.classList.add('open'); return;
  }
  const filtered = equipSearch(val);
  if (!filtered.length) { dd.classList.remove('open'); return; }
  equipSearchFocusIdx = -1;
  dd.innerHTML = filtered.map((e, i) =>
    `<div class="equip-dropdown-item" onmousedown="event.preventDefault();selectEquipFromSearch(this.dataset.name)" data-name="${e.name.replace(/"/g,'&quot;')}" data-idx="${i}">
      <span class="equip-dropdown-name">${e.name}</span>
      ${e.code ? `<span class="equip-dropdown-code">${e.code}</span>` : ''}
    </div>`
  ).join('');
  dd.classList.add('open');
}

function selectEquipFromSearch(name) {
  const list  = _equipCache;
  if (!list) { showToast('Catálogo ainda carregando, aguarde', 'err'); return; }
  const found = list.find(e => e.name === name);
  if (!found) { showToast('Selecione um equipamento da lista', 'err'); return; }
  const existing = tempEquipList.find(e => e.name === name);
  if (existing) { existing.qty++; }
  else {
    const item = { name, code: found.code || '', qty: 1, valorUnit: '', desconto: '' };
    if (found.tracking !== undefined) item.tracking = found.tracking;
    tempEquipList.push(item);
  }
  const inp = document.getElementById('equip-search-input');
  if (inp) inp.value = '';
  const dd = document.getElementById('equip-dropdown');
  if (dd) dd.classList.remove('open');
  equipSearchFocusIdx = -1;
  refreshEquipList();
}

function equipSearchKeydown(e) {
  const dd = document.getElementById('equip-dropdown');
  if (!dd || !dd.classList.contains('open')) {
    if (e.key === 'Enter') e.preventDefault(); // bloqueio: exige seleção da lista
    return;
  }
  const items = dd.querySelectorAll('.equip-dropdown-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    equipSearchFocusIdx = Math.min(equipSearchFocusIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('focused', i === equipSearchFocusIdx));
    items[equipSearchFocusIdx]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    equipSearchFocusIdx = Math.max(equipSearchFocusIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('focused', i === equipSearchFocusIdx));
    items[equipSearchFocusIdx]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    // Seleciona o item destacado ou o primeiro da lista
    const idx  = equipSearchFocusIdx >= 0 ? equipSearchFocusIdx : 0;
    const name = items[idx]?.dataset.name;
    if (name) selectEquipFromSearch(name);
  } else if (e.key === 'Escape') {
    dd.classList.remove('open');
    equipSearchFocusIdx = -1;
  }
}

function hideEquipDropdownDelayed() {
  setTimeout(() => {
    const dd = document.getElementById('equip-dropdown');
    if (dd) dd.classList.remove('open');
    equipSearchFocusIdx = -1;
  }, 160);
}

function equipListHtml() {
  const items = tempEquipList.length
    ? tempEquipList.map((e,i) => renderEquipItem(e,i)).join('')
    : `<div class="equip-empty">Nenhum equipamento adicionado</div>`;

  return `
    <div class="form-group">
      <label class="form-label">Equipamentos *</label>
      <div class="equip-picker">
        <div class="equip-search-wrap">
          <input class="form-input" id="equip-search-input"
            placeholder="${_equipCache ? 'Buscar por nome ou código…' : 'Carregando catálogo…'}"
            autocomplete="off"
            oninput="filterEquipSearch(this.value)"
            onkeydown="equipSearchKeydown(event)"
            onblur="hideEquipDropdownDelayed()">
          <div id="equip-dropdown" class="equip-dropdown"></div>
        </div>
        <div class="equip-list-items" id="equip-list-items">${items}</div>
        <div id="equip-list-total" style="font-size:11px;font-family:'DM Mono',monospace;color:var(--green);text-align:right;min-height:14px;padding-top:3px"></div>
      </div>
    </div>`;
}

function equipQty(idx, delta) {
  tempEquipList[idx].qty = Math.max(1, tempEquipList[idx].qty + delta);
  refreshEquipList();
}

function equipRemove(idx) {
  tempEquipList.splice(idx, 1);
  refreshEquipList();
}

function equipPrice(idx, val) {
  if (!tempEquipList[idx]) return;
  const numVal = parseBRL(val);
  tempEquipList[idx].valorUnit = numVal > 0 ? numVal.toString() : '';
  const desc = parseFloat(tempEquipList[idx].desconto) || 0;
  const lineT = numVal ? Math.max(0, (parseInt(tempEquipList[idx].qty)||1) * numVal - desc) : 0;
  const el = document.getElementById('equip-total-' + idx);
  if (el) el.textContent = lineT > 0 ? 'R$ ' + lineT.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '';
  updateEquipListTotal();
}

// Desconto por equipamento (R$ sobre a linha)
function equipDiscount(idx, val) {
  if (!tempEquipList[idx]) return;
  const item    = tempEquipList[idx];
  const unit    = parseFloat(item.valorUnit) || 0;
  const qty     = parseInt(item.qty) || 1;
  const lineMax = unit * qty; // teto da linha

  let n = Math.max(0, parseBRL(val));
  let warn = '';

  // Regra 1: desconto do item não pode exceder o total da linha
  if (lineMax > 0 && n > lineMax) {
    n = lineMax;
    warn = `Máx. desta linha: R$ ${lineMax.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
  }

  // Regra 2: soma de todos os descontos não pode exceder o valor total do pedido
  const totalPedido   = tempEquipList.reduce((s, e) => s + (!e.gratuito ? (parseInt(e.qty)||1)*(parseFloat(e.valorUnit)||0) : 0), 0);
  const outrosDescs   = tempEquipList.reduce((s, e, i) => i !== idx && !e.gratuito ? s + (parseFloat(e.desconto)||0) : s, 0);
  const disponivelTotal = Math.max(0, totalPedido - outrosDescs);
  if (n > disponivelTotal) {
    n = disponivelTotal;
    warn = `Soma dos descontos não pode exceder o total do pedido (R$ ${totalPedido.toLocaleString('pt-BR',{minimumFractionDigits:2})})`;
  }

  item.desconto = n > 0 ? n.toString() : '';

  // Corrige o input se o valor foi truncado
  const inp = document.getElementById(`equip-desc-${idx}`);
  if (inp && Math.abs(parseBRL(inp.value) - n) > 0.001) {
    inp.value = n > 0 ? n.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '';
  }

  // Aviso visual
  const warnEl = document.getElementById(`equip-desc-warn-${idx}`);
  if (warnEl) { warnEl.textContent = warn; warnEl.style.display = warn ? '' : 'none'; }

  const lineT = lineMax ? Math.max(0, lineMax - n) : 0;
  const el = document.getElementById('equip-total-' + idx);
  if (el) el.textContent = lineT > 0 ? 'R$ ' + lineT.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '';
  updateEquipListTotal();
}

function equipQrcode(idx, k, val) {
  const e = tempEquipList[idx];
  if (!e) return;
  const arr = qrListaDaLinha(e);
  arr[k] = (val || '').trim();
  e.qrcodes = arr;
  e.qrcode  = arr[0] || ''; // compat: telas antigas leem só e.qrcode
}

function updateEquipListTotal() {
  const el = document.getElementById('equip-list-total');
  if (!el) return;
  const subtotal = tempEquipList.reduce((sum, e) => {
    if (!e.valorUnit) return sum;
    return sum + (parseInt(e.qty)||1) * (parseFloat(e.valorUnit)||0);
  }, 0);
  el.textContent = subtotal > 0
    ? 'Subtotal: R$ ' + subtotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : '';
  calcDescontoTotal();
}

function calcDescontoTotal() {
  const isAllFree = tempEquipList.length > 0 && tempEquipList.every(e => e.gratuito);
  const subtotal = tempEquipList.reduce((sum, e) => {
    if (e.gratuito || !e.valorUnit) return sum;
    return sum + (parseInt(e.qty)||1) * (parseFloat(e.valorUnit)||0);
  }, 0);
  // Desconto = soma dos descontos por equipamento
  const descTotal = tempEquipList.reduce((sum, e) => {
    if (e.gratuito) return sum;
    return sum + (parseFloat(e.desconto)||0);
  }, 0);
  const descontoEfetivo = Math.min(descTotal, subtotal);
  const total = Math.max(0, subtotal - descontoEfetivo);

  // Campo global é só leitura: mostra a soma dos descontos por item
  const descEl = document.getElementById('nova-desconto');
  if (descEl) descEl.value = descontoEfetivo > 0 ? descontoEfetivo.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : '';

  const elDisp = document.getElementById('nova-valor-total-display');
  if (elDisp) elDisp.textContent = isAllFree ? 'Gratuito' : (total > 0 ? 'R$ ' + total.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '-');
  const vt = document.getElementById('nova-valorTotal');
  const vd = document.getElementById('nova-valorDesconto');
  const vl = document.getElementById('nova-valorLiquido');
  if (vt) vt.value = subtotal > 0 ? subtotal.toFixed(2) : '';
  if (vd) vd.value = descontoEfetivo > 0 ? descontoEfetivo.toFixed(2) : '';
  if (vl) vl.value = total > 0 ? total.toFixed(2) : '';
}

function refreshEquipList() {
  const el = document.getElementById('equip-list-items');
  if (!el) return;
  el.innerHTML = tempEquipList.length
    ? tempEquipList.map((e,i) => renderEquipItem(e,i)).join('')
    : `<div class="equip-empty">Nenhum equipamento adicionado</div>`;
  updateEquipListTotal();
}

// ═══════════════════════════════════════════════════════════════════
// BRL FORMATTING HELPERS
// ═══════════════════════════════════════════════════════════════════

function parseBRL(val) {
  if (!val && val !== 0) return 0;
  return parseFloat(String(val).replace(/\./g, '').replace(',', '.')) || 0;
}

function brlFormat(input) {
  const cur = input.selectionStart;
  const old = input.value;
  let val = input.value.replace(/[^\d,]/g, '');
  if (!val) return;
  const parts = val.split(',');
  const intPart = parts[0].replace(/^0+/, '') || '0';
  const formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  input.value = parts.length > 1 ? formatted + ',' + parts[1].slice(0, 2) : formatted;
  const diff = input.value.length - old.length;
  try { input.setSelectionRange(cur + diff, cur + diff); } catch(e) {}
}

function brlFmtNum(n) {
  const num = parseFloat(n);
  if (isNaN(num)) return '';
  return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ═══════════════════════════════════════════════════════════════════
// FILE SYSTEM - Supabase Storage (bucket: op-files)
// ═══════════════════════════════════════════════════════════════════

async function uploadToStorage(file) {
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  // Nome imprevisível: o bucket é público hoje, então o caminho é o que impede
  // adivinhação. Date.now() sozinho seria previsível — daí os 10 chars sorteados.
  const rand = Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
  const path = `uploads/${Date.now()}_${rand}_${safe}`;
  const { error } = await sb.storage.from('op-files').upload(path, file, { upsert: false });
  if (error) throw error;
  const { data } = sb.storage.from('op-files').getPublicUrl(path);
  // `path` é gravado junto para permitir migrar o bucket para privado depois
  // (signed URLs precisam do caminho; a URL pública não serve). Ver storagePath().
  return { name: file.name, size: file.size, url: data.publicUrl, path };
}

/** Caminho do arquivo no bucket — do campo `path` (novos) ou extraído da URL
 *  pública (anexos antigos). Base para migrar o bucket para privado. */
function storagePath(f) {
  if (!f) return null;
  if (f.path) return f.path;
  const m = String(f.url || '').match(/\/storage\/v1\/object\/public\/op-files\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}

/** URL assinada (temporária) para um anexo. Funciona com o bucket público OU
 *  privado — é o que torna possível virar a chave sem quebrar os links. */
async function signedUrl(f, segundos = 3600) {
  const path = storagePath(f);
  if (!path) return f?.url || f?.dataUrl || '';
  const { data, error } = await sb.storage.from('op-files').createSignedUrl(path, segundos);
  return (!error && data?.signedUrl) ? data.signedUrl : (f.url || '');
}

// Mantido para compatibilidade com OPs antigas que ainda têm base64
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// Abre arquivo - URL do Storage diretamente, ou Blob para base64 legado
function openFileBlob(btn) {
  const dataUrl = btn.getAttribute('data-fileurl');
  const name    = btn.getAttribute('data-filename') || 'arquivo';
  if (!dataUrl) return;
  // URLs do Supabase Storage: abre diretamente na nova aba
  if (dataUrl.startsWith('http')) { window.open(dataUrl, '_blank', 'noopener'); return; }
  // Legacy base64: converte para Blob (evita restrição do Chrome)
  fetch(dataUrl)
    .then(r => r.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const w   = window.open(url, '_blank');
      if (!w) {
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    })
    .catch(() => showToast('Não foi possível abrir o arquivo.', 'err'));
}

// Uma linha uniforme por arquivo: miniatura/ícone + nome + tamanho + Visualizar + Baixar.
function fileLinkHtml(f, compact = false) {
  if (!f) return '-';
  if (typeof f === 'string') {
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 4px;border-top:1px solid var(--border);font-size:12px;color:var(--text3)">${icon('paperclip',13,'color:var(--text3)')} ${esc(f)}</div>`;
  }
  const kb       = f.size ? `${(f.size/1024).toFixed(0)} KB` : '';
  const fileUrl  = f.url || f.dataUrl || '';   // url = Storage, dataUrl = legado base64
  const safeName = (f.name || 'arquivo').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
  const isImage  = /\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name || '') || fileUrl.startsWith('data:image/');
  const isPdf    = /\.pdf$/i.test(f.name || '');
  const canLight = isImage || (isPdf && (f.url || fileUrl.startsWith('data:application/pdf')));
  const btn      = `display:inline-flex;align-items:center;gap:4px;font-size:11px;text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-family:inherit;white-space:nowrap`;

  const thumb = (isImage && fileUrl)
    ? `<img src="${fileUrl}" alt="${safeName}" onclick="showLightbox(this.src,'${safeName}')" title="Ampliar" style="width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--border);cursor:zoom-in;flex-shrink:0">`
    : `<span style="width:34px;height:34px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0">${icon(isPdf?'file-text':'paperclip',15,'color:var(--text3)')}</span>`;

  const vizAction = canLight
    ? `onclick="showLightbox('${fileUrl.replace(/'/g,"\\'")}','${safeName}')"`
    : `data-fileurl="${fileUrl}" data-filename="${safeName}" onclick="openFileBlob(this)"`;

  return `<div style="display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid var(--border)">
    ${thumb}
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</div>
      ${kb ? `<div style="font-size:10px;color:var(--text3)">${kb}</div>` : ''}
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0">
      ${fileUrl ? `<button type="button" style="${btn};color:var(--accent)" ${vizAction}>${icon('eye',12,'color:var(--accent)')} Visualizar</button>` : ''}
      ${fileUrl ? `<a href="${fileUrl}" download="${safeName}" style="${btn};color:var(--text2)">${icon('download',12,'color:var(--text2)')} Baixar</a>` : ''}
    </div>
  </div>`;
}

function fileLinksHtml(files) {
  if (!files || !files.length) return '';
  const arr = Array.isArray(files) ? files : [files];
  return `<div style="display:flex;flex-direction:column;border-bottom:1px solid var(--border);margin-top:4px">${arr.map(f => fileLinkHtml(f)).join('')}</div>`;
}

async function addMultiFile(input, key) {
  if (!input.files.length) return;
  if (!tempFilesData[key]) tempFilesData[key] = [];
  const btn = input.closest('label');
  if (btn) { btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none'; }
  for (const f of Array.from(input.files)) {
    if (f.size > 20 * 1024 * 1024) { showToast('Arquivo muito grande (máx 20 MB): ' + f.name, 'err'); continue; }
    try {
      const fileData = await uploadToStorage(f);
      tempFilesData[key].push(fileData);
    } catch (err) {
      showToast('Erro ao enviar ' + f.name + ': ' + (err.message || 'tente novamente'), 'err');
    }
    // Ao anexar a NF (XML ou DANFE em PDF), lê a chave e o número automaticamente.
    if (key === 'arquivoNF') autoPreencherNota(f);
    // Simples faturamento: preenche a data de emissão a partir da nota anexada.
    if (key === 'sf_arquivos') autoPreencherSF(f);
  }
  if (btn) { btn.style.opacity = ''; btn.style.pointerEvents = ''; }
  input.value = '';
  refreshMultiFileList(key);
}

// ── Leitura automática da NF (chave 44 díg. + número) ────────────────

let _pdfjsPromise = null;
function carregarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload = () => {
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; } catch {}
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error('Falha ao carregar o leitor de PDF'));
    document.head.appendChild(s);
  });
  return _pdfjsPromise;
}

async function pdfParaTexto(file) {
  const lib = await carregarPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  let txt = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const c = await page.getTextContent();
    txt += ' ' + c.items.map(i => i.str).join(' ');
  }
  return txt;
}

/** Dígito verificador (módulo 11) da chave da NFe — confirma os 44 dígitos. */
function chaveNfeValida(ch) {
  if (!/^\d{44}$/.test(ch)) return false;
  let peso = 2, soma = 0;
  for (let i = 42; i >= 0; i--) { soma += parseInt(ch[i], 10) * peso; peso = peso === 9 ? 2 : peso + 1; }
  let dv = 11 - (soma % 11);
  if (dv >= 10) dv = 0;
  return dv === parseInt(ch[43], 10);
}

/** Extrai chave/número/data do TEXTO do DANFE (PDF). */
function extrairDadosNota(txt) {
  const limpo = String(txt || '');
  // Número impresso como "N. 000019175" (âncora obrigatória: "UN 100" não casa).
  const mnum = limpo.match(/N[º°.]\s*0*(\d{3,9})/);
  const numImpresso = mnum ? String(parseInt(mnum[1], 10) || '') : '';

  // Chave de 44 dígitos: coleta todas as janelas com DV válido e prefere a que
  // tem o nNF (díg 26–34) igual ao número impresso. Desliza sobre blocos com
  // espaços/pontos, então funciona com a chave em 11 grupos de 4. O desempate
  // evita pegar uma janela deslocada que por acaso também passe no DV.
  const validas = [];
  (limpo.match(/\d[\d\s.]{40,}\d/g) || []).forEach(b => {
    const d = b.replace(/\D/g, '');
    for (let i = 0; i + 44 <= d.length; i++) {
      const c = d.slice(i, i + 44);
      if (chaveNfeValida(c)) validas.push(c);
    }
  });
  let chave = (numImpresso && validas.find(c => String(parseInt(c.slice(25, 34), 10) || '') === numImpresso))
           || validas[0]
           || (limpo.match(/\d{44}/) || [''])[0];

  let numero = '';
  if (chave.length === 44) numero = String(parseInt(chave.slice(25, 34), 10) || '');
  if (!numero) numero = numImpresso;

  // Data de emissão: SÓ com a âncora EMISSÃO/SAÍDA (não pega "qualquer data",
  // que capturava o vencimento). Valida dia/mês antes de aceitar.
  let dataEmissao = '';
  const md = limpo.match(/(?:EMISS[ÃA]O|SA[ÍI]DA)[^0-9]{0,25}(\d{2})\/(\d{2})\/(\d{4})/i);
  if (md && +md[1] >= 1 && +md[1] <= 31 && +md[2] >= 1 && +md[2] <= 12) dataEmissao = `${md[3]}-${md[2]}-${md[1]}`;

  return { chave, numero, dataEmissao, chaveValida: chaveNfeValida(chave) };
}

/** Extrai do XML da NFe (100% confiável, caso anexem o XML). */
function extrairDadosNotaXml(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const g = t => doc.getElementsByTagName(t)[0]?.textContent?.trim() || '';
  let chave = (g('chNFe') || (doc.getElementsByTagName('infNFe')[0]?.getAttribute('Id') || '')).replace(/\D/g, '');
  chave = (chave.match(/\d{44}/) || [''])[0];
  const numero = String(parseInt(g('nNF'), 10) || '');
  let dataEmissao = (g('dhEmi') || g('dEmi')).slice(0, 10);
  return { chave, numero, dataEmissao, chaveValida: chaveNfeValida(chave) };
}

async function autoPreencherNota(file) {
  const nome = (file.name || '').toLowerCase();
  const ehXml = nome.endsWith('.xml');
  const ehPdf = nome.endsWith('.pdf');
  if (!ehXml && !ehPdf) return; // imagem/foto não dá para ler com segurança
  const opAoLer = activeOpId; // ler PDF é assíncrono; se trocar de modal, aborta
  try {
    const dados = ehXml ? extrairDadosNotaXml(await file.text()) : extrairDadosNota(await pdfParaTexto(file));
    if (activeOpId !== opAoLer) return; // modal mudou durante a leitura — não contamina
    if (!dados || (!dados.chave && !dados.numero)) {
      showToast('Não consegui ler a nota automaticamente — preencha os campos manualmente', 'err');
      return;
    }
    // Só preenche campo vazio: não sobrescreve o que o operador já digitou.
    const setVal = (id, v) => { const el = document.getElementById(id); if (el && v && !el.value.trim()) el.value = v; };
    setVal('f-chaveNfe', dados.chave);
    setVal('f-numeroNF', dados.numero);
    setVal('f-dataEmissao', dados.dataEmissao);
    if (dados.chave && !dados.chaveValida) {
      showToast(`NF ${dados.numero || '?'} lida, mas confira a chave (dígito verificador não bateu)`, 'err');
    } else {
      showToast(`Nota lida: NF ${dados.numero || '?'}${dados.chave ? ' · chave preenchida' : ''}`, 'ok');
    }
  } catch (e) {
    showToast('Não consegui ler a nota automaticamente — preencha os campos manualmente', 'err');
  }
}

// Simples faturamento: lê só a data de emissão da nota anexada e preenche f-sf_data.
async function autoPreencherSF(file) {
  const nome = (file.name || '').toLowerCase();
  const ehXml = nome.endsWith('.xml');
  const ehPdf = nome.endsWith('.pdf');
  if (!ehXml && !ehPdf) return;
  const opAoLer = activeOpId;
  try {
    const dados = ehXml ? extrairDadosNotaXml(await file.text()) : extrairDadosNota(await pdfParaTexto(file));
    if (activeOpId !== opAoLer) return; // trocou de modal durante a leitura
    if (dados?.dataEmissao) {
      const el = document.getElementById('f-sf_data');
      if (el && !el.value) { el.value = dados.dataEmissao; showToast('Data de emissão preenchida pela nota', 'ok'); }
    }
  } catch (e) { /* silencioso: se não ler, o usuário preenche a data manualmente */ }
}

function removeMultiFile(key, idx) {
  if (!tempFilesData[key]) return;
  tempFilesData[key].splice(idx, 1);
  refreshMultiFileList(key);
}

function refreshMultiFileList(key) {
  const el = document.getElementById('mfl-' + key);
  if (!el) return;
  const files = tempFilesData[key] || [];
  el.innerHTML = files.map((f, i) => `
    <div class="multi-file-item">
      <span class="multi-file-item-name" style="display:flex;align-items:center;gap:5px;overflow:hidden">
        ${icon('paperclip',12,'color:var(--text3);flex-shrink:0')}
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span>
      </span>
      <span class="multi-file-item-size">${(f.size/1024).toFixed(0)} KB</span>
      <button class="multi-file-remove" type="button" onclick="removeMultiFile('${key}',${i})" title="Remover">${icon('x',12)}</button>
    </div>`).join('');
}

function buildFieldHtml(f) {
  if (f.type === 'equipment-list') return equipListHtml();

  if (f.type === 'ns-equipamentos') {
    const op = ops.find(o => o.id === activeOpId);
    const rawList = op?.pedidoVenda?.equipamentos || op?.equipamentos || (op?.equipamento ? [op.equipamento] : []);

    // Filtra apenas itens que controlam lote ou série
    // Prioridade: 1) campo tracking salvo no item, 2) lookup no _equipCache, 3) legado → série
    const rawTrackItems = rawList.flatMap(e => {
      const obj = typeof e === 'object' ? e : { name: e };
      // Mesmo resolvedor usado pelos campos de QR — se divergir, o QR e a série
      // deixam de casar e o cadastro no Sistema QR sai errado.
      const tracking = equipTracking(obj);
      if (tracking === null) return []; // Trail='N' / cache não carregado → sem série/lote
      const qty = obj.qty || 1;
      if ((tracking || 'serie') === 'lote') {
        return [{ name: obj.name, tracking: 'lote', qty }];
      }
      return Array.from({ length: qty }, () => ({ name: obj.name, tracking: 'serie', qty: 1 }));
    });

    // 1 campo por linha do Protheus: lote com qty>1 mostra ×qty; lotes distintos do mesmo produto ficam separados
    const trackItems = rawTrackItems;

    if (!trackItems.length) return `
      <div style="font-size:12px;color:var(--text3);padding:6px 0">
        Nenhum equipamento nesta OP requer número de série ou lote.
      </div>`;

    const nameCount = {};
    const nameIdx   = {};
    trackItems.forEach(({ name: n }) => { nameCount[n] = (nameCount[n]||0)+1; });
    const inputsHtml = trackItems.map(({ name: nm, tracking, qty }, i) => {
      nameIdx[nm] = (nameIdx[nm]||0)+1;
      // lote: mostra ×qty quando há mais de 1 unidade na linha; numera se mesmo produto aparece em linhas distintas
      const equipLabel = tracking === 'lote'
        ? (nameCount[nm] > 1
            ? `${nm} #${nameIdx[nm]}${qty > 1 ? ` (× ${qty})` : ''}`
            : (qty > 1 ? `${nm} × ${qty}` : nm))
        : (nameCount[nm] > 1 ? `${nm} #${nameIdx[nm]}` : nm);
      const fieldLabel = tracking === 'lote' ? 'Lote' : 'Nº de Série';
      return `
      <div class="form-group">
        <label class="form-label">${fieldLabel} - <span style="color:var(--accent);font-family:'DM Mono',monospace;font-size:11px">${equipLabel}</span></label>
        <input class="form-input" id="f-numSerie_${i}" data-tracking="${tracking}" data-name="${String(nm).replace(/"/g,'&quot;')}">
      </div>`;
    }).join('');
    const btnHtml = op?.pedidoProtheus ? `
      <button type="button" id="btn-puxar-serie" onclick="puxarSerieLote(${op.id})"
        style="margin-bottom:8px;padding:8px 16px;background:var(--accent);border:none;color:#fff;border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;width:fit-content">
        ${icon('search',13,'color:#fff')} Buscar série e lote
      </button>` : '';
    return btnHtml + inputsHtml;
  }

  if (f.type === 'cep-lookup') {
    const op = ops.find(o => o.id === activeOpId);
    const pv = op?.pedidoVenda;
    // Usa o endereço de entrega informado na abertura da OP (Observações)
    const originalAddr = (pv?.enderecoEntrega || '').trim();
    const showCopy = !!originalAddr;
    return `
    <div class="form-group">
      <label class="form-label">${f.label}</label>
      <div style="display:flex;gap:6px;align-items:stretch">
        <input class="form-input" id="f-${f.key}" style="max-width:150px"
          oninput="fmtCEP(this);if(this.value.replace(/\\D/g,'').length===8)lookupCEPforField(this.value,'f-${f.targetKey}','cep-field-status-${f.key}')">
        <div id="cep-field-status-${f.key}" class="api-status" style="display:flex;align-items:center"></div>
      </div>
      ${showCopy ? `
      <label style="display:flex;align-items:center;gap:7px;margin-top:6px;cursor:pointer;font-size:12px;color:var(--text2)">
        <input type="checkbox" style="width:14px;height:14px;cursor:pointer;flex-shrink:0"
          onchange="copyOriginalAddress(this.checked,'f-${f.targetKey}','${originalAddr.replace(/'/g,"\\'")}','f-${f.key}')">
        Usar endereço de entrega informado anteriormente:
        <span style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${originalAddr}</span>
      </label>` : ''}
    </div>`;
  }

  if (f.type === 'multi-file') return `
    <div class="form-group">
      ${f.label ? `<label class="form-label">${f.label}</label>` : ''}
      <div class="multi-file-wrap">
        <div class="multi-file-list" id="mfl-${f.key}"></div>
        <label class="multi-file-add-btn" style="cursor:pointer">
          <input type="file" id="f-${f.key}" ${f.accept?`accept="${f.accept}"`:''}
            style="display:none" multiple onchange="addMultiFile(this,'${f.key}')">
          + Adicionar arquivo(s)
        </label>
      </div>
    </div>`;

  if (f.type === 'file') return `
    <div class="form-group">
      <label class="form-label">${f.label}</label>
      <label style="cursor:pointer">
        <input type="file" id="f-${f.key}" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"
          style="display:none" onchange="handleFile(this)">
        <div class="file-upload-area" id="file-display-${f.key}">
          <div class="file-upload-text" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon('upload',14)} Clique para anexar arquivo (PDF, Word, Excel, Imagem)</div>
        </div>
      </label>
    </div>`;

  if (f.type === 'envio') {
    // Pré-preenche se a OP já tiver dados de envio (ex.: reabertura)
    const seed  = ops.find(o => o.id === activeOpId)?.stepData?.aguard_nf || {};
    const tipo  = seed.envioTipo || '';
    const mot   = (seed.motorista || (seed.envioTipo !== 'transportadora' ? seed.tecnico : '') || '').replace(/"/g,'&quot;');
    const transp= seed.transportadora || '';
    const carro = (seed.carro || '').replace(/"/g,'&quot;');
    const placa = (seed.placa || '').replace(/"/g,'&quot;');
    const opts  = Object.entries(TRANSPORTADORAS).map(([id,label]) =>
      `<option value="${id}" ${transp===id?'selected':''}>${label}${RASTREIO_ATIVO && RASTREAVEIS.has(id)?' · rastreio automático':''}</option>`).join('');
    return `
    <div class="form-group">
      <label class="form-label">${f.label}</label>
      <div style="display:flex;gap:16px;margin-bottom:8px">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text)">
          <input type="radio" name="envioTipo" value="motorista" onchange="toggleEnvio('motorista')" ${tipo==='motorista'?'checked':''}> Motorista
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text)">
          <input type="radio" name="envioTipo" value="transportadora" onchange="toggleEnvio('transportadora')" ${tipo==='transportadora'?'checked':''}> Transportadora
        </label>
      </div>
      <input class="form-input" id="f-envio_motorista" placeholder="Nome do motorista" value="${mot}"
        style="display:${tipo==='motorista'?'block':'none'}">
      <div id="f-envio_carroplaca" style="display:${tipo==='motorista'?'grid':'none'};grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
        <input class="form-input" id="f-envio_carro" placeholder="Nome do carro *" value="${carro}">
        <input class="form-input" id="f-envio_placa" placeholder="Placa *" value="${placa}">
      </div>
      <select class="form-input" id="f-envio_transportadora" style="display:${tipo==='transportadora'?'block':'none'}">
        <option value="">Selecione a transportadora…</option>
        ${opts}
      </select>
      ${RASTREIO_ATIVO ? `<div style="font-size:11px;color:var(--text3);margin-top:6px">Transportadora com integração ativa o rastreio automático das cargas.</div>` : ''}
    </div>`;
  }

  return `
    <div class="form-group">
      <label class="form-label">${f.label}</label>
      ${f.type === 'textarea'
        ? `<textarea class="form-textarea" id="f-${f.key}" rows="3"></textarea>`
        : `<input class="form-input" id="f-${f.key}" type="${f.type}">`}
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// CADASTRO NO SISTEMA QR (Body Health) — dispara no despacho
// ═══════════════════════════════════════════════════════════════════
// O QR vem do adesivo colado na máquina, capturado na abertura da OP
// (pedidoVenda.equipamentos[].qrcode ← C6_XQRCODE do Protheus).
// Só MÁQUINAS vão: a API exige numero_serie, que consumível de lote não tem.

/** Pareia os nº de série do passo Dados Transporte com as linhas de equipamento.
 *  Espelha a expansão do campo 'ns-equipamentos' (1 input por unidade em série,
 *  1 por linha em lote) — a ordem dos inputs é a ordem de numSeries. */
function qrSeriaisPorLinha(op) {
  const raw       = op.pedidoVenda?.equipamentos || [];
  const numSeries = op.stepData?.aguard_nf?.numSeries || [];
  const porLinha  = new Map();
  let i = 0;
  raw.forEach((e, idx) => {
    const tracking = equipTracking(e);
    if (tracking === null) return; // não controla série/lote → não gera input
    const qty = parseInt(e.qty) || 1;
    const n   = tracking === 'lote' ? 1 : qty;
    const arr = [];
    for (let k = 0; k < n; k++) { arr.push((numSeries[i] || '').trim()); i++; }
    porLinha.set(idx, arr);
  });
  return porLinha;
}

function qrMontarPayload(op) {
  const pv      = op.pedidoVenda || {};
  const raw     = pv.equipamentos || [];
  const seriais = qrSeriaisPorLinha(op);
  const dataExp = op.stepData?.aguard_despacho?.dataDespacho || new Date().toISOString().split('T')[0];

  // "empresa" na API do QR = o CLIENTE dono da máquina.
  // Atenção: pv.empresa/pv.cnpj são da Contourline (emitente), NÃO do cliente.
  const empresa = {
    razao_social: pv.cliente || op.cliente || '',
    cpf_cnpj:     pv.cpf || '',
    telefone:     pv.tel || '',
    email:        pv.email || '',
    cep:          pv.endCEP || '',
    logradouro:   pv.endRua || '',
    numero:       pv.endNumero || '',
    bairro:       pv.endBairro || '',
    cidade:       pv.endCidade || '',
    estado:       pv.endEstado || '',
    responsavel_equipamento: pv.contatoEntrega || '',
  };

  // 1 cadastro por MÁQUINA física — o qr_code é o ID único do Sistema QR.
  // avisos    = algo deu errado, precisa de atenção
  // ignorados = pulado de propósito (normal, não é erro)
  const itens = [], avisos = [], ignorados = [];
  raw.forEach((e, idx) => {
    const tracking = equipTracking(e);
    // Só máquinas com nº de série individual entram: a API exige numero_serie.
    // Consumível de lote (ponta, filme) não tem série, garantia nem revisão própria.
    if (tracking === null)   { ignorados.push(`${e.name} (não controla série)`); return; }
    if (tracking === 'lote') { ignorados.push(`${e.name} (lote)`); return; }
    const qty   = parseInt(e.qty) || 1;
    const qrs   = qrListaDaLinha(e, qty);
    const sers  = seriais.get(idx) || [];

    for (let k = 0; k < qty; k++) {
      const rotulo = qty > 1 ? `${e.name} #${k + 1}` : e.name;
      const qr     = (qrs[k] || '').trim();
      const serie  = (sers[k] || (k === 0 ? e.numSerie : '') || '').trim();
      if (!qr)    { avisos.push(`${rotulo}: sem QR na OP`);      continue; }
      if (!serie) { avisos.push(`${rotulo}: sem nº de série`);   continue; }

      itens.push({
        qr_code: qr, numero_serie: serie, modelo: e.name || '', data_expedicao: dataExp,
        empresa,
        pedido_producao: {
          numero: op.pedidoProtheus || op.numero || '',
          // Data de abertura da OP (não a emissão do pedido de venda).
          data: op.dataAbertura || '',
          // Vendedor 1 = pv.vendedorCanal (vendedores[0]). O analista é outra
          // pessoa — antes ia "Ana Paula" (analista) no lugar do vendedor.
          vendedor: pv.vendedorCanal || (pv.vendedores || [])[0] || '',
          quantidade: '1',
          produto: e.name || '', valor_produto: e.valorUnit || '',
          observacao: `OP ${op.numero || op.id}`,
        },
        contato_negociacao: { nome: pv.contatoEntrega || '', telefone: pv.tel || '', email: pv.email || '' },
      });
    }
  });

  // QR duplicado dentro da própria OP viraria 1 registro só (o QR é a chave).
  const vistos = new Set();
  itens.forEach(it => {
    const chave = it.qr_code.replace(/\s+/g, '').toUpperCase();
    if (vistos.has(chave)) avisos.push(`QR ${it.qr_code} repetido na OP — cada máquina precisa do seu`);
    vistos.add(chave);
  });

  return { itens, avisos, ignorados };
}

/** Cadastra as máquinas da OP no Sistema QR. NÃO bloqueia o despacho: se falhar,
 *  avisa e registra o erro na OP para recadastro posterior. */
async function cadastrarEquipamentosQR(op) {
  // Idempotência: dois usuários despachando a mesma OP quase juntos disparavam
  // dois POSTs (o 2º só descobre o conflito no dbSaveOp, depois do envio).
  // O endpoint faz upsert por qr_code, então não duplica registro — mas um PUT
  // a mais é ruído desnecessário no sistema do parceiro.
  if (op._qrEnviando) return;
  op._qrEnviando = true;
  try {
    await _cadastrarEquipamentosQR(op);
  } finally {
    op._qrEnviando = false;
  }
}

async function _cadastrarEquipamentosQR(op) {
  const { itens, avisos, ignorados } = qrMontarPayload(op);
  if (!itens.length) {
    // Nunca sair calado: antes, uma OP só de lote passava sem dizer nada e
    // parecia que a integração tinha falhado.
    if (avisos.length) {
      showToast('Sistema QR não cadastrou: ' + avisos.join(' · '), 'err');
      op.qrCadastro = { ts: nowTs(), gravados: 0, erros: [], avisos, ignorados };
      dbSaveOp(op);
    } else if (ignorados.length) {
      showToast(`Sistema QR: nada a cadastrar — ${ignorados.join(', ')}`, 'ok');
    } else {
      showToast('Sistema QR: nenhum equipamento nesta OP', 'ok');
    }
    return;
  }
  try {
    const resp = await apiFetch('/api/qrcode', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ equipamentos: itens }),
    });
    const data = await resp.json();
    if (!resp.ok && !data.resultados) throw new Error(data.error || 'Falha no cadastro');
    const erros = (data.resultados || []).filter(r => !r.success);
    op.qrCadastro = {
      ts: nowTs(), gravados: data.gravados || 0,
      erros: erros.map(e => `${e.qr_code || '?'}: ${e.erro}`), avisos, ignorados,
    };
    dbSaveOp(op);
    if (erros.length) showToast(`Sistema QR: ${data.gravados} ok, ${erros.length} com erro`, 'err');
    else showToast(`Sistema QR: ${data.gravados} equipamento(s) cadastrado(s)`, 'ok');
    // Máquina pulada por falta de QR/série NÃO pode sumir só porque outra deu
    // certo: antes o toast verde dizia "2 cadastrados" e a 3ª ficava fora do
    // Sistema QR sem ninguém saber.
    if (avisos.length) showToast('Sistema QR — ficaram de fora: ' + avisos.join(' · '), 'err');
  } catch (e) {
    op.qrCadastro = { ts: nowTs(), gravados: 0, erros: [e.message], avisos, ignorados };
    dbSaveOp(op);
    showToast('Sistema QR falhou: ' + e.message + ' — o despacho seguiu normalmente', 'err');
  }
  if (currentTab === 'rastreio') renderMain();
}

const TRANSPORTADORAS = { azul: 'Azul Cargo', jamef: 'Jamef', correios: 'Correios', rotta: 'Rotta Master', loggica: 'Loggica' };
const RASTREAVEIS     = new Set(['azul']); // com integração de API hoje (demais entram ao ter API)

const RASTREIO_ATIVO  = false;

const RAST_STAGES = ['Coletado', 'Em transferência', 'Saiu para entrega', 'Entregue'];

// Alterna os inputs do campo Motorista/Transportadora
function toggleEnvio(tipo) {
  const mot = document.getElementById('f-envio_motorista');
  const tra = document.getElementById('f-envio_transportadora');
  const cp  = document.getElementById('f-envio_carroplaca'); // carro/placa só p/ motorista
  if (mot) mot.style.display = tipo === 'motorista'     ? 'block' : 'none';
  if (cp)  cp.style.display  = tipo === 'motorista'     ? 'grid'  : 'none';
  if (tra) tra.style.display = tipo === 'transportadora'? 'block' : 'none';
}

// Coleta e valida o campo de envio (motorista + carro + placa, ou transportadora).
// Retorna o objeto de dados, ou null se inválido (já mostrou o erro e focou o campo).
function collectEnvio() {
  const tipo = document.querySelector('input[name="envioTipo"]:checked')?.value;
  if (!tipo) { showToast('Escolha Motorista ou Transportadora', 'err'); return null; }
  if (tipo === 'motorista') {
    const nome  = document.getElementById('f-envio_motorista')?.value?.trim();
    if (!nome)  { const e=document.getElementById('f-envio_motorista'); e.style.borderColor='var(--red)'; e.focus(); showToast('Informe o nome do motorista', 'err'); return null; }
    // Carro e placa são obrigatórios quando é motorista próprio.
    const carro = document.getElementById('f-envio_carro')?.value?.trim();
    const placa = document.getElementById('f-envio_placa')?.value?.trim();
    if (!carro) { const e=document.getElementById('f-envio_carro'); e.style.borderColor='var(--red)'; e.focus(); showToast('Informe o nome do carro', 'err'); return null; }
    if (!placa) { const e=document.getElementById('f-envio_placa'); e.style.borderColor='var(--red)'; e.focus(); showToast('Informe a placa', 'err'); return null; }
    return { envioTipo:'motorista', motorista:nome, carro, placa, transportadora:'', tecnico:nome };
  }
  const t = document.getElementById('f-envio_transportadora')?.value;
  if (!t) { const e=document.getElementById('f-envio_transportadora'); e.style.borderColor='var(--red)'; e.focus(); return null; }
  return { envioTipo:'transportadora', transportadora:t, motorista:'', carro:'', placa:'', tecnico: TRANSPORTADORAS[t] || t };
}

// Deduz o estágio (0-3) a partir do texto do último evento
function inferStage(r) {
  if (!r) return -1;
  if (r.entregue) return 3;
  const s = (r.statusLabel || '').toLowerCase();
  if (/saiu para entrega|em rota|rota de entrega|em entrega|out for delivery/.test(s)) return 2;
  if (/transfer|tr[aâ]nsito|chegou|encaminhad|receb.*unidade|in transit/.test(s))      return 1;
  return 0;
}

// OPs que aparecem na aba: enviadas por transportadora, em trânsito ou entregues há ≤7 dias
function rastreioOps() {
  return ops.filter(o => {
    if (o.cancelada) return false; // carga cancelada não é rastreada
    const nf = o.stepData?.aguard_nf;
    if (nf?.envioTipo !== 'transportadora') return false;
    if (o.status === 'transito') return true;
    if (o.status === 'entregue') {
      const dEnt = o.stepData?.transito?.dataEntrega || (o.rastreio?.dataEntrega || '').slice(0, 10);
      return dEnt ? daysSince(new Date(dEnt)) <= 7 : false;
    }
    return false;
  });
}

function rastFmtTs(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return String(ts);
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// View-model por OP para a aba
function rastreioVM(op) {
  const nf     = op.stepData?.aguard_nf || {};
  const transp = nf.transportadora;
  const rastreavel = RASTREAVEIS.has(transp);
  const r = op.rastreio;

  let stage, statusLabel, local = '', previsao = null, entregue = false, insucesso = false;
  if (op.status === 'entregue') { entregue = true; stage = 3; statusLabel = r?.statusLabel || 'Entregue'; local = r?.local || ''; previsao = r?.previsao || null; }
  else if (r) { stage = inferStage(r); statusLabel = r.statusLabel; local = r.local; previsao = r.previsao; insucesso = r.insucesso; entregue = r.entregue; }
  else { stage = -1; statusLabel = rastreavel ? 'Aguardando 1ª atualização' : 'Sem integração de rastreio'; }

  const prevDate = previsao ? new Date(previsao) : (op.pedidoVenda?.dataPrevista ? parseBRDate(op.pedidoVenda.dataPrevista) : null);
  const atrasada = !entregue && prevDate && (new Date() > prevDate);
  const group = entregue ? 'entregue' : (insucesso || atrasada) ? 'atencao' : stage >= 2 ? 'saiu' : 'transito';

  return { op, transp, rastreavel, stage, statusLabel, local, previsao, prevDate, entregue, insucesso, atrasada, group, r };
}

// Consulta a API e atualiza uma OP; auto-avança p/ Entregue quando a transportadora confirma
async function atualizarRastreio(opId, silent) {
  const op = ops.find(o => o.id === opId);
  if (!op) return;
  const transp   = op.stepData?.aguard_nf?.transportadora;
  const chaveNfe = (op.stepData?.aguard_emissao?.chaveNfe || '').replace(/\D/g, '');
  if (!RASTREAVEIS.has(transp)) { if (!silent) showToast('Transportadora sem integração de rastreio', 'err'); return; }
  if (!chaveNfe || chaveNfe.length < 44) { if (!silent) showToast('Chave da NFe (44 díg.) não informada na emissão', 'err'); return; }

  op._rastreioLoading = true; op._rastreioErro = null;
  if (currentTab === 'rastreio') renderMain();
  try {
    const resp = await apiFetch('/api/rastreio', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transportadora: transp, chaveNfe }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Falha ao consultar rastreio');
    op.rastreio = data;
    if (data.entregue && op.status === 'transito') {
      autoEntregar(op, data); // persiste + renderAll
    } else {
      dbSaveOp(op);
    }
    if (!silent) showToast('Rastreio atualizado', 'ok');
  } catch (e) {
    op._rastreioErro = e.message;
    if (!silent) showToast(e.message, 'err');
  } finally {
    op._rastreioLoading = false;
    if (currentTab === 'rastreio') renderMain();
    renderCounts();
  }
}

function autoEntregar(op, data) {
  const dataEntrega = (data.dataEntrega || '').slice(0, 10);
  advanceOP(op.id, {
    dataEntrega,
    descricao: `Entrega confirmada automaticamente via ${TRANSPORTADORAS[data.transportadora] || 'transportadora'} (rastreio).`,
    rastreioPod: data.pod || '',
    fotos: [],
  });
  showToast(`OP ${op.numero || op.id}: entrega confirmada pela ${TRANSPORTADORAS[data.transportadora] || 'transportadora'}`, 'ok');
}

async function atualizarTodosRastreios() {
  const list = rastreioOps().filter(o => RASTREAVEIS.has(o.stepData?.aguard_nf?.transportadora) && o.status === 'transito');
  if (!list.length) { showToast('Nenhuma carga rastreável em trânsito', 'ok'); return; }
  showToast(`Atualizando ${list.length} carga(s)…`, 'ok');
  for (const o of list) await atualizarRastreio(o.id, true);
  if (currentTab === 'rastreio') renderMain();
  showToast('Rastreios atualizados', 'ok');
}

// ── Componentes visuais ──────────────────────────────────────────────
function rastStepperHtml(vm) {
  const dots = RAST_STAGES.map((label, i) => {
    const done   = vm.stage >= i && vm.stage >= 0;
    const active = vm.stage === i && !vm.entregue;
    const color  = vm.insucesso && i === vm.stage ? 'var(--red)' : done ? 'var(--accent)' : 'var(--border2)';
    const pulse  = active ? `box-shadow:0 0 0 4px rgba(38,114,184,.18);animation:rastPulse 1.6s ease-in-out infinite` : '';
    const line   = i < RAST_STAGES.length - 1
      ? `<div style="flex:1;height:2px;background:${vm.stage > i ? 'var(--accent)' : 'var(--border2)'}"></div>` : '';
    return `<div style="display:flex;align-items:center;${i < RAST_STAGES.length - 1 ? 'flex:1' : ''}">
        <div title="${label}" style="width:11px;height:11px;border-radius:50%;flex-shrink:0;background:${color};${pulse}"></div>${line}
      </div>`;
  }).join('');
  return `<div style="display:flex;align-items:center;margin:10px 0 4px">${dots}</div>`;
}

function rastPrevBadge(vm) {
  if (vm.entregue) return `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--green);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.3);padding:1px 8px;border-radius:20px">${icon('check',10,'color:var(--green)')} Entregue</span>`;
  if (vm.atrasada)  return `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--red);background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.28);padding:1px 8px;border-radius:20px">${icon('alert-triangle',10,'color:var(--red)')} Atrasada</span>`;
  if (vm.previsao || vm.op.pedidoVenda?.dataPrevista) {
    const txt = vm.previsao ? rastFmtTs(vm.previsao).split(' ')[0] : vm.op.pedidoVenda.dataPrevista;
    return `<span style="font-size:10px;color:var(--text3)">prev. ${txt}</span>`;
  }
  return '';
}

function rastCardHtml(vm) {
  const op = vm.op;
  const cliente = op.cliente || op.pedidoVenda?.cliente || '—';

  const live    = !vm.entregue && vm.r && !vm._stale ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--accent)"><span style="width:7px;height:7px;border-radius:50%;background:var(--accent);animation:rastPulse 1.6s ease-in-out infinite"></span>ao vivo</span>` : '';

      ${live}
    </div>
    <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${TRANSPORTADORAS[vm.transp] || '—'}${codigo ? ' · ' + codigo : ''}</div>

    ${errHtml}
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${loadBtn}${tlBtn}${openBtn}</div>
  </div>`;
}

function renderRastreio(el) {
  const vms = rastreioOps().map(rastreioVM);

    atencao:  { title: 'Precisa de atenção', desc: 'Atrasadas ou com falha de entrega', color: 'var(--red)',    items: [] },
    saiu:     { title: 'Saiu para entrega',  desc: 'A caminho do cliente',              color: 'var(--accent)', items: [] },
    transito: { title: 'Em trânsito',        desc: 'Coletadas / em transferência',      color: 'var(--text2)',  items: [] },
    entregue: { title: 'Entregues (7 dias)', desc: 'Concluídas recentemente',           color: 'var(--green)',  items: [] },

      </div>

        <span class="tab-count">${g.items.length}</span>

// Modal com a linha do tempo completa de uma OP
function verTimeline(opId) {
  const op = ops.find(o => o.id === opId);
  const r  = op?.rastreio;
  if (!r) return;
  let modal = document.getElementById('rastreio-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'rastreio-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px';
    modal.onclick = e => { if (e.target === modal) modal.style.display = 'none'; };
    document.body.appendChild(modal);
  }
  const eventos = [...(r.eventos || [])].reverse(); // mais recente primeiro
  const linha = eventos.map((ev, i) => {
    const dotColor = i === 0 ? 'var(--accent)' : 'var(--border2)';
    const pod = ev.urlPod ? ` · <a href="#" onclick="event.preventDefault();showLightbox('${ev.urlPod}','Comprovante de entrega')" style="color:var(--accent)">comprovante</a>` : '';

        <div style="display:flex;flex-direction:column;align-items:center">
          <div style="width:10px;height:10px;border-radius:50%;background:${dotColor};margin-top:4px"></div>
          ${i < eventos.length - 1 ? `<div style="flex:1;width:2px;background:var(--border2)"></div>` : ''}
        </div>
        <div style="padding-bottom:14px">
          <div style="font-size:12px;font-weight:600;color:var(--text)">${esc(ev.descricao || '—')}</div>
          <div style="font-size:11px;color:var(--text3)">${rastFmtTs(ev.ts)}${ev.local ? ' · ' + ev.local : ''}${pod}${ins}</div>
        </div>
      </div>`;
  }).join('') || `<div style="font-size:12px;color:var(--text3)">Sem eventos registrados ainda.</div>`;

  modal.innerHTML = `<div style="background:var(--surface);border-radius:14px;max-width:440px;width:100%;max-height:82vh;overflow:auto;padding:20px 22px;box-shadow:0 12px 48px rgba(0,0,0,.3)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div style="font-weight:700;color:var(--text);font-size:14px">Rastreio · OP ${op.numero || op.id}</div>
        <button onclick="document.getElementById('rastreio-modal').style.display='none'" style="background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;line-height:1">×</button>
      </div>
      <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:14px">${TRANSPORTADORAS[r.transportadora] || ''}${r.awb ? ' · AWB ' + r.awb : ''}${r.destino ? ' · ' + r.destino : ''}${r.fetchedAt ? ' · atualizado ' + rastFmtTs(r.fetchedAt) : ''}</div>
      ${linha}
    </div>`;
  modal.style.display = 'flex';
}

async function handleFile(input) {
  if (!input.files[0]) return;
  const file    = input.files[0];
  if (file.size > 20 * 1024 * 1024) { showToast('Arquivo muito grande (máx 20 MB)', 'err'); return; }
  const key     = input.id.replace('f-', '');
  const display = document.getElementById(`file-display-${key}`);
  if (display) display.innerHTML = `<div class="file-upload-text" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon('upload',14)} Enviando…</div>`;
  try {
    const fileData = await uploadToStorage(file);
    tempFilesData[key] = fileData;
    if (display) {
      display.classList.add('has-file');
      display.innerHTML = `<div class="file-upload-text has-file" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon('check-circle',14,'color:var(--green)')} ${esc(file.name)} <span style="font-weight:400;opacity:.7">(${(file.size/1024).toFixed(0)} KB)</span></div>`;
    }
  } catch (err) {
    showToast('Erro ao enviar arquivo: ' + (err.message || 'tente novamente'), 'err');
    if (display) display.innerHTML = `<div class="file-upload-text" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon('upload',14)} Clique para tentar novamente</div>`;
  }
  // Re-emissão: mesmo anexo da NF → lê chave e número automaticamente.
  if (key === 'arquivoNF') autoPreencherNota(file);
  input.value = '';
}

function renderCounts() {
  const view = getActiveView();
  document.getElementById('cnt-fila').textContent        = getQueue(view).length;
  document.getElementById('cnt-concluidas').textContent  = getCompleted(view).length;
  document.getElementById('cnt-todas').textContent       = _opsFiltered().filter(o=>o.status!=='aberta'&&o.status!=='bloqueada').length;

  // Aba Rastreamento: só para logística e gestor
  const rastBtn = document.getElementById('btn-tab-rastreio');
  if (rastBtn) {
    const canRastreio = RASTREIO_ATIVO && (view?.role === 'logistica' || view?.role === 'gestor');
    rastBtn.style.display = canRastreio ? '' : 'none';
    document.getElementById('cnt-rastreio').textContent = canRastreio ? rastreioOps().length : 0;
    // Se estava na aba e perdeu acesso, volta pra fila
    if (!canRastreio && currentTab === 'rastreio') currentTab = 'fila';
  }

  // Aba Entregas (painel operacional da logística): só a logística (o ADM vê ao
  // simular Logística). O Gestor tem visão gerencial, não opera entregas.
  const logBtn = document.getElementById('btn-tab-logistica');
  if (logBtn) {
    const canLog = view?.role === 'logistica';
    logBtn.style.display = canLog ? '' : 'none';
    document.getElementById('cnt-logistica').textContent = canLog ? logisticaOps().length : 0;
    if (!canLog && currentTab === 'logistica') currentTab = 'fila';
  }

  // Aba Dashboard: só na visão Gestor.
  const isGestor = view?.role === 'gestor';
  const dashBtn = document.getElementById('btn-tab-dashboard');
  if (dashBtn) {
    dashBtn.style.display = isGestor ? '' : 'none';
    if (!isGestor && currentTab === 'dashboard') currentTab = 'fila';
  }
  // Aba Pendentes: o Gestor não tem fila pessoal → esconde (fica no Dashboard).
  const filaBtn = document.querySelector('.tab-btn[data-tab="fila"]');
  if (filaBtn) {
    filaBtn.style.display = isGestor ? 'none' : '';
    if (isGestor && currentTab === 'fila') currentTab = 'dashboard';
  }

  // Botão de cancelados: badge com a contagem (só aparece se houver alguma)
  const nCanc = ops.filter(o => o.cancelada).length;

  if (cntC) { cntC.textContent = nCanc; cntC.style.display = nCanc ? '' : 'none'; }

  if (verCancelados && !nCanc) { verCancelados = false; aplicarEstiloCancelados(); }

  syncActiveTab();      // mantém o botão destacado igual ao conteúdo (currentTab)
  refreshPendingAlert(); // bolinha + som conforme os pendentes do setor visualizado

// Destaca o botão de aba correspondente ao currentTab. Sem isto, ao trocar de
// setor (gestor) o currentTab volta pra 'fila' mas o botão "Entregas" continuava
// destacado — aba Entregas acesa mostrando o conteúdo de Pendentes.
function syncActiveTab() {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
}

function renderMain() {
  const view = getActiveView();
  const el   = document.getElementById('main');
  sincronizarTopFiltro(); // troca/restaura o filtro do topo conforme a aba
  // Não reconstrói o #main enquanto uma observação está sendo digitada (senão o
  // realtime/outro save apagaria o texto ainda não confirmado). Fica pendente.
  if (_editandoObs) { _renderMainPendente = true; return; }
  // try/catch: se um render falhar, o #main NÃO pode ficar com o conteúdo da aba
  // anterior (era isso que deixava "Entregas" aceso mostrando os Pendentes).
  try {
    if      (verCancelados)               renderCancelados(el);
    else if (currentTab === 'dashboard')  { view?.role === 'gestor' ? renderDashboard(el) : renderQueue(view, el); }
    else if (currentTab === 'fila')       renderQueue(view, el);
    else if (currentTab === 'concluidas') renderConcluidas(view, el);
    else if (currentTab === 'logistica')  renderLogistica(el);
    else if (currentTab === 'rastreio')   renderRastreio(el);
    else                                  renderTodas(el);
  } catch (e) {
    console.error('renderMain falhou:', e);
    el.innerHTML = `<div class="empty"><div class="empty-icon">${icon('alert-triangle',32,'color:var(--red)')}</div><div class="empty-title">Não foi possível carregar esta aba</div><div class="empty-desc">${(e&&e.message)||'Erro inesperado'} — tente recarregar a página.</div></div>`;
  }
  syncActiveTab(); // a aba destacada SEMPRE reflete o conteúdo mostrado
}

const UF_NOME = { AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins' };

// OPs que a logística acompanha: em fase de transporte, não entregues/canceladas.
function logisticaOps() {
  // Mostra desde a criação (o destino já é conhecido na abertura), para a
  // logística planejar com antecedência. Fora: entregues, canceladas, bloqueadas.
  const fora = ['entregue', 'bloqueada', 'aberta'];
  return ops.filter(o => !o.cancelada && !fora.includes(o.status));
}

function destinoOP(op) {
  const pv = op.pedidoVenda || {};
  return { uf: (pv.endEstado||'').trim().toUpperCase() || '??', cidade: (pv.endCidade||'').trim() || 'Sem cidade' };
}

// Consolidável = ainda não despachada → dá para juntar na mesma viagem.
function consolidavel(op) {
  return op.status === 'aguard_nf' || op.status === 'aguard_emissao' || op.status === 'aguard_despacho';
}

// Filtros do painel (persistem entre re-renders)
let _logBusca = '';
let _logUrg   = 'todas';  // todas | atrasadas | proximas | noprazo

// Dias até o prazo (negativo = atrasada). Mesma lógica do semáforo.
function diasRestantes(op) {
  const prev = parseBRDate(op.pedidoVenda?.dataPrevista);
  if (prev) { const t = new Date(); t.setHours(0,0,0,0); return Math.ceil((prev - t) / 86400000); }
  // Sem data prevista nem abertura válida → neutro (não vira NaN nem "atrasada").
  if (!op.dataAbertura || isNaN(new Date(op.dataAbertura))) return 999;
  return 20 - daysSince(op.dataAbertura);
}
function urgCat(op) {
  const c = semaforo(op).cls;
  return c === 'b-red' ? 'atrasadas' : (c === 'b-yellow' || c === 'b-orange') ? 'proximas' : 'noprazo';
}
function setLogUrg(v) {
  _logUrg = v;
  const lf = document.getElementById('log-filter'); // atualiza o destaque dos chips no topo
  if (lf) { lf.innerHTML = logFiltroHtml(); lf.dataset.built = '1'; }
  renderMain();
}
function setLogBusca(v) {
  _logBusca = v;
  renderMain(); // só re-renderiza o conteúdo; a busca fica no topo e mantém o foco
}

// Filtro da aba Entregas (busca + chips) — vai na barra do topo, no lugar do
// filtro normal, quando a aba está ativa (ver sincronizarTopFiltro).
function logFiltroHtml() {
  const chip = (val, label) => {
    const on = _logUrg === val;
    return `<button onclick="setLogUrg('${val}')" style="border:1px solid ${on?'var(--accent)':'var(--border)'};background:${on?'var(--accent)':'transparent'};color:${on?'#fff':'var(--text2)'};font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;font-family:inherit;white-space:nowrap">${label}</button>`;
  };
  return `<div style="position:relative;flex:1;min-width:140px;max-width:240px">
      <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;display:flex">${icon('search',14,'color:var(--text3)')}</span>
      <input id="log-busca" type="text" value="${_logBusca.replace(/"/g,'&quot;')}" oninput="setLogBusca(this.value)" placeholder="Buscar cidade ou estado…"
        style="width:100%;height:30px;padding:0 10px 0 32px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;outline:none">
    </div>
    <div style="display:flex;gap:6px;flex-wrap:nowrap">${chip('todas','Todas')}${chip('atrasadas','Atrasadas')}${chip('proximas','Próximas')}${chip('noprazo','No prazo')}</div>`;
}

// Troca o filtro do topo: na aba Entregas mostra busca+chips no lugar do filtro
// normal (e esconde o funil). Fora dela, restaura o filtro normal.
function sincronizarTopFiltro() {
  const emLog  = currentTab === 'logistica' && !verCancelados;
  const funnel = document.getElementById('btn-filter-toggle');
  const fbar   = document.getElementById('filter-bar');
  const lf     = document.getElementById('log-filter');
  if (funnel) funnel.style.display = emLog ? 'none' : '';
  if (fbar)   fbar.style.display   = emLog ? 'none' : '';
  if (lf) {
    lf.style.display = emLog ? 'flex' : 'none';
    // Monta uma vez ao entrar (não a cada render, senão perde o foco da busca).
    if (emLog && !lf.dataset.built) { lf.innerHTML = logFiltroHtml(); lf.dataset.built = '1'; }
    if (!emLog) lf.dataset.built = '';
  }
}

let _logGrupoOps = {};       // key do card → [ids das OPs] (arrastar/soltar)
let _logDrag     = null;     // { tipo:'card', key } | { tipo:'op', id }
let _logCidadeSoltas = {};   // cidade||uf → nº de entregas soltas (para o 💡)

// Observação da entrega (embaixo do card), exibida como *texto. Salva em
// op.obsLogistica (todos veem). O campo desativa o arraste do card enquanto
// está com foco, senão não dá para digitar dentro de um elemento draggable.
function obsLogHtml(o) {
  const v = (o.obsLogistica || '').replace(/"/g, '&quot;');
  return `<div onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:4px;margin-top:6px">
    <span style="color:var(--text3);font-size:12px;font-weight:700">*</span>
    <input value="${v}"
      onfocus="_editandoObs=true;const c=this.closest('[draggable]');if(c)c.draggable=false"
      onblur="_editandoObs=false;const c=this.closest('[draggable]');if(c)c.draggable=true;setObsLog(${o.id},this.value);if(_renderMainPendente){_renderMainPendente=false;renderMain();}"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
      style="flex:1;min-width:0;border:none;background:none;color:var(--text2);font-size:11px;font-style:italic;outline:none;padding:0">
  </div>`;
}
function setObsLog(opId, val) {
  const o = ops.find(x => x.id === opId);
  if (!o) return;
  const v = (val || '').trim();
  if ((o.obsLogistica || '') === v) return; // nada mudou
  o.obsLogistica = v;
  dbSaveOp(o); // persiste; não re-renderiza para não perder o que se digita
}

// Situação clara para a logística: em preparação → pronto para sair (NF emitida)
// → em trânsito. Despacho (aguard_despacho) é logo após a emissão da NF.
function logStatus(op) {
  const meta  = STEPS[op.status];
  const color = meta?.color || 'gray';
  return { label: meta?.label || 'Em preparação', bg: `var(--${color}-bg)`, fg: `var(--${color})` };
}

// Prazo SEMPRE como DATA (dd/mm/aa). Usa a data prevista; sem ela, estima
// abertura + 20 dias (a mesma janela que o semáforo usa como fallback).
function prazoData(op) {
  const dp = (op.pedidoVenda?.dataPrevista || '').trim();
  if (dp && dp !== '-') {
    const m = dp.match(/^(\d{2})\/(\d{2})\/(\d{2,4})/);
    return m ? `${m[1]}/${m[2]}/${m[3].slice(-2)}` : dp;
  }
  if (op.dataAbertura) {
    const d = new Date(op.dataAbertura + 'T12:00:00');
    if (!isNaN(d)) {
      d.setDate(d.getDate() + 20);
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`;
    }
  }
  return null;
}

// Selo de prazo (data máxima = previsão) com cor pela janela:
//   • Verde:    dentro da data ótima (faltam 10+ dias, ou seja até 10 dias antes da máxima)
//   • Amarelo:  fora da ótima e ainda no prazo (faltam de 0 a 9 dias — inclui os 3 dias finais)
//   • Vermelho: passou da data máxima
function prazoBadge(op) {
  const date = prazoData(op) || '—';
  const dias = diasRestantes(op);
  const cls  = dias < 0 ? 'b-red' : dias < 10 ? 'b-yellow' : 'b-green';
  return { cls, date };
}

// Origem fixa da rota: sede da Contourline (Sete Lagoas/MG).
const ORIGEM_ROTA = 'R. Joaquim Dias Drumond, 100 - Henrique Nery, Sete Lagoas - MG, 35700-333';

// Abre a rota completa no Google Maps: origem = sede Contourline, última parada =
// destino, demais paradas = waypoints. Usa o endereço/CEP de cada parada.
function abrirRotaMaps(rotaId) {
  const r = rotas.find(x => x.id === rotaId); if (!r) return;
  const pts = (r.paradas || []).filter(entregaParadaAtiva).map(p => (p.mapsQuery || p.endereco || p.cep || '').trim()).filter(Boolean);
  if (!pts.length) { showToast('Rota sem endereços para o mapa', 'err'); return; }
  const enc = s => encodeURIComponent(s);
  const destination = pts[pts.length - 1];
  const way = pts.slice(0, -1).map(enc).join('|'); // todas menos a última viram waypoints
  const url = `https://www.google.com/maps/dir/?api=1&origin=${enc(ORIGEM_ROTA)}&destination=${enc(destination)}` + (way ? `&waypoints=${way}` : '');
  window.open(url, '_blank');
}

function renderLogistica(el) {
  const emRota = opsEmRotaSet();
  const soltas = logisticaOps().filter(o => !emRota.has(Number(o.id)));

  const sub = (id, label, n) => {
    const on = _entregaSubtab === id;
    return `<button onclick="setEntregaSubtab('${id}')" style="border:none;background:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;padding:4px 2px;margin-right:16px;color:${on?'var(--text)':'var(--text3)'};border-bottom:2px solid ${on?'var(--accent)':'transparent'}">${label} <span class="tab-count">${n}</span></button>`;
  };
  const header = `<div class="step-header" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${icon('map-pin',18,'color:var(--accent)')}
      ${sub('rotas','Rotas', rotas.length)}
      ${sub('sem_rota','Sem rota', soltas.length)}
      ${_entregaSubtab==='rotas' ? `<button onclick="abrirConstrutorRota()" title="Nova rota" style="margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--accent);border:none;color:#fff;font-weight:700;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit">${icon('plus',14,'color:#fff')} Nova rota</button>` : ''}
    </div>`;

  if (_entregaSubtab === 'rotas') {
    if (!rotas.length) {
      el.innerHTML = header + `<div class="empty"><div class="empty-icon">${icon('truck',32,'color:var(--text3)')}</div><div class="empty-title">Nenhuma rota</div><div class="empty-desc">Clique em "Nova rota" para montar a rota de um motorista com entregas e coletas.</div></div>`;
    } else {
      const cards = rotas.slice().sort((a,b)=>(b.id||0)-(a.id||0)).map(rotaCard).join('');
      el.innerHTML = header + `<div style="column-width:320px;column-gap:12px;padding-bottom:24px">${cards}</div>`;
    }
  } else {
    const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    const busca = norm(_logBusca.trim());
    let lista = soltas;
    if (_logUrg !== 'todas') lista = lista.filter(o => urgCat(o) === _logUrg);
    if (busca) lista = lista.filter(o => { const d = destinoOP(o); return norm(`${d.cidade} ${d.uf} ${UF_NOME[d.uf]||''} ${esc(o.cliente)}`).includes(busca); });
    lista.sort((a,b)=>diasRestantes(a)-diasRestantes(b));
    if (!lista.length) {
      el.innerHTML = header + `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--text3)')}</div><div class="empty-title">Nada sem rota</div><div class="empty-desc">As entregas em transporte que ainda não estão em rotas aparecem aqui.</div></div>`;
    } else {
      const cards = lista.map(o => opCardEntrega(o)).join('');
      el.innerHTML = header + `<div style="column-width:300px;column-gap:12px;padding-bottom:24px">${cards}</div>`;
    }
  }
  sincronizarTopFiltro();
}

function setEntregaSubtab(id) { _entregaSubtab = id; renderMain(); }

function enderecoOP(op) {
  const pv = op.pedidoVenda || {};
  return (pv.enderecoEntrega || [pv.endRua, pv.endNumero].filter(Boolean).join(', ') || '').trim();
}
function equipOP(op) { return (op.equipamentos || [op.equipamento]).filter(Boolean).slice(0, 2).join(', '); }

  const base = rotaId ? rotas.find(r => r.id === rotaId) : null;
  _rotaEditando = base
    ? JSON.parse(JSON.stringify({ id: base.id, motorista: base.motorista||'', carro: base.carro||'', placa: base.placa||'', paradas: base.paradas||[] }))

          ${paradasHtml}
          ${_addingColeta ? `
          <div style="margin-top:10px;border:1px solid var(--border2);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--bg2)">
            <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px">Nova coleta</div>
            <input id="col-item" class="form-input" placeholder="O que buscar/coletar?" autocomplete="off">
            <div style="display:grid;grid-template-columns:110px 1fr;gap:8px">

            <div style="display:flex;gap:8px;justify-content:flex-end">

              <button onclick="confirmarColeta()" class="btn-primary" style="padding:6px 12px;font-size:12px">Adicionar</button>

function addOpNaRota(opId) {
  const o = ops.find(x => x.id === opId); if (!o || !_rotaEditando) return;
  (_rotaEditando.paradas = _rotaEditando.paradas || []).push({
    tipo: 'entregar', opId: o.id, opNum: numOp(o), cliente: o.cliente || '', equip: equipOP(o), endereco: enderecoOP(o),
  });
  renderConstrutorRota();
}
function abrirColetaForm() { _addingColeta = true; _coletaCep = null; renderConstrutorRota(); setTimeout(()=>{ const el=document.getElementById('col-item'); if(el) el.focus(); }, 0); }
function cancelColeta() { _addingColeta = false; _coletaCep = null; renderConstrutorRota(); }

// Busca o CEP da coleta e guarda as PARTES (rua/bairro/cidade/uf/cep) — precisamos
// delas para montar um endereço que o Google Maps geolocalize corretamente.
async function lookupColetaCEP(rawVal) {
  const digits = rawVal.replace(/\D/g, '');
  const elEnd = document.getElementById('col-endereco');
  if (digits.length !== 8) { _coletaCep = null; return; }
  setStatus('col-cepstatus', 'Buscando…', 'loading');
  try {
    const res = await fetch('https://brasilapi.com.br/api/cep/v2/' + digits);
    if (!res.ok) throw new Error();
    const d = await res.json();
    const cepFmt = digits.replace(/^(\d{5})(\d{3})$/, '$1-$2');
    _coletaCep = { street: d.street || '', neighborhood: d.neighborhood || '', city: d.city || '', state: d.state || '', cep: cepFmt };
    if (elEnd) elEnd.value = [d.street, d.neighborhood, [d.city, d.state].filter(Boolean).join('/'), cepFmt].filter(Boolean).join(', ');
    setStatus('col-cepstatus', '✓ ' + [d.city, d.state].filter(Boolean).join('/'), 'ok');
  } catch {
    _coletaCep = null;
    setStatus('col-cepstatus', '✗ CEP não encontrado', 'err');
  }
}

function confirmarColeta() {
  const item = (document.getElementById('col-item')?.value || '').trim();
  if (!item) { showToast('Informe o que buscar/coletar', 'err'); document.getElementById('col-item')?.focus(); return; }
  const cep = (document.getElementById('col-cep')?.value || '').trim();
  const numero = (document.getElementById('col-num')?.value || '').trim();
  const base = (document.getElementById('col-endereco')?.value || '').trim();
  // Display: como o usuário vê (rua, bairro, cidade/uf, cep, Nº X).
  const endereco = [base, numero ? 'Nº ' + numero : ''].filter(Boolean).join(', ');
  // Maps: número LOGO após a rua e "Cidade - UF" — formato que o Google geolocaliza
  // certo (com o número no fim, depois do CEP, ele erra a rua).
  let mapsQuery = '';
  if (_coletaCep) {
    const c = _coletaCep;
    const rua = c.street + (numero ? ', ' + numero : '');
    mapsQuery = [rua, c.neighborhood, [c.city, c.state].filter(Boolean).join(' - '), c.cep].filter(Boolean).join(', ');
  } else {
    mapsQuery = endereco;
  }
  (_rotaEditando.paradas = _rotaEditando.paradas || []).push({ tipo: 'buscar', item, cep, numero, endereco, mapsQuery });
  _addingColeta = false; _coletaCep = null;
  renderConstrutorRota();
}
function removerParada(i) {
  if (!_rotaEditando) return;
  _rotaEditando.paradas.splice(i, 1);
  renderConstrutorRota();
}

// ── Reordenar paradas por arrastar ───────────────────────────────────
let _paradaDrag = null;
function paradaDragStart(i, ev) {
  _paradaDrag = i;
  if (ev?.dataTransfer) ev.dataTransfer.effectAllowed = 'move';
  ev?.currentTarget?.style && (ev.currentTarget.style.opacity = '.4');
}
function paradaDragEnd(ev) {
  if (ev?.currentTarget?.style) ev.currentTarget.style.opacity = '';
  document.querySelectorAll('[data-pidx]').forEach(el => el.style.borderTop = '');
}
function paradaDragOver(i, ev) {
  ev.preventDefault();                        // necessário para permitir o drop
  if (ev?.dataTransfer) ev.dataTransfer.dropEffect = 'move';
  const el = ev.currentTarget;                // realça a linha alvo
  if (el && _paradaDrag !== null && _paradaDrag !== i) el.style.borderTop = '2px solid var(--accent)';
}
function paradaDrop(i, ev) {
  ev?.preventDefault();
  const from = _paradaDrag; _paradaDrag = null;
  if (from === null || !_rotaEditando) return;
  const arr = _rotaEditando.paradas;
  if (from === i || from < 0 || from >= arr.length) { renderConstrutorRota(); return; }
  const [it] = arr.splice(from, 1);
  // Ao remover antes do alvo, o índice do alvo desloca 1 — corrige para soltar
  // exatamente onde o usuário largou (arrastar p/ baixo e p/ cima simétricos).
  const alvo = from < i ? i - 1 : i;
  arr.splice(alvo, 0, it);
  renderConstrutorRota();
}
async function salvarRotaEditando() {
  const r = _rotaEditando; if (!r) return;
  if (!(r.paradas||[]).length) { showToast('Adicione ao menos uma parada', 'err'); return; }
  const ok = await saveRota(r);
  if (ok) { _rotaEditando = null; closeModal(); showToast('Rota salva', 'ok'); }
}

function aplicarEstiloCancelados() {
  const btn  = document.getElementById('btn-cancelados');
  const tabs = document.querySelectorAll('.tab-btn');
  if (btn) {
    btn.style.background  = verCancelados ? 'var(--red-bg)' : 'var(--surface2)';
    btn.style.color       = verCancelados ? 'var(--red)'    : 'var(--text3)';
