// Debounce: agrupa chamadas rápidas em série (realtime, advanceOP, etc.)
// em um único re-render depois de 60ms de silêncio
let _renderAllTimer = null;
function renderAll() {
  if (_renderAllTimer) clearTimeout(_renderAllTimer);
  _renderAllTimer = setTimeout(() => {
    _renderAllTimer = null;
    renderRoles();
    renderCounts();
    renderMain();
  }, 60);
}

function renderRoles() {
  const user = getUser();
  if (!user) return;
  // Botão Nova OP: só gestor e comercial
  const canCreate = user.id === 'gestor' || user.id === 'comercial';
  const novaBtn = document.getElementById('btnNovaOP');
  if (novaBtn) novaBtn.style.display = canCreate ? '' : 'none';

  // Centro do header: switcher de visão só para gestor
  const center = document.getElementById('headerCenter');
  if (center) {
    center.innerHTML = user.id === 'gestor' ? `
      <div class="view-switcher">
        <button class="view-btn ${gestorViewAs === 'comercial'  ? 'active' : ''}" onclick="setGestorView('comercial')">COM</button>
        <button class="view-btn ${gestorViewAs === 'financeiro' ? 'active' : ''}" onclick="setGestorView('financeiro')">FIN</button>
        <button class="view-btn ${gestorViewAs === 'logistica'  ? 'active' : ''}" onclick="setGestorView('logistica')">LOG</button>
        <button class="view-btn ${gestorViewAs === 'fiscal'     ? 'active' : ''}" onclick="setGestorView('fiscal')">FIS</button>
      </div>` : '';
  }

  // Widget: [Sair] [Avatar + nome]
  document.getElementById('roleSelector').innerHTML = `
    <div class="user-widget">
      <button class="logout-btn" onclick="doLogout()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
        <div class="user-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="user-widget-name">${user.userName || user.name}</div>
      </div>
    </div>`;
}

function renderCounts() {
  const view = getActiveView();
  document.getElementById('cnt-fila').textContent       = getQueue(view).length;
  document.getElementById('cnt-concluidas').textContent  = getCompleted(view).length;
  document.getElementById('cnt-todas').textContent       = ops.length;
}

function renderMain() {
  const view = getActiveView();
  const el   = document.getElementById('main');
  if      (currentTab === 'fila')       renderQueue(view, el);
  else if (currentTab === 'concluidas') renderConcluidas(view, el);
  else                                  renderTodas(el);
}

function renderQueue(user, el) {
  // ── GESTOR ───────────────────────────────────────────────────────
  if (user.role === 'gestor') {
    el.innerHTML = `<div class="step-header"><div class="step-title">Sem pendências</div><div class="step-desc">Você tem acesso de visualização. Use "Todas as OPs" para o painel completo.</div></div>
      <div class="empty"><div class="empty-icon">${icon('eye',32,'color:var(--text3)')}</div><div class="empty-title">Acesso de visualização</div><div class="empty-desc">Use "Todas as OPs" para o painel completo.</div></div>`;
    return;
  }

  // ── COMERCIAL — pendentes = em andamento ─────────────────────────
  if (user.role === 'vendedor') {
    const pendentes = ops.filter(o => o.status !== 'entregue');
    let html = `<div class="step-header"><div class="step-title">Minhas OPs — Pendentes</div>
      <div class="step-desc">OPs ainda em andamento. Acompanhe o progresso ou clique para ver detalhes.</div></div>`;
    if (!ops.length) {
      html += `<div class="empty"><div class="empty-icon">${icon('clipboard-list',32,'color:var(--text3)')}</div><div class="empty-title">Nenhuma OP cadastrada</div><div class="empty-desc">Clique em "+ Nova OP" para criar a primeira.</div></div>`;
    } else if (!pendentes.length) {
      html += `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Tudo entregue!</div><div class="empty-desc">Todas as OPs foram concluídas e entregues ao cliente.</div></div>`;
    } else {
      html += `<div class="card-grid">${pendentes.map((op,i) => card(op,false,i)).join('')}</div>`;
    }
    el.innerHTML = html;
    return;
  }

  // ── LOGÍSTICA UNIFICADA ──────────────────────────────────────────
  if (user.role === 'logistica') {
    const nfOps      = ops.filter(o => o.status === 'aguard_nf');
    const despachoOps= ops.filter(o => o.status === 'aguard_despacho');
    const transitoOps= ops.filter(o => o.status === 'transito');
    const total = nfOps.length + despachoOps.length + transitoOps.length;
    let html = `<div class="step-header"><div class="step-title">Logística — Pendentes</div>
      <div class="step-desc">${total} OP${total!==1?'s':''} pendente${total!==1?'s':''} — Solicitação NF, despacho e entregas</div></div>`;
    if (!total) {
      html += `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Nenhuma pendência agora</div><div class="empty-desc">Todas as etapas de logística estão em dia.</div></div>`;
    } else {
      if (nfOps.length) html += `
        <div class="section">
          <div class="section-header">
            <div class="section-header-icon" style="background:var(--blue-bg)">
              ${icon('file-text',16,'color:var(--accent)')}
            </div>
            <div style="flex:1">
              <div class="section-header-title">Solicitar Emissão de NF</div>
              <div class="section-header-desc">Preencha os dados de entrega e envie para o fiscal emitir</div>
            </div>
            <span class="section-header-count" style="background:var(--blue-bg);color:var(--accent)">${nfOps.length}</span>
          </div>
          <div class="card-grid">${nfOps.map((op,i) => card(op,true,i)).join('')}</div>
        </div>`;
      if (despachoOps.length) html += `
        <div class="section">
          <div class="section-header">
            <div class="section-header-icon" style="background:var(--teal-bg)">
              ${icon('truck',16,'color:var(--teal)')}
            </div>
            <div style="flex:1">
              <div class="section-header-title">Aguardando Despacho</div>
              <div class="section-header-desc">NF emitida — confirme a data e hora do despacho</div>
            </div>
            <span class="section-header-count" style="background:var(--teal-bg);color:var(--teal)">${despachoOps.length}</span>
          </div>
          <div class="card-grid">${despachoOps.map((op,i) => card(op,true,i)).join('')}</div>
        </div>`;
      if (transitoOps.length) html += `
        <div class="section">
          <div class="section-header">
            <div class="section-header-icon" style="background:var(--orange-bg)">
              ${icon('package',16,'color:var(--orange)')}
            </div>
            <div style="flex:1">
              <div class="section-header-title">Em Trânsito — Confirmar Entrega</div>
              <div class="section-header-desc">Produto despachado — registre a entrega ao cliente</div>
            </div>
            <span class="section-header-count" style="background:var(--orange-bg);color:var(--orange)">${transitoOps.length}</span>
          </div>
          <div class="card-grid">${transitoOps.map((op,i) => card(op,true,i)).join('')}</div>
        </div>`;
    }
    el.innerHTML = html;
    return;
  }

  // ── FINANCEIRO (seções: Validação + Bloqueadas) ──────────────────
  if (user.role === 'financeiro') {
    const validacaoOps = ops.filter(o => o.status === 'aguard_financeiro');
    const bloqueadaOps = ops.filter(o => o.status === 'bloqueada');
    const boletoOps    = ops.filter(o => o.boletoTask?.status === 'pendente');
    const total = validacaoOps.length + bloqueadaOps.length + boletoOps.length;

    let html = `<div class="step-header"><div class="step-title">Financeiro — Pendentes</div>
      <div class="step-desc">${total} OP${total!==1?'s':''} pendente${total!==1?'s':''} — Validação de pagamentos, bloqueados e envio de boletos</div></div>`;

    if (!total) {
      html += `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Tudo em dia!</div><div class="empty-desc">Nenhuma OP aguardando ação financeira.</div></div>`;
    } else {
      if (validacaoOps.length) html += `
        <div class="section">
          <div class="section-header">
            <div class="section-header-icon" style="background:var(--yellow-bg)">
              ${icon('clock',16,'color:var(--yellow)')}
            </div>
            <div style="flex:1">
              <div class="section-header-title">Aguardando Validação</div>
              <div class="section-header-desc">OPs com entrada pendente aguardando confirmação de pagamento</div>
            </div>
            <span class="section-header-count" style="background:var(--yellow-bg);color:var(--yellow)">${validacaoOps.length}</span>
          </div>
          <div class="card-grid">${validacaoOps.map((op,i) => card(op,true,i)).join('')}</div>
        </div>`;

      if (bloqueadaOps.length) html += `
        <div class="section">
          <div class="section-header">
            <div class="section-header-icon" style="background:var(--red-bg)">
              ${icon('ban',16,'color:var(--red)')}
            </div>
            <div style="flex:1">
              <div class="section-header-title">Bloqueados</div>
              <div class="section-header-desc">Pedidos bloqueados pelo financeiro — aguardando resolução ou desbloqueio</div>
            </div>
            <span class="section-header-count" style="background:var(--red-bg);color:var(--red)">${bloqueadaOps.length}</span>
          </div>
          <div class="card-grid">${bloqueadaOps.map((op,i) => card(op,true,i)).join('')}</div>
        </div>`;

      if (boletoOps.length) html += `
        <div class="section">
          <div class="section-header">
            <div class="section-header-icon" style="background:rgba(38,114,184,.1)">
              ${icon('send',16,'color:var(--accent)')}
            </div>
            <div style="flex:1">
              <div class="section-header-title">Envio de Boleto ao Cliente</div>
              <div class="section-header-desc">NF emitida — aguardando envio do boleto ao cliente</div>
            </div>
            <span class="section-header-count" style="background:rgba(38,114,184,.1);color:var(--accent)">${boletoOps.length}</span>
          </div>
          <div class="card-grid">${boletoOps.map(op => boletoTaskCard(op)).join('')}</div>
        </div>`;
    }
    el.innerHTML = html;
    return;
  }

  // ── DEMAIS SETORES ───────────────────────────────────────────────
  const config = {
    fiscal: ['Notas Fiscais a Emitir', 'Preencha os dados — emita a NF e registre o número aqui'],
  };
  const [title, desc] = config[user.role] || ['Pendentes', ''];
  const queue = getQueue(user);
  el.innerHTML = `<div class="step-header"><div class="step-title">${title}</div><div class="step-desc">${desc}</div></div>
    ${queue.length === 0
      ? `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Tudo em dia!</div><div class="empty-desc">Nenhuma OP aguardando sua ação no momento.</div></div>`
      : `<div class="card-grid">${queue.map((op,i) => card(op,true,i)).join('')}</div>`}`;
}

function renderConcluidas(user, el) {
  const list = getCompleted(user);
  el.innerHTML = `<div class="step-header"><div class="step-title">Concluídas por Mim</div><div class="step-desc">OPs em que você já tomou uma ação</div></div>
    ${list.length === 0
      ? `<div class="empty"><div class="empty-icon">${icon('clipboard-list',32,'color:var(--text3)')}</div><div class="empty-title">Nenhuma concluída ainda</div></div>`
      : `<div class="card-grid">${list.map((op,i) => card(op,false,i)).join('')}</div>`}`;
}

function renderTodas(el) {
  const order = ['aguard_financeiro','aguard_nf','aguard_emissao','aguard_despacho','transito','entregue'];
  const groups = {};
  const q = todasFilter.trim().toLowerCase();
  ops.forEach(op => {
    if (op.status === 'aberta' || op.status === 'bloqueada') return;
    if (q && !(op.numero||'').toLowerCase().includes(q) && !(op.cliente||'').toLowerCase().includes(q)) return;
    (groups[op.status]=groups[op.status]||[]).push(op);
  });
  const abertas = ops.filter(o=>o.status!=='entregue').length;
  const cols = order.map(status => {
    const s = STEPS[status];
    const colOps = groups[status] || [];
    const badgeCls = COLOR_MAP[s?.color||'gray'] || 'b-gray';
    return `<div class="kanban-col">
      <div class="kanban-col-head">
        <span class="kanban-col-name">${s?.label||status}</span>
        <span class="badge ${badgeCls}" style="font-size:9px;padding:1px 6px">${colOps.length}</span>
      </div>
      <div class="kanban-col-body">
        ${colOps.length ? colOps.map((op,i)=>card(op,false,i,true)).join('') : '<div class="kanban-empty">—</div>'}
      </div>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="step-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <div><div class="step-title">Todas as OPs</div>
        <div class="step-desc">${abertas} em aberto · ${ops.length-abertas} entregues</div></div>
      <input class="form-input" type="text" placeholder="Buscar OP ou cliente…"
        value="${todasFilter.replace(/"/g,'&quot;')}"
        oninput="filterTodas(this.value)"
        style="max-width:240px;font-size:12px;flex-shrink:0">
    </div>
    <div class="kanban-wrap"><div class="kanban-board">${cols}</div></div>`;
}

function filterTodas(val) {
  todasFilter = val;
  const el = document.getElementById('main');
  if (!el || currentTab !== 'todas') return;
  renderTodas(el);
  // Re-foca o input e restaura o cursor no fim do texto
  const inp = el.querySelector('input[type="text"]');
  if (inp) { inp.focus(); const n = inp.value.length; inp.setSelectionRange(n, n); }
  renderCounts();
}

// ═══════════════════════════════════════════════════════════════════
// CARD RENDERER
// ═══════════════════════════════════════════════════════════════════

function card(op, inQueue, animIdx, infoOnly = false) {
  const user     = getActiveView();
  const step     = STEPS[op.status];
  const badge    = stepBadge(op.status);
  const sem      = semaforo(op);
  const isBlocked = op.status === 'bloqueada';

  const dots = PIPELINE_ORDER.map(s => {
    const sIdx   = STEPS[s]?.pipelineIdx ?? 0;
    const curIdx = isBlocked ? 1 : (step?.pipelineIdx ?? 0);
    if (sIdx < curIdx)  return `<div class="pipe-dot done"></div>`;
    if (sIdx === curIdx) return `<div class="pipe-dot ${isBlocked?'blocked':'current'}"></div>`;
    return `<div class="pipe-dot"></div>`;
  }).join('');

  const canAct = inQueue && step?.owner === user.role;

  const skippedFin = op.history.some(h => h.note?.includes('Validação financeira pulada'));
  const lastEvt    = op.history[op.history.length-1];

  // Equipment chips
  const equipList = op.equipamentos?.length
    ? op.equipamentos.map(e=>`<span class="equip-chip">${e}</span>`).join('')
    : `<span class="equip-chip">${op.equipamento||'—'}</span>`;

  let footer = '';
  if (canAct) {
    footer = `<div class="card-footer">
      <button class="btn-action" onclick="event.stopPropagation();openActionModal(${op.id},'advance')">${step.actionLabel}</button>
      ${step.getReject ? `<button class="btn-action danger" onclick="event.stopPropagation();openActionModal(${op.id},'reject')">${step.rejectLabel||'Bloquear'}</button>` : ''}
    </div>`;
  }

  const isEntregue = op.status === 'entregue';
  return `
  <div class="card ${canAct&&!infoOnly?'actionable':''} ${isBlocked?'blocked':''} ${isEntregue?'entregue':''}" style="animation-delay:${animIdx*.04}s" onclick="${infoOnly?`openInfoModal(${op.id})`:`openCard(${op.id})`}">
    <div class="card-top">
      <div>
        <div class="card-op">OP ${op.numero}</div>
        <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${fmtDate(op.dataAbertura)} · ${op.vendedorCanal||op.vendedorName||''}</div>
      </div>
      <div class="card-flags">
        ${isEntregue ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;color:var(--green);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.25);padding:1px 6px;border-radius:20px">${icon('check-circle',10,'color:var(--green)')} Concluída</span>` : ''}
        ${flagsHtml(op)}
      </div>
    </div>
    <div class="card-client">${op.cliente}</div>
    <div class="equip-chips">${equipList}</div>
    <div class="card-meta">
      <span class="badge ${badge.cls}"><span class="badge-dot" style="background:currentColor"></span>${badge.label}</span>
      ${op.status!=='entregue' ? `<span class="sema ${sem.cls}">${sem.icon?sem.icon+' ':''}${sem.label}</span>` : ''}
      ${skippedFin ? `<span class="skip-badge">↷ Fin. pulado</span>` : ''}
    </div>
    <div class="pipe-bar">${dots}</div>
    <div style="font-size:11px;color:var(--text3)">${op.numContrato||op.canal||op.contrato}</div>
    ${isEntregue && !op.stepData?.transito?.fotos?.length ? `<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);font-style:italic;margin-top:2px">${icon('image',10,'color:var(--text3)')} sem foto de entrega</div>` : ''}
    ${lastEvt ? `<div class="card-last-event"><span style="color:var(--text2)">${lastEvt.actorName}:</span> ${(lastEvt.action||lastEvt.note||'').substring(0,90)}</div>` : ''}
    ${footer}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// CONTEXT PANEL — acumula respostas anteriores
// ═══════════════════════════════════════════════════════════════════

function buildContextPanel(op) {
  const pv = op.pedidoVenda;
  const sd = op.stepData || {};
  const sem = semaforo(op);
  const badge = stepBadge(op.status);

  const cRow = (label, val) => {
    if (!val) return '';
    return `<div class="ctx-row"><span class="ctx-label">${label}</span><span class="ctx-value">${val}</span></div>`;
  };
  const sec = (title, rows) => {
    const content = rows.filter(Boolean).join('');
    if (!content) return '';
    return `<div class="ctx-sec"><div class="ctx-sec-title">${title}</div>${content}</div>`;
  };

  let parts = [];

  // OP summary header
  parts.push(`<div style="display:flex;flex-direction:column;gap:5px">
    <div style="font-size:13px;font-weight:700;line-height:1.3">${op.cliente}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
      <span class="badge ${badge.cls}"><span class="badge-dot" style="background:currentColor"></span>${badge.label}</span>
      ${op.status!=='entregue'?`<span class="sema ${sem.cls}">${sem.label}</span>`:''}
    </div>
    <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${[op.numContrato||op.contrato||'',op.vendedorCanal||op.vendedorName,daysSince(op.dataAbertura)+'d'].filter(Boolean).join(' · ')}</div>
    ${op.obs?`<div style="font-size:11px;color:var(--text2)">${op.obs}</div>`:''}
  </div>`);

  // Pedido do Cliente
  if (pv) {
    const equipLines = (pv.equipamentos||[]).map(e=>`${e.name}${e.qty>1?' ×'+e.qty:''}`).join('<br>');
    const addrParts  = [[pv.endRua, pv.endNumero].filter(Boolean).join(', '), pv.endBairro, [pv.endCidade,pv.endEstado].filter(Boolean).join('/'), pv.endCEP].filter(Boolean);
    const endDisplay = addrParts.length ? addrParts.join(', ') : (pv.enderecoCliente||'');

    const payRows = [];
    if (pv.tipoContrato)   payRows.push(cRow('Tipo de Contrato', `<strong>${pv.tipoContrato}</strong>`));
    if (pv.valorTotal)     payRows.push(cRow('Valor Bruto', fmtBRL(pv.valorTotal)));
    if (pv.valorDesconto && parseFloat(pv.valorDesconto) > 0)
                           payRows.push(cRow('Desconto', '− ' + fmtBRL(pv.valorDesconto)));
    if (pv.valorLiquido)   payRows.push(cRow('Valor Total', fmtBRL(pv.valorLiquido)));
    if (pv.detalhesPagamento) payRows.push(cRow('Pagamento', pv.detalhesPagamento.replace(/\n/g,'<br>')));
    if (pv.simulador && parseFloat(pv.simulador) > 0)
                           payRows.push(cRow('Simulador', fmtBRL(pv.simulador)));
    if (pv.entrada === 'pendente')
                           payRows.push(cRow('Entrada', (pv.valorEntrada ? fmtBRL(pv.valorEntrada) : 'a definir') + ' — PENDENTE'));

    parts.push(sec('Pedido do Cliente', [
      cRow('Vendedor(a)', pv.vendedorCanal),
      cRow('Equipamentos', equipLines),
      pv.voltagem && (Array.isArray(pv.voltagem) ? pv.voltagem.filter(Boolean).length : pv.voltagem)
        ? cRow('Voltagem', Array.isArray(pv.voltagem) ? pv.voltagem.filter(Boolean).join(' / ') : pv.voltagem) : '',
      cRow('CPF / CNPJ', pv.cpf),
      cRow('Tel.', pv.tel),
      cRow('E-mail', pv.email),
      cRow('Endereço', endDisplay),
      ...payRows,
      pv.enderecoEntrega && pv.enderecoEntrega !== endDisplay
                       ? cRow('Endereço de entrega', pv.enderecoEntrega) : '',
      cRow('Contato responsável', pv.contatoEntrega),
      pv.dataPrevista  ? cRow('Prazo / Previsão', (pv.prazo ? pv.prazo + (pv.diasUteis===false?' dias':' dias úteis') + (pv.aContarDe ? ' a contar de ' + pv.aContarDe : '') + ' — ' : '') + pv.dataPrevista) : '',
      cRow('Treinamento', pv.treinamento),
    ]));
  } else {
    parts.push(sec('Pedido', [
      cRow('Equipamentos', (op.equipamentos||[op.equipamento||'—']).join(', ')),
      cRow('Contrato', op.numContrato||op.contrato),
    ]));
  }

  // Validação financeira
  if (sd.aguard_financeiro) {
    parts.push(sec('Validação Financeira', [
      cRow('Aprovação', sd.aguard_financeiro.descricao),
    ]));
  }

  // Logística — solicitação de NF
  if (sd.aguard_nf) {
    const d = sd.aguard_nf;
    parts.push(sec('Solicitação de NF (Logística)', [
      cRow('Endereço de entrega', d.enderecoEntrega),
      cRow('Técnico / Transportadora', d.tecnico),
      (d.volumes||d.peso) ? cRow('Vol / Peso', [d.volumes&&d.volumes+' vol', d.peso&&d.peso+' kg'].filter(Boolean).join(' · ')) : '',
      cRow('Obs.', d.descricao),
    ]));
  }

  // Emissão da NF
  if (sd.aguard_emissao) {
    const d = sd.aguard_emissao;
    parts.push(sec('Nota Fiscal Emitida', [
      cRow('Número NF', d.numeroNF),
      d.dataEmissao ? cRow('Data de emissão', fmtDate(d.dataEmissao)) : '',
      cRow('Obs.', d.descricao),
    ]));
  }

  // Re-emissão solicitada (logística rejeitou despacho)
  if (sd.aguard_despacho_reject) {
    const d = sd.aguard_despacho_reject;
    parts.push(`<div style="background:var(--red-bg);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px">
      <div class="ctx-sec-title" style="color:var(--red);border-color:rgba(220,38,38,.2)">Re-emissão Solicitada</div>
      ${d.motivoReemissao?`<div class="ctx-row">${cRow('Motivo',d.motivoReemissao)}</div>`:''}
      ${d.dadosCorrigidos?`<div class="ctx-row">${cRow('Dados corrigidos',d.dadosCorrigidos.replace(/\n/g,'<br>'))}</div>`:''}
    </div>`);
  }

  // Despacho confirmado
  if (sd.aguard_despacho) {
    parts.push(sec('Despacho Confirmado', [
      cRow('Confirmação', sd.aguard_despacho.descricao),
    ]));
  }

  // Arquivo da OP
  if (sd.aberta?.arquivoOP) {
    const arq = sd.aberta.arquivoOP;
    parts.push(`<div class="ctx-sec"><div class="ctx-sec-title">Arquivo da OP</div>
      <div style="padding:4px 0">${fileLinkHtml(arq, true)}</div>
    </div>`);
  }

  return parts.join('');
}

// MODALS

function openCard(opId) {
  const op   = ops.find(o => o.id === opId);
  if (!op) { showToast('OP não encontrada — recarregue', 'err'); return; }
  const view = getActiveView();
  const step = STEPS[op.status];
  const canAct = step?.owner === view?.role;
  canAct ? openActionModal(opId,'advance') : openInfoModal(opId);
}

function openActionModal(opId, mode) {
  activeOpId = opId; modalMode = mode; tempFiles = {}; tempFilesData = {};
  const op   = ops.find(o => o.id === opId);
  const step = STEPS[op.status];
  const fields = mode==='reject' ? (step.rejectFields||[]) : (step.formFields||[]);

  // Reset and pre-seed equipment list for aberta step
  if (op.status === 'aberta' && mode === 'advance') {
    tempEquipList = (op.equipamentos||[])
      .filter(e => e && e !== '—')
      .map(e => {
        const m = e.match(/^(.+)\s\(x(\d+)\)$/);
        return m ? { name: m[1], qty: parseInt(m[2]) } : { name: e, qty: 1 };
      });
  } else {
    tempEquipList = [];
  }

  const titles = { advance: step.actionLabel, reject: step.rejectLabel||'Bloquear OP' };
  const btnCls  = { advance: '', reject: ' red' };
  const btnLbl  = { advance: 'Confirmar →', reject: 'Bloquear' };

  // Algorithm note for "aberta" step
  let algoNote = '';
  if (op.status === 'aberta' && mode === 'advance') {
    algoNote = op.entrada === 'pendente'
      ? `<div class="warn-block" style="display:flex;align-items:flex-start;gap:8px">${icon('alert-triangle',15,'color:var(--orange);flex-shrink:0;margin-top:1px')}<span>Entrada <strong>pendente</strong> — esta OP irá para <strong>Validação Financeira</strong> antes de prosseguir.</span></div>`
      : `<div class="success-block" style="display:flex;align-items:flex-start;gap:8px">${icon('check-circle',15,'color:var(--green);flex-shrink:0;margin-top:1px')}<span>Entrada <strong>${op.entrada==='paga'?'paga':'não exigida'}</strong> — validação financeira será <strong>pulada</strong>. OP irá direto para Logística.</span></div>`;
  }

  const dirNote = '';

  // Rejection warning when aguard_emissao reopens after Logística rejection
  let rejectionNote = '';
  if (op.status === 'aguard_emissao' && op.stepData?.aguard_despacho_reject && mode === 'advance') {
    const rej = op.stepData.aguard_despacho_reject;
    rejectionNote = `
      <div style="background:var(--red-bg);border:1.5px solid rgba(220,38,38,.3);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px">
        <div style="font-size:11px;font-weight:700;color:var(--red);letter-spacing:.2px;display:flex;align-items:center;gap:6px">${icon('alert-triangle',14,'color:var(--red)')} RE-EMISSÃO SOLICITADA PELA LOGÍSTICA</div>
        ${rej.motivoReemissao ? `<div style="font-size:12px;color:var(--text);line-height:1.5"><strong>Motivo:</strong> ${rej.motivoReemissao}</div>` : ''}
        ${rej.dadosCorrigidos ? `<div style="font-size:12px;color:var(--text);line-height:1.5;padding:8px;background:rgba(0,0,0,.03);border-radius:6px;border:1px solid rgba(220,38,38,.15)"><strong>Dados corrigidos:</strong><br>${rej.dadosCorrigidos.replace(/\n/g,'<br>')}</div>` : ''}
        <div style="font-size:11px;color:var(--text3)">Os campos abaixo foram pré-preenchidos com os dados anteriores. Corrija conforme necessário e re-emita.</div>
      </div>`;
  }

  let fieldsHtml;
  if (op.status === 'aguard_emissao' && op.stepData?.aguard_despacho_reject && mode === 'advance') {
    const nfData = op.stepData.aguard_nf || {};
    const emData = op.stepData.aguard_emissao || {};
    const sh2 = l => `<div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--text3);border-top:1px solid var(--border);padding:8px 0 2px;margin-top:2px">${l}</div>`;
    fieldsHtml = `
      ${sh2('Dados de Despacho — verificar e corrigir')}
      <div class="form-group">
        <label class="form-label">Endereço de Entrega Completo *</label>
        <textarea class="form-textarea" id="f-reNF_enderecoEntrega" rows="2" placeholder="Rua, número, bairro, cidade/UF, CEP">${nfData.enderecoEntrega||''}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Motorista / Transportadora *</label>
        <input class="form-input" id="f-reNF_tecnico" placeholder="Ex: Alexandre - Expert - SHY8C17" value="${nfData.tecnico||''}">
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Nº de Volumes *</label>
          <input class="form-input" id="f-reNF_volumes" type="number" value="${nfData.volumes||''}"></div>
        <div class="form-group"><label class="form-label">Peso Total (kg) *</label>
          <input class="form-input" id="f-reNF_peso" type="number" value="${nfData.peso||''}"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Obs. do Despacho</label>
        <textarea class="form-textarea" id="f-reNF_descricao" rows="2">${nfData.descricao||''}</textarea>
      </div>
      ${sh2('Emissão da Nota Fiscal')}
      <div class="form-group">
        <label class="form-label">Número da NF *</label>
        <input class="form-input" id="f-numeroNF" value="${emData.numeroNF||''}">
      </div>
      <div class="form-group">
        <label class="form-label">Data de Emissão *</label>
        <input class="form-input" id="f-dataEmissao" type="date" value="${emData.dataEmissao||''}">
      </div>
      <div class="form-group">
        <label class="form-label">PDF da Nota Fiscal *</label>
        <label style="cursor:pointer">
          <input type="file" id="f-arquivoNF" accept=".pdf" style="display:none" onchange="handleFile(this)">
          <div class="file-upload-area" id="file-display-arquivoNF">
            <div class="file-upload-text" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon('upload',14)} ${emData.arquivoNF ? 'Anterior: '+(emData.arquivoNF?.name||emData.arquivoNF)+' — clique para substituir' : 'Clique para anexar o novo PDF da NF'}</div>
          </div>
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Observações *</label>
        <textarea class="form-textarea" id="f-descricao" rows="2" placeholder="Descreva as correções feitas na re-emissão...">${emData.descricao||''}</textarea>
      </div>`;
  } else if (op.status === 'aguard_despacho' && mode === 'advance') {
    // Despacho: só data + hora, sem anexo
    const nowDate = new Date().toISOString().split('T')[0];
    const nowTime = new Date().toTimeString().slice(0,5);
    fieldsHtml = `
      <div class="success-block" style="display:flex;align-items:flex-start;gap:8px;margin-bottom:4px">
        ${icon('check-circle',15,'color:var(--green);flex-shrink:0;margin-top:1px')}
        <span>Confirme os dados à esquerda e registre a data e hora do despacho.</span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Data do Despacho *</label>
          <input class="form-input" id="f-dataDespacho" type="date" value="${nowDate}">
        </div>
        <div class="form-group">
          <label class="form-label">Hora do Despacho *</label>
          <input class="form-input" id="f-horaDespacho" type="time" value="${nowTime}">
        </div>
      </div>`;
  } else {
    fieldsHtml = fields.map(f => buildFieldHtml(f)).join('');
  }

  document.getElementById('modal').classList.add('split');
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <div><div class="modal-title">${titles[mode]}</div><div class="modal-subtitle">OP ${op.numero} · ${op.cliente}</div></div>
      <button class="close-btn" onclick="closeModal()">${icon('x',14)}</button>
    </div>
    <div class="modal-split-body">
      <div class="split-pane split-pane-right">
        <div class="split-pane-header">Preencher agora</div>
        ${algoNote}${dirNote}${rejectionNote}${fieldsHtml}
      </div>
      <div class="split-pane split-pane-left">
        <div class="split-pane-left-header">
          <div style="font-size:13px;font-weight:700;margin-bottom:6px">${op.cliente}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
            <span class="badge ${stepBadge(op.status).cls}"><span class="badge-dot" style="background:currentColor"></span>${stepBadge(op.status).label}</span>
            ${op.status!=='entregue'?`<span class="sema ${semaforo(op).cls}">${semaforo(op).label}</span>`:''}
          </div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">${(op.equipamentos||[]).map(e=>`<span class="equip-chip" style="font-size:10px">${typeof e==='object'?e.name+(e.qty>1?' ×'+e.qty:''):e}</span>`).join('')}</div>
        </div>
        <div class="split-pane-left-scroll">
          ${buildInfoSections(op, op.id)}
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary${btnCls[mode]}" onclick="submitModal()">${btnLbl[mode]}</button>
    </div>`;

  document.getElementById('overlay').classList.add('open');

  // Força alturas via JS — CSS cascade no grid do overlay não é confiável
  requestAnimationFrame(() => {
    const modal  = document.getElementById('modal');
    if (!modal.classList.contains('split')) return;
    const hEl    = modal.querySelector('.modal-header');
    const fEl    = modal.querySelector('.modal-footer');
    const body   = modal.querySelector('.modal-split-body');
    const lhEl   = modal.querySelector('.split-pane-left-header');
    const scroll = modal.querySelector('.split-pane-left-scroll');
    if (!body) return;
    const maxH  = Math.min(window.innerHeight * 0.9, window.innerHeight - 40);
    const bodyH = maxH - (hEl?.offsetHeight || 0) - (fEl?.offsetHeight || 0);
    modal.style.height    = maxH + 'px';
    modal.style.maxHeight = maxH + 'px';
    body.style.height     = bodyH + 'px';
    // Seta a altura do scroll container explicitamente para garantir overflow-y
    if (scroll) {
      const scrollH = bodyH - (lhEl?.offsetHeight || 0);
      scroll.style.height    = scrollH + 'px';
      scroll.style.maxHeight = scrollH + 'px';
      scroll.style.overflowY = 'auto';
    }
  });
}

// Helper: constrói um accordion para o info modal
function infoAcc(title, iconName, contentHtml, open = false) {
  const arrowStyle = open ? 'rotate(0deg)' : 'rotate(-90deg)';
  return `<div class="acc">
    <div class="acc-head" onclick="toggleAccordion(this)" style="font-size:12px">
      <span style="display:flex;align-items:center;gap:7px">${icon(iconName,14,'color:var(--text3)')} ${title}</span>
      <span class="acc-arrow" style="transform:${arrowStyle}">${icon('chevron-down',14)}</span>
    </div>
    <div class="acc-body" ${open?'':'hidden'}>${contentHtml}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// SHARED INFO SECTIONS (accordion) — used by info modal & action modal left panel
// ═══════════════════════════════════════════════════════════════════

function buildInfoSections(op, opId) {
  const pv = op.pedidoVenda;
  const sd = op.stepData || {};
  const dItem = (label, val) => val
    ? `<div class="detail-item"><div class="detail-label">${label}</div><div class="detail-value" style="font-size:12px;font-weight:400">${val}</div></div>`
    : '';

  const sections = [];

  // ── PEDIDO DE VENDA ──────────────────────────────────────────────
  if (pv) {
    const equipLines = (pv.equipamentos||[]).map(e => {
      const lt = e.valorUnit ? ` — ${fmtBRL((parseInt(e.qty)||1)*(parseFloat(e.valorUnit)||0))}` : '';
      return `<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)">${e.name}${e.qty>1?' × '+e.qty:''}${lt}</div>`;
    }).join('') || `<div style="font-size:12px">${(op.equipamentos||[]).join(', ')}</div>`;
    const addrParts = [[pv.endRua, pv.endNumero].filter(Boolean).join(', '), pv.endBairro, [pv.endCidade,pv.endEstado].filter(Boolean).join('/'), pv.endCEP].filter(Boolean);
    const endDisplay = addrParts.length ? addrParts.join(', ') : (pv.enderecoCliente||'');

    let pvHtml = `
      <div class="detail-grid" style="margin-bottom:8px">
        ${dItem('Vendedor(a)', pv.vendedorCanal)}
        ${dItem('Data', pv.data)}
        ${dItem('Analista', pv.analista)}
        ${dItem('Contrato', pv.numContrato)}
      </div>
      <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--text3);margin-bottom:5px;letter-spacing:.6px">Equipamentos</div>
      <div style="margin-bottom:10px">${equipLines}</div>`;
    if (pv.valorLiquido || pv.valorTotal) {
      pvHtml += `<div class="detail-grid" style="margin-bottom:8px">
        ${pv.valorTotal && parseFloat(pv.valorTotal)>0 ? dItem('Valor Bruto', fmtBRL(pv.valorTotal)) : ''}
        ${pv.valorDesconto && parseFloat(pv.valorDesconto)>0 ? dItem('Desconto', '− '+fmtBRL(pv.valorDesconto)) : ''}
        ${pv.valorLiquido && parseFloat(pv.valorLiquido)>0 ? dItem('Valor Total', `<strong style="color:var(--green)">${fmtBRL(pv.valorLiquido)}</strong>`) : ''}
        ${pv.tipoContrato ? dItem('Tipo', pv.tipoContrato) : ''}
        ${pv.entrada && pv.entrada !== 'sem' && pv.valorEntrada && parseFloat(pv.valorEntrada) > 0 ? dItem('Entrada', fmtBRL(pv.valorEntrada)) : ''}
      </div>`;
    }
    if (pv.detalhesPagamento) pvHtml += `<div class="detail-item" style="grid-column:1/-1;margin-bottom:8px"><div class="detail-label">Pagamento</div><div class="detail-value" style="font-size:12px;font-weight:400;white-space:pre-line">${pv.detalhesPagamento}</div></div>`;
    pvHtml += `<div class="detail-grid">
      ${dItem('Cliente', `<strong>${pv.cliente||'—'}</strong>`)}
      ${dItem('CPF/CNPJ', pv.cpf)}
      ${dItem('Tel.', pv.tel)}
      ${dItem('E-mail', pv.email)}
      ${endDisplay ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">Endereço</div><div class="detail-value" style="font-size:12px;font-weight:400">${endDisplay}</div></div>` : ''}
      ${pv.enderecoEntrega && pv.enderecoEntrega !== endDisplay ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">Endereço de Entrega</div><div class="detail-value" style="font-size:12px;font-weight:400">${pv.enderecoEntrega}</div></div>` : ''}
      ${dItem('Prazo', pv.prazo ? pv.prazo+(pv.diasUteis===false?' dias':' dias úteis')+(pv.dataPrevista?' — '+pv.dataPrevista:'') : '')}
      ${dItem('Contato', pv.contatoEntrega)}
      ${dItem('Treinamento', pv.treinamento)}
      ${dItem('Voltagem', Array.isArray(pv.voltagem) ? pv.voltagem.filter(Boolean).join(' / ') : pv.voltagem)}
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn-primary" style="font-size:12px;padding:6px 14px;display:flex;align-items:center;gap:5px" onclick="printPedidoVenda(${opId})">${icon('printer',13,'color:#fff')} Baixar Pedido de Venda</button>
      ${sd.aberta?.arquivoOP && sd.aberta.arquivoOP.dataUrl ? `
        <a href="${sd.aberta.arquivoOP.dataUrl}" download="${(sd.aberta.arquivoOP.name||'arquivo_op').replace(/"/g,'')}"
          style="display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:6px 14px;
            border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
            color:var(--text);text-decoration:none;cursor:pointer"
          onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          ${icon('download',13,'color:var(--text2)')} Baixar Arquivo da OP
        </a>` : sd.aberta?.arquivoOP ? fileLinkHtml(sd.aberta.arquivoOP, true) : ''}
    </div>
    ${sd.aberta?.comprovanteEntrada?.length ? `
      <div style="margin-top:10px">
        <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--text3);letter-spacing:.5px;margin-bottom:5px">Comprovante da Entrada</div>
        ${fileLinksHtml(sd.aberta.comprovanteEntrada)}
      </div>` : ''}`;
    sections.push(infoAcc('Pedido de Venda', 'file-text', pvHtml, true));
  } else {
    sections.push(infoAcc('Pedido', 'clipboard-list', `<div class="detail-grid">
      ${dItem('Equipamentos', (op.equipamentos||[op.equipamento||'—']).join(', '))}
      ${dItem('Contrato', op.numContrato||op.contrato)}
      ${dItem('Vendedor', op.vendedorCanal||op.vendedorName)}
    </div>`, true));
  }

  // ── FINANCEIRO ───────────────────────────────────────────────────
  if (sd.aguard_financeiro || sd.aguard_financeiro_reject || op.boletoTask) {
    const df = sd.aguard_financeiro || {};
    const dr = sd.aguard_financeiro_reject || {};
    const bt = op.boletoTask;
    let finHtml = '';

    if (sd.aguard_financeiro || sd.aguard_financeiro_reject) {
      finHtml += `<div class="detail-grid">
        ${dItem('Confirmação', df.descricao)}
        ${dr.descricao ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label" style="color:var(--red)">Motivo do Bloqueio</div><div class="detail-value" style="font-size:12px;font-weight:400">${dr.descricao}</div></div>` : ''}
      </div>`;
      if (df.anexo?.length) finHtml += `<div style="margin-top:8px">${fileLinksHtml(df.anexo)}</div>`;
    }

    if (bt) {
      const boletoStatus = bt.status === 'concluida'
        ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--green);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.25);padding:1px 7px;border-radius:20px">${icon('check',10,'color:var(--green)')} Enviado</span>`
        : `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--yellow);background:var(--yellow-bg);border:1px solid rgba(202,138,4,.25);padding:1px 7px;border-radius:20px">Pendente</span>`;
      finHtml += `<div style="margin-top:${finHtml?'12':'0'}px;padding-top:${finHtml?'10':'0'}px;${finHtml?'border-top:1px solid var(--border)':''}">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
          <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--text3);letter-spacing:.5px">Envio de Boleto</div>
          ${boletoStatus}
        </div>
        ${bt.email ? `<div style="font-size:11px;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:5px">${icon('mail',11,'color:var(--text3)')} ${bt.email}</div>` : ''}
        ${bt.tsEnvio ? `<div style="font-size:10px;color:var(--text3);margin-bottom:6px">${bt.tsEnvio}</div>` : ''}
        ${bt.arquivos?.length ? fileLinksHtml(bt.arquivos) : ''}
      </div>`;
    }

    sections.push(infoAcc('Financeiro', 'check-circle', finHtml));
  }

  // ── DADOS DE ENTREGA ─────────────────────────────────────────────
  if (sd.aguard_nf) {
    const d = sd.aguard_nf;
    const nsRows = (() => {
      if (d.numSeries?.length) return d.numSeries.map((ns, i) => {
        if (!ns) return '';
        const tipo = d.trackingTypes?.[i] === 'lote' ? `Lote ${i+1}` : `Nº Série ${i+1}`;
        return dItem(tipo, ns);
      }).join('');
      return d.numSerie ? dItem('Nº de Série', d.numSerie) : '';
    })();
    let entHtml = `<div class="detail-grid">
      ${d.enderecoEntrega ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">${icon('map-pin',10,'color:var(--text3)')} Endereço</div><div class="detail-value" style="font-size:12px;font-weight:400">${d.enderecoEntrega}</div></div>` : ''}
      ${dItem('Motorista / Transportadora', d.tecnico)}
      ${d.volumes||d.peso ? dItem('Vol / Peso', [d.volumes&&d.volumes+' vol', d.peso&&d.peso+' kg'].filter(Boolean).join(' · ')) : ''}
      ${nsRows}
      ${dItem('Observações', d.descricao)}
    </div>`;
    if (sd.aguard_despacho) {
      const dd = sd.aguard_despacho;
      entHtml += `<div class="success-block" style="margin-top:8px;display:flex;align-items:center;gap:8px">
        ${icon('truck',14,'color:var(--green)')}
        <span><strong>Despachado</strong> em ${dd.dataDespacho ? fmtDate(dd.dataDespacho) : ''}${dd.horaDespacho ? ' às '+dd.horaDespacho : ''}</span>
      </div>`;
    }
    if (sd.aguard_despacho_reject) {
      const dr = sd.aguard_despacho_reject;
      entHtml += `<div style="background:var(--red-bg);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius);padding:8px;margin-top:8px">
        <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--red);margin-bottom:5px">Re-emissão Solicitada</div>
        ${dr.motivoReemissao?`<div style="font-size:11px;margin-bottom:4px"><strong>Motivo:</strong> ${dr.motivoReemissao}</div>`:''}
        ${dr.dadosCorrigidos?`<div style="font-size:11px"><strong>Dados corrigidos:</strong> ${dr.dadosCorrigidos.replace(/\n/g,'<br>')}</div>`:''}
      </div>`;
    }
    sections.push(infoAcc('Dados de Entrega', 'truck', entHtml));
  }

  // ── NOTA FISCAL ──────────────────────────────────────────────────
  if (sd.aguard_emissao) {
    const d = sd.aguard_emissao;
    let nfeHtml = `<div class="detail-grid">
      ${dItem('Número NF', d.numeroNF)}
      ${d.dataEmissao ? dItem('Data de Emissão', fmtDate(d.dataEmissao)) : ''}
      ${dItem('Observações', d.descricao)}
    </div>`;
    // Normaliza arquivoNF: pode ser array (multi-file), objeto único ou string legada
    const nfFiles = d.arquivoNF
      ? (Array.isArray(d.arquivoNF) ? d.arquivoNF : [d.arquivoNF])
      : [];
    if (nfFiles.length) nfeHtml += `<div style="margin-top:8px">${fileLinksHtml(nfFiles)}</div>`;
    sections.push(infoAcc('Nota Fiscal', 'file-text', nfeHtml));
  }

  // ── CONFIRMAÇÃO DE ENTREGA ────────────────────────────────────────
  if (sd.transito || op.status === 'entregue') {
    const d = sd.transito || {};

    // Badge de prazo: compara data de entrega real com a prevista
    let prazoBadge = '';
    if (d.dataEntrega && op.pedidoVenda?.dataPrevista) {
      const entregaDate = new Date(d.dataEntrega + 'T12:00:00');
      const prevDate    = parseBRDate(op.pedidoVenda.dataPrevista);
      if (prevDate) {
        const diasDiff = Math.ceil((entregaDate - prevDate) / 86400000);
        prazoBadge = diasDiff <= 0
          ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--green);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.3);padding:1px 7px;border-radius:20px;margin-left:6px">${icon('check',10,'color:var(--green)')} No prazo</span>`
          : `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--red);background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.28);padding:1px 7px;border-radius:20px;margin-left:6px">${icon('alert-triangle',10,'color:var(--red)')} Atrasada ${diasDiff}d</span>`;
      }
    }

    let confHtml = `<div class="detail-grid">
      ${d.dataEntrega ? `<div class="detail-item"><div class="detail-label">Data de Entrega</div><div class="detail-value" style="font-size:12px;font-weight:400;display:flex;align-items:center;flex-wrap:wrap;gap:2px">${fmtDate(d.dataEntrega)}${prazoBadge}</div></div>` : ''}
      ${dItem('Observações', d.descricao)}
    </div>`;

    if (d.motivoAtraso) {
      confHtml += `<div style="margin-top:8px;padding:8px 11px;border:1px solid rgba(220,38,38,.22);border-radius:var(--radius);background:rgba(220,38,38,.04)">
        <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--red);letter-spacing:.5px;margin-bottom:4px">Motivo do Atraso</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5">${d.motivoAtraso}</div>
      </div>`;
    }

    if (d.fotos?.length) {
      confHtml += `<div style="margin-top:8px">${fileLinksHtml(d.fotos)}</div>`;
    } else if (op.status === 'entregue') {
      confHtml += `<div style="margin-top:8px;display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);font-style:italic">
        ${icon('image',11,'color:var(--text3)')} Nenhuma foto anexada
      </div>`;
    }
    sections.push(infoAcc('Confirmação de Entrega', 'package', confHtml, op.status === 'entregue'));
  }

  // ── HISTÓRICO ────────────────────────────────────────────────────
  const histHtml = op.history.length
    ? op.history.map(h => {
        const acao = h.action || (() => {
          const isReject = h.note && (h.note.startsWith('Bloqueado') || h.note.startsWith('Solicitar Re'));
          return isReject
            ? (HIST_REJECT[h.step] || 'Bloqueado')
            : (HIST_ACTION[h.step] || 'Ação');
        })();
        return `<div class="history-item"><div class="history-ts">${h.ts}</div><div class="history-text"><span class="history-author">${h.actorName||h.actor}</span> — ${acao}</div></div>`;
      }).join('')
    : `<div style="font-size:12px;color:var(--text3)">Nenhum evento registrado.</div>`;
  sections.push(infoAcc('Histórico', 'clock', `<div style="display:flex;flex-direction:column;gap:10px">${histHtml}</div>`));

  return sections.join('');
}
function openInfoModal(opId) {
  const op    = ops.find(o => o.id === opId);
  const badge = stepBadge(op.status);
  const sem   = semaforo(op);
  const pv    = op.pedidoVenda;
  const sd    = op.stepData || {};
  const dItem = (label, val) => val
    ? `<div class="detail-item"><div class="detail-label">${label}</div><div class="detail-value" style="font-size:12px;font-weight:400">${val}</div></div>`
    : '';

  const sectionsHtml = buildInfoSections(op, opId);






























































































































  // ── STATUS HEADER ─────────────────────────────────────────────────
  const equipList = (op.equipamentos||[op.equipamento]).map(e => `<span class="equip-chip">${e}</span>`).join('');
  const statusHeader = `
    <div class="op-info-block" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap">
        <span class="badge ${badge.cls}"><span class="badge-dot" style="background:currentColor"></span>${badge.label}</span>
        ${op.status!=='entregue'?`<span class="sema ${sem.cls}">${sem.label}</span>`:''}
        ${op.status==='entregue'?`<span style="display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;color:var(--green);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.25);padding:1px 7px;border-radius:20px">${icon('check-circle',10,'color:var(--green)')} Concluída</span>`:''}
      </div>
      <div class="op-info-meta">
        <span>${op.vendedorCanal||op.vendedorName||'—'}</span><span>${op.numContrato||op.contrato||''}</span>
        <span>${daysSince(op.dataAbertura)}d</span>
      </div>
      <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">${equipList}</div>
    </div>`;

  const activeView = getActiveView();
  const canAnexarFotos  = activeView?.role === 'logistica'  && !!sd.transito;

  const anexarBoletoBtn = '';

  const anexarFotosBtn = canAnexarFotos
    ? `<button class="btn-action" onclick="openAnexarFotos(${opId})" style="display:inline-flex;align-items:center;gap:6px">
        ${icon('image',13)} Anexar Fotos
       </button>` : '';

  document.getElementById('modal').classList.add('wide');
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <div><div class="modal-title">OP ${op.numero}</div><div class="modal-subtitle">${op.cliente}</div></div>
      <button class="close-btn" onclick="closeModal()">${icon('x',14)}</button>
    </div>
    <div class="modal-body" style="gap:0;padding:16px 22px">
      ${statusHeader}
      <div style="display:flex;flex-direction:column;gap:6px">${sectionsHtml}</div>
    <div class="modal-footer">${anexarBoletoBtn}${anexarFotosBtn}<button class="btn-cancel" onclick="closeModal()">Fechar</button></div>`;

  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('wide', 'split');
  activeOpId = null; modalMode = null; tempEquipList = []; tempVoltagemList = ['']; tempFiles = {}; tempFilesData = {};
  _pendingAdvance = null; // garante que delay modal não vaza entre opens
}

// ─── ANEXAR BOLETO AVULSO (financeiro, qualquer hora) ───────────────
function openAnexarBoleto(opId) {
  tempFiles     = {};
  tempFilesData = {};
  activeOpId    = opId;

  const op  = ops.find(o => o.id === opId);
  const cur = (op?.stepData?.aguard_financeiro?.boleto || []).length;

  document.getElementById('modal').classList.remove('wide', 'split');
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <div><div class="modal-title">Anexar Boleto</div>
           <div class="modal-subtitle">OP ${op.numero} · ${op.cliente}</div></div>
      <button class="close-btn" onclick="openInfoModal(${opId})">${icon('x',14)}</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px">
        ${cur > 0 ? `Já ${cur} boleto${cur>1?'s':''} anexado${cur>1?'s':''}. Novos arquivos serão adicionados.` : 'Nenhum boleto anexado ainda.'}
      </div>
      ${buildFieldHtml({ key:'boleto_avulso', label:'Boleto(s)', type:'multi-file', accept:'.pdf,.png,.jpg,.jpeg' })}
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="openInfoModal(${opId})">Cancelar</button>
      <button class="btn-primary" onclick="saveAnexarBoleto(${opId})">${icon('paperclip',13)} Salvar Boleto</button>
    </div>`;

  document.getElementById('overlay').classList.add('open');
}

function saveAnexarBoleto(opId) {
  const op      = ops.find(o => o.id === opId);
  const novos   = tempFilesData['boleto_avulso'] || [];
  if (!novos.length) { showToast('Selecione ao menos um arquivo', 'err'); return; }

  if (!op.stepData) op.stepData = {};
  if (!op.stepData.aguard_financeiro) op.stepData.aguard_financeiro = {};
  const existentes = op.stepData.aguard_financeiro.boleto || [];
  op.stepData.aguard_financeiro.boleto = [...existentes, ...novos];

  dbSaveOp(op);
  showToast(`${novos.length} comprovante${novos.length>1?'s':''} anexado${novos.length>1?'s':''}!`, 'ok');
  openInfoModal(opId); // volta para o painel de info com os arquivos atualizados
}

// ─── ANEXAR FOTOS AVULSAS (logística, qualquer hora após transito) ──
function openAnexarFotos(opId) {
  tempFiles     = {};
  tempFilesData = {};
  activeOpId    = opId;

  const op  = ops.find(o => o.id === opId);
  const cur = (op?.stepData?.transito?.fotos || []).length;

  document.getElementById('modal').classList.remove('wide', 'split');
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <div><div class="modal-title">Anexar Fotos de Entrega</div>
           <div class="modal-subtitle">OP ${op.numero} · ${op.cliente}</div></div>
      <button class="close-btn" onclick="openInfoModal(${opId})">${icon('x',14)}</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px">
        ${cur > 0 ? `Já ${cur} foto${cur>1?'s':''} anexada${cur>1?'s':''}. Novas serão adicionadas às existentes.` : 'Nenhuma foto de entrega anexada ainda.'}
      </div>
      ${buildFieldHtml({ key:'fotos_avulsas', label:'Fotos / Comprovante de Entrega', type:'multi-file', accept:'image/*,.pdf' })}
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="openInfoModal(${opId})">Cancelar</button>
      <button class="btn-primary" onclick="saveAnexarFotos(${opId})">${icon('image',13)} Salvar Fotos</button>
    </div>`;

  document.getElementById('overlay').classList.add('open');
}

function saveAnexarFotos(opId) {
  const op    = ops.find(o => o.id === opId);
  const novas = tempFilesData['fotos_avulsas'] || [];
  if (!novas.length) { showToast('Selecione ao menos uma foto ou arquivo', 'err'); return; }

  if (!op.stepData) op.stepData = {};
  if (!op.stepData.transito) op.stepData.transito = {};
  const existentes = op.stepData.transito.fotos || [];
  op.stepData.transito.fotos = [...existentes, ...novas];

  dbSaveOp(op);
  showToast(`${novas.length} foto${novas.length>1?'s':''} anexada${novas.length>1?'s':''}!`, 'ok');
  openInfoModal(opId);
}

// ─── TAREFA PARALELA: ENVIO DE BOLETO AO CLIENTE ────────────────────
function boletoTaskCard(op) {
  const nf        = op.stepData?.aguard_emissao?.numeroNF || '—';
  const nfDate    = op.stepData?.aguard_emissao?.dataEmissao || '';
  const sem       = semaforo(op);
  const equipList = op.equipamentos?.length
    ? op.equipamentos.map(e => `<span class="equip-chip">${e}</span>`).join('')
    : `<span class="equip-chip">${op.equipamento || '—'}</span>`;
  const lastEvt   = op.history?.[op.history.length - 1];
  const opNum     = op.numero && op.numero !== 'PENDENTE' ? op.numero : '#' + op.id;

  return `
  <div class="card actionable" onclick="openBoletoTask(${op.id})">
    <div class="card-top">
      <div>
        <div class="card-op">OP ${opNum}</div>
        <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${fmtDate(op.dataAbertura)} · ${op.vendedorCanal||op.vendedorName||''}</div>
      </div>
    </div>
    <div class="card-client">${op.cliente}</div>
    <div class="equip-chips">${equipList}</div>
    <div class="card-meta">
      <span class="sema ${sem.cls}">${sem.label}</span>
    </div>
    <div style="margin-top:6px;font-size:11px;display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:5px">
      ${icon('file-text',11,'color:var(--accent)')}
      <span style="color:var(--text3)">NF</span>
      <span style="font-family:'DM Mono',monospace">${nf}</span>
      ${nfDate ? `<span style="color:var(--text3)">·</span><span style="color:var(--text3)">${nfDate}</span>` : ''}
    </div>
    ${lastEvt ? `<div class="card-last-event"><span style="color:var(--text2)">${lastEvt.actorName}:</span> ${(lastEvt.action||lastEvt.note||'').substring(0,80)}</div>` : ''}
    <div class="card-footer">
      <button class="btn-action" onclick="event.stopPropagation();openBoletoTask(${op.id})" style="display:inline-flex;align-items:center;gap:5px">
        ${icon('send',12)} Enviar Boleto
      </button>
    </div>
  </div>`;
}

function saveBoletoTask(opId) {
  const op       = ops.find(o => o.id === opId);
  if (!op) return;
  const email    = document.getElementById('boleto-email')?.value?.trim() || '';
  const msgEl    = document.getElementById('boleto-template');
  const mensagem = msgEl ? msgEl.innerText.trim() : '';
  const arquivos = tempFilesData['boleto-task'] || [];

  if (!email || !email.includes('@')) {
    const el = document.getElementById('boleto-email');
    if (el) { el.style.borderColor='var(--red)'; el.focus(); setTimeout(()=>el.style.borderColor='',2500); }
    showToast('Informe um e-mail válido para o envio', 'err');
    return;
  }
  if (!arquivos.length) { showToast('Anexe ao menos um boleto antes de confirmar', 'err'); return; }

  if (!op.boletoTask) op.boletoTask = { status: 'pendente', arquivos: [] };
  op.boletoTask.status   = 'concluida';
  op.boletoTask.email    = email;
  op.boletoTask.mensagem = mensagem;
  op.boletoTask.arquivos = arquivos;
  op.boletoTask.tsEnvio  = nowTs();

  dbSaveOp(op);
  closeModal();
  renderAll();
  showToast(`Boleto(s) registrado(s) — ${op.cliente}`, 'ok');
}

// ─── POPUP DE MOTIVO DE ATRASO ──────────────────────────────────────
function showDelayModal(opId, formData, diasAtraso, dataPrevistaFmt) {
  _pendingAdvance = { opId, formData };
  document.getElementById('modal').classList.remove('wide', 'split');
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <div>
        <div class="modal-title" style="color:var(--orange);display:flex;align-items:center;gap:7px">
          ${icon('alert-triangle',15,'color:var(--orange)')} Entrega com Atraso
        </div>
        <div class="modal-subtitle">Prazo: ${dataPrevistaFmt} · <strong style="color:var(--red)">${diasAtraso} dia(s) de atraso</strong></div>
      </div>
    </div>
    <div class="modal-body" style="padding:14px 20px;gap:8px">
      <div class="form-group" style="margin:0">
        <label class="form-label">Motivo do Atraso *</label>
        <textarea class="form-textarea" id="delay-reason-input" rows="2"
          style="margin-top:4px"
          placeholder="Ex: Problema na transportadora, cliente solicitou reagendamento…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cancelDelay()">Cancelar</button>
      <button class="btn-primary" style="background:var(--orange)" onclick="confirmDelay()">Confirmar Entrega</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('delay-reason-input')?.focus(), 80);
}

function confirmDelay() {
  const reason = document.getElementById('delay-reason-input')?.value?.trim();
  if (!reason) { showToast('Informe o motivo do atraso', 'err'); return; }
  if (!_pendingAdvance) { showToast('Sessão expirada — tente novamente', 'err'); closeModal(); return; }
  // Proteção duplo clique: zera _pendingAdvance antes de processar
  const { opId, formData } = pending;
  formData.motivoAtraso = reason;
  formData.descricao = (formData.descricao ? formData.descricao + '\n' : '') + '[Atraso] ' + reason;
  // Registra no histórico como ação extra
  const op = ops.find(o => o.id === opId);
  if (op) {
    const user = getUser();
    op.history.push({ step: op.status, actor: getActiveView()?.role || 'logistica', actorName: user?.userName || user?.name || '', ts: nowTs(), action: 'Atraso: ' + reason, note: reason });
  }
  advanceOP(opId, formData);
  closeModal();
}

function cancelDelay() {
  _pendingAdvance = null;
  closeModal();
}

function submitModal() {
  if (!activeOpId || !modalMode) return;
  const op = ops.find(o => o.id === activeOpId);
  if (!op) { showToast('OP não encontrada — recarregue a página', 'err'); closeModal(); return; }
  const step = STEPS[op.status];
  if (!step) { showToast('Estado inválido da OP', 'err'); closeModal(); return; }

  // Caso especial: Confirmar e Despachar (aguard_despacho → transito)
  if (op.status === 'aguard_despacho' && modalMode === 'advance') {
    const dataD = document.getElementById('f-dataDespacho')?.value;
    const horaD = document.getElementById('f-horaDespacho')?.value;
    if (!dataD || !horaD) { showToast('Preencha data e hora do despacho', 'err'); return; }
    const descDespacho = `Despachado em ${fmtDate(dataD)} às ${horaD}`;
    advanceOP(activeOpId, { dataDespacho: dataD, horaDespacho: horaD, descricao: descDespacho });
    closeModal(); return;
  }

  // Re-emission: combined aguard_nf + aguard_emissao form
  if (op.status === 'aguard_emissao' && op.stepData?.aguard_despacho_reject && modalMode === 'advance') {
    const err = id => { const e = document.getElementById(id); if(e){e.style.borderColor='var(--red)';e.style.boxShadow='0 0 0 3px rgba(220,38,38,.12)';e.focus();} };
    const addr  = document.getElementById('f-reNF_enderecoEntrega')?.value?.trim();
    const tec   = document.getElementById('f-reNF_tecnico')?.value?.trim();
    const numNF = document.getElementById('f-numeroNF')?.value?.trim();
    const dtNF  = document.getElementById('f-dataEmissao')?.value;
    const descNF= document.getElementById('f-descricao')?.value?.trim();
    if (!addr)  { err('f-reNF_enderecoEntrega'); return; }
    if (!tec)   { err('f-reNF_tecnico');         return; }
    if (!numNF) { err('f-numeroNF');              return; }
    if (!dtNF)  { err('f-dataEmissao');           return; }
    if (!descNF){ err('f-descricao');             return; }
    op.stepData.aguard_nf = {
      enderecoEntrega: addr,
      tecnico: tec,
      volumes: document.getElementById('f-reNF_volumes')?.value || '',
      peso:    document.getElementById('f-reNF_peso')?.value    || '',
      descricao: document.getElementById('f-reNF_descricao')?.value?.trim() || '',
    };
    // Normaliza para array (igual ao multi-file do passo normal)
    const rawFileNF = tempFilesData['arquivoNF'] || null;
    const prevNF    = op.stepData.aguard_emissao?.arquivoNF;
    const prevArr   = prevNF ? (Array.isArray(prevNF) ? prevNF : [prevNF]) : [];
    // Se anexou novo arquivo, substitui; caso contrário mantém o anterior
    const fileNF    = rawFileNF ? [rawFileNF] : prevArr;
    advanceOP(activeOpId, { numeroNF: numNF, dataEmissao: dtNF, arquivoNF: fileNF, descricao: descNF });
    closeModal(); return;
  }

  const fields = modalMode==='reject' ? (step.rejectFields||[]) : (step.formFields||[]);
  const formData = {};

  for (const f of fields) {
    if (f.type === 'equipment-list') {
      if (f.required && !tempEquipList.length) {
        const el = document.getElementById('equip-list-items');
        if (el) el.style.outline = '2px solid var(--red)';
        return;
      }
      formData.equipamentos = [...tempEquipList];
      continue;
    }
    if (f.type === 'multi-file') {
      const mfFiles = tempFilesData[f.key] || [];
      if (f.required && !mfFiles.length) {
        const el = document.getElementById('mfl-' + f.key);
        if (el) { el.style.outline='2px solid var(--red)'; el.style.borderRadius='6px'; setTimeout(()=>{ el.style.outline=''; },2500); }
        showToast(`Obrigatório: ${f.label.replace(' *','')}`, 'err');
        return;
      }
      formData[f.key] = mfFiles;
      continue;
    }
    if (f.type === 'file') {
      formData[f.key] = tempFilesData[f.key] || null;
      continue;
    }
    if (f.type === 'cep-lookup') continue; // CEP é auxiliar, não salva
    if (f.type === 'ns-equipamentos') {
      const series = [], types = [];
      let i = 0;
      while (document.getElementById(`f-numSerie_${i}`)) {
        const el = document.getElementById(`f-numSerie_${i}`);
        series.push(el.value.trim());
        types.push(el.dataset.tracking || 'serie');
        i++;
      }
      formData.numSeries       = series;
      formData.trackingTypes   = types;
      continue;
    }
    const el  = document.getElementById('f-' + f.key);
    const val = el?.value?.trim();
    if (f.required && !val) { el.style.borderColor='var(--red)'; el.style.boxShadow='0 0 0 3px rgba(220,38,38,.12)'; el.focus(); return; }
    formData[f.key] = val || '';
  }

  if (modalMode === 'reject') {
    rejectOP(activeOpId, formData);
    closeModal();
  } else {
    // Verifica atraso na entrega (transito → entregue)
    const _opChk = ops.find(o => o.id === activeOpId);
    if (_opChk?.status === 'transito' && formData.dataEntrega && _opChk.pedidoVenda?.dataPrevista) {
      const entregaDate = new Date(formData.dataEntrega + 'T12:00:00');
      const prevDate    = parseBRDate(_opChk.pedidoVenda.dataPrevista);
      if (prevDate && entregaDate > prevDate) {
        const dias = Math.ceil((entregaDate - prevDate) / 86400000);
        showDelayModal(activeOpId, formData, dias, _opChk.pedidoVenda.dataPrevista);
        return; // aguarda confirmação no popup
      }
    }
    advanceOP(activeOpId, formData);
    closeModal();
  }
}

// ─── LIGHTBOX — imagens e PDFs ──────────────────────────────────────
function showLightbox(src, name) {
  const isPdf = /\.pdf$/i.test(name || '') || src.startsWith('data:application/pdf');
  let lb = document.getElementById('img-lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'img-lightbox';
    lb.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px';
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.style.display = 'none'; });
    document.body.appendChild(lb);
  }
  // Botão fechar sempre visível (essencial para PDF onde clicar no iframe não fecha)
  const closeBtn = `<button onclick="document.getElementById('img-lightbox').style.display='none'"
    style="position:absolute;top:14px;right:18px;background:rgba(255,255,255,.15);border:none;color:#fff;
      border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;line-height:1;
      display:flex;align-items:center;justify-content:center">×</button>`;

  if (isPdf) {
    lb.onclick = null; // iframe consome o clique — usa só o botão X e o Esc
    lb.innerHTML = `
      ${closeBtn}
      <div style="color:#fff;font-size:11px;font-family:'DM Mono',monospace;margin-bottom:10px;opacity:.65">${name}</div>
      <iframe src="${src}" style="width:min(960px,95vw);height:calc(100vh - 130px);border:none;border-radius:6px;background:#fff"></iframe>`;
  } else {
    lb.onclick = () => { lb.style.display = 'none'; };
    lb.innerHTML = `
      ${closeBtn}
      <div style="color:#fff;font-size:11px;font-family:'DM Mono',monospace;margin-bottom:10px;opacity:.65">${name}</div>
      <img src="${src}" alt="${name}" style="max-width:100%;max-height:calc(100vh - 120px);border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.6);cursor:zoom-out" onclick="document.getElementById('img-lightbox').style.display='none'">
      <div style="color:#fff;font-size:10px;margin-top:10px;opacity:.45">Clique na imagem ou Esc para fechar</div>`;
  }
  lb.style.display = 'flex';
}

// ─── RASCUNHO AUTOMÁTICO DO FORMULÁRIO NOVA OP ──────────────────────
const DRAFT_KEY = 'contourline_novaop_draft';
const DRAFT_TEXT_IDS = [
  'nova-vendedorCanal','nova-data','nova-analista','nova-numContrato',
  'nova-cliente','nova-dn','nova-cpf','nova-rg','nova-email','nova-profissao',
  'nova-numDocumento','nova-endRua','nova-endNumero','nova-endBairro',
  'nova-endCidade','nova-cep-cliente','nova-tel','nova-tipoContrato',
  'nova-detalhesPagamento','nova-simulador','nova-entrada','nova-valorEntrada',
  'nova-enderecoEntrega','nova-contatoEntrega','nova-prazo','nova-aContarDe',
  'nova-treinamento','nova-descricao',
];

function saveDraft() {
  const g = id => document.getElementById(id);
  const draft = {
    ts: Date.now(),
    fields: {},
    equips: tempEquipList.map(e => ({ ...e })),
    voltagens: [...tempVoltagemList],
  };
  DRAFT_TEXT_IDS.forEach(id => {
    const el = g(id);
    if (el) draft.fields[id] = el.value;
  });
  draft.fields['nova-same-address'] = g('nova-same-address')?.checked ?? false;
  draft.fields['nova-diasUteis']    = g('nova-diasUteis')?.checked ?? true;
  draft.fields['nova-endEstado']    = g('nova-endEstado')?.value || '';
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch {}
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return false;
    const draft = JSON.parse(raw);
    if (!draft?.fields) return false;
    const g = id => document.getElementById(id);
    DRAFT_TEXT_IDS.forEach(id => {
      const el = g(id);
      if (el && draft.fields[id] !== undefined) el.value = draft.fields[id];
    });
    const sameAddr = g('nova-same-address');
    if (sameAddr) { sameAddr.checked = draft.fields['nova-same-address'] || false; toggleSameAddress(sameAddr.checked); }
    const diasUteis = g('nova-diasUteis');
    if (diasUteis) diasUteis.checked = draft.fields['nova-diasUteis'] ?? true;
    const estado = g('nova-endEstado');
    if (estado && draft.fields['nova-endEstado']) estado.value = draft.fields['nova-endEstado'];
    if (draft.equips?.length)    { tempEquipList = draft.equips;       refreshEquipList();      }
    if (draft.voltagens?.length) { tempVoltagemList = draft.voltagens; renderVoltagemFields();  }
    calcDataPrevista();
    calcDescontoTotal();
    updateEntradaHint(g('nova-entrada')?.value || 'sem');
    return draft.ts;
  } catch { return false; }
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch {}
}

function openNovaOP() {
  tempEquipList    = [];
  tempVoltagemList = [''];
  const todayISO = new Date().toISOString().split('T')[0];

// Calcula a Páscoa pelo algoritmo de Meeus/Jones/Butcher
function calcEaster(year) {
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day   = ((h+l-7*m+114) % 31) + 1;
  return new Date(year, month-1, day, 12);
}

// Retorna true se a data for feriado nacional brasileiro
function isBrHoliday(d) {
  const m = d.getMonth()+1, day = d.getDate(), year = d.getFullYear();
  // Feriados fixos: [mês, dia]
  const fixed = [[1,1],[4,21],[5,1],[9,7],[10,12],[11,2],[11,15],[12,25]];
  if (fixed.some(([fm,fd]) => m===fm && day===fd)) return true;
  // Feriados móveis (relativos à Páscoa)
  const easter = calcEaster(year);
  const diff   = Math.round((new Date(year,m-1,day,12)-easter) / 86400000);
  // Carnaval seg (-48), Carnaval ter (-47), Sexta-feira Santa (-2), Corpus Christi (+60)
  return diff===-48 || diff===-47 || diff===-2 || diff===60;
}

function calcDataPrevista() {
  const prazo = parseInt(document.getElementById('nova-prazo')?.value);
  const aContarDe = document.getElementById('nova-aContarDe')?.value;
  const diasUteis = document.getElementById('nova-diasUteis')?.checked !== false;
  const el = document.getElementById('nova-data-prevista');
  if (!el) return;
  if (!prazo || prazo <= 0) { el.textContent = '—'; return; }
  const d = aContarDe ? new Date(aContarDe + 'T12:00:00') : new Date();
  if (diasUteis) {
    let dias = 0;
    while (dias < prazo) {
      d.setDate(d.getDate() + 1);
      const dow = d.getDay();
      // Pula fins de semana e feriados nacionais
      if (dow !== 0 && dow !== 6 && !isBrHoliday(d)) dias++;
    }
  } else {
    d.setDate(d.getDate() + prazo);
  }
  el.textContent = d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function validateEmailField(input) {
  input.value = input.value.trim().toLowerCase().replace(/\s/g, '');
  const val = input.value;
  if (!val) return;
  const ok = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}(\.[a-zA-Z]{2,})?$/.test(val);
  if (!ok) {
    input.style.outline = '2px solid var(--red)';
    input.style.borderColor = 'var(--red)';
    showToast('E-mail pode estar inválido — verifique o formato', 'err');
    setTimeout(() => { input.style.outline = ''; input.style.borderColor = ''; }, 2500);
  }
}

function toggleSameAddress(checked) {

    const estado = document.getElementById('nova-endEstado')?.value || '';

function clearClientFields() {
  ['nova-cliente','nova-endRua','nova-endNumero','nova-endBairro','nova-endCidade',
   'nova-cep-cliente','nova-tel','nova-email','nova-rg'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const estEl = document.getElementById('nova-endEstado');
  if (estEl) estEl.value = '';
}

function fillClientFromProtheus(d) {
  // Sempre sobrescreve — limpa antes para não misturar dados de pessoas diferentes
  clearClientFields();
  const fill = (id, val) => { const el = document.getElementById(id); if (el && val) el.value = String(val).trim(); };
  fill('nova-cliente', d.name || d.shortName);
  const addr = d.address || {};
  const ruaParts = [addr.address, addr.number, addr.complement].map(s => (s||'').trim()).filter(Boolean);
  fill('nova-endRua',    ruaParts.join(', '));
  fill('nova-endBairro', addr.district);
  fill('nova-endCidade', addr.city && addr.city.cityDescription);
  const estEl = document.getElementById('nova-endEstado');
  const stateId = addr.state && addr.state.stateId && addr.state.stateId.trim();
  if (estEl && stateId) estEl.value = stateId;
  const rawCep = (addr.zipCode || '').replace(/\D/g, '');
  if (rawCep.length === 8) fill('nova-cep-cliente', rawCep.replace(/^(\d{5})(\d{3})$/, '$1-$2'));
  const comm = (d.listOfCommunicationInformation || [])[0] || {};
  const ddd = (comm.diallingCode || '').trim();
  const tel = (comm.phoneNumber || '').trim();
  if (tel) fill('nova-tel', ddd ? '(' + ddd + ') ' + tel : tel);
  fill('nova-email', comm.email);
  const govInfo = d.GovernmentalInformation || [];
  const rgEntry = govInfo.find(function(g){ return g.name === 'RG'; });
  if (rgEntry && rgEntry.id && rgEntry.id.trim()) fill('nova-rg', rgEntry.id.trim());
  togglePFFields(d.entityType !== 'J');
}

async function upsertProtheusCache(digits, dados) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/protheus_clientes`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates',
      },
      body: JSON.stringify([{ cpf_digits: digits, nome: (dados.name||dados.shortName||'').trim(), dados }]),
    });
  } catch {}
}

async function lookupProtheusClient(rawVal) {
  const digits = rawVal.replace(/\D/g, '');
  if (digits.length < 11) return false;
  setStatus('cnpj-status', 'Buscando no Protheus…', 'loading');

  // ── 1. Supabase cache (instantâneo) ─────────────────────────────
  try {
    const resp = await fetch(
      `${SUPABASE_URL}/rest/v1/protheus_clientes?cpf_digits=eq.${digits}&select=dados`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if (resp.ok) {
      const rows = await resp.json();
      if (Array.isArray(rows) && rows.length > 0) {
        const d = rows[0].dados;
        fillClientFromProtheus(d);
        setStatus('cnpj-status', 'OK: ' + (d.name || d.shortName || '').substring(0, 35) + ' (Protheus)', 'ok');
        showToast('Cliente encontrado no Protheus');
        return true;
      }
    }
  } catch {}

  // ── 2. Fallback: busca ao vivo na API do Protheus ────────────────
  setStatus('cnpj-status', 'Não encontrado no cache — buscando na API…', 'loading');
  try {
    const resp = await fetch('/api/protheus?cpfCnpj=' + digits, { signal: AbortSignal.timeout(25000) });
    if (resp.ok) {
      const data = await resp.json();
      const items = data.items || [];
      if (items.length > 0) {
        const d = items[0];
        fillClientFromProtheus(d);
        // Salva no Supabase para próximas buscas
        upsertProtheusCache(digits, d);
        setStatus('cnpj-status', 'OK: ' + (d.name || d.shortName || '').substring(0, 35) + ' (Protheus)', 'ok');
        showToast('Cliente encontrado no Protheus');
        return true;
      }
    }
  } catch {}

  setStatus('cnpj-status', 'Não encontrado no Protheus', 'err');
  return false;
}

function fmtCEP(input) {
