    btn.title = verCancelados ? 'Voltar às OPs ativas' : 'Ver OPs canceladas';
  }
  // Enquanto vê cancelados, as abas normais ficam apagadas (não fazem sentido)
  tabs.forEach(t => { t.style.opacity = verCancelados ? '0.4' : '1'; t.style.pointerEvents = verCancelados ? 'none' : ''; });
}

function toggleCancelados() {
  verCancelados = !verCancelados;
  aplicarEstiloCancelados();
  renderAll();
}

function renderCancelados(el) {
  const list = ops.filter(o => o.cancelada)
                  .sort((a, b) => (b.cancelada.ts || '').localeCompare(a.cancelada.ts || ''));
  const header = `<div class="step-header" style="display:flex;align-items:center;gap:10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      <div><div class="step-title">OPs Canceladas</div>
        <div class="step-desc">${list.length} cancelada${list.length!==1?'s':''} · clique em Reativar para devolver ao fluxo</div></div>
    </div>`;

  if (!list.length) {
    el.innerHTML = header + `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--text3)')}</div><div class="empty-title">Nenhuma OP cancelada</div><div class="empty-desc">OPs canceladas aparecem aqui e somem das filas normais.</div></div>`;
    return;
  }

  const cards = list.map(op => {
    const c = op.cancelada || {};
    const etapa = STEPS[c.statusAnterior]?.label || c.statusAnterior || '—';
    return `<div style="background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div style="font-weight:700;color:var(--text);font-size:13px">OP ${numOp(op)} <span style="color:var(--text3);font-weight:400">· ${esc(op.cliente)}</span></div>
        <span style="font-size:10px;font-weight:700;color:var(--red);background:var(--red-bg);border:1px solid rgba(220,38,38,.25);padding:2px 8px;border-radius:20px">CANCELADA</span>
      </div>
      <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">cancelada em ${c.ts||'—'} · por ${c.by||'—'} · estava em: ${etapa}</div>
      ${c.motivo ? `<div style="font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px"><strong>Motivo:</strong> ${c.motivo}</div>` : ''}
      <div style="display:flex;gap:6px;margin-top:4px">
        <button onclick="openInfoModal(${op.id})" style="background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:11px;color:var(--text2);cursor:pointer">Abrir OP</button>
        <button onclick="reativarOP(${op.id})" style="background:var(--green);border:none;border-radius:6px;padding:5px 12px;font-size:11px;color:#fff;font-weight:600;cursor:pointer">Reativar</button>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = header + `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px">${cards}</div>`;
}

/** Abre o modal pedindo o motivo do cancelamento. */
function openCancelarOP(opId) {
  const op = ops.find(o => o.id === opId);
  if (!op) return;
  const m = document.getElementById('modal');
  m.classList.remove('wide', 'split', 'xwide');
  m.innerHTML = `
    <div class="modal-header">
      <div><div class="modal-title">Cancelar OP ${numOp(op)}</div><div class="modal-subtitle">${esc(op.cliente)}</div></div>
      <button class="close-btn" onclick="closeModal()">${icon('x',14)}</button>
    </div>
    <div class="modal-body" style="padding:16px 22px;gap:12px">
      <div class="warn-block" style="display:flex;align-items:flex-start;gap:8px">
        ${icon('alert-triangle',15,'color:var(--orange);flex-shrink:0;margin-top:1px')}
        <span style="font-size:12px;line-height:1.5">A OP sai das filas de todos os setores e vai para a lista de canceladas. Não some do sistema — dá para <strong>reativar</strong> depois. Não cancela a NF na SEFAZ nem desfaz cadastro no Sistema QR.</span>
      </div>
      <div class="form-group">
        <label class="form-label">Motivo do cancelamento *</label>
        <textarea class="form-textarea" id="f-motivoCancel" rows="3" placeholder="Ex: cliente desistiu da compra / pedido duplicado / erro de digitação…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Voltar</button>
      <button class="btn-primary" style="background:var(--red)" onclick="doCancelarOP(${opId})">Confirmar Cancelamento</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-motivoCancel')?.focus(), 50);
}

function doCancelarOP(opId) {
  const motivo = document.getElementById('f-motivoCancel')?.value?.trim();
  if (!motivo) {
    const t = document.getElementById('f-motivoCancel');
    if (t) { t.style.borderColor = 'var(--red)'; t.focus(); }
    showToast('Informe o motivo do cancelamento', 'err');
    return;
  }
  const op = ops.find(o => o.id === opId);
  if (!op) return;
  const user = getUser();
  op.cancelada = { motivo, ts: nowTs(), by: user?.userName || user?.name || getActiveView()?.role || '', statusAnterior: op.status };
  // Sai de qualquer rota (senão o motorista é roteirizado para uma OP cancelada).
  removerOpDasRotas(op.id);
  op.history.push({ step: op.status, actor: getActiveView()?.role || '', actorName: user?.userName || user?.name || '-', ts: nowTs(), action: 'OP Cancelada', note: motivo });
  dbSaveOp(op);
  closeModal();
  renderAll();
  showToast(`OP ${numOp(op)} cancelada`, 'ok');
}

function reativarOP(opId) {
  const op = ops.find(o => o.id === opId);
  if (!op || !op.cancelada) return;
  const etapa = op.cancelada.statusAnterior;
  const user  = getUser();
  delete op.cancelada;
  op.history.push({ step: op.status, actor: getActiveView()?.role || '', actorName: user?.userName || user?.name || '-', ts: nowTs(), action: 'OP Reativada', note: '' });
  dbSaveOp(op);
  renderAll();
  showToast(`OP ${numOp(op)} reativada${etapa && STEPS[etapa] ? ' — voltou para ' + STEPS[etapa].label : ''}`, 'ok');
}

function secBlock(key, iconHtml, iconBg, title, desc, count, countStyle, cards) {
  const collapsed = getSectionCollapsed(key);
  return `<div class="section">
    <div class="section-header collapsible" onclick="toggleSection(this)" data-skey="${key}">
      <div class="section-header-icon" style="background:${iconBg}">${iconHtml}</div>
      <div style="flex:1">
        <div class="section-header-title">${title}</div>
        <div class="section-header-desc">${desc}</div>
      </div>
      <span class="section-header-count" style="${countStyle}">${count}</span>
      <span class="sec-chevron${collapsed?' collapsed':''}">${icon('chevron-down',14)}</span>
    </div>
    <div class="section-body"${collapsed?' style="display:none"':''}>
      <div class="card-grid">${cards}</div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// DASHBOARD EXECUTIVO (só na visão Gestor)
// ═══════════════════════════════════════════════════════════════════
function renderDashboard(el) {
  const ativos      = ops.filter(o => !o.cancelada);
  const emAndamento = ativos.filter(o => o.status !== 'entregue');
  const entregues   = ativos.filter(o => o.status === 'entregue');
  const bloqueadas  = ativos.filter(o => o.status === 'bloqueada').length;

  // Faturamento do mês — conta só OPs com NF emitida no mês corrente (data de emissão).
  const now = new Date();
  const ym  = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const fatMes = ativos.filter(o => (o.stepData?.aguard_emissao?.dataEmissao || '').startsWith(ym))
    .reduce((s, o) => s + (parseFloat(o.pedidoVenda?.valorLiquido || o.pedidoVenda?.valorTotal || 0) || 0), 0);

  // Entregas no prazo x atrasadas (entre as já entregues).
  let noPrazo = 0, foraPrazo = 0;
  entregues.forEach(o => {
    const dEnt  = o.stepData?.transito?.dataEntrega;
    const dPrev = parseBRDate(o.pedidoVenda?.dataPrevista);
    if (dEnt && dPrev) (new Date(dEnt + 'T12:00:00') <= dPrev) ? noPrazo++ : foraPrazo++;
    else noPrazo++;
  });
  const pctPrazo = entregues.length ? Math.round(noPrazo / entregues.length * 100) : 100;

  // Atrasadas AGORA (em andamento com semáforo vermelho).
  const atrasadasAgora = emAndamento.filter(o => semaforo(o).cls === 'b-red').length;

  // Dias parado por OP (desde a última alteração no banco = updated_at).
  const diasParado = o => { const t = o._loadedAt ? new Date(o._loadedAt).getTime() : 0; return t ? Math.floor((Date.now() - t) / 86400000) : 0; };

  // Funil por etapa.
  const etapas = ['aguard_financeiro','aguard_nf','aguard_emissao','aguard_despacho','transito','entregue'];
  const funil  = etapas.map(st => ({ label: STEPS[st]?.label || st, n: ativos.filter(o => o.status === st).length }));
  const maxF   = Math.max(1, ...funil.map(f => f.n));

  // Tempo médio parado por setor (das OPs em andamento agora).
  const porSetor = {};
  emAndamento.forEach(o => { const r = STEPS[o.status]?.owner; if (!r) return; (porSetor[r] = porSetor[r] || []).push(diasParado(o)); });
  const setores = Object.entries(porSetor).map(([role, arr]) => ({
    nome: SECTORS.find(s => s.role === role)?.name || role,
    med: arr.reduce((a, b) => a + b, 0) / arr.length, n: arr.length,
  })).sort((a, b) => b.med - a.med);
  const maxMed = Math.max(1, ...setores.map(s => s.med));

  const kpi = (label, valor, cor, sub) => `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:700">${label}</div>
      <div style="font-size:24px;font-weight:800;color:${cor||'var(--text)'};margin-top:4px;line-height:1.1">${valor}</div>
      ${sub ? `<div style="font-size:11px;color:var(--text3);margin-top:2px">${sub}</div>` : ''}
    </div>`;

  const barra = (label, n, max, cor) => `
    <div style="display:flex;align-items:center;gap:10px;font-size:12px">
      <div style="width:150px;flex-shrink:0;color:var(--text2)">${esc(label)}</div>
      <div style="flex:1;background:var(--surface2);border-radius:6px;height:22px;position:relative;overflow:hidden">
        <div style="width:${Math.round(n/max*100)}%;background:${cor};height:100%;border-radius:6px;min-width:${n?'2px':'0'};transition:width .3s"></div>
      </div>
      <div style="width:38px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">${n}</div>
    </div>`;

  el.innerHTML = `
    <div class="step-header"><div class="step-title">Dashboard</div><div class="step-desc">Visão executiva da operação — ${ativos.length} OPs ativas</div></div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px">
      ${kpi('Em andamento', emAndamento.length, 'var(--accent)', bloqueadas ? bloqueadas + ' bloqueada(s)' : 'no fluxo')}
      ${kpi('Faturamento do mês', fatMes ? fmtBRL(fatMes) : 'R$ 0,00', 'var(--green)', 'NF emitida em ' + now.toLocaleDateString('pt-BR',{month:'long'}))}
      ${kpi('Entregas no prazo', pctPrazo + '%', pctPrazo>=80?'var(--green)':pctPrazo>=50?'var(--orange)':'var(--red)', noPrazo + ' no prazo · ' + foraPrazo + ' fora')}
      ${kpi('Atrasadas agora', atrasadasAgora, atrasadasAgora?'var(--red)':'var(--green)', 'em andamento vencidas')}
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px">
        <div style="font-size:13px;font-weight:800;margin-bottom:12px">Funil por etapa</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${funil.map(f => barra(f.label, f.n, maxF, 'var(--accent)')).join('')}
        </div>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px">
        <div style="font-size:13px;font-weight:800;margin-bottom:12px">Tempo parado por setor <span style="font-weight:400;color:var(--text3);font-size:11px">(dias, em andamento)</span></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${setores.length ? setores.map(s => barra(`${s.nome} (${s.n})`, Math.round(s.med), Math.round(maxMed), s.med>=3?'var(--red)':s.med>=1?'var(--orange)':'var(--green)')).join('') : '<div style="font-size:12px;color:var(--text3)">Sem OPs em andamento</div>'}
        </div>
      </div>
    </div>
  `;
}

function renderQueue(user, el) {
  // ── GESTOR ───────────────────────────────────────────────────────
  if (user.role === 'gestor' || user.role === 'adm') {
    el.innerHTML = `<div class="step-header"><div class="step-title">Sem pendências</div><div class="step-desc">Você tem acesso de visualização. Use "Todas as OPs" para o painel completo.</div></div>
      <div class="empty"><div class="empty-icon">${icon('eye',32,'color:var(--text3)')}</div><div class="empty-title">Acesso de visualização</div><div class="empty-desc">Use "Todas as OPs" para o painel completo.</div></div>`;
    return;
  }

  // ── COMERCIAL - pendentes = em andamento ─────────────────────────
  if (user.role === 'vendedor') {
    const pendentes = _opsFiltered().filter(o => o.status !== 'entregue');
    let html = `<div class="step-header"><div class="step-title">Minhas OPs - Pendentes</div>
      <div class="step-desc">OPs ainda em andamento. Acompanhe o progresso ou clique para ver detalhes.</div></div>`;
    if (!ops.length) {
      html += `<div class="empty"><div class="empty-icon">${icon('clipboard-list',32,'color:var(--text3)')}</div><div class="empty-title">Nenhuma OP cadastrada</div><div class="empty-desc">Clique em "+ Nova OP" para criar a primeira.</div></div>`;
    } else if (!pendentes.length) {
      html += _hasActiveFilter()
        ? `<div class="empty"><div class="empty-icon">${icon('filter-x',32,'color:var(--text3)')}</div><div class="empty-title">Sem resultados</div><div class="empty-desc">Nenhuma OP encontrada com os filtros aplicados.</div></div>`
        : `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Tudo entregue!</div><div class="empty-desc">Todas as OPs foram concluídas e entregues ao cliente.</div></div>`;
    } else {
      html += `<div class="card-grid">${pendentes.map((op,i) => card(op,false,i)).join('')}</div>`;
    }
    el.innerHTML = html;
    return;
  }

  // ── LOGÍSTICA UNIFICADA ──────────────────────────────────────────
  if (user.role === 'logistica') {
    const base = _opsFiltered();
    const nfOps      = base.filter(o => o.status === 'aguard_nf');
    const despachoOps= base.filter(o => o.status === 'aguard_despacho');
    const transitoOps= base.filter(o => o.status === 'transito');
    const total = nfOps.length + despachoOps.length + transitoOps.length;
    let html = `<div class="step-header"><div class="step-title">Logística - Pendentes</div>
      <div class="step-desc">${total} OP${total!==1?'s':''} pendente${total!==1?'s':''} - Solicitação NF, despacho e entregas</div></div>`;
    if (!total) {
      html += `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Nenhuma pendência agora</div><div class="empty-desc">Todas as etapas de logística estão em dia.</div></div>`;
    } else {
      if (nfOps.length) html += secBlock('log_nf', icon('file-text',16,'color:var(--accent)'), 'var(--blue-bg)', 'Solicitar Emissão de NF', 'Preencha os dados de entrega e envie para o fiscal emitir', nfOps.length, 'background:var(--blue-bg);color:var(--accent)', nfOps.map((op,i)=>card(op,true,i)).join(''));
      if (despachoOps.length) html += secBlock('log_despacho', icon('truck',16,'color:var(--teal)'), 'var(--teal-bg)', 'Aguardando Despacho', 'NF emitida - confirme a data e hora do despacho', despachoOps.length, 'background:var(--teal-bg);color:var(--teal)', despachoOps.map((op,i)=>card(op,true,i)).join(''));
      if (transitoOps.length) html += secBlock('log_transito', icon('package',16,'color:var(--orange)'), 'var(--orange-bg)', 'Em Trânsito - Confirmar Entrega', 'Produto despachado - registre a entrega ao cliente', transitoOps.length, 'background:var(--orange-bg);color:var(--orange)', transitoOps.map((op,i)=>card(op,true,i)).join(''));
    }
    el.innerHTML = html;
    return;
  }

  // ── FINANCEIRO (seções: Validação + Bloqueadas) ──────────────────
  if (user.role === 'financeiro') {
    const base = _opsFiltered();
    const validacaoOps = base.filter(o => o.status === 'aguard_financeiro' && finNeeded(o) && !finDone(o));
    const bloqueadaOps = base.filter(o => o.status === 'bloqueada');
    const total = validacaoOps.length + bloqueadaOps.length;

    let html = `<div class="step-header"><div class="step-title">Financeiro - Pendentes</div>
      <div class="step-desc">${total} OP${total!==1?'s':''} pendente${total!==1?'s':''} - Validação de pagamentos e bloqueados</div></div>`;

    if (!total) {
      html += `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Tudo em dia!</div><div class="empty-desc">Nenhuma OP aguardando ação financeira.</div></div>`;
    } else {
      if (validacaoOps.length) html += `
        <div class="section">
          <div class="section-header">
            <div class="section-header-icon" style="background:var(--yellow-bg)">
              ${icon('clock',16,'color:var(--yellow)')}
            </div>
            <div style="flex:1">
              <div class="section-header-title">Aguardando Validação</div>
              <div class="section-header-desc">OPs com entrada pendente aguardando confirmação de pagamento</div>
            </div>
            <span class="section-header-count" style="background:var(--yellow-bg);color:var(--yellow)">${validacaoOps.length}</span>
          </div>
          <div class="card-grid">${validacaoOps.map((op,i) => card(op,true,i)).join('')}</div>
        </div>`;

      if (bloqueadaOps.length) html += `
        <div class="section">
          <div class="section-header">
            <div class="section-header-icon" style="background:var(--red-bg)">
              ${icon('ban',16,'color:var(--red)')}
            </div>
            <div style="flex:1">
              <div class="section-header-title">Bloqueados</div>
              <div class="section-header-desc">Pedidos bloqueados pelo financeiro - aguardando resolução ou desbloqueio</div>
            </div>
            <span class="section-header-count" style="background:var(--red-bg);color:var(--red)">${bloqueadaOps.length}</span>
          </div>
          <div class="card-grid">${bloqueadaOps.map((op,i) => card(op,true,i)).join('')}</div>
        </div>`;
    }
    el.innerHTML = html;
    return;
  }

  // ── FISCAL (seções: Simples Faturamento + Notas Fiscais) ────────
  if (user.role === 'fiscal') {
    const base = _opsFiltered();
    const sfOps = base.filter(o => o.status === 'aguard_financeiro' && !sfDone(o));
    const nfOps = base.filter(o => o.status === 'aguard_emissao');
    const total = sfOps.length + nfOps.length;

    let html = `<div class="step-header"><div class="step-title">Fiscal - Pendentes</div>
      <div class="step-desc">${total} OP${total!==1?'s':''} pendente${total!==1?'s':''} - Simples faturamento e emissão de notas fiscais</div></div>`;

    if (!total) {
      html += `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Tudo em dia!</div><div class="empty-desc">Nenhuma OP aguardando ação fiscal.</div></div>`;
    } else {
      if (sfOps.length) html += secBlock('fis_sf', icon('file-text',16,'color:var(--purple)'), 'var(--purple-bg)', 'Simples Faturamento Pendente', 'Envie o simples faturamento para liberar a OP para logística', sfOps.length, 'background:var(--purple-bg);color:var(--purple)', sfOps.map((op,i)=>card(op,true,i)).join(''));
      if (nfOps.length) html += secBlock('fis_nf', icon('file-plus',16,'color:var(--purple)'), 'var(--purple-bg)', 'Notas Fiscais a Emitir', 'Preencha os dados - emita a NF e registre o número aqui', nfOps.length, 'background:var(--purple-bg);color:var(--purple)', nfOps.map((op,i)=>card(op,true,i)).join(''));
    }
    el.innerHTML = html;
    return;
  }

  // ── DEMAIS SETORES ───────────────────────────────────────────────
  const config = {};
  const [title, desc] = config[user.role] || ['Pendentes', ''];
  const queue = getQueue(user);
  el.innerHTML = `<div class="step-header"><div class="step-title">${title}</div><div class="step-desc">${desc}</div></div>
    ${queue.length === 0
      ? `<div class="empty"><div class="empty-icon">${icon('check-circle',32,'color:var(--green)')}</div><div class="empty-title">Tudo em dia!</div><div class="empty-desc">Nenhuma OP aguardando sua ação no momento.</div></div>`
      : `<div class="card-grid">${queue.map((op,i) => card(op,true,i)).join('')}</div>`}`;
}

function renderConcluidas(user, el) {
  // Fiscal: separa "Simples Faturamento" (lançado, ainda não emitido) de "NF emitida"
  if (user.role === 'fiscal') {
    const base = _opsFiltered();
    const sfConcl = base.filter(o => sfDone(o) && (o.status === 'aguard_financeiro' || o.status === 'aguard_nf'));
    const nfConcl = base.filter(o => o.stepData?.aguard_emissao?.numeroNF);
    const total = sfConcl.length + nfConcl.length;
    let html = `<div class="step-header"><div class="step-title">Concluídas por Mim</div><div class="step-desc">Simples faturamento lançados e notas fiscais emitidas</div></div>`;
    if (!total) {
      html += `<div class="empty"><div class="empty-icon">${icon('clipboard-list',32,'color:var(--text3)')}</div><div class="empty-title">Nenhuma concluída ainda</div></div>`;
    } else {
      if (sfConcl.length) html += secBlock('fis_sf_concl', icon('file-text',16,'color:var(--purple)'), 'var(--purple-bg)', 'Simples Faturamento', 'Lançados - aguardando a logística solicitar a emissão', sfConcl.length, 'background:var(--purple-bg);color:var(--purple)', sfConcl.map((op,i)=>card(op,false,i)).join(''));
      if (nfConcl.length) html += secBlock('fis_nf_concl', icon('file-text',16,'color:var(--purple)'), 'var(--purple-bg)', 'Notas Fiscais Emitidas', 'NFs já emitidas por você', nfConcl.length, 'background:var(--purple-bg);color:var(--purple)', nfConcl.map((op,i)=>card(op,false,i)).join(''));
    }
    el.innerHTML = html;
    return;
  }
  const list = getCompleted(user);
  el.innerHTML = `<div class="step-header"><div class="step-title">Concluídas por Mim</div><div class="step-desc">OPs em que você já tomou uma ação</div></div>
    ${list.length === 0
      ? `<div class="empty"><div class="empty-icon">${icon('clipboard-list',32,'color:var(--text3)')}</div><div class="empty-title">Nenhuma concluída ainda</div></div>`
      : `<div class="card-grid">${list.map((op,i) => card(op,false,i)).join('')}</div>`}`;
}

function renderTodas(el) {
  const order = ['aguard_financeiro','aguard_nf','aguard_emissao','aguard_despacho','transito','entregue'];
  const groups = {};
  _opsFiltered().forEach(op => {
    if (op.status === 'aberta' || op.status === 'bloqueada') return;
    (groups[op.status]=groups[op.status]||[]).push(op);
  });
  const abertas = _opsFiltered().filter(o=>o.status!=='entregue'&&o.status!=='aberta'&&o.status!=='bloqueada').length;
  const total   = _opsFiltered().filter(o=>o.status!=='aberta'&&o.status!=='bloqueada').length;
  const cols = order.map(status => {
    const s = STEPS[status];
    const colOps = groups[status] || [];
    const badgeCls = COLOR_MAP[s?.color||'gray'] || 'b-gray';
    return `<div class="kanban-col">
      <div class="kanban-col-head">
        <span class="kanban-col-name">${s?.label||status}</span>
        <span class="badge ${badgeCls}" style="font-size:9px;padding:1px 6px">${colOps.length}</span>
      </div>
      <div class="kanban-col-body">
        ${colOps.length ? colOps.map((op,i)=>card(op,false,i,true)).join('') : `<div class="kanban-empty">${icon('package',18,'color:var(--text3);opacity:.5')}<div style="margin-top:4px">Nenhuma OP</div></div>`}
      </div>
    </div>`;
  }).join('');
  const hasResults = Object.values(groups).some(g => g.length > 0);
  el.innerHTML = `
    <div class="step-header" style="margin-bottom:12px">
      <div class="step-title">Todas as OPs</div>
      <div class="step-desc">${abertas} em aberto · ${total-abertas} entregues</div>
    </div>
    ${!hasResults && _hasActiveFilter()
      ? `<div class="empty"><div class="empty-icon">${icon('filter-x',32,'color:var(--text3)')}</div><div class="empty-title">Sem resultados</div><div class="empty-desc">Nenhuma OP encontrada com os filtros aplicados.</div></div>`
      : `<div class="kanban-wrap" id="kanban-wrap"><div class="kanban-board">${cols}</div></div>`}`;
}

let _filterBarOpen = false;
function toggleFilterBar() {
  _filterBarOpen = !_filterBarOpen;
  const bar = document.getElementById('filter-bar');
  const btn = document.getElementById('btn-filter-toggle');
  if (bar) bar.style.maxWidth = _filterBarOpen ? '760px' : '0';
  if (btn) btn.style.color = _filterBarOpen ? 'var(--accent)' : '';
}

function applyFilters() {
  _filters.q        = document.getElementById('fl-q')?.value    || '';
  _filters.pv       = document.getElementById('fl-pv')?.value   || '';
  _filters.dateFrom = document.getElementById('fl-from')?.value || '';
  _filters.dateTo   = document.getElementById('fl-to')?.value   || '';
  _filters.sem      = document.getElementById('fl-sem')?.value  || '';
  const hasFilter = _hasActiveFilter();
  const clrBtn = document.getElementById('fl-clear');
  if (clrBtn) clrBtn.style.display = hasFilter ? '' : 'none';
  const dot = document.getElementById('fl-active-dot');
  if (dot) dot.style.display = hasFilter ? '' : 'none';
  renderAll();
}

function clearFilters() {
  _filters = { q: '', pv: '', dateFrom: '', dateTo: '', sem: '' };
  ['fl-q','fl-pv','fl-from','fl-to'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const sel = document.getElementById('fl-sem'); if (sel) sel.selectedIndex = 0;
  const clrBtn = document.getElementById('fl-clear'); if (clrBtn) clrBtn.style.display = 'none';
  const dot = document.getElementById('fl-active-dot'); if (dot) dot.style.display = 'none';
  renderAll();
}

// CARD RENDERER
// ═══════════════════════════════════════════════════════════════════

function card(op, inQueue, animIdx, infoOnly = false) {
  const user     = getActiveView();
  const step     = STEPS[op.status];
  const badge    = stepBadge(op.status, op);
  const sem      = semaforo(op);
  const isBlocked = op.status === 'bloqueada';

  // Barra de progresso das 6 etapas do processo (o estágio final "entregue" não é
  // um traço: quando a OP é entregue, TODOS os traços ficam verdes = concluída).
  const dots = PIPELINE_ORDER.filter(s => s !== 'entregue').map(s => {
    const sIdx   = STEPS[s]?.pipelineIdx ?? 0;
    const curIdx = isBlocked ? 1 : (step?.pipelineIdx ?? 0);
    if (op.status === 'entregue' || sIdx < curIdx) return `<div class="pipe-dot done"></div>`;
    if (sIdx === curIdx)             return `<div class="pipe-dot ${isBlocked?'blocked':'current'}"></div>`;
    return `<div class="pipe-dot"></div>`;
  }).join('');

  const canAct   = inQueue && step?.owner === user.role;
  const needsSF  = inQueue && user.role === 'fiscal' && op.status === 'aguard_financeiro' && !op.stepData?.simples_faturamento;

  const skippedFin = op.history.some(h => h.note?.includes('Validação financeira pulada'));
  const lastEvt    = op.history[op.history.length-1];

  // Equipment chips — mostra no máx. 3 para o card não crescer; o resto vira "+N"
  const equipArr  = op.equipamentos?.length ? op.equipamentos : [op.equipamento||'-'];
  const equipList = equipArr.slice(0,3).map(e=>`<span class="equip-chip">${esc(typeof e==='object'?e.name:e)}</span>`).join('')
    + (equipArr.length > 3 ? `<span class="equip-chip">+${equipArr.length-3}</span>` : '');

  let footer = '';
  if (needsSF) {
    footer = `<div class="card-footer">
      <button class="btn-action" onclick="event.stopPropagation();openSimplesFaturamento(${op.id})">${icon('file-text',13)} Simples Faturamento</button>
    </div>`;
  } else if (canAct) {
    footer = `<div class="card-footer">
      <button class="btn-action" onclick="event.stopPropagation();openActionModal(${op.id},'advance')">${step.actionLabel}</button>
      ${step.getReject ? `<button class="btn-action danger" onclick="event.stopPropagation();openActionModal(${op.id},'reject')">${step.rejectLabel||'Bloquear'}</button>` : ''}
    </div>`;
  }

  const isEntregue = op.status === 'entregue';
  return `
  <div class="card ${(canAct||needsSF)&&!infoOnly?'actionable':''} ${isBlocked?'blocked':''} ${isEntregue?'entregue':''}" style="animation-delay:${animIdx*.04}s" onclick="${infoOnly?`openInfoModal(${op.id})`:`openCard(${op.id})`}">
    <div class="card-top">
      <div style="min-width:0">
        <div class="card-op">OP ${numOp(op).split(' - ')[0]}</div>
        ${numOp(op).includes(' - ') ? `<div style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(numOp(op).split(' - ')[1])}</div>` : ''}
        <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${fmtDate(op.dataAbertura)}</div>
        ${op.vendedorCanal||op.vendedorName ? `<div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(op.vendedorCanal||op.vendedorName)}</div>` : ''}
      </div>
      <div class="card-flags">
        ${isEntregue ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;color:var(--green);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.25);padding:1px 6px;border-radius:20px">${icon('check-circle',10,'color:var(--green)')} Concluída</span>` : ''}
        ${flagsHtml(op)}
      </div>
    </div>
    <div class="card-client">${esc(op.cliente)}</div>
    <div class="equip-chips">${equipList}</div>
    <div class="card-meta">
      <span class="badge ${badge.cls}"><span class="badge-dot" style="background:currentColor"></span>${badge.label}</span>
      ${op.status!=='entregue' ? `<span class="sema ${sem.cls}">${sem.icon?sem.icon+' ':''}${sem.label}</span>` : ''}
    </div>
    <div class="pipe-bar">${dots}</div>
    ${lastEvt ? `<div class="card-last-event"><span style="color:var(--text2)">${esc(lastEvt.actorName)}:</span> ${esc((lastEvt.action||lastEvt.note||'').substring(0,64))}</div>` : ''}
    ${footer}
  </div>`;
}

// CONTEXT PANEL - acumula respostas anteriores
// ═══════════════════════════════════════════════════════════════════

function buildContextPanel(op) {
  const pv = op.pedidoVenda;
  const sd = op.stepData || {};
  const sem = semaforo(op);
  const badge = stepBadge(op.status, op);

  const cRow = (label, val) => {
    if (!val) return '';
    return `<div class="ctx-row"><span class="ctx-label">${label}</span><span class="ctx-value">${val}</span></div>`;
  };
  const sec = (title, rows) => {
    const content = rows.filter(Boolean).join('');
    if (!content) return '';
    return `<div class="ctx-sec"><div class="ctx-sec-title">${title}</div>${content}</div>`;
  };

  let parts = [];

  // OP summary header
  parts.push(`<div style="display:flex;flex-direction:column;gap:5px">
    <div style="font-size:13px;font-weight:700;line-height:1.3">${esc(op.cliente)}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
      <span class="badge ${badge.cls}"><span class="badge-dot" style="background:currentColor"></span>${badge.label}</span>
      ${op.status!=='entregue'?`<span class="sema ${sem.cls}">${sem.label}</span>`:''}
    </div>
    <div style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace">${op.vendedorCanal||op.vendedorName||''}</div>
    ${op.obs?`<div style="font-size:11px;color:var(--text2)">${op.obs}</div>`:''}
  </div>`);

  // Pedido do Cliente
  if (pv) {
    const equipLines = (pv.equipamentos||[]).map(e=>{
      const tesBadge = e.tes ? `<span style="display:inline-flex;align-items:center;font-size:9px;font-weight:700;color:var(--orange);background:var(--orange-bg);border:1px solid rgba(234,88,12,.2);padding:1px 5px;border-radius:3px;font-family:'DM Mono',monospace;margin-left:4px">TES ${e.tes}${e.tesDesc?' · '+e.tesDesc:''}</span>` : '';
      const details = [e.qty>1&&`Qtd: ${e.qty}`, e.numSerie&&`Série: ${e.numSerie}`, e.lote&&`Lote: ${e.lote}`].filter(Boolean);
      return `<div style="padding:3px 0;border-bottom:1px solid var(--border)">
        <div style="font-size:12px;font-weight:500">${e.name}</div>
        ${tesBadge}
        ${details.map(d=>`<div style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace">${d}</div>`).join('')}
      </div>`;
    }).join('');
    const addrParts  = [[pv.endRua, pv.endNumero].filter(Boolean).join(', '), pv.endBairro, [pv.endCidade,pv.endEstado].filter(Boolean).join('/'), pv.endCEP].filter(Boolean);
    const endDisplay = addrParts.length ? addrParts.join(', ') : (pv.enderecoCliente||'');

    const payRows = [];
    if (pv.tipoContrato)   payRows.push(cRow('Tipo de Contrato', `<strong>${pv.tipoContrato}</strong>`));
    if (pv.valorTotal)     payRows.push(cRow('Valor Bruto', fmtBRL(pv.valorTotal)));
    if (pv.valorDesconto && parseFloat(pv.valorDesconto) > 0)
                           payRows.push(cRow('Desconto', '− ' + fmtBRL(pv.valorDesconto)));
    if (pv.valorLiquido)   payRows.push(cRow('Valor Total', fmtBRL(pv.valorLiquido)));
    if (pv.detalhesPagamento) payRows.push(cRow('Pagamento', pv.detalhesPagamento.replace(/\n/g,'<br>')));
    if (pv.simulador && parseFloat(pv.simulador) > 0)
                           payRows.push(cRow('Simulador', fmtBRL(pv.simulador)));
    if (pv.entrada === 'pendente')
                           payRows.push(cRow('Entrada', (pv.valorEntrada ? fmtBRL(pv.valorEntrada) : 'a definir') + ' - PENDENTE'));

    parts.push(sec('Pedido do Cliente', [
      cRow('Vendedor(a)', [pv.vendedorCanal, ...((pv.vendedores||[]).slice(1))].filter(Boolean).join('<br>')),
      cRow('Analista', pv.analista),
      cRow('Contrato', pv.numContrato),
      equipLines ? `<div class="ctx-row"><span class="ctx-label">Equipamentos</span><div>${equipLines}</div></div>` : '',
      cRow('Cliente', pv.cliente),
      cRow('CPF / CNPJ', pv.cpf),
      cRow('RG', pv.rg),
      cRow('Nascimento', pv.dn),
      cRow('Profissão', pv.profissao),
      cRow('Documento profissional', pv.numDocumento),
      cRow('Telefone', pv.tel),
      cRow('E-mail', pv.email),
      cRow('Instagram', pv.instagram),
      cRow('Endereço do cliente', endDisplay),
      ...payRows,
      (pv.simulador && parseFloat(pv.simulador) > 0) ? cRow('Simulador', fmtBRL(pv.simulador)) : '',
      pv.enderecoEntrega ? cRow('Endereço de entrega', pv.enderecoEntrega) : '',
      cRow('Contato responsável', pv.contatoEntrega),
      pv.dataPrevista  ? cRow('Previsão de entrega', pv.dataPrevista) : '',
      cRow('Treinamento', pv.treinamento),
      cRow('Observações', op.stepData?.aberta?.descricao),
    ]));
  } else {
    parts.push(sec('Pedido', [
      cRow('Equipamentos', (op.equipamentos||[op.equipamento||'-']).join(', ')),
      cRow('Contrato', op.numContrato||op.contrato),
    ]));
  }

  // Validação financeira
  if (sd.aguard_financeiro) {
    parts.push(sec('Validação Financeira', [
      cRow('Aprovação', sd.aguard_financeiro.descricao),
    ]));
  }

  // Logística - solicitação de NF
  if (sd.aguard_nf) {
    const d = sd.aguard_nf;
    parts.push(sec('Solicitação de NF (Logística)', [
      cRow('Endereço de entrega', d.enderecoEntrega),
      cRow('Técnico / Transportadora', d.tecnico),
      (d.carro||d.placa) ? cRow('Carro / Placa', [d.carro, d.placa].filter(Boolean).join(' · ')) : '',
      (d.volumes||d.peso) ? cRow('Volumes / Peso', [d.volumes&&d.volumes+' vol', d.peso&&d.peso+' kg'].filter(Boolean).join(' · ')) : '',
      cRow('Observações', d.descricao),
    ]));
  }

  // Emissão da NF
  if (sd.aguard_emissao) {
    const d = sd.aguard_emissao;
    parts.push(sec('Nota Fiscal Emitida', [
      cRow('Número NF', d.numeroNF),
      d.dataEmissao ? cRow('Data de emissão', fmtDate(d.dataEmissao)) : '',
      cRow('Observações', d.descricao),
    ]));
  }

  // Simples Faturamento (fiscal, side-channel)
  if (sd.simples_faturamento) {
    const d = sd.simples_faturamento;
    parts.push(sec('Simples Faturamento', [
      d.dataEmissao ? cRow('Data de emissão', fmtDate(d.dataEmissao)) : '',
      cRow('Observações', d.observacoes),
    ]));
  }

  // Re-emissão solicitada (logística rejeitou despacho)
  if (sd.aguard_despacho_reject) {
    const d = sd.aguard_despacho_reject;
    parts.push(`<div style="background:var(--red-bg);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px">
      <div class="ctx-sec-title" style="color:var(--red);border-color:rgba(220,38,38,.2)">Re-emissão Solicitada</div>
      ${d.motivoReemissao?`<div class="ctx-row">${cRow('Motivo',esc(d.motivoReemissao))}</div>`:''}
      ${d.dadosCorrigidos?`<div class="ctx-row">${cRow('Dados corrigidos',esc(d.dadosCorrigidos).replace(/\n/g,'<br>'))}</div>`:''}
    </div>`);
  }

  // Despacho confirmado
  if (sd.aguard_despacho) {
    parts.push(sec('Despacho Confirmado', [
      cRow('Confirmação', sd.aguard_despacho.descricao),
    ]));
  }

  // Arquivo da OP
  if (sd.aberta?.arquivoOP) {
    const arq = sd.aberta.arquivoOP;
    parts.push(`<div class="ctx-sec"><div class="ctx-sec-title">Arquivo da OP</div>
      <div style="padding:4px 0">${fileLinkHtml(arq, true)}</div>
    </div>`);
  }

  return parts.join('');
}

// ═══════════════════════════════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════════════════════════════

function openCard(opId) {
  const op   = ops.find(o => o.id === opId);
  if (!op) { showToast('OP não encontrada - recarregue', 'err'); return; }
  const view = getActiveView();
  const step = STEPS[op.status];
  if (view?.role === 'fiscal' && op.status === 'aguard_financeiro' && !op.stepData?.simples_faturamento) {
    openSimplesFaturamento(opId);
    return;
  }
  if (op.status === 'aguard_financeiro' && op.stepData?.aguard_financeiro?.aprovado === true) {
    openInfoModal(opId);
    return;
  }
  const canAct = step?.owner === view?.role;
  canAct ? openActionModal(opId,'advance') : openInfoModal(opId);
}

function openActionModal(opId, mode) {
  activeOpId = opId; modalMode = mode; tempFiles = {}; tempFilesData = {};
  const op   = ops.find(o => o.id === opId);
  const step = STEPS[op.status];
  _modalStatus = op?.status; // guarda a etapa ao abrir; o submit aborta se mudou (outro usuário avançou)
  const fields = mode==='reject' ? (step.rejectFields||[]) : (step.formFields||[]);

  // Reset and pre-seed equipment list for aberta step
  if (op.status === 'aberta' && mode === 'advance') {
    tempEquipList = (op.equipamentos||[])
      .filter(e => e && e !== '-')
      .map(e => {
        const m = e.match(/^(.+)\s\(x(\d+)\)$/);
        return m ? { name: m[1], qty: parseInt(m[2]) } : { name: e, qty: 1 };
      });
  } else {
    tempEquipList = [];
  }

  const titles = { advance: step.actionLabel, reject: step.rejectLabel||'Bloquear OP' };
  const btnCls  = { advance: '', reject: ' red' };
  const btnLbl  = { advance: 'Confirmar →', reject: 'Bloquear' };

  // Algorithm note for "aberta" step
  let algoNote = '';
  if (op.status === 'aberta' && mode === 'advance') {
    algoNote = op.entrada === 'pendente'
      ? `<div class="warn-block" style="display:flex;align-items:flex-start;gap:8px">${icon('alert-triangle',15,'color:var(--orange);flex-shrink:0;margin-top:1px')}<span>Entrada <strong>pendente</strong> - esta OP irá para <strong>Validação Financeira</strong> antes de prosseguir.</span></div>`
      : `<div class="success-block" style="display:flex;align-items:flex-start;gap:8px">${icon('check-circle',15,'color:var(--green);flex-shrink:0;margin-top:1px')}<span>Entrada <strong>${op.entrada==='paga'?'paga':'não exigida'}</strong> - validação financeira será <strong>pulada</strong>. OP irá direto para Logística.</span></div>`;
  }

  const dirNote = '';

  // Rejection warning when aguard_emissao reopens after Logística rejection
  let rejectionNote = '';
  if (op.status === 'aguard_emissao' && op.stepData?.aguard_despacho_reject && mode === 'advance') {
    const rej = op.stepData.aguard_despacho_reject;
    rejectionNote = `
      <div style="background:var(--red-bg);border:1.5px solid rgba(220,38,38,.3);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px">
        <div style="font-size:11px;font-weight:700;color:var(--red);letter-spacing:.2px;display:flex;align-items:center;gap:6px">${icon('alert-triangle',14,'color:var(--red)')} RE-EMISSÃO SOLICITADA PELA LOGÍSTICA</div>
        ${rej.motivoReemissao ? `<div style="font-size:12px;color:var(--text);line-height:1.5"><strong>Motivo:</strong> ${esc(rej.motivoReemissao)}</div>` : ''}
        ${rej.dadosCorrigidos ? `<div style="font-size:12px;color:var(--text);line-height:1.5;padding:8px;background:rgba(0,0,0,.03);border-radius:6px;border:1px solid rgba(220,38,38,.15)"><strong>Dados corrigidos:</strong><br>${esc(rej.dadosCorrigidos).replace(/\n/g,'<br>')}</div>` : ''}
        <div style="font-size:11px;color:var(--text3)">Os campos abaixo foram pré-preenchidos com os dados anteriores. Corrija conforme necessário e re-emita.</div>
      </div>`;
  }

  let fieldsHtml;
  if (op.status === 'aguard_emissao' && op.stepData?.aguard_despacho_reject && mode === 'advance') {
    const nfData = op.stepData.aguard_nf || {};
    const emData = op.stepData.aguard_emissao || {};
    const sh2 = l => `<div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--text3);border-top:1px solid var(--border);padding:8px 0 2px;margin-top:2px">${l}</div>`;
    fieldsHtml = `
      ${sh2('Dados de Despacho - verificar e corrigir')}
      <div class="form-group">
        <label class="form-label">Endereço de Entrega Completo *</label>
        <textarea class="form-textarea" id="f-reNF_enderecoEntrega" rows="2">${esc(nfData.enderecoEntrega||'')}</textarea>
      </div>
      ${buildFieldHtml({ key:'envio', label:'Motorista / Transportadora *', type:'envio' })}
      <div class="form-row">
        <div class="form-group"><label class="form-label">Nº de Volumes *</label>
          <input class="form-input" id="f-reNF_volumes" type="number" value="${nfData.volumes||''}"></div>
        <div class="form-group"><label class="form-label">Peso Total (kg) *</label>
          <input class="form-input" id="f-reNF_peso" type="number" value="${nfData.peso||''}"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Obs. do Despacho</label>
        <textarea class="form-textarea" id="f-reNF_descricao" rows="2">${esc(nfData.descricao||'')}</textarea>
      </div>
      ${sh2('Emissão da Nota Fiscal')}
      <div class="form-group">
        <label class="form-label">Número da NF *</label>
        <input class="form-input" id="f-numeroNF" value="${esc(emData.numeroNF||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">Chave da NFe (44 díg.)</label>
        <input class="form-input" id="f-chaveNfe" value="${esc(emData.chaveNfe||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">Data de Emissão *</label>
        <input class="form-input" id="f-dataEmissao" type="date" value="${emData.dataEmissao||''}">
      </div>
      <div class="form-group">
        <label class="form-label">PDF da Nota Fiscal *</label>
        <label style="cursor:pointer">
          <input type="file" id="f-arquivoNF" accept=".pdf" style="display:none" onchange="handleFile(this)">
          <div class="file-upload-area" id="file-display-arquivoNF">
            <div class="file-upload-text" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon('upload',14)} ${emData.arquivoNF ? 'Anterior: '+(emData.arquivoNF?.name||emData.arquivoNF)+' - clique para substituir' : 'Clique para anexar o novo PDF da NF'}</div>
          </div>
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Observações *</label>
        <textarea class="form-textarea" id="f-descricao" rows="2">${esc(emData.descricao||'')}</textarea>
      </div>`;
  } else if (op.status === 'aguard_despacho' && mode === 'advance') {
    // Despacho: só data + hora, sem anexo
    const nowDate = new Date().toISOString().split('T')[0];
    const nowTime = new Date().toTimeString().slice(0,5);
    fieldsHtml = `
      <div class="success-block" style="display:flex;align-items:flex-start;gap:8px;margin-bottom:4px">
        ${icon('check-circle',15,'color:var(--green);flex-shrink:0;margin-top:1px')}
        <span>Confirme os dados à esquerda e registre a data e hora do despacho.</span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Data do Despacho *</label>
          <input class="form-input" id="f-dataDespacho" type="date" value="${nowDate}">
        </div>
        <div class="form-group">
          <label class="form-label">Hora do Despacho *</label>
          <input class="form-input" id="f-horaDespacho" type="time" value="${nowTime}">
        </div>
      </div>`;
  } else {
    fieldsHtml = fields.map(f => buildFieldHtml(f)).join('');
  }

  document.getElementById('modal').classList.add('split');
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <div><div class="modal-title">${titles[mode]}</div><div class="modal-subtitle">OP ${numOp(op)} · ${esc(op.cliente)}</div></div>
      <button class="close-btn" onclick="closeModal()">${icon('x',14)}</button>
    </div>
    <div class="modal-split-body">
      <div class="split-pane split-pane-right">
        <div class="split-pane-header">Preencher agora</div>
        ${algoNote}${dirNote}${rejectionNote}${fieldsHtml}
      </div>
      <div class="split-pane split-pane-left">
        <div class="split-pane-left-header">
          <div style="font-size:13px;font-weight:700;margin-bottom:6px">${esc(op.cliente)}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
            <span class="badge ${stepBadge(op.status, op).cls}"><span class="badge-dot" style="background:currentColor"></span>${stepBadge(op.status, op).label}</span>
            ${op.status!=='entregue'?`<span class="sema ${semaforo(op).cls}">${semaforo(op).label}</span>`:''}
          </div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">${(op.equipamentos||[]).map(e=>`<span class="equip-chip" style="font-size:10px">${typeof e==='object'?esc(e.name)+(e.qty>1?' ×'+e.qty:''):esc(e)}</span>`).join('')}</div>
        </div>
        <div class="split-pane-left-scroll">
          ${buildInfoSections(op, op.id)}
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary${btnCls[mode]}" onclick="submitModal()">${btnLbl[mode]}</button>
    </div>`;

  document.getElementById('overlay').classList.add('open');

  // Força alturas via JS - CSS cascade no grid do overlay não é confiável
  requestAnimationFrame(() => {
    const modal  = document.getElementById('modal');
    if (!modal.classList.contains('split')) return;
    const hEl    = modal.querySelector('.modal-header');
    const fEl    = modal.querySelector('.modal-footer');
    const body   = modal.querySelector('.modal-split-body');
    const lhEl   = modal.querySelector('.split-pane-left-header');
    const scroll = modal.querySelector('.split-pane-left-scroll');
    if (!body) return;
    const maxH  = Math.min(window.innerHeight * 0.9, window.innerHeight - 40);
    const bodyH = maxH - (hEl?.offsetHeight || 0) - (fEl?.offsetHeight || 0);
    modal.style.height    = maxH + 'px';
    modal.style.maxHeight = maxH + 'px';
    body.style.height     = bodyH + 'px';
    // Seta a altura do scroll container explicitamente para garantir overflow-y
    if (scroll) {
      const scrollH = bodyH - (lhEl?.offsetHeight || 0);
      scroll.style.height    = scrollH + 'px';
      scroll.style.maxHeight = scrollH + 'px';
      scroll.style.overflowY = 'auto';
    }
  });
}

// Helper: constrói um accordion para o info modal
function infoAcc(title, iconName, contentHtml, open = false) {
  const arrowStyle = open ? 'rotate(0deg)' : 'rotate(-90deg)';
  return `<div class="acc">
    <div class="acc-head" onclick="toggleAccordion(this)" style="font-size:12px">
      <span style="display:flex;align-items:center;gap:7px">${icon(iconName,14,'color:var(--text3)')} ${title}</span>
      <span class="acc-arrow" style="transform:${arrowStyle}">${icon('chevron-down',14)}</span>
    </div>
    <div class="acc-body" ${open?'':'hidden'}>${contentHtml}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// SHARED INFO SECTIONS (accordion) - used by info modal & action modal left panel
// ═══════════════════════════════════════════════════════════════════

function buildInfoSections(op, opId) {
  const pv = op.pedidoVenda;
  const sd = op.stepData || {};
  const dItem = (label, val) => val
    ? `<div class="detail-item"><div class="detail-label">${label}</div><div class="detail-value" style="font-size:12px;font-weight:400">${val}</div></div>`
    : '';

  const sections = [];

  // ── PEDIDO DE VENDA ──────────────────────────────────────────────
  if (pv) {
    const equipLines = (pv.equipamentos||[]).map(e => {
      const valor = e.gratuito ? '<span style="color:var(--green);font-weight:700">Gratuito</span>'
                  : e.valorUnit ? fmtBRL(Math.max(0,(parseInt(e.qty)||1)*(parseFloat(e.valorUnit)||0)-(parseFloat(e.desconto)||0))) : '';
      const tesBadge = e.tes ? `<span style="display:inline-flex;align-items:center;align-self:flex-start;font-size:9px;font-weight:700;color:var(--orange);background:var(--orange-bg);border:1px solid rgba(234,88,12,.2);padding:1px 5px;border-radius:3px;font-family:'DM Mono',monospace">TES ${e.tes}${e.tesDesc?' · '+e.tesDesc:''}</span>` : '';
      const _qrs = qrListaDaLinha(e).filter(Boolean); // 1 QR por máquina
      const details = [valor, _qrs.length&&`QR ${_qrs.join(', ')}`, e.numSerie&&`Série ${e.numSerie}`, e.lote&&`Lote ${e.lote}`].filter(Boolean);
      return `<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">
        <div style="font-weight:500">${esc(e.name)}${e.qty>1?' × '+e.qty:''}</div>
        ${tesBadge}
        ${details.map(d=>`<div style="font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;margin-top:1px">${d}</div>`).join('')}
      </div>`;
    }).join('') || `<div style="font-size:12px">${esc((op.equipamentos||[]).join(', '))}</div>`;
    const addrParts = [[pv.endRua, pv.endNumero].filter(Boolean).join(', '), pv.endBairro, [pv.endCidade,pv.endEstado].filter(Boolean).join('/'), pv.endCEP].filter(Boolean);
    const endDisplay = addrParts.length ? addrParts.join(', ') : (pv.enderecoCliente||'');

    let pvHtml = `
      <div class="detail-grid" style="margin-bottom:8px">
        ${dItem('Vendedor(a)', [pv.vendedorCanal, ...((pv.vendedores||[]).slice(1))].filter(Boolean).join('<br>'))}
        ${dItem('Data', pv.data)}
        ${dItem('Analista', pv.analista)}
        ${dItem('Contrato', pv.numContrato)}
      </div>
      <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--text3);margin-bottom:5px;letter-spacing:.6px">Equipamentos</div>
      <div style="margin-bottom:10px">${equipLines}</div>`;
    if (pv.valorLiquido || pv.valorTotal) {
      pvHtml += `<div class="detail-grid" style="margin-bottom:8px">
        ${pv.valorTotal && parseFloat(pv.valorTotal)>0 ? dItem('Valor Bruto', fmtBRL(pv.valorTotal)) : ''}
        ${pv.valorDesconto && parseFloat(pv.valorDesconto)>0 ? dItem('Desconto', '− '+fmtBRL(pv.valorDesconto)) : ''}
        ${pv.valorLiquido && parseFloat(pv.valorLiquido)>0 ? dItem('Valor Total', `<strong style="color:var(--green)">${fmtBRL(pv.valorLiquido)}</strong>`) : ''}
        ${pv.entrada && pv.entrada !== 'sem' && pv.valorEntrada && parseFloat(pv.valorEntrada) > 0 ? dItem('Entrada', fmtBRL(pv.valorEntrada)) : ''}
        ${pv.tipoContrato ? dItem('Tipo', pv.tipoContrato) : ''}
      </div>`;
    }
    if (pv.detalhesPagamento) pvHtml += `<div class="detail-item" style="grid-column:1/-1;margin-bottom:8px"><div class="detail-label">Pagamento</div><div class="detail-value" style="font-size:12px;font-weight:400;white-space:pre-line">${esc(pv.detalhesPagamento)}</div></div>`;
    pvHtml += `<div class="detail-grid">
      ${dItem('Cliente', `<strong>${esc(pv.cliente||'-')}</strong>`)}
      ${dItem('CPF/CNPJ', pv.cpf)}
      ${dItem('RG', pv.rg)}
      ${dItem('Nascimento', pv.dn)}
      ${dItem('Profissão', pv.profissao)}
      ${dItem('Documento profissional', pv.numDocumento)}
      ${dItem('Telefone', pv.tel)}
      ${dItem('E-mail', pv.email)}
      ${dItem('Instagram', pv.instagram)}
      ${(pv.simulador && parseFloat(pv.simulador)>0) ? dItem('Simulador', fmtBRL(pv.simulador)) : ''}
      ${endDisplay ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">Endereço do cliente</div><div class="detail-value" style="font-size:12px;font-weight:400">${esc(endDisplay)}</div></div>` : ''}
      ${pv.enderecoEntrega ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">Endereço de entrega</div><div class="detail-value" style="font-size:12px;font-weight:400">${esc(pv.enderecoEntrega)}</div></div>` : ''}
      ${dItem('Previsão de entrega', pv.dataPrevista || '')}
      ${dItem('Contato', esc(pv.contatoEntrega))}
      ${dItem('Treinamento', pv.treinamento)}
      ${op.stepData?.aberta?.descricao ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">Observações</div><div class="detail-value" style="font-size:12px;font-weight:400;white-space:pre-line">${esc(op.stepData.aberta.descricao)}</div></div>` : ''}
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn-primary" style="font-size:12px;padding:6px 14px;display:flex;align-items:center;gap:5px" onclick="printPedidoVenda(${opId})">${icon('printer',13,'color:#fff')} Baixar Pedido de Venda</button>
      ${sd.aberta?.arquivoOP && sd.aberta.arquivoOP.dataUrl ? `
        <a href="${sd.aberta.arquivoOP.dataUrl}" download="${(sd.aberta.arquivoOP.name||'arquivo_op').replace(/"/g,'')}"
          style="display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:6px 14px;
            border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
            color:var(--text);text-decoration:none;cursor:pointer"
          onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          ${icon('download',13,'color:var(--text2)')} Baixar Arquivo da OP
        </a>` : sd.aberta?.arquivoOP ? fileLinkHtml(sd.aberta.arquivoOP, true) : ''}
    </div>
    ${sd.aberta?.comprovanteEntrada?.length ? `
      <div style="margin-top:10px">
        <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--text3);letter-spacing:.5px;margin-bottom:5px">Comprovante da Entrada</div>
        ${fileLinksHtml(sd.aberta.comprovanteEntrada)}
      </div>` : ''}`;
    sections.push(infoAcc('Pedido de Venda', 'file-text', pvHtml, true));
  } else {
    sections.push(infoAcc('Pedido', 'clipboard-list', `<div class="detail-grid">
      ${dItem('Equipamentos', esc((op.equipamentos||[op.equipamento||'-']).join(', ')))}
      ${dItem('Contrato', op.numContrato||op.contrato)}
      ${dItem('Vendedor', op.vendedorCanal||op.vendedorName)}
    </div>`, true));
  }

  // ── FINANCEIRO ───────────────────────────────────────────────────
  if (sd.aguard_financeiro || sd.aguard_financeiro_reject) {
    const df = sd.aguard_financeiro || {};
    const dr = sd.aguard_financeiro_reject || {};
    let finHtml = `<div class="detail-grid">
        ${dItem('Confirmação', esc(df.descricao))}
        ${dr.descricao ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label" style="color:var(--red)">Motivo do Bloqueio</div><div class="detail-value" style="font-size:12px;font-weight:400">${esc(dr.descricao)}</div></div>` : ''}
      </div>`;
    if (df.anexo?.length) finHtml += `<div style="margin-top:8px">${fileLinksHtml(df.anexo)}</div>`;
    sections.push(infoAcc('Financeiro', 'check-circle', finHtml));
  }

  // ── DADOS DE ENTREGA ─────────────────────────────────────────────
  if (sd.aguard_nf) {
    const d = sd.aguard_nf;
    const nsRows = (() => {
      if (d.numSeries?.length) return d.numSeries.map((ns, i) => {
        if (!ns) return '';
        const tipo = d.trackingTypes?.[i] === 'lote' ? `Lote ${i+1}` : `Nº Série ${i+1}`;
        return dItem(tipo, ns);
      }).join('');
      return d.numSerie ? dItem('Nº de Série', d.numSerie) : '';
    })();
    // Só repete o endereço aqui se for diferente do endereço de entrega do pedido
    // (evita mostrar o mesmo endereço duas vezes no modal).
    const endTranspDif = d.enderecoEntrega && d.enderecoEntrega.trim() !== (pv?.enderecoEntrega||'').trim();
    let entHtml = `<div class="detail-grid">
      ${endTranspDif ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">${icon('map-pin',10,'color:var(--text3)')} Endereço (transporte)</div><div class="detail-value" style="font-size:12px;font-weight:400">${esc(d.enderecoEntrega)}</div></div>` : ''}
      ${dItem('Motorista / Transportadora', esc(d.tecnico))}
      ${(d.carro||d.placa) ? dItem('Carro / Placa', [d.carro, d.placa].filter(Boolean).join(' · ')) : ''}
      ${d.volumes||d.peso ? dItem('Volumes / Peso', [d.volumes&&d.volumes+' vol', d.peso&&d.peso+' kg'].filter(Boolean).join(' · ')) : ''}
      ${nsRows}
      ${dItem('Observações', esc(d.descricao))}
    </div>`;
    if (sd.aguard_despacho) {
      const dd = sd.aguard_despacho;
      entHtml += `<div class="success-block" style="margin-top:8px;display:flex;align-items:center;gap:8px">
        ${icon('truck',14,'color:var(--green)')}
        <span><strong>Despachado</strong> em ${dd.dataDespacho ? fmtDate(dd.dataDespacho) : ''}${dd.horaDespacho ? ' às '+dd.horaDespacho : ''}</span>
      </div>`;
    }
    if (sd.aguard_despacho_reject) {
      const dr = sd.aguard_despacho_reject;
      entHtml += `<div style="background:var(--red-bg);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius);padding:8px;margin-top:8px">
        <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--red);margin-bottom:5px">Re-emissão Solicitada</div>
        ${dr.motivoReemissao?`<div style="font-size:11px;margin-bottom:4px"><strong>Motivo:</strong> ${esc(dr.motivoReemissao)}</div>`:''}
        ${dr.dadosCorrigidos?`<div style="font-size:11px"><strong>Dados corrigidos:</strong> ${esc(dr.dadosCorrigidos).replace(/\n/g,'<br>')}</div>`:''}
      </div>`;
    }
    sections.push(infoAcc('Dados de Entrega', 'truck', entHtml));
  }

  // ── NOTA FISCAL ──────────────────────────────────────────────────
  if (sd.aguard_emissao) {
    const d = sd.aguard_emissao;
    let nfeHtml = `<div class="detail-grid">
      ${dItem('Número NF', esc(d.numeroNF))}
      ${d.chaveNfe ? dItem('Chave NFe', esc(d.chaveNfe)) : ''}
      ${d.dataEmissao ? dItem('Data de Emissão', fmtDate(d.dataEmissao)) : ''}
      ${dItem('Observações', esc(d.descricao))}
    </div>`;
    // Normaliza arquivoNF: pode ser array (multi-file), objeto único ou string legada
    const nfFiles = d.arquivoNF
      ? (Array.isArray(d.arquivoNF) ? d.arquivoNF : [d.arquivoNF])
      : [];
    if (nfFiles.length) nfeHtml += `<div style="margin-top:8px">${fileLinksHtml(nfFiles)}</div>`;
    sections.push(infoAcc('Nota Fiscal', 'file-text', nfeHtml));
  }

  // ── SIMPLES FATURAMENTO (fiscal, side-channel) ────────────────────
  if (sd.aguard_financeiro?.aprovado && !sd.simples_faturamento) {
    sections.push(`<div style="background:rgba(234,179,8,.07);border:1px solid rgba(234,179,8,.35);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:flex-start;gap:8px">
      ${icon('alert-triangle',14,'color:var(--orange);flex-shrink:0;margin-top:1px')}
      <div style="font-size:12px;color:var(--text);line-height:1.5"><strong>Aguardando Simples Faturamento</strong><br><span style="color:var(--text2)">O Financeiro já aprovou. O Fiscal precisa lançar o Simples Faturamento para a OP avançar.</span></div>
    </div>`);
  }
  if (sd.simples_faturamento) {
    const d = sd.simples_faturamento;
    let sfHtml = `<div class="detail-grid">
      ${d.dataEmissao ? dItem('Data de Emissão', fmtDate(d.dataEmissao)) : ''}
      ${dItem('Observações', esc(d.observacoes))}
    </div>`;
    const sfFiles = d.arquivos
      ? (Array.isArray(d.arquivos) ? d.arquivos : [d.arquivos])
      : [];
    if (sfFiles.length) sfHtml += `<div style="margin-top:8px">${fileLinksHtml(sfFiles)}</div>`;
    sections.push(infoAcc('Simples Faturamento', 'file-text', sfHtml));
  }

  // ── CONFIRMAÇÃO DE ENTREGA ────────────────────────────────────────
  if (sd.transito || op.status === 'entregue') {
    const d = sd.transito || {};

    // Badge de prazo: compara data de entrega real com a prevista
    let prazoBadge = '';
    if (d.dataEntrega && op.pedidoVenda?.dataPrevista) {
      const entregaDate = new Date(d.dataEntrega + 'T12:00:00');
      const prevDate    = parseBRDate(op.pedidoVenda.dataPrevista);
      if (prevDate) {
        const diasDiff = Math.ceil((entregaDate - prevDate) / 86400000);
        prazoBadge = diasDiff <= 0
          ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--green);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.3);padding:1px 7px;border-radius:20px;margin-left:6px">${icon('check',10,'color:var(--green)')} No prazo</span>`
          : `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--red);background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.28);padding:1px 7px;border-radius:20px;margin-left:6px">${icon('alert-triangle',10,'color:var(--red)')} Atrasada ${diasDiff}d</span>`;
      }
    }

    let confHtml = `<div class="detail-grid">
      ${d.dataEntrega ? `<div class="detail-item"><div class="detail-label">Data de Entrega</div><div class="detail-value" style="font-size:12px;font-weight:400;display:flex;align-items:center;flex-wrap:wrap;gap:2px">${fmtDate(d.dataEntrega)}${prazoBadge}</div></div>` : ''}
      ${dItem('Observações', esc(d.descricao))}
    </div>`;

    if (d.motivoAtraso) {
      confHtml += `<div style="margin-top:8px;padding:8px 11px;border:1px solid rgba(220,38,38,.22);border-radius:var(--radius);background:rgba(220,38,38,.04)">
        <div style="font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--red);letter-spacing:.5px;margin-bottom:4px">Motivo do Atraso</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5">${d.motivoAtraso}</div>
      </div>`;
    }

    if (d.fotos?.length) {
      confHtml += `<div style="margin-top:8px">${fileLinksHtml(d.fotos)}</div>`;
    } else if (op.status === 'entregue') {
      confHtml += `<div style="margin-top:8px;display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);font-style:italic">
        ${icon('image',11,'color:var(--text3)')} Nenhuma foto anexada
      </div>`;
    }
    sections.push(infoAcc('Confirmação de Entrega', 'package', confHtml, op.status === 'entregue'));
  }

  // ── RASTREAMENTO (envio por transportadora) — penúltima, antes do Histórico
  // Oculto até a API de rastreio ficar pronta (ver RASTREIO_ATIVO).
  if (RASTREIO_ATIVO && sd.aguard_nf?.envioTipo === 'transportadora') {
    const vm = rastreioVM(op);
    let rHtml = `<div class="detail-grid">
      ${dItem('Transportadora', TRANSPORTADORAS[vm.transp] || vm.transp || '—')}
      ${op.rastreio?.awb ? dItem('AWB', op.rastreio.awb) : ''}
      ${dItem('Situação', vm.statusLabel)}
      ${vm.local ? dItem('Local atual', vm.local) : ''}
    </div>`;
    const btnCss = 'background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text2);cursor:pointer';
    const acts = [];
    if (vm.rastreavel) acts.push(`<button style="${btnCss}" onclick="atualizarRastreio(${op.id})">${op._rastreioLoading ? 'atualizando…' : 'Atualizar rastreio'}</button>`);
    if (op.rastreio)   acts.push(`<button style="${btnCss}" onclick="verTimeline(${op.id})">Ver histórico</button>`);
    if (acts.length) rHtml += `<div style="display:flex;gap:6px;margin-top:8px">${acts.join('')}</div>`;
    else if (!vm.rastreavel) rHtml += `<div style="font-size:11px;color:var(--text3);margin-top:6px">Transportadora ainda sem integração de rastreio.</div>`;
    sections.push(infoAcc('Rastreamento', 'truck', rHtml));
  }

  // ── HISTÓRICO ────────────────────────────────────────────────────
  const histHtml = op.history.length
    ? `<div style="border-left:2px solid var(--border);margin-left:5px;padding-left:18px;display:flex;flex-direction:column;gap:14px">
        ${op.history.map((h, i) => {
          const acao = h.action || (() => {
            const isReject = h.note && (h.note.startsWith('Bloqueado') || h.note.startsWith('Solicitar Re'));
            return isReject ? (HIST_REJECT[h.step] || 'Bloqueado') : (HIST_ACTION[h.step] || 'Ação');
          })();
          const cor  = `var(--${STEPS[h.step]?.color || 'blue'})`;
          const last = i === op.history.length - 1;
          const note = h.note && h.note.trim() && h.note.trim() !== acao
            ? `<div style="font-size:11px;color:var(--text3);margin-top:2px;white-space:pre-line">${esc(h.note)}</div>` : '';
          return `<div style="position:relative">
            <div style="position:absolute;left:-24px;top:1px;width:11px;height:11px;border-radius:50%;background:${last?cor:'var(--surface)'};border:2px solid ${cor};box-shadow:0 0 0 2px var(--surface)"></div>
            <div style="font-size:12px;font-weight:600;color:var(--text)">${esc(acao)}</div>
            <div style="font-size:11px;color:var(--text3)"><span style="color:var(--text2);font-weight:600">${esc(h.actorName||h.actor)}</span> · ${esc(h.ts)}</div>
            ${note}
          </div>`;
        }).join('')}
      </div>`
    : `<div style="font-size:12px;color:var(--text3)">Nenhum evento registrado.</div>`;
  sections.push(infoAcc('Histórico', 'clock', histHtml));

  return sections.join('');
}

function saveSimplesFaturamento(opId) {
  const op    = ops.find(o => o.id === opId);

// ─── POPUP DE MOTIVO DE ATRASO ──────────────────────────────────────
function showDelayModal(opId, formData, diasAtraso, dataPrevistaFmt) {
  _pendingAdvance = { opId, formData };
  document.getElementById('modal').classList.remove('wide', 'split', 'xwide');
  document.getElementById('modal').innerHTML = `
    <div class="modal-header">
      <div>
        <div class="modal-title" style="color:var(--orange);display:flex;align-items:center;gap:7px">
          ${icon('alert-triangle',15,'color:var(--orange)')} Entrega com Atraso
        </div>
        <div class="modal-subtitle">Prazo: ${dataPrevistaFmt} · <strong style="color:var(--red)">${diasAtraso} dia(s) de atraso</strong></div>
      </div>
    </div>
    <div class="modal-body" style="padding:14px 20px;gap:8px">
      <div class="form-group" style="margin:0">
        <label class="form-label">Motivo do Atraso *</label>
        <textarea class="form-textarea" id="delay-reason-input" rows="2"
          style="margin-top:4px"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cancelDelay()">Cancelar</button>
      <button class="btn-primary" style="background:var(--orange)" onclick="confirmDelay()">Confirmar Entrega</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('delay-reason-input')?.focus(), 80);
}

function confirmDelay() {
  const reason = document.getElementById('delay-reason-input')?.value?.trim();
  if (!reason) { showToast('Informe o motivo do atraso', 'err'); return; }
  if (!_pendingAdvance) { showToast('Sessão expirada - tente novamente', 'err'); closeModal(); return; }
  // Proteção duplo clique: zera _pendingAdvance antes de processar.
  // (Era `pending`, variável inexistente → ReferenceError em TODA entrega
  //  atrasada: a OP ficava presa em trânsito e o clique não fazia nada.)
  const { opId, formData } = _pendingAdvance;
  _pendingAdvance = null;
  formData.motivoAtraso = reason;
  formData.descricao = (formData.descricao ? formData.descricao + '\n' : '') + '[Atraso] ' + reason;
  // Registra no histórico como ação extra
  const op = ops.find(o => o.id === opId);
  if (op) {
    const user = getUser();
    op.history.push({ step: op.status, actor: getActiveView()?.role || 'logistica', actorName: user?.userName || user?.name || '', ts: nowTs(), action: 'Atraso: ' + reason, note: reason });
  }
  advanceOP(opId, formData);
  closeModal();
}

function cancelDelay() {
  _pendingAdvance = null;
  closeModal();
}

function submitModal() {
  if (!activeOpId || !modalMode) return;
  const op = ops.find(o => o.id === activeOpId);
  if (!op) { showToast('OP não encontrada - recarregue a página', 'err'); closeModal(); return; }
  // Se outro usuário avançou a OP enquanto o modal estava aberto, o formulário é
  // de outra etapa — abortar para não gravar dados no passo errado.
  if (_modalStatus && op.status !== _modalStatus) {
    showToast('Esta OP mudou de etapa (outro usuário avançou). Reabra para continuar.', 'err');
    closeModal(); return;
  }
  const step = STEPS[op.status];
  if (!step) { showToast('Estado inválido da OP', 'err'); closeModal(); return; }

  // Caso especial: Confirmar e Despachar (aguard_despacho → transito)
  if (op.status === 'aguard_despacho' && modalMode === 'advance') {
    const dataD = document.getElementById('f-dataDespacho')?.value;
    const horaD = document.getElementById('f-horaDespacho')?.value;
    if (!dataD || !horaD) { showToast('Preencha data e hora do despacho', 'err'); return; }
    const descDespacho = `Despachado em ${fmtDate(dataD)} às ${horaD}`;
    advanceOP(activeOpId, { dataDespacho: dataD, horaDespacho: horaD, descricao: descDespacho });
    closeModal(); return;
  }

  // Re-emission: combined aguard_nf + aguard_emissao form
  if (op.status === 'aguard_emissao' && op.stepData?.aguard_despacho_reject && modalMode === 'advance') {
    const err = id => { const e = document.getElementById(id); if(e){e.style.borderColor='var(--red)';e.style.boxShadow='0 0 0 3px rgba(220,38,38,.12)';e.focus();} };
    const addr  = document.getElementById('f-reNF_enderecoEntrega')?.value?.trim();
    if (!addr)  { err('f-reNF_enderecoEntrega'); return; }
    const ev    = collectEnvio(); if (!ev) return; // motorista+carro+placa ou transportadora
    const numNF = document.getElementById('f-numeroNF')?.value?.trim();
    const chvNF = document.getElementById('f-chaveNfe')?.value?.trim();
    const dtNF  = document.getElementById('f-dataEmissao')?.value;
    const descNF= document.getElementById('f-descricao')?.value?.trim();
    if (!numNF) { err('f-numeroNF');              return; }
    if (!dtNF)  { err('f-dataEmissao');           return; }
    if (!descNF){ err('f-descricao');             return; }
    op.stepData.aguard_nf = {
      ...(op.stepData.aguard_nf || {}),
      enderecoEntrega: addr,
      ...ev, // envioTipo, motorista/transportadora, carro, placa, tecnico
      volumes: document.getElementById('f-reNF_volumes')?.value || '',
      peso:    document.getElementById('f-reNF_peso')?.value    || '',
      descricao: document.getElementById('f-reNF_descricao')?.value?.trim() || '',
    };
    // A nota costuma continuar a MESMA (a correção sai por carta de correção),
    // então o novo arquivo é opcional: se não anexar, mantém o PDF atual.
    const rawFileNF = tempFilesData['arquivoNF'] || null;
    const prevNF    = op.stepData.aguard_emissao?.arquivoNF;
    const prevArr   = prevNF ? (Array.isArray(prevNF) ? prevNF : [prevNF]) : [];
    const fileNF    = rawFileNF ? [rawFileNF] : prevArr;
    // Re-emissão concluída: limpa o pedido de re-emissão para o aviso vermelho
    // "RE-EMISSÃO SOLICITADA" não ficar preso na OP (inclusive já entregue).
    delete op.stepData.aguard_despacho_reject;
    advanceOP(activeOpId, { numeroNF: numNF, chaveNfe: chvNF, dataEmissao: dtNF, arquivoNF: fileNF, descricao: descNF });
    closeModal(); return;
  }

  const fields = modalMode==='reject' ? (step.rejectFields||[]) : (step.formFields||[]);
  const formData = {};

  for (const f of fields) {
    if (f.type === 'equipment-list') {
      if (f.required && !tempEquipList.length) {
        const el = document.getElementById('equip-list-items');
        if (el) el.style.outline = '2px solid var(--red)';
        return;
      }
      formData.equipamentos = [...tempEquipList];
      continue;
    }
    if (f.type === 'multi-file') {
      const mfFiles = tempFilesData[f.key] || [];
      if (f.required && !mfFiles.length) {
        const el = document.getElementById('mfl-' + f.key);
        if (el) { el.style.outline='2px solid var(--red)'; el.style.borderRadius='6px'; setTimeout(()=>{ el.style.outline=''; },2500); }
        showToast(`Obrigatório: ${f.label.replace(' *','')}`, 'err');
        return;
      }
      formData[f.key] = mfFiles;
      continue;
    }
    if (f.type === 'file') {
      formData[f.key] = tempFilesData[f.key] || null;
      continue;
    }
    if (f.type === 'cep-lookup') continue; // CEP é auxiliar, não salva
    if (f.type === 'ns-equipamentos') {
      const series = [], types = [];
      let i = 0, vazio = null;
      while (document.getElementById(`f-numSerie_${i}`)) {
        const el = document.getElementById(`f-numSerie_${i}`);
        const v  = el.value.trim();
        // Série em branco fazia a máquina ser descartada lá no despacho e nunca
        // entrar no Sistema QR — o equipamento saía sem rastreabilidade.
        if (!v && !vazio) vazio = el;
        series.push(v);
        types.push(el.dataset.tracking || 'serie');
        i++;
      }
      if (vazio) {
        vazio.style.borderColor = 'var(--red)';
        vazio.style.boxShadow = '0 0 0 3px rgba(220,38,38,.12)';
        vazio.focus();
        showToast('Preencha o Nº de Série / Lote de todos os equipamentos — sem ele a máquina não é cadastrada no Sistema QR', 'err');
        return;
      }
      formData.numSeries       = series;
      formData.trackingTypes   = types;
      continue;
    }
    if (f.type === 'envio') {
      const ev = collectEnvio(); if (!ev) return;
      Object.assign(formData, ev);
      continue;
    }
    const el  = document.getElementById('f-' + f.key);
    const val = el?.value?.trim();
    if (f.required && !val) { el.style.borderColor='var(--red)'; el.style.boxShadow='0 0 0 3px rgba(220,38,38,.12)'; el.focus(); return; }
    formData[f.key] = val || '';
  }

  if (modalMode === 'reject') {
    rejectOP(activeOpId, formData);
    closeModal();
  } else {
    // Verifica atraso na entrega (transito → entregue)
    const _opChk = ops.find(o => o.id === activeOpId);
    if (_opChk?.status === 'transito' && formData.dataEntrega && _opChk.pedidoVenda?.dataPrevista) {
      const entregaDate = new Date(formData.dataEntrega + 'T12:00:00');
      const prevDate    = parseBRDate(_opChk.pedidoVenda.dataPrevista);
      if (prevDate && entregaDate > prevDate) {
        const dias = Math.ceil((entregaDate - prevDate) / 86400000);
        showDelayModal(activeOpId, formData, dias, _opChk.pedidoVenda.dataPrevista);
        return; // aguarda confirmação no popup
      }
    }
    advanceOP(activeOpId, formData);
    closeModal();
  }
}

// ─── LIGHTBOX - imagens e PDFs ──────────────────────────────────────
function showLightbox(src, name) {
  const isPdf = /\.pdf$/i.test(name || '') || src.startsWith('data:application/pdf');
  let lb = document.getElementById('img-lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'img-lightbox';
    lb.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px';
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.style.display = 'none'; });
    document.body.appendChild(lb);
  }
  // Botão fechar sempre visível (essencial para PDF onde clicar no iframe não fecha)
  const closeBtn = `<button onclick="document.getElementById('img-lightbox').style.display='none'"
    style="position:absolute;top:14px;right:18px;background:rgba(255,255,255,.15);border:none;color:#fff;
      border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;line-height:1;
      display:flex;align-items:center;justify-content:center">×</button>`;

  if (isPdf) {
    lb.onclick = null; // iframe consome o clique - usa só o botão X e o Esc
    lb.innerHTML = `
      ${closeBtn}
      <div style="color:#fff;font-size:11px;font-family:'DM Mono',monospace;margin-bottom:10px;opacity:.65">${name}</div>
      <iframe src="${src}" style="width:min(960px,95vw);height:calc(100vh - 130px);border:none;border-radius:6px;background:#fff"></iframe>`;
  } else {
    lb.onclick = () => { lb.style.display = 'none'; };
    lb.innerHTML = `
      ${closeBtn}
      <div style="color:#fff;font-size:11px;font-family:'DM Mono',monospace;margin-bottom:10px;opacity:.65">${name}</div>
      <img src="${src}" alt="${name}" style="max-width:100%;max-height:calc(100vh - 120px);border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.6);cursor:zoom-out" onclick="document.getElementById('img-lightbox').style.display='none'">
      <div style="color:#fff;font-size:10px;margin-top:10px;opacity:.45">Clique na imagem ou Esc para fechar</div>`;
  }
  lb.style.display = 'flex';
}

function showDupPedidoWarn(dupOp, num, onContinue) {
  const el = document.createElement('div');
  el.id = '_dup-warn';
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;display:flex;align-items:center;justify-content:center';
  el.innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 26px;max-width:420px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,.35)">
