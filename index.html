<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f0f3f7; --surface: #ffffff; --surface2: #f0f4f8;
  --border: #dde3ed; --border2: #c8d3e3;
  --text: #0f1f35; --text2: #3d5170; --text3: #5f7391;
  --accent: #2672B8; --accent2: #162C45;
  --azul-claro: #91B0DC; --azul-noturno: #162C45;
  --green: #16a34a; --green-bg: rgba(22,163,74,.08);
  --yellow: #ca8a04; --yellow-bg: rgba(202,138,4,.08);
  --orange: #ea580c; --orange-bg: rgba(234,88,12,.08);
  --red: #dc2626; --red-bg: rgba(220,38,38,.08);
  --gray: #6b7280; --gray-bg: rgba(107,114,128,.08);
  --blue: #2672B8; --blue-bg: rgba(38,114,184,.08);
  --purple: #7c3aed; --purple-bg: rgba(124,58,237,.08);
  --teal: #0d9488; --teal-bg: rgba(13,148,136,.08);
  --radius: 8px; --radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
/* Enquadramento geral um pouco mais compacto (equivale a ~90% de zoom, embutido). */
#appContainer { zoom: 0.9; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--azul-claro); border-radius: 3px; }
/* Campos puxados do Protheus: bloqueio com lápis/confirmar/cancelar */
.fl-wrap { display: flex; gap: 3px; align-items: flex-start; }
.fl-btn { background: none; border: none; cursor: pointer; padding: 4px; color: var(--text3); display: flex; align-items: center; border-radius: 5px; flex-shrink: 0; }
.fl-btn:hover { background: var(--surface2); color: var(--text); }
.fl-btn.fl-ok { color: var(--green); }
.fl-btn.fl-cancel { color: var(--red); }

/* HEADER */
header {
  padding: 0 24px;
  height: 58px;
  background: linear-gradient(135deg, #162C45 0%, #1e3a5f 60%, #24336E 100%);
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 0;
  box-shadow: 0 2px 20px rgba(22,44,69,.45), inset 0 1px 0 rgba(255,255,255,.07);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
/* Logo group */
.logo { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.logo-divider {
  width: 1px; height: 28px; background: rgba(255,255,255,.15); flex-shrink: 0;
}
.logo-text-group { display: flex; flex-direction: column; gap: 1px; }
.logo-text { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -.3px; line-height: 1; }
.logo-sub  { font-size: 9px; color: rgba(255,255,255,.4); font-family: 'DM Mono', monospace; letter-spacing: .5px; text-transform: uppercase; }

/* Header center: view switcher do gestor */
.header-center {
  flex: 1; display: flex; justify-content: center; align-items: center;
}
/* View switcher */
.view-switcher {
  display: flex; align-items: center; gap: 3px;
  background: rgba(0,0,0,.18); border-radius: 8px; padding: 3px;
}
.view-btn {
  padding: 4px 9px; border-radius: 6px; border: none;
  background: transparent; color: rgba(255,255,255,.55);
  font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700;
  cursor: pointer; transition: all .15s; letter-spacing: .3px;
  white-space: nowrap;
}
.view-btn:hover { background: rgba(255,255,255,.12); color: rgba(255,255,255,.85); }
.view-btn.active { background: rgba(255,255,255,.22); color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
/* Header right group */
.header-right {
  display: flex; align-items: center; gap: 10px;
  padding-right: 4px;
}

/* NEW OP BUTTON */
.btn-nova-op {
  padding: 7px 15px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.22);
  color: #fff;
  border-radius: 8px;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all .15s;
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn-nova-op:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.4); }

/* ROLE SELECTOR (legacy, mantido para compatibilidade) */
.role-selector { display: flex; gap: 4px; flex-wrap: wrap; }
.role-btn {
  padding: 5px 11px; border-radius: 20px; border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08); color: rgba(255,255,255,.75);
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px;
}
.role-btn:hover { background: rgba(255,255,255,.18); color: #fff; }
.role-btn.active { border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.22); color: #fff; }

/* TABS */
.tabs { padding: 0 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; height: 42px; min-height: 42px; max-height: 42px; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.04); position: relative; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 0 12px; height: 100%; border: none; background: transparent;
  color: var(--text3); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; position: relative; transition: color .15s; display: flex; align-items: center; gap: 7px;
  flex-shrink: 0;
}
.tab-btn::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: transparent; border-radius: 2px 2px 0 0; transition: background .15s; }
.tab-btn.active { color: var(--text); }
.tab-btn.active::after { background: var(--accent); }
.tab-count { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px; font-size: 10px; font-family: 'DM Mono', monospace; }
.tab-btn.active .tab-count { background: var(--accent); border-color: var(--accent); color: #fff; }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0 rgba(220,38,38,.55); animation: notifPulse 1.6s infinite; }
@keyframes notifPulse { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,.55); } 70% { box-shadow: 0 0 0 6px rgba(220,38,38,0); } 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); } }
@media (prefers-reduced-motion: reduce) { .notif-dot { animation: none; } }

/* MAIN */
main { padding: 24px; }
.step-header { margin-bottom: 20px; }
.step-title { font-size: 18px; font-weight: 700; }
.step-desc { font-size: 12px; color: var(--text3); margin-top: 3px; }

/* CARD GRID */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

/* CARD */
.card {
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  border-radius: var(--radius-lg); padding: 12px 13px;
  cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .1s;
  animation: cardIn .25s ease both;
}
@keyframes cardIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.card:hover { border-color: var(--border2); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.card.actionable { border-color: rgba(38,114,184,.2); }
.card.actionable:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(38,114,184,.15); }
.card.blocked { border-color: rgba(220,38,38,.2); }
.card.blocked:hover { border-color: var(--red); }
.card.entregue { border-color: rgba(22,163,74,.35); background: rgba(22,163,74,.025); }
.card.entregue:hover { border-color: var(--green); box-shadow: 0 4px 12px rgba(22,163,74,.1); }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-op { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); font-weight: 600; }
.card-flags { display: flex; gap: 3px; flex-wrap: wrap; }
.flag { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; font-family: 'DM Mono', monospace; }
.flag-dir   { background: rgba(234,88,12,.1);  color: var(--orange); border: 1px solid rgba(234,88,12,.25); }
.flag-div   { background: rgba(220,38,38,.1);  color: var(--red);    border: 1px solid rgba(220,38,38,.25); }
.flag-multi { background: rgba(124,58,237,.1); color: var(--purple); border: 1px solid rgba(124,58,237,.25); }

.card-client { font-size: 13px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
.equip-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; min-width: 0; }
.equip-chip { display: inline-block; padding: 1px 7px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 5px; font-size: 10px; font-family: 'DM Mono', monospace; color: var(--text2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }

/* BADGE */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .2px; }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; }
.b-blue   { background: var(--blue-bg);   color: var(--blue);   }
.b-yellow { background: var(--yellow-bg); color: var(--yellow); }
.b-orange { background: var(--orange-bg); color: var(--orange); }
.b-purple { background: var(--purple-bg); color: var(--purple); }
.b-teal   { background: var(--teal-bg);   color: var(--teal);   }
.b-green  { background: var(--green-bg);  color: var(--green);  }
.b-red    { background: var(--red-bg);    color: var(--red);    }
.b-gray   { background: var(--gray-bg);   color: var(--gray);   }

/* SEMA */
.sema { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-family: 'DM Mono', monospace; }

/* PIPELINE BAR */
.pipe-bar { display: flex; gap: 3px; margin-bottom: 6px; }
.pipe-dot { flex: 1; height: 3px; border-radius: 2px; background: var(--border); }
.pipe-dot.done    { background: var(--green); }
.pipe-dot.current { background: var(--accent); }
.pipe-dot.blocked { background: var(--red); }

/* CARD LAST EVENT */
.card-last-event { margin-top: 6px; font-size: 10px; color: var(--text3); line-height: 1.35; border-top: 1px solid var(--border); padding-top: 6px; }

/* CARD FOOTER */
.card-footer { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.btn-action { width: 100%; padding: 9px; border-radius: var(--radius); background: var(--accent); border: none; color: #fff; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
.btn-action:hover { background: var(--accent2); }
.btn-action.danger { background: transparent; border: 1px solid rgba(220,38,38,.25); color: var(--red); }
.btn-action.danger:hover { background: var(--red-bg); border-color: var(--red); }
.btn-action.warn { background: transparent; border: 1px solid rgba(234,88,12,.25); color: var(--orange); }
.btn-action.warn:hover { background: var(--orange-bg); border-color: var(--orange); }

/* SECTION */
.section { margin-bottom: 32px; }
.section-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; margin-bottom: 14px;
  border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: 0 1px 4px rgba(22,44,69,.06);
}
.section-header-icon {
  width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center; flex-shrink: 0;
}
.section-header-title { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
.section-header-desc  { font-size: 11px; color: var(--text3); margin-top: 1px; }
.section-header-count {
  font-size: 12px; font-weight: 700; min-width: 24px; height: 24px;
  border-radius: 12px; display: grid; place-items: center; padding: 0 7px;
}
.section-header.collapsible { cursor: pointer; user-select: none; }
.section-header.collapsible:hover { background: var(--surface2); }
.sec-chevron { color: var(--text3); flex-shrink: 0; transition: transform .2s; }
.sec-chevron.collapsed { transform: rotate(-90deg); }
/* legado */
.section-label { font-size: 10px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); margin-bottom: 10px; padding: 5px 10px; background: var(--surface2); border-radius: 6px; display: inline-block; }

/* EMPTY */
.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-icon { font-size: 32px; margin-bottom: 10px; }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
.empty-desc { font-size: 12px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 300; opacity: 0; pointer-events: none; transition: opacity .2s; display: grid; place-items: center; padding: 20px; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 480px; transform: scale(.97) translateY(8px); transition: transform .2s; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
.modal-overlay.open .modal { transform: scale(1) translateY(0); }
.modal.wide { max-width: 620px; }
.modal.xwide { max-width: 920px; }
.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; position: sticky; top: 0; background: var(--surface); z-index: 1; flex-shrink: 0; }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-subtitle { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; }
.close-btn { width: 26px; height: 26px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); cursor: pointer; font-size: 14px; display: grid; place-items: center; flex-shrink: 0; transition: all .15s; }
.close-btn:hover { background: var(--border); color: var(--text); }
.modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; }

.op-info-block { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.op-info-client { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
.op-info-meta { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; display: flex; gap: 10px; flex-wrap: wrap; }

/* FORM FIELDS */
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 10px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .6px; color: var(--text3); }
.form-input, .form-select, .form-textarea {
  padding: 8px 11px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 13px;
  font-family: 'Inter', sans-serif; outline: none; transition: border-color .15s; width: 100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(38,114,184,.1); }
/* Foco de teclado visível em tudo que é clicável (acessibilidade). */
:where(button, a, input, select, textarea, [tabindex], [role="button"]):focus-visible {
  outline: 2px solid var(--accent) !important; outline-offset: 2px; border-radius: 6px;
}
.form-textarea { resize: vertical; min-height: 68px; }
.form-select option { background: var(--surface); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* EQUIPMENT LIST */
.equip-picker { display: flex; flex-direction: column; gap: 8px; }
.equip-add-row { display: flex; gap: 6px; }
.equip-add-row .form-select { flex: 1; }
.btn-add-equip {
  padding: 8px 14px; background: var(--accent); border: none; color: #fff;
  border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background .15s; flex-shrink: 0;
}
.btn-add-equip:hover { background: var(--accent2); }
.equip-list-items { display: flex; flex-direction: column; gap: 5px; }
.equip-list-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 10px;
}
.equip-list-item-name { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text); }
.equip-list-item-qty { display: flex; align-items: center; gap: 6px; }
.equip-qty-btn { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; display: grid; place-items: center; transition: background .1s; }
.equip-qty-btn:hover { background: var(--border2); }
.equip-qty-val { font-size: 12px; font-family: 'DM Mono', monospace; width: 20px; text-align: center; }
.equip-remove { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1; transition: color .1s; }
.equip-remove:hover { color: var(--red); }
.equip-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 10px; background: var(--surface2); border: 1px dashed var(--border2); border-radius: 6px; }

/* FILE UPLOAD */
.file-upload-area {
  border: 1.5px dashed var(--border2); border-radius: var(--radius);
  padding: 14px; text-align: center; cursor: pointer; transition: all .15s;
  background: var(--surface2);
}
.file-upload-area:hover { border-color: var(--accent); background: rgba(38,114,184,.05); }
.file-upload-area.has-file { border-color: var(--green); background: var(--green-bg); border-style: solid; }
.file-upload-text { font-size: 12px; color: var(--text3); }
.file-upload-text.has-file { color: var(--green); font-weight: 600; }

/* MULTI-FILE UPLOAD */
.multi-file-wrap { display: flex; flex-direction: column; gap: 6px; }
.multi-file-list { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.multi-file-item { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 5px 9px; }
.multi-file-item-name { flex: 1; font-size: 11px; font-family: 'DM Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multi-file-item-size { font-size: 10px; color: var(--text3); white-space: nowrap; }
.multi-file-remove { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 15px; padding: 0 2px; line-height: 1; transition: color .1s; flex-shrink: 0; }
.multi-file-remove:hover { color: var(--red); }
.multi-file-add-btn { display: block; padding: 8px 12px; background: var(--surface2); border: 1.5px dashed var(--border2); border-radius: var(--radius); font-size: 12px; color: var(--text2); cursor: pointer; transition: all .15s; text-align: center; width: 100%; font-family: 'Inter', sans-serif; }
.multi-file-add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(38,114,184,.05); }

/* BUTTONS */
.btn-primary { padding: 8px 18px; background: var(--accent); border: none; color: #fff; border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
.btn-primary:hover { background: var(--accent2); }
.btn-primary.orange { background: var(--orange); }
.btn-primary.orange:hover { background: #c94f0b; }
.btn-primary.red { background: var(--red); }
.btn-primary.red:hover { background: #b91c1c; }
.btn-cancel { padding: 8px 18px; background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
.btn-cancel:hover { border-color: var(--border2); color: var(--text); }

/* WARN BLOCK */
.warn-block { padding: 10px 12px; border-radius: var(--radius); background: var(--orange-bg); border: 1px solid rgba(234,88,12,.2); font-size: 12px; color: var(--text2); line-height: 1.5; }
.warn-block strong { color: var(--orange); }
.info-block { padding: 10px 12px; border-radius: var(--radius); background: var(--blue-bg); border: 1px solid rgba(38,114,184,.15); font-size: 12px; color: var(--text2); line-height: 1.5; }
.info-block strong { color: var(--accent); }
.success-block { padding: 10px 12px; border-radius: var(--radius); background: var(--green-bg); border: 1px solid rgba(22,163,74,.15); font-size: 12px; color: var(--text2); line-height: 1.5; }
.success-block strong { color: var(--green); }

/* DETAIL GRID */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.detail-item { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px; }
.detail-label { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; color: var(--text3); margin-bottom: 3px; }
.detail-value { font-size: 12px; font-weight: 600; word-break: break-word; overflow-wrap: break-word; }

/* HISTORY */
.history-item { display: flex; gap: 10px; }
.history-ts { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); width: 80px; flex-shrink: 0; padding-top: 1px; line-height: 1.4; }
.history-text { font-size: 12px; color: var(--text2); line-height: 1.5; }
.history-author { color: var(--text); font-weight: 600; }

/* SKIP BADGE */
.skip-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--teal-bg); border: 1px solid rgba(13,148,136,.2); border-radius: 20px; font-size: 10px; color: var(--teal); font-family: 'DM Mono', monospace; }

/* SECTION DIVIDER */
.form-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
@keyframes rastPulse { 0%,100%{box-shadow:0 0 0 0 rgba(38,114,184,.35)} 50%{box-shadow:0 0 0 5px rgba(38,114,184,0)} }
@keyframes spin  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.badge.b-blue .badge-dot, .badge.b-yellow .badge-dot, .badge.b-orange .badge-dot, .badge.b-teal .badge-dot { animation: pulse 2s infinite; }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.api-status { font-size:10px; font-family:'DM Mono',monospace; min-height:13px; margin-top:3px; line-height:1.3; }

/* SPLIT ACTION MODAL */
/* NOTA: overlay usa display:grid;place-items:center - max-height sozinho não
   dá altura definitiva ao modal, então flex:1 nos filhos não funciona.
   Solução: height:90vh dá altura concreta para a cadeia de flex/grid funcionar. */
.modal.split {
  max-width: 940px;
  height: 90vh;
  max-height: 90vh;
  overflow: hidden !important;
  overflow-y: hidden !important;
  display: flex;
  flex-direction: column;
}
.modal-split-body {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr;   /* força a row a preencher a altura do body */
  overflow: hidden;
}
.split-pane {
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
  min-width: 0;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.split-pane-left {
  border-right: 1px solid var(--border);
  background: var(--surface2);
  order: 1;
  padding: 0;
  gap: 0;
  overflow-y: hidden; /* scroll é gerenciado pelo .split-pane-left-scroll interno */
}
.split-pane-right { order: 2; }
.split-pane-left-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface2);
}
.split-pane-left-scroll {
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1;
  min-height: 0;
  min-width: 0;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.split-pane-header { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .9px; color: var(--text3); padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 2px; flex-shrink: 0; }
.ctx-sec { display: flex; flex-direction: column; gap: 7px; }
.ctx-sec-title { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .7px; color: var(--text3); border-bottom: 1px solid var(--border); padding-bottom: 3px; }
.ctx-row { display: flex; flex-direction: column; gap: 2px; }
.ctx-label { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .4px; color: var(--text3); }
.ctx-value { font-size: 12px; color: var(--text); line-height: 1.4; }
@media (max-width: 760px) {
  .modal.split { max-width: 98vw; height: 95vh; max-height: 95vh; }
  .modal-split-body { grid-template-columns: 1fr; overflow-y: auto; }
  .split-pane-left { max-height: 260px; border-right: none; border-bottom: 1px solid var(--border); order: 2; }
  .split-pane-right { order: 1; overflow-y: visible; }
}

/* ACCORDION */
[hidden] { display: none !important; }
.acc { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }
.acc + .acc { margin-top: 8px; }
.acc-head {
  padding: 11px 13px; min-height: 40px; display: flex; justify-content: space-between; align-items: center;
  background: var(--surface2); cursor: pointer; user-select: none;
  font-size: 12px; font-weight: 700; transition: background .12s;
}
.acc-head:hover { background: var(--border); }
.acc-arrow { color: var(--text3); transition: transform .18s; display: inline-flex; align-items: center; flex-shrink: 0; }
.acc-body { padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); }

/* EQUIP SEARCH DROPDOWN */
.equip-search-wrap { position: relative; }
.equip-dropdown {
  position: absolute; top: calc(100% + 3px); left: 0; right: 0; z-index: 250;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 8px 28px rgba(22,44,69,.14);
  max-height: 220px; overflow-y: auto; display: none;
}
.equip-dropdown.open { display: block; }
.equip-dropdown-item {
  padding: 7px 12px; cursor: pointer; font-size: 12px;
  font-family: 'DM Mono', monospace; transition: background .08s;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.equip-dropdown-item:last-child { border-bottom: none; }
.equip-dropdown-item:hover, .equip-dropdown-item.focused { background: var(--surface2); }
.equip-dropdown-name { flex: 1; color: var(--text); font-size: 11.5px; }
.equip-dropdown-code { font-size: 10px; color: var(--accent); background: var(--blue-bg); padding: 1px 5px; border-radius: 4px; flex-shrink: 0; }

/* KANBAN */
.kanban-wrap {
  overflow-x: auto;
  overflow-y: hidden;
  min-height: 300px;
}
.kanban-board {
  display: flex; gap: 8px; align-items: flex-start; padding: 2px 1px;
}
/* 6 colunas dividem a largura disponível (encolhem para caber sem scroll horizontal). */
.kanban-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.kanban-col-head {
  padding: 8px 11px 7px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0;
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.kanban-col-name { font-size: 11px; font-weight: 700; white-space: nowrap; }
.kanban-col-body {
  background: var(--surface2); border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 60px;
  overflow-y: auto; max-height: 72vh;
}
.kanban-col-body .card { animation: none; }
.kanban-empty { font-size: 11px; color: var(--text3); text-align: center; padding: 14px 6px; }

/* Kanban mode: layout travado no viewport, barra h-scroll sempre visível na base */
body.kanban-mode { overflow: hidden; }
body.kanban-mode main {
  height: calc(100vh - 58px - 42px);
  padding: 24px 24px 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
body.kanban-mode .kanban-wrap {
  flex: 1;
  min-height: 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 8px;
}
body.kanban-mode .kanban-board {
  height: 100%;
  align-items: stretch;
}
body.kanban-mode .kanban-col { height: 100%; }
body.kanban-mode .kanban-col-body {
  flex: 1;
  min-height: 0;
  max-height: none;
  overflow-y: auto;
}

/* ── LOGIN SCREEN ──────────────────────────────────────────────── */
#loginScreen {
  position: fixed; inset: 0; z-index: 9999;
  background: #eef1f6;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  font-family: 'Inter', sans-serif;
}
.login-card {
  width: 100%; max-width: 420px;
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 16px 60px rgba(22,44,69,.18), 0 2px 8px rgba(22,44,69,.08);
  overflow: hidden;
}
.login-card-header {
  background: linear-gradient(135deg, #162C45 0%, #24336E 100%);
  padding: 32px 28px 28px;
  text-align: center;
}
.login-logo {
  height: 32px; width: auto;
  filter: brightness(0) invert(1);
  margin-bottom: 14px;
  display: block; margin-left: auto; margin-right: auto;
}
.login-title {
  font-size: 20px; font-weight: 700; color: #fff;
  letter-spacing: -.3px;
}
.login-card-body { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.login-field { display: flex; flex-direction: column; gap: 6px; }
.login-label {
  font-size: 10px; font-weight: 700; letter-spacing: .8px;
  color: #8096b3; font-family: 'DM Mono', monospace; text-transform: uppercase;
}
.login-input-wrap {
  position: relative; display: flex; align-items: center;
  border: 1.5px solid #dde3ed; border-radius: 10px; background: #f8fafc;
  transition: border-color .15s;
}
.login-input-wrap:focus-within { border-color: #2672B8; background: #fff; }
.login-input-icon {
  position: absolute; left: 13px; color: #8096b3; pointer-events: none;
  display: flex; align-items: center;
}
.login-input {
  width: 100%; padding: 12px 42px;
  border: none; background: transparent; outline: none;
  font-family: 'Inter', sans-serif; font-size: 14px; color: #0f1f35;
}
.login-input::placeholder { color: #aab5c8; }
.login-eye-btn {
  position: absolute; right: 12px; background: none; border: none;
  cursor: pointer; color: #8096b3; display: flex; align-items: center;
  padding: 4px; border-radius: 4px; transition: color .15s;
}
.login-eye-btn:hover { color: #3d5170; }
.login-error {
  font-size: 12px; color: #dc2626; text-align: center;
  min-height: 16px; font-weight: 500;
}
.login-btn {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, #162C45 0%, #24336E 100%);
  color: #fff; border: none; border-radius: 10px;
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity .15s; display: flex; align-items: center;
  justify-content: center; gap: 8px; margin-top: 4px;
}
.login-btn:hover:not(:disabled) { opacity: .88; }
.login-btn:disabled { opacity: .55; cursor: default; }
.login-card-footer {
  text-align: center; padding: 14px;
  font-size: 11px; color: #aab5c8; border-top: 1px solid #eef1f6;
  font-family: 'DM Mono', monospace;
}
/* ── USER WIDGET (header) ──────────────────────────────────────── */
.user-widget {
  display: flex; align-items: center; gap: 10px;
}
.user-widget-info {
  display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
}
.user-widget-name {
  font-size: 9px; font-weight: 600; color: rgba(255,255,255,.7);
  white-space: nowrap; line-height: 1; text-align: center;
  max-width: 60px; overflow: hidden; text-overflow: ellipsis;
}
.user-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,.1));
  border: 2px solid rgba(255,255,255,.35);
  display: grid; place-items: center; color: rgba(255,255,255,.9);
  overflow: hidden; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.2), 0 0 0 4px rgba(255,255,255,.06), 0 4px 20px rgba(0,0,0,.35);
}
.user-avatar svg { display: block; }
.logout-btn {
  padding: 5px 11px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.08); color: rgba(255,255,255,.7);
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px;
  white-space: nowrap;
}
.logout-btn:hover { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.3); }

/* ═══════════════════════════════════════════════════
   RESPONSIVIDADE
   ═══════════════════════════════════════════════════ */

  main { padding: 16px; }
}
@media (max-width: 680px) {
  header { padding: 0 12px; height: 50px; }
  .logo-icon { width: 28px; height: 28px; }
  .logo-text { font-size: 12px; }

  .view-switcher { gap: 2px; }

  .user-widget { gap: 6px; }
  .user-widget-name { display: none; }
  .tabs { padding: 0 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .step-title { font-size: 15px; }
  .card-grid { grid-template-columns: 1fr; gap: 10px; }
  .form-row { grid-template-columns: 1fr !important; }
  .modal-overlay { padding: 6px; align-items: flex-end; }
  .modal { border-radius: var(--radius-lg) var(--radius-lg) 0 0; max-height: 92vh; }
  .modal.wide { max-width: 100%; }
  .modal.xwide { max-width: 100%; }
  .modal.split { flex-direction: column !important; }
  .modal.split > * { width: 100% !important; max-width: 100% !important; }
  .login-card { border-radius: 14px; padding: 22px 18px; }
  .login-card-header { padding: 0 0 18px; }
  .section-header { padding: 10px 12px; }
  .card-grid .card { animation: none; }
}
@media (max-width: 420px) {
  main { padding: 8px; }
  .modal-overlay { padding: 0; }

}

<!-- LOADING SCREEN (visível enquanto a sessão é verificada) -->
<div id="loadingScreen" style="position:fixed;inset:0;z-index:10000;background:#eef1f6;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px">
  <img id="loadingLogo" alt="Contourline" style="width:auto;height:56px;max-width:200px;opacity:.85">
  <svg style="animation:spin 0.85s linear infinite;width:22px;height:22px;color:#94a3b8" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" stroke-dasharray="31.4 62.8" stroke-linecap="round"/>
  </svg>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="login-card-header">
      <img id="loginLogo" class="login-logo" alt="Contourline">
      <div class="login-title">Fluxo de Vendas</div>
    </div>
    <!-- PAINEL 1: Credenciais -->
    <div class="login-card-body" id="loginCredPanel" style="">
      <div class="login-field">
        <label class="login-label">E-mail</label>
        <div class="login-input-wrap">
          <span class="login-input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input class="login-input" id="loginEmail" type="email" placeholder="seu@contourline.com.br" autocomplete="username"
            onkeydown="if(event.key==='Enter')document.getElementById('loginPassword').focus()">
        </div>
      </div>
      <div class="login-field">
        <label class="login-label">Senha</label>
        <div class="login-input-wrap">
          <span class="login-input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input class="login-input" id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password"
            onkeydown="if(event.key==='Enter')doLogin()">
          <button class="login-eye-btn" type="button" onclick="toggleLoginPwd(this)" title="Mostrar/ocultar senha">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div id="loginError" class="login-error"></div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Entrar
      </button>
      <button type="button" onclick="showResetPanel()" style="display:none;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:2px;align-self:center">Esqueci minha senha</button>
    </div>

    <!-- PAINEL 2: Recuperar senha por código de e-mail -->
    <div class="login-card-body" id="loginResetPanel" style="display:none">
      <!-- Etapa 1: e-mail -->
      <div id="resetStep1">
        <div class="login-field">
          <label class="login-label">E-mail da conta</label>
          <div class="login-input-wrap">
            <span class="login-input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input class="login-input" id="resetEmail" type="email" placeholder="seu@contourline.com.br" autocomplete="username" onkeydown="if(event.key==='Enter')enviarCodigoReset()">
          </div>
        </div>
        <div id="resetError" class="login-error"></div>
        <button class="login-btn" id="resetSendBtn" onclick="enviarCodigoReset()">Enviar código</button>
        <button type="button" onclick="showLoginPanel()" style="background:none;border:none;color:var(--text3);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:2px;align-self:center">Voltar ao login</button>
      </div>
      <!-- Etapa 2: código + nova senha -->
      <div id="resetStep2" style="display:none">
        <div style="font-size:12.5px;color:var(--text2);line-height:1.5">Enviamos um código para <b id="resetEmailShow"></b>. Digite-o abaixo e defina a nova senha.</div>

          <label class="login-label">Código do e-mail</label>
          <div class="login-input-wrap"><input class="login-input" id="resetCode" inputmode="numeric" placeholder="000000" autocomplete="one-time-code" style="letter-spacing:3px"></div>
        </div>
        <div class="login-field">
          <label class="login-label">Nova senha</label>
          <div class="login-input-wrap"><input class="login-input" id="resetNew" type="password" placeholder="mínimo 8 caracteres" autocomplete="new-password"></div>
        </div>
        <div class="login-field">
          <label class="login-label">Confirmar nova senha</label>

        </div>
        <div id="resetError2" class="login-error"></div>
        <button class="login-btn" id="resetSaveBtn" onclick="redefinirComCodigo()">Redefinir senha</button>
        <button type="button" onclick="showLoginPanel()" style="background:none;border:none;color:var(--text3);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:2px;align-self:center">Cancelar</button>
      </div>
    </div>

    <!-- PAINEL 3: Definir nova senha (senha expirada / temporária) -->
    <div class="login-card-body" id="loginNewPassPanel" style="display:none">
      <div style="font-size:13px;color:var(--text);line-height:1.5;background:var(--yellow-bg);border:1px solid rgba(234,179,8,.35);border-radius:8px;padding:10px 12px">
        <b>Defina uma nova senha</b> para continuar.
      </div>
      <div class="login-field">
        <label class="login-label">Nova senha</label>

          <input class="login-input" id="np-new" type="password" placeholder="mínimo 8 caracteres" autocomplete="new-password">
        </div>
      </div>
      <div class="login-field">
        <label class="login-label">Confirmar nova senha</label>
        <div class="login-input-wrap">
          <span class="login-input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input class="login-input" id="np-confirm" type="password" placeholder="repita a nova senha" autocomplete="new-password" onkeydown="if(event.key==='Enter')salvarSenhaForcada()">
        </div>
      </div>
      <div id="np-err" class="login-error"></div>
      <button class="login-btn" id="np-save" onclick="salvarSenhaForcada()">Salvar e entrar</button>
    </div>

    <div class="login-card-footer">Rede interna · Acesso restrito</div>
  </div>
</div>

<!-- APP -->
<div id="appContainer" style="display:none">

let _equipCache   = null;  // null = ainda não carregado
let _equipLoading = false;

async function loadEquipItems() {
  if (_equipCache || _equipLoading) return;
  _equipLoading = true;
  try {
    const res = await apiFetch('/api/retail-items?v=5');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    if (Array.isArray(d.items) && d.items.length) {
      _equipCache = d.items; // [{code, name, price, tracking}]
      console.log('[equip] cache:', _equipCache.length, 'itens do Protheus');
      // Atualiza placeholder do input de busca se já estiver visível
      const inp = document.getElementById('equip-search-input');
      if (inp) inp.placeholder = 'Buscar por nome ou código…';
    }
  } catch (e) {
    console.warn('[equip] API falhou:', e.message);
    // Sem fallback - informa o usuário
    const inp = document.getElementById('equip-search-input');
    if (inp) inp.placeholder = 'Catálogo indisponível - verifique a conexão';
  } finally {
    _equipLoading = false;
  }
}

// Busca flexível: suporta múltiplas palavras, prioriza código exato/parcial e início do nome
function equipSearch(query) {
  const list  = _equipCache;
  if (!list) return []; // cache ainda carregando
  const q     = query.trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/\s+/).filter(Boolean);

  const scored = list.map(e => {
    const nl = e.name.toLowerCase();
    const cl = (e.code || '').toLowerCase();

    if (cl === q)          return { e, s: 100 }; // código exato
    if (nl === q)          return { e, s: 99  }; // nome exato
    if (cl.startsWith(q))  return { e, s: 85  }; // código começa com query
    if (cl.includes(q))    return { e, s: 80  }; // código contém query ("1069" acha "001069")
    if (nl.startsWith(q))  return { e, s: 70  }; // nome começa com query
    const allIn = words.every(w => nl.includes(w) || cl.includes(w));
    if (!allIn) return null;
    const pos = Math.max(0, nl.indexOf(words[0]));
    return { e, s: Math.max(5, 50 - pos) };      // todas as palavras presentes
  }).filter(Boolean);

  scored.sort((a, b) => b.s - a.s || a.e.name.localeCompare(b.e.name, 'pt-BR'));
  return scored.slice(0, 30).map(x => x.e);
}

/**
 * fetch para as rotas /api/* com o token da sessão.
 * As funções serverless (Protheus, Azul, Sistema QR) rodam com credenciais da
 * empresa; sem este header elas respondem 401. Use SEMPRE isto em vez de fetch
 * cru ao chamar /api — senão a rota quebra em produção.
 */
async function apiFetch(url, opts = {}) {
  let token = '';
  try {
    const { data } = await sb.auth.getSession();
    token = data?.session?.access_token || '';
  } catch { /* sem sessão → a rota devolve 401 e o chamador trata */ }
  return fetch(url, {
    ...opts,
    headers: {
      ...(opts.headers || {}),
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
  });
}

function rowToOp(row) {
  if (!row || !row.data || !row.data.status || !row.data.cliente) return null;
  // _loadedAt = carimbo da linha quando lemos; usado pela trava otimista do dbSaveOp
  return { ...row.data, id: Number(row.id), _loadedAt: row.updated_at || null };
}

// ── ROTAS: camada de dados (tabela rotas, mesmo padrão de ops) ──────
function rowToRota(row) {
  if (!row || !row.data) return null;
  return { ...row.data, id: Number(row.id), _loadedAt: row.updated_at || null };
}
async function carregarRotas() {
  const { data, error } = await sb.from('rotas').select('id,data,updated_at').order('id', { ascending: false });
  if (error) { console.warn('Rotas indisponíveis (rode a migração 2026-07-16-rotas.sql):', error.message); rotas = []; }
  else rotas = (data || []).map(rowToRota).filter(Boolean);
  if (currentTab === 'logistica' && !_editandoObs) renderMain();
}
function startRotasRealtime() {
  try {
    sb.channel('rotas-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rotas' }, payload => {
        if (payload.eventType === 'DELETE') rotas = rotas.filter(r => r.id !== Number(payload.old.id));
        else { const r = rowToRota(payload.new); if (r) { const i = rotas.findIndex(x => x.id === r.id); if (i >= 0) rotas[i] = r; else rotas.unshift(r); } }
        if (currentTab === 'logistica' && !_editandoObs) renderMain();
      }).subscribe();
  } catch (e) { console.warn('Realtime de rotas indisponível:', e.message); }
}
async function saveRota(rota) {
  const payload = { ...rota }; delete payload._loadedAt; delete payload.id;
  let error;
  if (rota.id) ({ error } = await sb.from('rotas').update({ data: payload }).eq('id', rota.id));
  else         ({ error } = await sb.from('rotas').insert({ data: payload }));
  if (error) { showToast('Erro ao salvar rota: ' + error.message, 'err'); return false; }
  await carregarRotas();
  return true;
}
async function excluirRota(id) {
  const { error } = await sb.from('rotas').delete().eq('id', id);
  if (error) { showToast('Erro ao excluir rota: ' + error.message, 'err'); return; }
  rotas = rotas.filter(r => r.id !== id);
  renderMain();
  showToast('Rota excluída', 'ok');
}
// Remove a OP de todas as rotas (parada de entrega) e salva as afetadas.
// Usado ao cancelar ou ao concluir a entrega — evita roteirizar entrega morta.
async function removerOpDasRotas(opId) {
  const id = Number(opId);
  const afetadas = rotas.filter(r => (r.paradas || []).some(p => p.tipo === 'entregar' && Number(p.opId) === id));
  for (const r of afetadas) {
    r.paradas = r.paradas.filter(p => !(p.tipo === 'entregar' && Number(p.opId) === id));
    await saveRota(r);
  }
}

// Uma parada de entrega só é válida se a OP ainda existe e não foi cancelada/entregue.
// Guarda de exibição para rotas antigas que ficaram com paradas "mortas".
function entregaParadaAtiva(p) {
  if (p.tipo !== 'entregar') return true;
  const o = ops.find(x => x.id === Number(p.opId));
  return !!o && !o.cancelada && o.status !== 'entregue';
}

// OPs que já estão em alguma rota (para tirar da "Sem rota")
function opsEmRotaSet() {
  const s = new Set();
  rotas.forEach(r => (r.paradas || []).forEach(p => { if (p.tipo === 'entregar' && p.opId != null) s.add(Number(p.opId)); }));
  return s;
}

    return;
  }
  ops = (data || []).map(rowToOp).filter(Boolean);
  const maxId = ops.reduce((m, o) => Math.max(m, Number(o.id) || 0), 0);
  nextId = maxId + 1;

  // Repair ops stuck with 'PENDENTE' as numero (created before the await fix)
  const pendentes = ops.filter(o => !o.numero || o.numero === 'PENDENTE');
  if (pendentes.length > 0) {
    pendentes.sort((a, b) => a.id - b.id);
    for (const op of pendentes) {
      const ano = (op.dataAbertura || '').slice(0, 4) || String(new Date().getFullYear());
      const opsEsteAno = ops.filter(o => (o.dataAbertura || '').startsWith(ano) && o.numero && o.numero !== 'PENDENTE');
      const seqNum = opsEsteAno.length + 1;
      const numero = op.pedidoProtheus ? `${seqNum}/${ano} - PV ${op.pedidoProtheus}` : `${seqNum}/${ano}`;
      op.numero = numero;
      const { id: _id, ...repairData } = op;
      repairData.numero = numero;
      sb.from('ops').update({ numero, data: repairData }).eq('id', op.id)
        .then(({ error }) => { if (error) console.error('[repair] falha ao corrigir numero da OP', op.id, error); });
    }
  }

  renderAll();
}

// Salva ou atualiza uma OP no Supabase (fire-and-forget para não bloquear UI)
let _saveIndicatorTimer = null;
function setSaveIndicator(state) {
  const el = document.getElementById('save-indicator');
  if (!el) return;
  clearTimeout(_saveIndicatorTimer);
  if (state === 'saving') {
    el.textContent = 'Salvando…'; el.style.color = 'rgba(255,255,255,.55)'; el.style.opacity = '1';
  } else if (state === 'ok') {
    el.textContent = '✓ Salvo'; el.style.color = '#86efac'; el.style.opacity = '1';
    _saveIndicatorTimer = setTimeout(() => { el.style.opacity = '0'; }, 2000);
  } else if (state === 'err') {
    el.textContent = '⚠ Erro ao salvar'; el.style.color = '#fca5a5'; el.style.opacity = '1';
  }
}

/**
 * Persiste a OP com trava otimista.
 *
 * O update grava o objeto `data` INTEIRO. Sem trava era last-write-wins: o
 * Fiscal abria a OP às 10:00, o Financeiro anexava um comprovante às 10:01, o
 * Fiscal salvava às 10:02 com o snapshot velho e o comprovante sumia — com a
 * tela dizendo "Salvo". Agora o update só passa se a linha não mudou desde que
 * a carregamos (op._loadedAt vs updated_at, mantido pelo trigger do banco).
 */
function dbSaveOp(op, _semTrava) {
  // Coalescing por OP: se já há um save em voo para esta OP, marca para re-salvar
  // ao terminar. Sem isso, dois saves rápidos da mesma OP (ex.: arrastar e logo
  // arrastar de novo) usavam o _loadedAt velho → falso "alterada por outra pessoa".
  if (op._saving && !_semTrava) { op._saveDirty = true; return; }
  op._saving = true;

  // Campos de controle local NÃO podem ir para o jsonb. _rastreioLoading era
  // gravado como true (o save acontece antes do finally que o limpa) e voltava
  // do banco para todos: botão preso em "atualizando…" em todo reload.
  const payload = { ...op };
  delete payload._loadedAt;
  delete payload._rastreioLoading;
  delete payload._rastreioErro;
  delete payload._qrEnviando;
  delete payload._saving;
  delete payload._saveDirty;

  const json = JSON.stringify(payload);
  const kb   = (json.length / 1024).toFixed(0);
  if (json.length > 5 * 1024 * 1024) {
    console.warn(`[dbSaveOp] OP ${op.id} payload muito grande: ${kb} KB - considere reduzir arquivos anexados`);
  }

  setSaveIndicator('saving');
  let q = sb.from('ops')
    .update({ numero: op.numero, cliente: op.cliente, status: op.status, data: payload })
    .eq('id', op.id);
  const comTrava = !!op._loadedAt && !_semTrava;
  if (comTrava) q = q.eq('updated_at', op._loadedAt);

  q.select('id,updated_at').then(async ({ data, error }) => {
    const finalizar = () => { op._saving = false; if (op._saveDirty) { op._saveDirty = false; dbSaveOp(op); } };
    if (error) { console.error('dbSaveOp error:', error); setSaveIndicator('err'); finalizar(); return; }

    if (comTrava && (!data || !data.length)) {
      // 0 linhas: ou alguém salvou antes de nós, ou o updated_at não casou por
      // formato. Confere no banco antes de assustar o usuário.
      const { data: atual } = await sb.from('ops').select('id,updated_at').eq('id', op.id).single();
      if (atual && atual.updated_at === op._loadedAt) {
        // A linha NÃO mudou → o .eq() falhou por formato, não é conflito real.
        console.warn('[dbSaveOp] trava otimista não casou por formato — salvando sem trava');
        op._saving = false; op._saveDirty = false;
        return dbSaveOp(op, true);
      }
      setSaveIndicator('err');
      showToast('Esta OP foi alterada por outra pessoa enquanto você editava. Recarregue antes de salvar de novo.', 'err');
      if (atual) {
        const { data: row } = await sb.from('ops').select('id,data,updated_at').eq('id', op.id).single();
        const fresh = row && rowToOp(row);
        if (fresh) { const i = ops.findIndex(o => o.id === fresh.id); if (i >= 0) ops[i] = fresh; renderAll(); }
      }
      op._saving = false; op._saveDirty = false; // conflito real: não re-tenta em loop
      return;
    }

    op._loadedAt = data?.[0]?.updated_at || op._loadedAt; // próxima gravação usa o novo carimbo
    setSaveIndicator('ok');
    const idx = ops.findIndex(o => o.id === op.id);
    if (idx >= 0) {
      const curTs   = ops[idx].history?.at(-1)?.ts || '';
      const savedTs = op.history?.at(-1)?.ts || '';
      if (savedTs >= curTs) ops[idx] = op;
    }
    renderAll();
    finalizar();
  });
}

// ─── NOTIFICAÇÕES + SOM ─────────────────────────────────────────────
// "Plin" estilo iPhone: duas notas curtas e brilhantes tipo marimba/sino
// (fundamental + harmônico, ataque rápido e decaimento suave).
function playNotifSound() {
  try {
    const ctx    = new (window.AudioContext || window.webkitAudioContext)();
    const now    = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);

    const nota = (freq, delay) => {
      const t  = now + delay;
      const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2; // brilho de sino
      const g  = ctx.createGain();
      const gh = ctx.createGain(); gh.gain.value = 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.006); // ataque rápido
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42); // decaimento tipo marimba
      o1.connect(g); o2.connect(gh); gh.connect(g); g.connect(master);
      o1.start(t); o2.start(t);
      o1.stop(t + 0.5); o2.stop(t + 0.5);
    };

    nota(1318.51, 0.00); // E6
    nota(1760.00, 0.11); // A6

    setTimeout(() => { try { ctx.close(); } catch {} }, 900);
  } catch {}
}

// Bolinha vermelha na aba Pendentes: acende quando há pendente não visto no
// setor que está sendo visualizado; some ao abrir a aba Pendentes.
let _pendingAlert = false;
function setPendingDot(show) {
  _pendingAlert = show;
  const d = document.getElementById('pending-dot');
  if (d) d.style.display = show ? 'inline-block' : 'none';
}

// Chaves por SETOR (roleKey:id): assim, no gestor, cada setor tem sua própria
// contagem de "já visto" — trocar de setor mostra a bolinha se aquele setor tem
// pendente que você ainda não abriu, e o som toca só quando surge pendente novo
// no MESMO setor (não na carga inicial nem ao trocar de setor).
let _seenPending    = new Set();  // pendentes já vistos (só zera ao abrir Pendentes)
let _soundedPending = new Set();  // pendentes que já dispararam som (evita repetir)
let _pendingViewRole = null;      // setor da última verificação
let _pendingSeeded   = false;     // já rodou uma vez (não alerta na 1ª)
function refreshPendingAlert() {
  const view    = getActiveView();
  const roleKey = view ? (view.role || view.id || '') : '';
  // Comercial acompanha TODAS as OPs não entregues — bolinha/som viraria ruído
  // constante. O alerta é só para setores que atuam numa fila real.
  if (roleKey === 'vendedor') { setPendingDot(false); return; }
  const ids     = view ? getQueue(view).map(o => o.id) : [];
  const key     = id => roleKey + ':' + id;

  // Som: pendente novo (nunca sinalizado) no MESMO setor já semeado.
  const novos = ids.filter(id => !_soundedPending.has(key(id)));
  const tocar = _pendingSeeded && roleKey === _pendingViewRole && novos.length > 0;
  ids.forEach(id => _soundedPending.add(key(id)));
  _pendingViewRole = roleKey;
  _pendingSeeded   = true;

  // Bolinha: some ao ver Pendentes; senão acende se há pendente ainda não visto.
  if (currentTab === 'fila') { ids.forEach(id => _seenPending.add(key(id))); setPendingDot(false); }
  else                       { setPendingDot(ids.some(id => !_seenPending.has(key(id)))); }

  if (tocar) playNotifSound();
}

function sendNotif(title, body) {
  // O som é disparado por refreshPendingAlert (evita tocar duas vezes). Aqui só a
  // notificação do sistema operacional quando a aba está em segundo plano.
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    const n = new Notification(title, { body, icon: '/Logo-Contourline-Azul-2048x597 (2).webp' });
    setTimeout(() => n.close(), 7000);
  }
}

function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

// Realtime - sincroniza mudanças de outros usuários
let _realtimeChannel = null;
function startRealtime() {
  if (_realtimeChannel) { sb.removeChannel(_realtimeChannel); _realtimeChannel = null; }
  _realtimeChannel = sb.channel('ops-realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ops' }, payload => {
      if (payload.eventType === 'INSERT') {
        const newOp = rowToOp(payload.new);
        if (newOp && !ops.find(o => o.id === newOp.id)) {
          ops.unshift(newOp);
          // Notifica o setor responsável pela próxima etapa
          const view = getActiveView();
          const step = STEPS[newOp.status];
          if (step?.owner === view?.role) {
            showToast(`Nova OP na fila: ${newOp.cliente}`, 'ok');
            sendNotif('Nova OP na fila', `${newOp.cliente} - ${(newOp.equipamentos||[newOp.equipamento||'']).join(', ')}`);
          }
        }
      } else if (payload.eventType === 'UPDATE') {
        const updated = rowToOp(payload.new);
        if (updated) {
          const prev  = ops.find(o => o.id === updated.id);
          const view  = getActiveView();
          const step  = STEPS[updated.status];
          // Notifica quando uma OP avança para a fila do usuário atual
          if (prev && prev.status !== updated.status && step?.owner === view?.role) {
            showToast(`OP ${updated.numero} - ${updated.cliente} entrou na sua fila`, 'ok');
            sendNotif(`OP ${updated.numero} na sua fila`, `${updated.cliente} - ${step?.label || updated.status}`);
          }
          const idx = ops.findIndex(o => o.id === updated.id);
          if (idx >= 0) ops[idx] = updated; else ops.unshift(updated);
        } else {
          // payload sem data (REPLICA IDENTITY não está FULL) - re-busca do servidor
          sb.from('ops').select('id,data,updated_at').eq('id', payload.new.id).single()
            .then(({ data: row }) => { if (row) { const u = rowToOp(row); if (u) { const i = ops.findIndex(o=>o.id===u.id); if(i>=0) ops[i]=u; else ops.unshift(u); renderAll(); } } });
          return;
        }
      } else if (payload.eventType === 'DELETE') {
        ops = ops.filter(o => o.id !== Number(payload.old.id));
      }
      renderAll();
    })
    .subscribe(status => {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        console.warn('[Realtime] canal perdido (' + status + ') - reconectando em 5s');
        setTimeout(startRealtime, 5000);
      }
    });
}

// ─── AUTH - Supabase Authentication ────────────────────────────────
let _cachedUser = null; // { ...sector, userName, uid }

function getUser() { return _cachedUser; }

async function fetchUserProfile() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { _cachedUser = null; return null; }
  let { data: profile, error: _pErr } = await sb.from('profiles').select('name,sector_id,password_changed_at').eq('id', user.id).single();
  // A coluna password_changed_at pode ainda não existir (migração não rodada) — se
  // o select falhar por isso, refaz sem ela para o login não quebrar.
  if (_pErr) { ({ data: profile } = await sb.from('profiles').select('name,sector_id').eq('id', user.id).single()); }
  // Só profiles.sector_id. NÃO usar user_metadata como fallback: aquele campo é
  // auto-editável pelo dono da conta (PUT /auth/v1/user), o que permitia a
  // qualquer usuário se declarar 'gestor'.
  // Normaliza a caixa (ex.: "ADM" → "adm"). 'gestor' e 'adm' são papéis distintos:
  // gestor = só Dashboard/visão geral; adm = tudo + switcher de setores.
  const sectorId = String(profile?.sector_id || '').trim().toLowerCase();
  const sector   = SECTORS.find(s => s.id === sectorId);
  if (!sector) { _cachedUser = null; return null; }
  _cachedUser = { ...sector, userName: profile?.name || user.email.split('@')[0], uid: user.id, password_changed_at: profile?.password_changed_at || null };
  return _cachedUser;
}

function clearSession() { _cachedUser = null; }

// ─── SENHA: expiração (90 dias) + troca self-service ───────────────
const SENHA_VALIDADE_DIAS = 90;
let _forcedPwd = false; // true = senha expirada, modal não pode ser fechado

// Chamado após o login. Se nunca teve data, define agora (carência). Se passou de
// 90 dias, força a troca antes de usar o sistema.
// Expirou (passou de 90 dias desde a última troca)?
function senhaExpirada() {
  const u = _cachedUser;
  return !!(u && u.password_changed_at && (Date.now() - new Date(u.password_changed_at).getTime()) / 86400000 >= SENHA_VALIDADE_DIAS);
}
// Nunca teve data → define agora (carência de 90 dias a partir daqui).
async function garantirDataSenha() {
  const u = _cachedUser; if (!u || u.password_changed_at) return;
  const iso = new Date().toISOString();
  await sb.from('profiles').update({ password_changed_at: iso }).eq('id', u.uid);
  u.password_changed_at = iso;
}
// Entra no app OU, se a senha expirou/foi resetada, mostra a tela de nova senha.
function entrarOuTrocarSenha() {
  if (senhaExpirada()) { showForcedPasswordScreen(); return; }
  showApp();
  garantirDataSenha();
}

async function salvarSenhaForcada() {
  const err = document.getElementById('np-err');
  const n = document.getElementById('np-new')?.value || '';
  const c = document.getElementById('np-confirm')?.value || '';
  err.textContent = '';
  if (n.length < 8) { err.textContent = 'A senha deve ter ao menos 8 caracteres.'; return; }
  if (n !== c)      { err.textContent = 'As senhas não conferem.'; return; }
  const btn = document.getElementById('np-save'); if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }
  const { error } = await sb.auth.updateUser({ password: n });
  if (error) { err.textContent = /different from the old/i.test(error.message) ? 'A nova senha deve ser diferente da senha atual.' : error.message; if (btn) { btn.disabled = false; btn.textContent = 'Salvar e entrar'; } return; }
  const iso = new Date().toISOString();

async function redefinirComCodigo() {
  const err = document.getElementById('resetError2');

  const n = document.getElementById('resetNew').value || '';
  const c = document.getElementById('resetConfirm').value || '';

  if (n !== c)         { err.textContent = 'As senhas não conferem.'; return; }
  const btn = document.getElementById('resetSaveBtn'); btn.disabled = true; btn.textContent = 'Redefinindo…';
  const reset = () => { btn.disabled = false; btn.textContent = 'Redefinir senha'; };
  const { error: vErr } = await sb.auth.verifyOtp({ email: _resetEmail, token: code, type: 'recovery' });
  if (vErr) { err.textContent = /expired|invalid|token/i.test(vErr.message) ? 'Código inválido ou expirado.' : vErr.message; reset(); return; }
  const { error: uErr } = await sb.auth.updateUser({ password: n });

async function doLogin() {
  const email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
  const pass  = (document.getElementById('loginPassword').value || '');
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Preencha e-mail e senha.'; return; }

  btn.disabled = true;
  btn.innerHTML = _loginSpinner + ' Verificando…';

  // 1. Supabase Auth - valida email + senha
  const { data: { user }, error: authErr } = await sb.auth.signInWithPassword({ email, password: pass });
  if (authErr) {
    errEl.textContent = authErr.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : authErr.message;
    btn.disabled = false; btn.innerHTML = _loginIcon + ' Entrar';
    return;
  }

  // 2. Busca setor + nome no profiles. Sem fallback para user_metadata: aquele
  // campo é auto-editável pelo dono da conta e permitia virar 'gestor' sozinho.
  const { data: profile } = await sb.from('profiles').select('name,sector_id').eq('id', user.id).single();
  const sectorId = String(profile?.sector_id || '').trim().toLowerCase();
  if (!sectorId || !SECTORS.find(s => s.id === sectorId)) {
    errEl.textContent = 'Setor não configurado. Contate o administrador.';
    await sb.auth.signOut();
    btn.disabled = false; btn.innerHTML = _loginIcon + ' Entrar';
    return;
  }
  const userName = profile?.name || email.split('@')[0];

  // 4. Carrega perfil e abre o app
  btn.innerHTML = _loginSpinner + ' Entrando…';
  await fetchUserProfile();
  if (!_cachedUser) {
    errEl.textContent = 'Erro ao carregar perfil. Contate o administrador.';
    await sb.auth.signOut();
    btn.disabled = false; btn.innerHTML = _loginIcon + ' Entrar';
    return;
  }
  entrarOuTrocarSenha(); // entra, ou mostra a tela de nova senha se expirou/foi resetada
}

function _hasActiveFilter() { return Object.values(_filters).some(Boolean); }

// Todos os números de série de uma OP (equipamentos + os lançados no Transporte).
function opSeries(op) {
  const out = [];
  (op.equipamentos || []).forEach(e => { if (e?.numSerie) out.push(String(e.numSerie)); });
  const ns = op.stepData?.aguard_nf?.numSeries;
  if (Array.isArray(ns)) ns.forEach(s => { if (s) out.push(String(s)); });
  return out;
}

function _opsFiltered() {
  const { q, pv, dateFrom, dateTo, sem } = _filters;
  // OPs canceladas somem de TODAS as filas normais (Pendentes/Todas/Concluídas).
  // Elas só aparecem no modo "ver cancelados", que nem passa por aqui.
  const vivas = ops.filter(o => !o.cancelada);
  if (!q && !pv && !dateFrom && !dateTo && !sem) return vivas;
  return vivas.filter(op => {
    if (q) {
      const ql = q.toLowerCase();
      const ok = (numOp(op)||'').toLowerCase().includes(ql)
              || (op.cliente||'').toLowerCase().includes(ql)
              || opSeries(op).some(s => s.toLowerCase().includes(ql));
      if (!ok) return false;
    }
    if (pv && !String(op.pedidoProtheus||'').toLowerCase().includes(pv.toLowerCase())) return false;
    if (dateFrom && (op.dataAbertura||'') < dateFrom) return false;
    if (dateTo   && (op.dataAbertura||'') > dateTo)   return false;
    if (sem) {
      const s = semaforo(op);
      if (sem === 'verde'    && s.cls !== 'b-green')                          return false;
      if (sem === 'amarelo'  && s.cls !== 'b-yellow' && s.cls !== 'b-orange') return false;
      if (sem === 'vermelho' && s.cls !== 'b-red')                            return false;
    }
    return true;
  });
}

function getQueue(user) {
  const base = _opsFiltered();
  if (user.role === 'gestor' || user.role === 'adm')   return [];
  if (user.role === 'vendedor') return base.filter(o => o.status !== 'entregue');
  if (user.role === 'logistica') return base.filter(o =>
    o.status === 'aguard_nf' || o.status === 'aguard_despacho' || o.status === 'transito'
  );
  return base.filter(op => {
    const step = STEPS[op.status];
    if (!step) return false;
    if (op.status === 'aguard_financeiro') {
      if (user.role === 'fiscal')     return !sfDone(op);
      if (user.role === 'financeiro') return finNeeded(op) && !finDone(op);
      return false;
    }
    return step.owner === user.role;
  });
}

function getCompleted(user) {
  const base = _opsFiltered();
  if (user.role === 'gestor' || user.role === 'adm')   return base.filter(o => o.status === 'entregue');
  if (user.role === 'vendedor') return base.filter(o => o.status === 'entregue');
  const queue = getQueue(user);
  return base.filter(op => {
    if (queue.some(q => q.id === op.id)) return false;
    if (user.role === 'financeiro' && !finNeeded(op) && op.status !== 'aberta') return true;
    return op.history.some(h => h.actor === user.role);
  });
}

function nowTs() {
  const d = new Date();
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function advanceOP(opId, formData) {
  const op = ops.find(o => o.id === opId);
  if (!op) return;
  const step = STEPS[op.status];
  const next = step.getNext(op);
  if (!next) return;

  if (formData && Object.keys(formData).length) op.stepData[op.status] = { ...formData };

  // Porta dupla: registra a aprovação do financeiro; só avança se o SF também estiver pronto
  if (op.status === 'aguard_financeiro') {
    op.stepData.aguard_financeiro = { ...(op.stepData.aguard_financeiro || {}), ...formData, aprovado: true };
    if (!sfDone(op)) {
      const u = getUser(), v = getActiveView();
      op.history.push({ step: op.status, actor: v?.role || '', actorName: u?.userName || u?.name || '-', ts: nowTs(), action: 'Financeiro aprovado - aguardando Simples Faturamento', note: formData?.descricao || '' });
      dbSaveOp(op);
      renderAll();
      showToast('Financeiro aprovado! Aguardando Simples Faturamento do Fiscal.', 'ok');
      return;
    }
  }

  const user     = getUser();
  const view     = getActiveView();
  op.history.push({ step: op.status, actor: view?.role || '', actorName: user?.userName || user?.name || '-', ts: nowTs(), action: HIST_ACTION[op.status] || step.actionLabel || '', note: formData?.descricao || '' });

  op.status = next;
  dbSaveOp(op);  // persiste no Supabase (não bloqueia UI)

  // Concluiu a entrega → tira a OP das rotas (não deve mais ser roteirizada).
  if (next === 'entregue') removerOpDasRotas(op.id);

  renderAll();

  // Ao entrar em trânsito (logística aprovou a emissão/despacho da NF), cadastra
  // as máquinas no Sistema QR. Não bloqueia: falha só avisa (ver qrCadastro).
  if (next === 'transito') cadastrarEquipamentosQR(op);

  // Ao entrar em trânsito (logística confirmou o despacho da NF), dispara o
  // 1º rastreio automático quando a transportadora tem integração + chave NFe.
  if (RASTREIO_ATIVO
      && next === 'transito'
      && op.stepData?.aguard_nf?.envioTipo === 'transportadora'
      && RASTREAVEIS.has(op.stepData?.aguard_nf?.transportadora)
      && (op.stepData?.aguard_emissao?.chaveNfe || '').replace(/\D/g, '').length >= 44) {
    atualizarRastreio(op.id, true);
  }
}

function rejectOP(opId, formData) {
  const op = ops.find(o => o.id === opId);
  if (!op) return;
  const step = STEPS[op.status];
  if (!step.getReject) return;
  // Defesa: bloquear/rejeitar limpa a aprovação do financeiro, para a OP não
  // voltar "aprovada" ao ser desbloqueada.
  if (op.status === 'aguard_financeiro' && op.stepData?.aguard_financeiro) delete op.stepData.aguard_financeiro.aprovado;
  op.stepData[op.status + '_reject'] = formData;
  const user = getUser();
  const view = getActiveView();
  op.history.push({ step: op.status, actor: view?.role || '', actorName: user?.userName || user?.name || '-', ts: nowTs(), action: HIST_REJECT[op.status] || step.rejectLabel || 'OP Bloqueada', note: formData.descricao || formData.motivoReemissao || '' });
  op.status = step.getReject();
  dbSaveOp(op);  // persiste no Supabase (não bloqueia UI)
  renderAll();
}

function daysSince(d)  { return Math.floor((new Date() - new Date(d)) / 86400000); }
function fmtDate(d)    { return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }

// Escapa HTML — usar em TODA interpolação de dado não confiável (cliente/Protheus,
// texto digitado, nome de arquivo, item/endereço de coleta) antes de ir pro innerHTML.
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Converte "dd/mm/yyyy" → Date (meio-dia p/ evitar problema de fuso)
function parseBRDate(s) {
  if (!s) return null;
  const p = s.split('/');
  if (p.length !== 3) return null;
  let year = parseInt(p[2]);
  if (year < 100) year += 2000; // corrige ano 2-dígitos (ex: "26" → 2026)
  const dt = new Date(year, parseInt(p[1])-1, parseInt(p[0]), 12);
  return isNaN(dt) ? null : dt;
}

function getSectionCollapsed(key) {
  try { return JSON.parse(localStorage.getItem('secCollapsed')||'{}')[key]||false; } catch { return false; }
}
function toggleSection(el) {
  const body    = el.nextElementSibling;
  const chevron = el.querySelector('.sec-chevron');
  const key     = el.dataset.skey;
  const isOpen  = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  chevron?.classList.toggle('collapsed', isOpen);
  if (key) {
    try {
      const s = JSON.parse(localStorage.getItem('secCollapsed')||'{}');
      if (isOpen) s[key] = true; else delete s[key];
      localStorage.setItem('secCollapsed', JSON.stringify(s));
    } catch {}
  }
}
function diasRestantesLabel(dataBR) {
  const date = parseBRDate(dataBR);
  if (!date) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.ceil((date - today) / 86400000);
  if (diff > 0)  return ` (faltam ${diff} dia${diff!==1?'s':''})`;
  if (diff === 0) return ' (hoje)';
  return ` (${Math.abs(diff)}d de atraso)`;
}

function numOp(op) {
  return (op.numero && op.numero !== 'PENDENTE') ? op.numero : '#' + op.id;
}

function semaforo(op) {
  if (op.status === 'entregue') return { cls:'b-gray', label:'Entregue', icon:'' };

  const fmt = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const today = new Date(); today.setHours(0,0,0,0);

  // Data-alvo: previsão de entrega (real). Sem ela, estima abertura + 20 dias.
  let target = parseBRDate(op.pedidoVenda?.dataPrevista);
  if (!target) {
    if (!op.dataAbertura || isNaN(new Date(op.dataAbertura))) return { cls:'b-gray', label:'sem prazo', icon:'' };
    target = new Date(op.dataAbertura + 'T12:00:00');
    target.setDate(target.getDate() + 20);
  }

  // O rótulo é sempre a DATA (dd/mm/aaaa); a COR e o ícone indicam a urgência.
  const dias  = Math.ceil((target - today) / 86400000);
  const label = fmt(target);
  if (dias > 3)   return { cls:'b-green',  label, icon:'●' };
  if (dias >= 1)  return { cls:'b-yellow', label, icon:'▲' };
  if (dias === 0) return { cls:'b-orange', label, icon:'▲' };
  return { cls:'b-red', label, icon:'!' };
}

function stepBadge(status, op) {
  if (status === 'aguard_financeiro' && op) {
    const fOk = finDone(op);
    const sOk = sfDone(op);
    if (fOk && !sOk)  return { cls: 'b-purple', label: 'Aguardando Simples Faturamento' };
    if (!fOk && sOk)  return { cls: 'b-yellow', label: 'Aguardando Financeiro' };
    if (!fOk && !sOk) return { cls: 'b-yellow', label: finNeeded(op) ? 'Aguardando Financeiro e Simples Faturamento' : 'Aguardando Simples Faturamento' };
  }
  const s = STEPS[status];
  return s ? { cls: COLOR_MAP[s.color]||'b-gray', label: s.label } : { cls:'b-gray', label: status };
}

function entradaHtml(e) {
  if (e==='paga')     return `<span style="color:var(--green);font-size:11px;display:inline-flex;align-items:center;gap:3px">${icon('check-circle',11,'color:var(--green)')} Paga</span>`;
  if (e==='pendente') return `<span style="color:var(--yellow);font-size:11px;display:inline-flex;align-items:center;gap:3px">${icon('alert-triangle',11,'color:var(--yellow)')} Pendente</span>`;
  return `<span style="color:var(--text3);font-size:11px">- Sem entrada</span>`;
}

function flagsHtml(op) {
  return [
    op.opDivergente ? `<span class="flag flag-div" title="OP divergente">DIV</span>` : '',
    op.multiOp      ? `<span class="flag flag-multi" title="Múltiplas OPs">MULTI</span>` : '',
  ].filter(Boolean).join('');
}

function calcLineTotal(e) {
  const qt = parseInt(e.qty) || 1;
  const vu = parseFloat(e.valorUnit) || 0;
  const dc = parseFloat(e.desconto) || 0;
  return (qt * vu * (1 - dc / 100)).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderEquipItem(e, i) {
  const isFree    = !!e.gratuito;

           : lineTotal > 0 ? 'R$ ' + lineTotal.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '';
  const tesLabel = e.tes ? `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--orange);background:var(--orange-bg);border:1px solid rgba(234,88,12,.2);padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace">TES ${e.tes}${e.tesDesc ? ' · '+e.tesDesc : ''}</span>` : '';
  return `<div class="equip-list-item" style="flex-direction:column;align-items:stretch;gap:5px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0">

        ${tesLabel}
      </div>
      <div class="equip-list-item-qty">

        <span class="equip-qty-val">${e.qty}</span>
        <button class="equip-qty-btn" onclick="equipQty(${i},+1)">+</button>
        <button class="equip-remove" onclick="equipRemove(${i})">×</button>
      </div>
    </div>
    <div style="display:flex;gap:5px;align-items:center">
      ${isFree
        ? `<span style="flex:1"><span style="display:inline-flex;align-items:center;background:var(--green-bg);color:var(--green);font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.5px">GRATUITO</span></span>`
        : `<span style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;flex-shrink:0">R$</span>
      <input class="form-input" style="flex:1;font-size:11px;padding:4px 7px;min-width:0;font-family:'DM Mono',monospace"
        type="text" inputmode="decimal"
        value="${e.valorUnit ? brlFmtNum(e.valorUnit) : ''}" oninput="brlFormat(this);equipPrice(${i},this.value)">`}
      <span id="equip-total-${i}" style="font-size:12px;font-family:'DM Mono',monospace;color:var(--text2);min-width:130px;text-align:right;flex-shrink:0">${lt}</span>
    </div>
    ${isFree ? '' : `<div style="display:flex;gap:5px;align-items:center">
      <span style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;flex-shrink:0">Desconto</span>
      <input id="equip-desc-${i}" class="form-input" style="flex:1;font-size:11px;padding:4px 7px;min-width:0;font-family:'DM Mono',monospace"
        type="text" inputmode="decimal"

    </div>
    <div id="equip-desc-warn-${i}" style="display:none;font-size:10px;color:var(--red);font-family:'DM Mono',monospace;padding:2px 0"></div>`}
